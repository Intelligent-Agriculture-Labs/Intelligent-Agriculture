sw_gda_step_obs:
  en: "NASA GRACE-FO data assimilation (week of {date}, ~25 km): groundwater is wetter than {pct:.0f} % of the same weeks in 1948–2012 ({cls})."
  es: "Asimilación de datos NASA GRACE-FO (semana del {date}, ~25 km): el agua subterránea está más alta que en el {pct:.0f} % de las mismas semanas de 1948–2012 ({cls})."
  fr: "Assimilation de données NASA GRACE-FO (semaine du {date}, ~25 km) : les eaux souterraines sont plus abondantes que {pct:.0f} % des mêmes semaines de 1948–2012 ({cls})."
  sw: "Uingizaji wa data za NASA GRACE-FO (wiki ya {date}, ~km 25): maji ya ardhini ni mengi kuliko {pct:.0f} % ya wiki hizo hizo katika 1948–2012 ({cls})."
  hi: "NASA GRACE-FO डेटा समावेशन ({date} का सप्ताह, ~25 किमी): भूजल 1948–2012 के उन्हीं सप्ताहों के {pct:.0f} % से अधिक है ({cls})।"
  de: "NASA-GRACE-FO-Datenassimilation (Woche ab {date}, ~25 km): Das Grundwasser ist feuchter als in {pct:.0f} % derselben Wochen 1948–2012 ({cls})."
