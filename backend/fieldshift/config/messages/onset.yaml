# Rainy-season onset advisor (engine/rain_season.py; GET /api/rain-season and the rain_onset card's Why view).
model_onset:
  en: "Agroclimatic onset (Sivakumar 1988; Stern et al. 1981), water-balance cessation (FAO), Liebmann/Dunning seasons"
  es: "Inicio agroclimático (Sivakumar 1988; Stern et al. 1981), fin por balance hídrico (FAO), temporadas de Liebmann/Dunning"
  fr: "Début agroclimatique (Sivakumar 1988 ; Stern et al. 1981), fin par bilan hydrique (FAO), saisons de Liebmann/Dunning"
  sw: "Mwanzo wa kilimo-hali ya hewa (Sivakumar 1988; Stern et al. 1981), mwisho kwa mizania ya maji (FAO), misimu ya Liebmann/Dunning"
  hi: "कृषि-जलवायु आरंभ (Sivakumar 1988; Stern et al. 1981), जल-संतुलन से समाप्ति (FAO), Liebmann/Dunning मौसम"
  de: "Agroklimatischer Beginn (Sivakumar 1988; Stern et al. 1981), Ende per Wasserbilanz (FAO), Saisons nach Liebmann/Dunning"
ins_onset_later:
  en: "{season} rains now start {d:.0f} days per decade later than in {year} (p = {p:.2f})."
  es: "Las lluvias {season} empiezan ahora {d:.0f} días por década más tarde que en {year} (p = {p:.2f})."
  fr: "Les pluies {season} commencent désormais {d:.0f} jours par décennie plus tard qu'en {year} (p = {p:.2f})."
  sw: "Mvua za {season} sasa zinaanza siku {d:.0f} kwa muongo baadaye kuliko {year} (p = {p:.2f})."
  hi: "{season} वर्षा अब {year} की तुलना में प्रति दशक {d:.0f} दिन देर से शुरू होती है (p = {p:.2f})।"
  de: "Der {season}-Regen beginnt heute {d:.0f} Tage pro Jahrzehnt später als {year} (p = {p:.2f})."
ins_onset_earlier:
  en: "{season} rains now start {d:.0f} days per decade earlier than in {year} (p = {p:.2f})."
  es: "Las lluvias {season} empiezan ahora {d:.0f} días por década antes que en {year} (p = {p:.2f})."
  fr: "Les pluies {season} commencent désormais {d:.0f} jours par décennie plus tôt qu'en {year} (p = {p:.2f})."
  sw: "Mvua za {season} sasa zinaanza siku {d:.0f} kwa muongo mapema kuliko {year} (p = {p:.2f})."
  hi: "{season} वर्षा अब {year} की तुलना में प्रति दशक {d:.0f} दिन पहले शुरू होती है (p = {p:.2f})।"
  de: "Der {season}-Regen beginnt heute {d:.0f} Tage pro Jahrzehnt früher als {year} (p = {p:.2f})."
ins_length_longer:
  en: "The {season} season has become {d:.0f} days per decade longer since {year} (p = {p:.2f})."
  es: "La temporada {season} se ha alargado {d:.0f} días por década desde {year} (p = {p:.2f})."
  fr: "La saison {season} s'est allongée de {d:.0f} jours par décennie depuis {year} (p = {p:.2f})."
  sw: "Msimu wa {season} umerefuka kwa siku {d:.0f} kwa muongo tangu {year} (p = {p:.2f})."
  hi: "{year} से {season} मौसम प्रति दशक {d:.0f} दिन लंबा हुआ है (p = {p:.2f})।"
  de: "Die {season}-Saison ist seit {year} um {d:.0f} Tage pro Jahrzehnt länger geworden (p = {p:.2f})."
ins_length_shorter:
  en: "The {season} season has become {d:.0f} days per decade shorter since {year} (p = {p:.2f})."
  es: "La temporada {season} se ha acortado {d:.0f} días por década desde {year} (p = {p:.2f})."
  fr: "La saison {season} a raccourci de {d:.0f} jours par décennie depuis {year} (p = {p:.2f})."
  sw: "Msimu wa {season} umefupika kwa siku {d:.0f} kwa muongo tangu {year} (p = {p:.2f})."
  hi: "{year} से {season} मौसम प्रति दशक {d:.0f} दिन छोटा हुआ है (p = {p:.2f})।"
  de: "Die {season}-Saison ist seit {year} um {d:.0f} Tage pro Jahrzehnt kürzer geworden (p = {p:.2f})."
ins_false_starts:
  en: "False starts of the {season} rains: {a:.0f} % of years before {split}, {b:.0f} % since."
  es: "Falsos inicios de las lluvias {season}: {a:.0f} % de los años antes de {split}, {b:.0f} % desde entonces."
  fr: "Faux départs des pluies {season} : {a:.0f} % des années avant {split}, {b:.0f} % depuis."
  sw: "Mianzo ya uongo ya mvua za {season}: {a:.0f} % ya miaka kabla ya {split}, {b:.0f} % tangu hapo."
  hi: "{season} वर्षा की झूठी शुरुआत: {split} से पहले {a:.0f} % वर्ष, उसके बाद {b:.0f} %।"
  de: "Fehlstarts des {season}-Regens: {a:.0f} % der Jahre vor {split}, {b:.0f} % seither."
ins_no_shift:
  en: "No statistically clear shift (p < 0.1) in onset or season length since 1984; year-to-year swings dominate."
  es: "No hay un cambio estadísticamente claro (p < 0,1) en el inicio ni en la duración de la temporada desde 1984; dominan las variaciones entre años."
  fr: "Aucun décalage statistiquement net (p < 0,1) du début ou de la durée de saison depuis 1984 ; les variations d'une année à l'autre dominent."
  sw: "Hakuna mabadiliko wazi kitakwimu (p < 0.1) katika mwanzo au urefu wa msimu tangu 1984; tofauti za mwaka hadi mwaka ndizo kubwa."
  hi: "1984 से आरंभ या मौसम की लंबाई में कोई सांख्यिकीय रूप से स्पष्ट बदलाव नहीं (p < 0.1); साल-दर-साल उतार-चढ़ाव हावी है।"
  de: "Seit 1984 keine statistisch klare Verschiebung (p < 0,1) bei Beginn oder Saisonlänge; Schwankungen von Jahr zu Jahr überwiegen."
crit_onset:
  en: "first day of {days} days with ≥ {mm:g} mm (starting wet), no dry spell > {dry} days in the next {check} days"
  es: "primer día de {days} días con ≥ {mm:g} mm (empezando húmedo), sin racha seca > {dry} días en los {check} días siguientes"
  fr: "premier jour de {days} jours avec ≥ {mm:g} mm (début humide), sans période sèche > {dry} jours dans les {check} jours suivants"
  sw: "siku ya kwanza ya siku {days} zenye ≥ mm {mm:g} (kuanzia na unyevu), bila ukavu > siku {dry} katika siku {check} zinazofuata"
  hi: "{days} दिनों में ≥ {mm:g} मिमी का पहला दिन (गीली शुरुआत), अगले {check} दिनों में {dry} दिन से लंबा सूखा नहीं"
  de: "erster Tag von {days} Tagen mit ≥ {mm:g} mm (nass beginnend), keine Trockenphase > {dry} Tage in den folgenden {check} Tagen"
crit_cessation:
  en: "{awc:g} mm soil store emptied by ET₀, not before mid-season"
  es: "reserva de {awc:g} mm del suelo vaciada por la ET₀, no antes de mitad de temporada"
  fr: "réserve du sol de {awc:g} mm vidée par l'ET₀, pas avant la mi-saison"
  sw: "hifadhi ya udongo ya mm {awc:g} imemalizwa na ET₀, si kabla ya katikati ya msimu"
  hi: "{awc:g} मिमी मिट्टी भंडार ET₀ से खाली, मध्य-मौसम से पहले नहीं"
  de: "{awc:g}-mm-Bodenspeicher durch ET₀ geleert, nicht vor der Saisonmitte"
crit_false_start:
  en: "rain criterion met, then a dry spell > {dry} days within {check} days"
  es: "se cumple el criterio de lluvia y luego una racha seca > {dry} días dentro de {check} días"
  fr: "critère de pluie rempli, puis une période sèche > {dry} jours dans les {check} jours"
  sw: "kigezo cha mvua kimetimia, kisha ukavu > siku {dry} ndani ya siku {check}"
  hi: "वर्षा मानदंड पूरा, फिर {check} दिनों के भीतर {dry} दिन से लंबा सूखा"
  de: "Regenkriterium erfüllt, danach Trockenphase > {dry} Tage innerhalb von {check} Tagen"
reason_outside:
  en: "outside the tropics and subtropics (|latitude| > {lat}°)"
  es: "fuera de los trópicos y subtrópicos (|latitud| > {lat}°)"
  fr: "hors des tropiques et subtropiques (|latitude| > {lat}°)"
  sw: "nje ya tropiki na tropiki ndogo (|latitudo| > {lat}°)"
  hi: "उष्णकटिबंध और उपोष्णकटिबंध से बाहर (|अक्षांश| > {lat}°)"
  de: "außerhalb der Tropen und Subtropen (|Breite| > {lat}°)"
reason_no_season:
  en: "no distinct rainy season in the climatology"
  es: "no hay una temporada de lluvias definida en la climatología"
  fr: "pas de saison des pluies distincte dans la climatologie"
  sw: "hakuna msimu wa mvua unaoeleweka katika takwimu za hali ya hewa"
  hi: "जलवायु आँकड़ों में कोई स्पष्ट वर्षा ऋतु नहीं"
  de: "keine ausgeprägte Regenzeit in der Klimatologie"
reason_no_dry:
  en: "no real dry season (only {n} days with rain < half of ET₀), so rain onset rarely limits sowing"
  es: "no hay una verdadera estación seca (solo {n} días con lluvia < la mitad de la ET₀), así que el inicio de las lluvias rara vez limita la siembra"
  fr: "pas de vraie saison sèche (seulement {n} jours avec pluie < moitié de l'ET₀), donc le début des pluies limite rarement le semis"
  sw: "hakuna kiangazi halisi (siku {n} tu zenye mvua < nusu ya ET₀), hivyo mwanzo wa mvua mara chache huzuia kupanda"
  hi: "असली सूखा मौसम नहीं (केवल {n} दिन वर्षा < ET₀ का आधा), इसलिए वर्षा की शुरुआत बुवाई को कम ही रोकती है"
  de: "keine echte Trockenzeit (nur {n} Tage mit Regen < halbe ET₀), daher begrenzt der Regenbeginn die Saat selten"
reason_ok:
  en: "rain-fed tropical/monsoon setting with a distinct dry season"
  es: "zona tropical o monzónica de secano con una estación seca marcada"
  fr: "contexte tropical/de mousson pluvial avec une saison sèche marquée"
  sw: "kilimo cha mvua katika tropiki/monsuni chenye kiangazi kinachoeleweka"
  hi: "स्पष्ट सूखे मौसम वाला वर्षा-आधारित उष्णकटिबंधीय/मानसूनी क्षेत्र"
  de: "Regenfeldbau in tropischer/Monsun-Lage mit ausgeprägter Trockenzeit"
series_rain_since:
  en: "Rain since {date} ({season} season)"
  es: "Lluvia desde el {date} (temporada {season})"
  fr: "Pluie depuis le {date} (saison {season})"
  sw: "Mvua tangu {date} (msimu wa {season})"
  hi: "{date} से वर्षा ({season} मौसम)"
  de: "Regen seit {date} ({season}-Saison)"
on_step_seasons:
  en: "Rainy seasons here (NASA POWER {y0}–{y1}): {list}; regime {regime} (2nd/1st harmonic ratio {ratio})."
  es: "Temporadas de lluvia aquí (NASA POWER {y0}–{y1}): {list}; régimen {regime} (razón 2.º/1.er armónico {ratio})."
  fr: "Saisons des pluies ici (NASA POWER {y0}–{y1}) : {list} ; régime {regime} (rapport 2e/1re harmonique {ratio})."
  sw: "Misimu ya mvua hapa (NASA POWER {y0}–{y1}): {list}; mfumo {regime} (uwiano wa harmoniki ya 2/1 {ratio})."
  hi: "यहाँ वर्षा ऋतुएँ (NASA POWER {y0}–{y1}): {list}; व्यवस्था {regime} (दूसरा/पहला हार्मोनिक अनुपात {ratio})।"
  de: "Regenzeiten hier (NASA POWER {y0}–{y1}): {list}; Regime {regime} (Verhältnis 2./1. Harmonische {ratio})."
on_step_season_item: {en: "{season} (from ~{date})", es: "{season} (desde ~{date})", fr: "{season} (dès ~{date})", sw: "{season} (kuanzia ~{date})", hi: "{season} (~{date} से)", de: "{season} (ab ~{date})"}
regime_unimodal: {en: "unimodal", es: "unimodal", fr: "unimodal", sw: "msimu mmoja", hi: "एक-ऋतु", de: "eingipflig"}
regime_bimodal: {en: "bimodal", es: "bimodal", fr: "bimodal", sw: "misimu miwili", hi: "दो-ऋतु", de: "zweigipflig"}
on_step_rule:
  en: "Onset rule (Sivakumar 1988): first day of {days} days with ≥ {mm:g} mm, with no dry spell longer than {dry} days in the next {check} days."
  es: "Regla de inicio (Sivakumar 1988): primer día de {days} días con ≥ {mm:g} mm, sin rachas secas de más de {dry} días en los {check} días siguientes."
  fr: "Règle de début (Sivakumar 1988) : premier jour de {days} jours avec ≥ {mm:g} mm, sans période sèche de plus de {dry} jours dans les {check} jours suivants."
  sw: "Kanuni ya mwanzo (Sivakumar 1988): siku ya kwanza ya siku {days} zenye ≥ mm {mm:g}, bila ukavu wa zaidi ya siku {dry} katika siku {check} zinazofuata."
  hi: "आरंभ नियम (Sivakumar 1988): {days} दिनों में ≥ {mm:g} मिमी का पहला दिन, अगले {check} दिनों में {dry} दिन से लंबा सूखा नहीं।"
  de: "Beginn-Regel (Sivakumar 1988): erster Tag von {days} Tagen mit ≥ {mm:g} mm, ohne Trockenphase über {dry} Tage in den folgenden {check} Tagen."
on_step_onset_stats:
  en: "{season} onset over {n} past seasons: median {p50}; 8 in 10 years between {p20} and {p80}."
  es: "Inicio {season} en {n} temporadas pasadas: mediana {p50}; 8 de cada 10 años entre {p20} y {p80}."
  fr: "Début {season} sur {n} saisons passées : médiane {p50} ; 8 années sur 10 entre {p20} et {p80}."
  sw: "Mwanzo wa {season} kwa misimu {n} iliyopita: wastani wa kati {p50}; miaka 8 kati ya 10 kati ya {p20} na {p80}."
  hi: "{n} पिछले मौसमों में {season} आरंभ: माध्यिका {p50}; 10 में से 8 वर्ष {p20} और {p80} के बीच।"
  de: "{season}-Beginn über {n} vergangene Saisons: Median {p50}; in 8 von 10 Jahren zwischen {p20} und {p80}."
on_step_false:
  en: "False starts (dry spell > {dry} days after the first good rain) in {fs} % of years; no valid onset at all in {failed} % of years."
  es: "Falsos inicios (racha seca > {dry} días tras la primera buena lluvia) en el {fs} % de los años; ningún inicio válido en el {failed} % de los años."
  fr: "Faux départs (période sèche > {dry} jours après la première bonne pluie) dans {fs} % des années ; aucun début valide dans {failed} % des années."
  sw: "Mianzo ya uongo (ukavu > siku {dry} baada ya mvua nzuri ya kwanza) katika {fs} % ya miaka; hakuna mwanzo halali kabisa katika {failed} % ya miaka."
  hi: "{fs} % वर्षों में झूठी शुरुआत (पहली अच्छी बारिश के बाद {dry} दिन से लंबा सूखा); {failed} % वर्षों में कोई वैध आरंभ नहीं।"
  de: "Fehlstarts (Trockenphase > {dry} Tage nach dem ersten guten Regen) in {fs} % der Jahre; gar kein gültiger Beginn in {failed} % der Jahre."
on_step_length:
  en: "Season length to the water-balance end ({awc:g} mm soil store emptied by ET₀): median {p50} days, short years (p20) {p20} days."
  es: "Duración de la temporada hasta el fin por balance hídrico (reserva de {awc:g} mm vaciada por la ET₀): mediana {p50} días, años cortos (p20) {p20} días."
  fr: "Durée de saison jusqu'à la fin par bilan hydrique (réserve de {awc:g} mm vidée par l'ET₀) : médiane {p50} jours, années courtes (p20) {p20} jours."
  sw: "Urefu wa msimu hadi mwisho wa mizania ya maji (hifadhi ya mm {awc:g} imemalizwa na ET₀): wastani wa kati siku {p50}, miaka mifupi (p20) siku {p20}."
  hi: "जल-संतुलन समाप्ति तक मौसम की लंबाई ({awc:g} मिमी भंडार ET₀ से खाली): माध्यिका {p50} दिन, छोटे वर्ष (p20) {p20} दिन।"
  de: "Saisonlänge bis zum Ende der Wasserbilanz ({awc:g}-mm-Speicher durch ET₀ geleert): Median {p50} Tage, kurze Jahre (p20) {p20} Tage."
on_step_rain_since:
  en: "Rain since {date}: {mm:.0f} mm (incl. 16-day forecast where marked)."
  es: "Lluvia desde el {date}: {mm:.0f} mm (incluye pronóstico de 16 días donde se indica)."
  fr: "Pluie depuis le {date} : {mm:.0f} mm (prévision à 16 jours incluse là où c'est indiqué)."
  sw: "Mvua tangu {date}: mm {mm:.0f} (pamoja na utabiri wa siku 16 palipowekwa alama)."
  hi: "{date} से वर्षा: {mm:.0f} मिमी (जहाँ चिह्नित है, 16 दिन का पूर्वानुमान शामिल)।"
  de: "Regen seit {date}: {mm:.0f} mm (inkl. 16-Tage-Vorhersage, wo markiert)."
on_step_apparent:
  en: "Apparent onset {date}; {checked} of {check} days checked with observations and forecast. In {n} similar past situations, a damaging dry spell still followed in {pct} %."
  es: "Inicio aparente {date}; {checked} de {check} días comprobados con observaciones y pronóstico. En {n} situaciones pasadas similares, aún siguió una racha seca dañina en el {pct} %."
  fr: "Début apparent le {date} ; {checked} jours sur {check} vérifiés par observations et prévision. Dans {n} situations passées similaires, une période sèche dommageable a encore suivi dans {pct} % des cas."
  sw: "Mwanzo unaoonekana {date}; siku {checked} kati ya {check} zimekaguliwa kwa vipimo na utabiri. Katika hali {n} zinazofanana zilizopita, ukavu wenye madhara bado ulifuata katika {pct} %."
  hi: "स्पष्ट आरंभ {date}; {check} में से {checked} दिन अवलोकन और पूर्वानुमान से जाँचे। {n} मिलती-जुलती पिछली स्थितियों में {pct} % में फिर भी नुकसानदेह सूखा आया।"
  de: "Scheinbarer Beginn {date}; {checked} von {check} Tagen mit Beobachtung und Vorhersage geprüft. In {n} ähnlichen früheren Fällen folgte in {pct} % trotzdem eine schädliche Trockenphase."
on_step_crop:
  en: "{crop}: {need} days from sowing to the end of grain fill (FAO-56 stages; total cycle {cycle} days). Sown on {sow}, it would have finished grain fill before the rains ended in {fit} % of past seasons. The season ends after {end} in {rel} % of years"
  es: "{crop}: {need} días de la siembra al final del llenado de grano (etapas FAO-56; ciclo total {cycle} días). Sembrado el {sow}, habría terminado el llenado antes del fin de las lluvias en el {fit} % de las temporadas pasadas. La temporada termina después del {end} en el {rel} % de los años"
  fr: "{crop} : {need} jours du semis à la fin du remplissage du grain (stades FAO-56 ; cycle total {cycle} jours). Semé le {sow}, il aurait fini le remplissage avant la fin des pluies dans {fit} % des saisons passées. La saison se termine après le {end} dans {rel} % des années"
  sw: "{crop}: siku {need} kutoka kupanda hadi mwisho wa kujaa punje (hatua za FAO-56; mzunguko mzima siku {cycle}). Likipandwa {sow}, lingemaliza kujaa punje kabla mvua hazijaisha katika {fit} % ya misimu iliyopita. Msimu huisha baada ya {end} katika {rel} % ya miaka"
  hi: "{crop}: बुवाई से दाना भरने के अंत तक {need} दिन (FAO-56 चरण; कुल चक्र {cycle} दिन)। {sow} को बोने पर पिछले {fit} % मौसमों में बारिश खत्म होने से पहले दाना भर जाता। {rel} % वर्षों में मौसम {end} के बाद खत्म होता है"
  de: "{crop}: {need} Tage von der Saat bis zum Ende der Kornfüllung (FAO-56-Stadien; Gesamtzyklus {cycle} Tage). Gesät am {sow}, wäre die Kornfüllung in {fit} % der vergangenen Saisons vor dem Ende der Regenzeit fertig gewesen. Die Saison endet in {rel} % der Jahre nach dem {end}"
on_step_crop_fits: {en: ", so sow by {date}.", es: ", así que siembre antes del {date}.", fr: ", donc semez avant le {date}.", sw: ", hivyo panda kabla ya {date}.", hi: ", इसलिए {date} तक बोएँ।", de: ", also bis zum {date} säen."}
on_step_crop_short: {en: "; only varieties of ≤ {days} days fit.", es: "; solo caben variedades de ≤ {days} días.", fr: " ; seules les variétés de ≤ {days} jours conviennent.", sw: "; ni aina za ≤ siku {days} tu zinazofaa.", hi: "; केवल ≤ {days} दिन की किस्में फिट होती हैं।", de: "; nur Sorten mit ≤ {days} Tagen passen."}
on_step_trend:
  en: "Since 1984 the {season} onset has shifted {on:+.1f} days/decade (p = {onp:.2f}) and the season length {ln:+.1f} days/decade (p = {lnp:.2f})."
  es: "Desde 1984 el inicio {season} se ha desplazado {on:+.1f} días/década (p = {onp:.2f}) y la duración de la temporada {ln:+.1f} días/década (p = {lnp:.2f})."
  fr: "Depuis 1984, le début {season} s'est décalé de {on:+.1f} jours/décennie (p = {onp:.2f}) et la durée de saison de {ln:+.1f} jours/décennie (p = {lnp:.2f})."
  sw: "Tangu 1984 mwanzo wa {season} umesogea siku {on:+.1f}/muongo (p = {onp:.2f}) na urefu wa msimu siku {ln:+.1f}/muongo (p = {lnp:.2f})."
  hi: "1984 से {season} आरंभ {on:+.1f} दिन/दशक खिसका है (p = {onp:.2f}) और मौसम की लंबाई {ln:+.1f} दिन/दशक (p = {lnp:.2f})।"
  de: "Seit 1984 hat sich der {season}-Beginn um {on:+.1f} Tage/Jahrzehnt verschoben (p = {onp:.2f}) und die Saisonlänge um {ln:+.1f} Tage/Jahrzehnt (p = {lnp:.2f})."
on_note:
  en: "Validated against published onset climatologies (docs/VALIDATION.md, V9); a ~50 km rain grid misses single storms."
  es: "Validado con climatologías de inicio publicadas (docs/VALIDATION.md, V9); una cuadrícula de lluvia de ~50 km no capta tormentas aisladas."
  fr: "Validé par rapport à des climatologies de début publiées (docs/VALIDATION.md, V9) ; une maille de pluie de ~50 km manque les orages isolés."
  sw: "Imethibitishwa dhidi ya takwimu za mwanzo zilizochapishwa (docs/VALIDATION.md, V9); gridi ya mvua ya ~km 50 hukosa dhoruba moja moja."
  hi: "प्रकाशित आरंभ जलवायु आँकड़ों से सत्यापित (docs/VALIDATION.md, V9); ~50 किमी वर्षा ग्रिड इक्का-दुक्का तूफ़ान छोड़ देता है।"
  de: "Validiert an veröffentlichten Beginn-Klimatologien (docs/VALIDATION.md, V9); ein ~50-km-Regenraster verpasst einzelne Gewitter."
on_caveat_grid:
  en: "Rain comes from NASA POWER (~50 km grid) and a forecast: a storm on your farm may not show, and vice versa. Your own rain gauge is the best check."
  es: "La lluvia viene de NASA POWER (cuadrícula de ~50 km) y de un pronóstico: una tormenta en su finca puede no aparecer, y al revés. Su propio pluviómetro es la mejor comprobación."
  fr: "La pluie vient de NASA POWER (maille ~50 km) et d'une prévision : un orage sur votre ferme peut ne pas apparaître, et inversement. Votre propre pluviomètre reste la meilleure vérification."
  sw: "Mvua inatoka NASA POWER (gridi ya ~km 50) na utabiri: dhoruba shambani kwako inaweza isionekane, na kinyume chake. Kipimo chako cha mvua ndicho uthibitisho bora."
  hi: "वर्षा NASA POWER (~50 किमी ग्रिड) और पूर्वानुमान से है: आपके खेत का तूफ़ान न दिखे, या उल्टा भी हो सकता है। आपका अपना वर्षामापी सबसे अच्छी जाँच है।"
  de: "Der Regen stammt aus NASA POWER (~50-km-Raster) und einer Vorhersage: Ein Gewitter auf Ihrem Hof fehlt eventuell und umgekehrt. Der eigene Regenmesser ist die beste Kontrolle."
on_caveat_agronomic:
  en: "Onset rules are agronomic (enough soil water to sow), not the meteorological monsoon onset announced by weather services."
  es: "Las reglas de inicio son agronómicas (suficiente agua en el suelo para sembrar), no el inicio meteorológico del monzón que anuncian los servicios del tiempo."
  fr: "Les règles de début sont agronomiques (assez d'eau dans le sol pour semer), pas le début météorologique de la mousson annoncé par les services météo."
  sw: "Kanuni za mwanzo ni za kilimo (maji ya kutosha udongoni kupanda), si mwanzo wa monsuni unaotangazwa na idara za hali ya hewa."
  hi: "आरंभ नियम कृषि आधारित हैं (बुवाई लायक मिट्टी में पानी), मौसम विभाग द्वारा घोषित मानसून आगमन नहीं।"
  de: "Die Beginn-Regeln sind agronomisch (genug Bodenwasser zur Saat), nicht der von Wetterdiensten verkündete meteorologische Monsunbeginn."
on_caveat_cycle:
  en: "Crop cycle lengths are FAO-56 typical values; your variety may be shorter or longer."
  es: "Las duraciones de ciclo son valores típicos FAO-56; su variedad puede ser más corta o más larga."
  fr: "Les durées de cycle sont des valeurs typiques FAO-56 ; votre variété peut être plus courte ou plus longue."
  sw: "Urefu wa mzunguko wa mazao ni thamani za kawaida za FAO-56; aina yako inaweza kuwa fupi au ndefu zaidi."
  hi: "फसल चक्र की लंबाई FAO-56 के सामान्य मान हैं; आपकी किस्म छोटी या लंबी हो सकती है।"
  de: "Zykluslängen sind typische FAO-56-Werte; Ihre Sorte kann kürzer oder länger sein."
plan_onset_note:
  en: "Rain-fed sowing should follow the {season} rains: they start after {p50} in half of past years (8 in 10: {p20}–{p80})."
  es: "La siembra de secano debe seguir a las lluvias {season}: empiezan después del {p50} en la mitad de los años pasados (8 de 10: {p20}–{p80})."
  fr: "Le semis en pluvial doit suivre les pluies {season} : elles commencent après le {p50} une année sur deux (8 sur 10 : {p20}–{p80})."
  sw: "Kupanda kwa kutegemea mvua kunapaswa kufuata mvua za {season}: zinaanza baada ya {p50} katika nusu ya miaka iliyopita (8 kati ya 10: {p20}–{p80})."
  hi: "वर्षा-आधारित बुवाई {season} बारिश के बाद होनी चाहिए: आधे पिछले वर्षों में यह {p50} के बाद शुरू होती है (10 में 8: {p20}–{p80})।"
  de: "Die Saat im Regenfeldbau sollte dem {season}-Regen folgen: Er beginnt in der Hälfte der Jahre nach dem {p50} (8 von 10: {p20}–{p80})."
plan_onset_sow_by:
  en: " To finish grain fill before the rains end in {rel} % of years, sow by {date}."
  es: " Para terminar el llenado de grano antes del fin de las lluvias en el {rel} % de los años, siembre antes del {date}."
  fr: " Pour finir le remplissage du grain avant la fin des pluies dans {rel} % des années, semez avant le {date}."
  sw: " Ili kumaliza kujaa punje kabla mvua hazijaisha katika {rel} % ya miaka, panda kabla ya {date}."
  hi: " {rel} % वर्षों में बारिश खत्म होने से पहले दाना भरने के लिए {date} तक बोएँ।"
  de: " Damit die Kornfüllung in {rel} % der Jahre vor Ende der Regenzeit fertig ist, bis zum {date} säen."
plan_onset_early_variety:
  en: " A full-length variety finishes before the rains end in fewer than {n} of 10 years: use an early variety (≤ {days} days to maturity)."
  es: " Una variedad de ciclo completo termina antes del fin de las lluvias en menos de {n} de cada 10 años: use una variedad precoz (≤ {days} días a madurez)."
  fr: " Une variété à cycle complet termine avant la fin des pluies moins de {n} années sur 10 : utilisez une variété précoce (≤ {days} jours jusqu'à maturité)."
  sw: " Aina ya muda kamili humaliza kabla mvua hazijaisha katika chini ya miaka {n} kati ya 10: tumia aina ya mapema (≤ siku {days} hadi kukomaa)."
  hi: " पूरी अवधि की किस्म 10 में से {n} से कम वर्षों में बारिश खत्म होने से पहले पकती है: जल्दी पकने वाली किस्म (≤ {days} दिन) लगाएँ।"
  de: " Eine Sorte mit voller Länge wird in weniger als {n} von 10 Jahren vor dem Ende der Regenzeit reif: eine frühe Sorte (≤ {days} Tage bis zur Reife) wählen."
