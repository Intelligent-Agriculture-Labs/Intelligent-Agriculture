# Why-view texts of the advice cards (engine/service.py: water balance, planning). {placeholders} may carry
# Python format specs ({x:.0f}); keep them unchanged in every language.
why_caveat_grid:
  en: "Weather comes from NASA POWER (~50 km grid) and a forecast (~10–25 km): conditions at your field can differ, especially near hills or water."
  es: "El tiempo viene de NASA POWER (cuadrícula de ~50 km) y de un pronóstico (~10–25 km): en su campo puede ser distinto, sobre todo cerca de cerros o agua."
  fr: "La météo provient de NASA POWER (maille ~50 km) et d'une prévision (~10–25 km) : les conditions sur votre parcelle peuvent différer, surtout près des collines ou de l'eau."
  sw: "Hali ya hewa inatoka NASA POWER (gridi ya ~km 50) na utabiri (~km 10–25): shambani kwako inaweza kuwa tofauti, hasa karibu na milima au maji."
  hi: "मौसम NASA POWER (~50 किमी ग्रिड) और पूर्वानुमान (~10–25 किमी) से है: आपके खेत की स्थिति अलग हो सकती है, खासकर पहाड़ियों या पानी के पास।"
  de: "Das Wetter stammt aus NASA POWER (~50-km-Raster) und einer Vorhersage (~10–25 km): Auf Ihrem Feld kann es anders sein, besonders nahe Hügeln oder Gewässern."
series_soil_depletion:
  en: "Root-zone water used (depletion)"
  es: "Agua usada de la zona de raíces (agotamiento)"
  fr: "Eau consommée dans la zone racinaire (épuisement)"
  sw: "Maji yaliyotumika eneo la mizizi (upungufu)"
  hi: "जड़ क्षेत्र से उपयोग हुआ पानी (कमी)"
  de: "Verbrauchtes Wasser im Wurzelraum (Entleerung)"
series_raw:
