    breaks: [take-all, eyespot (partial)]
    sources:
    - 'Allen R.G. et al. 1998, FAO-56 Crop evapotranspiration, https://www.fao.org/3/x0490e/x0490e00.htm — Kc: Table 12 ''Oats''; stages: Table 11 ''Barley/Oats/Wheat'' (Mar/Apr, 35–45°L); Zr 1.0–1.5 m,
      p 0.55: Table 22'
    - 'Steduto P. et al. 2012, FAO-66 Crop yield response to water (Table 1 reproduces FAO-33 seasonal Ky), https://www.fao.org/3/i2800e/i2800e.pdf — Ky: no FAO-33 value for oats; spring-cereal value 1.0
      used (as for barley in crops.yaml)'
    - 'Steduto P. et al. 2009, AquaCrop—The FAO crop model to simulate yield response to water: I, https://doi.org/10.2134/agronj2008.0139s — WP* 15 g/m² (C3 cereal default)'
    - 'Porter J.R. et al. 1999, Temperatures and the growth and development of wheat: a review, https://doi.org/10.1016/S1161-0301(98)00047-1'
    - 'Luo Q. 2011, Temperature thresholds and crop production: a review, https://doi.org/10.1007/s10584-011-0028-6'
    - Indicative prices/costs 2023–24 (USDA NASS https://www.nass.usda.gov/; World Bank Pink Sheet https://www.worldbank.org/en/research/commodity-markets; FAOSTAT https://www.fao.org/faostat/en/#data/PP;
