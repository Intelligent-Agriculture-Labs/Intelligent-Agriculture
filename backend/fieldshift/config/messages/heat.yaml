  fr: "WBGT extérieur maximal du jour (stress thermique des travailleurs)"
  sw: "WBGT ya juu ya kila siku nje (msongo wa joto kwa wafanyakazi)"
  hi: "दैनिक अधिकतम बाहरी WBGT (कामगारों पर गर्मी का तनाव)"
  de: "Tägliches Maximum WBGT im Freien (Hitzestress für Arbeitende)"
