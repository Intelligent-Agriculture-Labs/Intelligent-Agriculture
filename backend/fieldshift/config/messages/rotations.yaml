  fr: "{label} : baisse de {slope:.1f} {unit} par décennie depuis {year} ({base:.0f} → {recent:.0f} {unit} ; Mann–Kendall p = {p:.2f})."
  sw: "{label} imepungua kwa {slope:.1f} {unit} kila muongo tangu {year} ({base:.0f} → {recent:.0f} {unit}; Mann–Kendall p = {p:.2f})."
  hi: "{label} {year} से प्रति दशक {slope:.1f} {unit} घटा है ({base:.0f} → {recent:.0f} {unit}; मैन–केंडल p = {p:.2f})।"
