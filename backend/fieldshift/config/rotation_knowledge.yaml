# IA rotation knowledge base — version 1.0.0
# Biological basis for rotation planning (see docs/ROTATION_SCIENCE.md).
#   pathogens .... soil-/residue-borne organisms (and parasitic weeds/insects) that rotation controls.
#                  hosts = crop ids in crops.yaml ∪ crops_extra.yaml; survival_years = persistence without a host;
#                  break_years = recommended host-free years. Optional: trap_crops (stimulate suicidal germination),
#                  favoured_by (crops that build the population without being damaged).
#   crops ........ one entry per crop id. min_return_years = minimum years before the same crop (lower bound of the
#                  literature range; range in `note`). n_effect_kg_ha = residual N credit (+) / immobilisation (−) for
#                  the NEXT crop. residue_c_t_ha = above-ground residue returned, t DM/ha (typical).
#                  good_/poor_predecessors = crops that are good/poor to grow BEFORE this crop.
#   rules ........ general rules for the checker. yield_effect_pct is a typical effect on the affected crop.
#                  Optional structured fields: applies_to (crop ids), after (predecessor crop ids), window_years
#                  (default 1 = directly preceding), host_group (pathogen id), low_confidence (effect size is an
#                  expert estimate from a qualitative source).
# Ranges in sources are reduced to midpoints and flagged in the note. All references are real and checkable.

version: "1.0.0"
pathogens:
  take_all:
    name: Gaeumannomyces tritici (take-all)
    kind: fungus
    hosts: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye, clover_grass_ley, cover_rye_vetch]
    survival_years: 1
    break_years: 1
    severity: high
    note: Root-rot fungus that lives on cereal and grass roots/stubble; one non-grass year starves it (two years is safer). Oats are immune; rye is tolerant. Continuous wheat can show 'take-all decline'
      after the 3rd–5th crop.
    sources:
    - Cook R.J. 2003, Take-all of wheat, https://doi.org/10.1016/S0885-5765(03)00042-0
    - AHDB. Non-chemical control of take-all in cereals. https://ahdb.org.uk/knowledge-library/non-chemical-control-of-take-all-in-cereals
    - AHDB. Rotation, cultivation and drilling options for cereal disease management. https://ahdb.org.uk/knowledge-library/rotation-cultivation-and-drilling-options-for-cereal-disease-management
    - Angus J.F. et al. 2015, Break crops and rotations for wheat, https://doi.org/10.1071/CP14252
  fusarium_head_blight:
    name: Fusarium graminearum / F. culmorum (head blight, stalk & ear rot; DON mycotoxin)
    kind: fungus
    hosts: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye, oats, maize, maize_silage, sweet_corn, sorghum, rice]
    survival_years: 2
    break_years: 1
    severity: high
    note: Survives on maize and cereal residue on the soil surface for about 2 years; wheat right after maize (especially no-till) has the highest head-blight and DON risk.
    sources:
    - 'McMullen M. et al. 2012, A unified effort to fight an enemy of wheat and barley: Fusarium head blight, https://doi.org/10.1094/PDIS-03-12-0291-FE'
    - Dill-Macky R. et al. 2000, The effect of previous crop residues and tillage on Fusarium head blight of wheat, https://doi.org/10.1094/PDIS.2000.84.1.71
  eyespot:
    name: Oculimacula yallundae / O. acuformis (eyespot)
    kind: fungus
    hosts: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye]
    survival_years: 2
    break_years: 2
    severity: medium
    note: Stem-base fungus carried on cereal stubble; a 1–2-year non-cereal break lowers but does not remove risk (air-borne spores). Wheat as previous crop is riskiest; early sowing raises risk.
    sources:
    - Fitt B.D.L. et al. 1988, Eyespot (Pseudocercosporella herpotrichoides) epidemiology in relation to prediction of disease severity and yield loss in winter wheat — a review, https://doi.org/10.1111/j.1365-3059.1988.tb02081.x
    - AHDB. Eyespot in cereals and risk assessment in wheat. https://ahdb.org.uk/knowledge-library/eyespot-in-cereals-and-risk-assessment-in-wheat
  cereal_cyst_nematode:
    name: Heterodera avenae / H. filipjevi (cereal cyst nematode)
    kind: nematode
    hosts: [oats, winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye, clover_grass_ley]
    survival_years: 3
    break_years: 2
    severity: medium
    note: Cysts persist a few years; populations fall quickly under broadleaf crops. Oats are the most damaged host; resistant cereal cultivars also reduce numbers.
    sources:
    - 'Smiley R.W. et al. 2017, Cereal cyst nematodes: a complex and destructive group of Heterodera species, https://doi.org/10.1094/PDIS-03-17-0355-FE'
    - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
  root_lesion_nematode:
    name: Pratylenchus thornei / P. neglectus (root-lesion nematodes)
    kind: nematode
    hosts: [winter_wheat, spring_wheat, durum_wheat, barley, chickpea, faba_bean, mung_bean, soybean, winter_rapeseed]
    survival_years: 3
    break_years: 2
    severity: medium
    note: Survive dry soil for years; wheat, chickpea and mung bean multiply P. thornei, canola multiplies P. neglectus. Sorghum, sunflower, cotton and most cover grasses are poor hosts.
    sources:
    - Thompson J.P. et al. 2008, Root-lesion nematodes (Pratylenchus thornei and P, https://doi.org/10.1071/AP08021
    - Angus J.F. et al. 2015, Break crops and rotations for wheat, https://doi.org/10.1071/CP14252
  sclerotinia:
    name: Sclerotinia sclerotiorum (white mould / stem rot)
    kind: fungus
    hosts: [soybean, dry_bean, sunflower, safflower, winter_rapeseed, mustard_cover, field_pea, lentil, chickpea, faba_bean, potato, tomato, carrot, cabbage, pepper, squash, watermelon, groundnut, hemp]
    survival_years: 5
    break_years: 3
    severity: high
    note: Over 400 broadleaf hosts; hard sclerotia survive in soil for about 5 years (up to 8). Never stack two Sclerotinia hosts in consecutive years; grasses and cereals are non-hosts.
    sources:
    - 'Bolton M.D. et al. 2006, Sclerotinia sclerotiorum (Lib.) de Bary: biology and molecular traits of a cosmopolitan pathogen, https://doi.org/10.1111/j.1364-3703.2005.00316.x'
    - Kirkegaard J. et al. 2008, Break crop benefits in temperate wheat production, https://doi.org/10.1016/j.fcr.2008.02.010
  clubroot:
    name: Plasmodiophora brassicae (clubroot)
    kind: fungus
    hosts: [winter_rapeseed, mustard_cover, cabbage]
    survival_years: 17
    break_years: 2
    severity: high
    note: Resting spores survive 15–20 years (midpoint used) but most lose viability within two host-free years; keep at least two years between brassicas and control cruciferous weeds/volunteers.
    sources:
    - Dixon G.R. 2009, The occurrence and economic impact of Plasmodiophora brassicae and clubroot disease, https://doi.org/10.1007/s00344-009-9090-y
    - Wallenhammar A.-C. 1996, Prevalence of Plasmodiophora brassicae in a spring oilseed rape growing area in central Sweden and factors influencing soil infestation levels, https://doi.org/10.1046/j.1365-3059.1996.d01-173.x
    - Canola Council of Canada. Canola Encyclopedia — Clubroot (spores survive up to 15–20 years; at least a two-year break). https://www.canolacouncil.org/canola-encyclopedia/diseases/clubroot/
  blackleg:
    name: Leptosphaeria maculans (blackleg / phoma stem canker)
    kind: fungus
    hosts: [winter_rapeseed, mustard_cover, cabbage]
    survival_years: 3
    break_years: 3
    severity: high
    note: Survives on canola stubble until it decomposes (≈3–4 years); airborne spores from old stubble infect new crops, so rotate and keep new canola away from last year's stubble.
    sources:
    - West J.S. et al. 2001, Epidemiology and management of Leptosphaeria maculans (phoma stem canker) on oilseed rape in Australia, Canada and Europe, https://doi.org/10.1046/j.1365-3059.2001.00546.x
    - Canola Council of Canada. Canola Encyclopedia — Blackleg. https://www.canolacouncil.org/canola-encyclopedia/diseases/blackleg/
    - Harker K.N. et al. 2015, Canola rotation frequency impacts canola yield and associated pest species, https://doi.org/10.4141/cjps-2014-289
  verticillium_wilt:
    name: Verticillium dahliae / V. longisporum (Verticillium wilt)
    kind: fungus
    hosts: [potato, tomato, pepper, sunflower, safflower, cotton, watermelon, squash, winter_rapeseed, cabbage, mustard_cover, alfalfa, hemp]
    survival_years: 14
    break_years: 4
    severity: high
    note: Microsclerotia survive up to ~14 years, so rotation only slowly reduces inoculum; cereals, maize and grasses are non-hosts and the best break.
    sources:
    - Fradin E.F. et al. 2006, Physiology and molecular aspects of Verticillium wilt diseases caused by V, https://doi.org/10.1111/j.1364-3703.2006.00323.x
    - 'Bennett A.J. et al. 2012, Meeting the demand for crop production: the challenge of yield decline in crops grown in short rotations, https://doi.org/10.1111/j.1469-185X.2011.00184.x'
  aphanomyces_root_rot:
    name: Aphanomyces euteiches (pea & lentil root rot)
    kind: oomycete
    hosts: [field_pea, lentil, faba_bean, alfalfa, dry_bean, clover_grass_ley]
    survival_years: 10
    break_years: 6
    severity: high
    note: Oospores persist 10+ years; once a field is infested, peas and lentils fail for many years. Keep ≥5–6 years between peas and test soil before sowing.
    sources:
    - Gaulin E. et al. 2007, Root rot disease of legumes caused by Aphanomyces euteiches, https://doi.org/10.1111/j.1364-3703.2007.00413.x
    - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
  ascochyta_blight:
    name: Ascochyta / Didymella spp. (ascochyta blights of pulses)
    kind: fungus
    hosts: [field_pea, lentil, chickpea, faba_bean]
    survival_years: 3
    break_years: 3
    severity: medium
    note: Host-specific species survive on pulse stubble and seed for ~2–4 years (midpoint used); sow clean seed far from last year's stubble and keep ≥3 years between the same pulse.
    sources:
    - Tivoli B. et al. 2007, Comparison of the epidemiology of ascochyta blights on grain legumes, https://doi.org/10.1007/s10658-007-9117-9
  phytophthora_capsici:
    name: Phytophthora capsici (Phytophthora blight of vegetables)
    kind: oomycete
    hosts: [pepper, squash, watermelon, tomato, dry_bean]
    survival_years: 5
    break_years: 3
    severity: high
    note: Oospores survive several years in wet soils; rotate away from peppers, cucurbits and tomato for ≥3 years and avoid waterlogged fields.
    sources:
    - 'Hausbeck M.K. et al. 2004, Phytophthora capsici on vegetable crops: research progress and management challenges, https://doi.org/10.1094/PDIS.2004.88.12.1292'
  phytophthora_sojae:
    name: Phytophthora sojae (Phytophthora root and stem rot of soybean)
    kind: oomycete
    hosts: [soybean]
    survival_years: 10
    break_years: 2
    severity: medium
    note: Oospores persist many years; rotation helps only partly — resistant varieties and drainage matter more.
    sources:
    - Dorrance A.E. et al. 2007, Phytophthora root and stem rot of soybean, https://doi.org/10.1094/PHI-I-2007-0830-07
  rhizoctonia:
    name: Rhizoctonia solani (root & crown rot, black scurf, sheath blight)
    kind: fungus
    hosts: [sugar_beet, potato, soybean, dry_bean, rice, maize, maize_silage, carrot, cabbage, cotton, field_pea, groundnut]
    survival_years: 5
    break_years: 2
    severity: medium
    note: Very wide host range and long saprophytic survival; maize before sugar beet raises crown-rot risk (AG 2-2). Cereals and grasses reduce but do not eliminate it.
    sources:
    - 'Ajayi-Oyetunde O.O. et al. 2018, Rhizoctonia solani: taxonomy, population biology and management of rhizoctonia seedling disease of soybean, https://doi.org/10.1111/ppa.12733'
    - Larkin R.P. et al. 2011, Effects of different potato cropping system approaches and water management on soilborne diseases and soil microbial communities, https://doi.org/10.1094/PHYTO-04-10-0100
  pythium:
    name: Pythium spp. (damping-off, root rot, cavity spot)
    kind: oomycete
    hosts: [maize, soybean, field_pea, dry_bean, chickpea, winter_wheat, sugar_beet, cotton, carrot, watermelon, squash]
    survival_years: 10
    break_years: 0
    severity: medium
    note: Generalist soil oomycete with long-lived oospores; rotation has little effect — use drainage, seed treatment and avoid cold wet sowing.
    sources:
    - van West P. et al. 2003, Advances in research on oomycete root pathogens, https://doi.org/10.1016/S0885-5765(03)00044-4
  soybean_cyst_nematode:
    name: Heterodera glycines (soybean cyst nematode, SCN)
    kind: nematode
    hosts: [soybean, dry_bean]
    survival_years: 10
    break_years: 2
    severity: high
    note: Eggs in cysts survive about 10 years; each non-host year lowers numbers. Rotate soybean with maize/cereals and switch resistance sources.
    sources:
    - Niblack T.L. 2005, Soybean cyst nematode management reconsidered, https://doi.org/10.1094/PD-89-1020
  beet_cyst_nematode:
    name: Heterodera schachtii (beet cyst nematode, BCN)
    kind: nematode
    hosts: [sugar_beet, winter_rapeseed, mustard_cover, cabbage, quinoa]
    survival_years: 6
    break_years: 4
    severity: high
    note: Cysts persist several years; brassicas (oilseed rape, cabbage, non-resistant mustard) and chenopods also multiply it, so count them as 'beet years'. Resistant mustard / oil-radish catch crops
      reduce it.
    sources:
    - UC IPM. Sugarbeet — Sugarbeet cyst nematode (Heterodera schachtii). University of California Agriculture and Natural Resources. https://ipm.ucanr.edu/agriculture/sugarbeet/sugarbeet-cyst-nematode/
    - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
    - 'Matthiessen J.N. et al. 2006, Biofumigation and enhanced biodegradation: opportunity and challenge in soilborne pest and disease management, https://doi.org/10.1080/07352680600611543'
  potato_cyst_nematode:
    name: Globodera rostochiensis / G. pallida (potato cyst nematode)
    kind: nematode
    hosts: [potato, tomato]
    survival_years: 20
    break_years: 6
    severity: high
    note: Cysts survive 20+ years; eggs decline only ~20–33 % per year without potatoes, so ≥6-year breaks are needed in infested fields (plus resistant varieties).
    sources:
    - Whitehead A.G. 1995, Decline of potato cyst nematodes, Globodera rostochiensis and G, https://doi.org/10.1111/j.1365-3059.1995.tb02728.x
    - 'Bennett A.J. et al. 2012, Meeting the demand for crop production: the challenge of yield decline in crops grown in short rotations, https://doi.org/10.1111/j.1469-185X.2011.00184.x'
  root_knot_nematode:
    name: Meloidogyne spp. (root-knot nematodes)
    kind: nematode
    hosts: [tomato, pepper, carrot, potato, sweet_potato, cotton, groundnut, soybean, dry_bean, cowpea, watermelon, squash, cabbage, onion, cassava, sugar_beet, maize, sugarcane, rice, chickpea, mung_bean,
      pigeon_pea, sunflower, quinoa]
    survival_years: 2
    break_years: 2
    severity: high
    note: Thousands of hosts (most vegetables and tropical crops); eggs survive ~1–2 years but weeds keep populations alive. Use poor hosts (resistant sorghum-sudangrass, some cereals, groundnut against
      M. incognita) and biofumigant covers.
    sources:
    - Moens M. et al. 2009, Meloidogyne species — a diverse group of novel and important plant parasites, https://doi.org/10.1079/9781845934927.0001
    - 'Matthiessen J.N. et al. 2006, Biofumigation and enhanced biodegradation: opportunity and challenge in soilborne pest and disease management, https://doi.org/10.1080/07352680600611543'
  corn_rootworm:
    name: Diabrotica virgifera / D. barberi (corn rootworm)
    kind: insect
    hosts: [maize, maize_silage, sweet_corn]
    survival_years: 1
    break_years: 1
    severity: high
    note: Eggs laid in maize hatch next year and larvae can only feed on maize roots, so one year without maize breaks the cycle — except where rotation-resistant or extended-diapause variants occur.
    sources:
    - 'Gray M.E. et al. 2009, Adaptation and invasiveness of western corn rootworm: intensifying research on a worsening pest, https://doi.org/10.1146/annurev.ento.54.110807.090434'
  wireworms:
    name: Agriotes spp. (wireworms, click-beetle larvae)
    kind: insect
    hosts: [potato, sweet_potato, maize, maize_silage, sweet_corn, sugar_beet, carrot, onion]
    survival_years: 5
    break_years: 3
    severity: medium
    favoured_by: [clover_grass_ley]
    note: Larvae live 4–5 years and build up under grass and leys; for 2–4 years after ploughing grassland, potatoes, maize, beet and root vegetables are at risk.
    sources:
    - Parker W.E. et al. 2001, The biology and management of wireworms (Agriotes spp.) on potato with particular reference to the U.K, https://doi.org/10.1046/j.1461-9563.2001.00094.x
  striga:
    name: Striga hermonthica / S. asiatica (witchweed)
    kind: weed
    hosts: [maize, sorghum, pearl_millet, rice, sugarcane, sorghum_sudan]
    survival_years: 15
    break_years: 3
    severity: high
    trap_crops: [cowpea, groundnut, soybean, cotton, pigeon_pea, mung_bean]
    note: Parasitic weed of cereals in Africa; seeds stay viable 10–20 years (midpoint used). Legume 'trap crops' trigger suicidal germination and add N that suppresses Striga.
    sources:
    - Oswald A. 2005, Striga control — technologies and their dissemination, https://doi.org/10.1016/j.cropro.2004.09.003
    - Parker C. 2009, Observations on the current status of Orobanche and Striga problems worldwide, https://doi.org/10.1002/ps.1713
  broomrape:
    name: Orobanche / Phelipanche spp. (broomrape)
    kind: weed
    hosts: [faba_bean, field_pea, lentil, chickpea, sunflower, tomato, potato, carrot, hemp, winter_rapeseed]
    survival_years: 10
    break_years: 5
    severity: high
    trap_crops: [flax, winter_wheat, barley]
    note: Root-parasitic weed of pulses, sunflower and vegetables; seeds survive >10 years. Long breaks plus trap/catch crops (e.g. flax, cereals) are needed.
    sources:
    - Parker C. 2009, Observations on the current status of Orobanche and Striga problems worldwide, https://doi.org/10.1002/ps.1713
  cereal_stem_borers:
    name: Busseola fusca / Chilo partellus / Sesamia (cereal stem borers)
    kind: insect
    hosts: [maize, sorghum, pearl_millet, sugarcane, rice, sorghum_sudan, sweet_corn]
    survival_years: 1
    break_years: 1
    severity: high
    note: Larvae survive the dry season inside cereal stalks; destroying stubble and rotating with legumes or cassava breaks the cycle.
    sources:
    - Kfir R. et al. 2002, Biology and management of economically important lepidopteran cereal stem borers in Africa, https://doi.org/10.1146/annurev.ento.47.091201.145254
  fall_armyworm:
    name: Spodoptera frugiperda (fall armyworm)
    kind: insect
    hosts: [maize, sweet_corn, sorghum, rice, pearl_millet, sugarcane, cotton]
    survival_years: 0
    break_years: 0
    severity: high
    note: Migratory moth with no soil-resting stage — crop rotation does NOT control it; scout, use intercropping/push-pull and natural enemies.
    sources:
    - 'Day R. et al. 2017, Fall armyworm: impacts and implications for Africa, https://doi.org/10.1564/v28_oct_02'
    - 'Prasanna B.M. et al. 2018, Fall Armyworm in Africa: A Guide for Integrated Pest Management, https://repository.cimmyt.org/handle/10883/19204'
  gray_leaf_spot:
    name: Cercospora zeae-maydis (gray leaf spot of maize)
    kind: fungus
    hosts: [maize, maize_silage, sweet_corn]
    survival_years: 1
    break_years: 1
    severity: medium
    note: Survives on maize residue left on the surface; one year without maize (or burying residue) sharply reduces early infection.
    sources:
    - 'Ward J.M.J. et al. 1999, Gray leaf spot: a disease of global importance in maize production, https://doi.org/10.1094/PDIS.1999.83.10.884'
  rhizomania:
    name: Beet necrotic yellow vein virus vectored by Polymyxa betae (rhizomania)
    kind: virus-vector
    hosts: [sugar_beet]
    survival_years: 15
    break_years: 3
    severity: medium
    note: The soil vector's resting spores carry the virus for 15+ years; rotation cannot clean a field — grow resistant varieties and avoid short beet rotations that intensify it.
    sources:
    - McGrann G.R.D. et al. 2009, Progress towards the understanding and control of sugar beet rhizomania disease, https://doi.org/10.1111/j.1364-3703.2008.00514.x
  white_rot:
    name: Sclerotium cepivorum (white rot of onion & garlic)
    kind: fungus
    hosts: [onion]
    survival_years: 20
    break_years: 15
    severity: high
    note: Sclerotia survive 20+ years; rotation alone will not clean a field — avoid moving infested soil and do not plant alliums there for many years.
    sources:
    - UC IPM. Onion and garlic — White rot (Sclerotium cepivorum). University of California Agriculture and Natural Resources. https://ipm.ucanr.edu/agriculture/onion-and-garlic/white-rot/
  common_scab:
    name: Streptomyces scabies (common scab)
    kind: bacterium
    hosts: [potato, carrot, sugar_beet, groundnut]
    survival_years: 10
    break_years: 3
    severity: medium
    note: Soil saprophyte that persists indefinitely; diverse rotations with disease-suppressive crops (mustard, sudangrass, rye) reduced scab 15–45 % vs continuous potato.
    sources:
    - Dees M.W. et al. 2012, In search of better management of potato common scab, https://doi.org/10.1007/s11540-012-9206-9
    - Larkin R.P. et al. 2011, Effects of different potato cropping system approaches and water management on soilborne diseases and soil microbial communities, https://doi.org/10.1094/PHYTO-04-10-0100
  blackgrass:
    name: Alopecurus myosuroides (black-grass, herbicide-resistant grass weed)
    kind: weed
    hosts: [winter_wheat, winter_barley, winter_rapeseed, winter_rye, spelt, triticale_forage]
    survival_years: 3
    break_years: 2
    severity: medium
    note: Autumn-germinating grass weed favoured by winter crops; spring sowing cut plant densities by 88 % and ploughing by 69 % in UK trials; a 2-year spring-crop break depletes the short-lived seedbank.
    sources:
    - Lutman P.J.W. et al. 2013, A review of the effects of crop agronomy on the management of Alopecurus myosuroides, https://doi.org/10.1111/wre.12024
crops:
  alfalfa:
    min_return_years: 4
    self_tolerance: low
    family_return_years: 2
    root_system: tap
    root_depth_class: deep
    n_effect_kg_ha: 120
    preceding_crop_value: high
    soil_structure_effect: improves
    residue_c_t_ha: 1.5
    allelopathy: 'Autotoxic: medicarpin and other compounds from old stands inhibit new alfalfa seedlings — wait ≥1 year (or 2–3 weeks for very young stands) before reseeding.'
    good_predecessors: [winter_wheat, barley, oats, maize_silage, spring_wheat, triticale_forage]
    poor_predecessors: [alfalfa, clover_grass_ley, field_pea, dry_bean]
    note: 'Deep-rooted perennial legume: leaves a large N credit and better soil structure, but cannot follow itself (autotoxicity) or other legumes (root rots).'
    sources:
    - Jennings J.A. et al. 1998, Influence of soil texture on alfalfa autotoxicity, https://doi.org/10.2134/agronj1998.00021962009000010010x
    - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
    - Peoples M.B. et al. 2009, The contributions of nitrogen-fixing crop legumes to the productivity of agricultural systems, https://doi.org/10.1007/BF03179980
  maize:
