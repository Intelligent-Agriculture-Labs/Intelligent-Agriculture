sat_msg_zones: {en: "Detecting crop phenology and computing AI management zones…", es: "Detectando la fenología del cultivo y calculando zonas de manejo con IA…", fr: "Détection de la phénologie et calcul des zones de gestion par IA…", sw: "Inatambua hatua za ukuaji wa zao na kukokotoa kanda za usimamizi kwa AI…", hi: "फसल की फ़ीनोलॉजी पहचान रहे हैं और AI प्रबंधन क्षेत्र बना रहे हैं…", de: "Phänologie wird erkannt und KI-Bewirtschaftungszonen werden berechnet…"}
