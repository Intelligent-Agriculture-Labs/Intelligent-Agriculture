    stages: [10, 20, 20, 10]  # per cutting cycle, FAO-56 Table 11 (individual cutting periods)
    root_m: [1.2, 1.8]
    p: 0.55
    ky: 1.1
    wp: 15
    hi: 0.85              # fraction of above-ground biomass harvested as hay
