# IA EXTRA crop parameter table — version 1.0.0
# Same schema as crops.yaml (see header there). Each crop carries its own `sources:` list.
#   kc_*, stages, root_m, p ... FAO-56 Tables 11, 12, 22 (Allen et al. 1998) — the table row is named in `sources`.
#                              root_m = [initial, maximum]; maximum usually the midpoint of the Table 22 range.
#                              When a range is given in FAO-56 (e.g. Kc_end 0.25–0.4) the midpoint is used.
#   ky ........................ FAO-33 seasonal values as reproduced in FAO-66 Table 1; crops without an FAO-33 value
#                              say so in `sources` (estimate).
#   wp, hi .................... AquaCrop (Steduto et al. 2009; Raes et al. 2009; FAO-66) where available, else estimates.
#   prices / costs ............ INDICATIVE 2023–24 orders of magnitude (USD per tonne of MARKETED product; USD/ha).
#                              Edit locally — they are not a market forecast.
#   typical_yield_t_ha ........ grain for cereals/pulses/oilseeds, FRESH weight for vegetables/roots/cane,
#                              hay dry matter for forages, lint for cotton, 0 for cover crops.
#   low_confidence: true ...... crop or key values not from FAO-56 (analogues or literature estimates).
# Sugarcane and cassava are multi-season crops; they are modelled as one cycle per year (type annual).
# `default_planting` (bottom) mirrors rotations.yaml default_planting (northern-hemisphere temperate calendar).

