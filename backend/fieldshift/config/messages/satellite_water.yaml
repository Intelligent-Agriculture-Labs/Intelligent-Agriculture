  es: "ET del conjunto JET de ECOSTRESS L3T frente a la ET del cultivo FAO-56"
  fr: "ET de l'ensemble JET ECOSTRESS L3T vs. ET de culture FAO-56"
  sw: "ET ya mkusanyiko wa JET wa ECOSTRESS L3T dhidi ya ET ya zao ya FAO-56"
