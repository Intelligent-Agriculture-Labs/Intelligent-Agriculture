plan_label_optimised: {en: "optimised plan", es: "plan optimizado", fr: "plan optimisé", sw: "mpango ulioboreshwa", hi: "अनुकूलित योजना", de: "der optimierte Plan"}
plan_label_suggested: {en: "suggested change", es: "cambio sugerido", fr: "changement suggéré", sw: "mabadiliko yanayopendekezwa", hi: "सुझाया गया बदलाव", de: "die vorgeschlagene Änderung"}
plan_headline_gains:
  en: "Over these years the {label} would give {gains}."
  es: "En estos años el {label} daría: {gains}."
  fr: "Sur ces années, le {label} apporterait : {gains}."
  sw: "Kwa miaka hii {label} ungeleta: {gains}."
  hi: "इन वर्षों में {label} से मिलेगा: {gains}।"
  de: "Über diese Jahre brächte {label}: {gains}."
plan_headline_pests:
  en: "The improved plan mainly lowers disease and pest risk."
  es: "El plan mejorado reduce sobre todo el riesgo de enfermedades y plagas."
  fr: "Le plan amélioré réduit surtout le risque de maladies et de ravageurs."
  sw: "Mpango ulioboreshwa hupunguza hasa hatari ya magonjwa na wadudu."
  hi: "बेहतर योजना मुख्य रूप से रोग और कीट जोखिम घटाती है।"
  de: "Der verbesserte Plan senkt vor allem das Krankheits- und Schädlingsrisiko."
plan_tradeoff: {en: " Trade-off: {costs}.", es: " A cambio: {costs}.", fr: " En contrepartie : {costs}.", sw: " Gharama yake: {costs}.", hi: " बदले में: {costs}।", de: " Dafür: {costs}."}
plan_impact_method:
  en: "Differences between the two plans as simulated at this field (FieldShift season model, NASA POWER weather). CO₂e counts only the direct N₂O emissions of fertiliser not applied (IPCC 2019, EF1 = 1 %, GWP100 = 273, AR6); manufacturing emissions are not counted."
  es: "Diferencias entre los dos planes simuladas en este campo (modelo de temporada FieldShift, clima NASA POWER). El CO₂e cuenta solo las emisiones directas de N₂O del fertilizante no aplicado (IPCC 2019, EF1 = 1 %, GWP100 = 273, AR6); no se cuentan las emisiones de fabricación."
  fr: "Écarts entre les deux plans simulés sur cette parcelle (modèle de saison FieldShift, météo NASA POWER). Le CO₂e ne compte que les émissions directes de N₂O de l'engrais non apporté (GIEC 2019, EF1 = 1 %, PRG100 = 273, AR6) ; les émissions de fabrication ne sont pas comptées."
  sw: "Tofauti kati ya mipango miwili kama ilivyoigwa shambani hapa (modeli ya msimu ya FieldShift, hali ya hewa ya NASA POWER). CO₂e inahesabu tu uzalishaji wa moja kwa moja wa N₂O kutoka mbolea isiyowekwa (IPCC 2019, EF1 = 1 %, GWP100 = 273, AR6); uzalishaji wa viwandani hauhesabiwi."
  hi: "इस खेत पर अनुकरणित दोनों योजनाओं का अंतर (FieldShift मौसम मॉडल, NASA POWER मौसम)। CO₂e में केवल न डाले गए उर्वरक का प्रत्यक्ष N₂O उत्सर्जन गिना गया है (IPCC 2019, EF1 = 1 %, GWP100 = 273, AR6); निर्माण उत्सर्जन शामिल नहीं।"
  de: "Unterschiede zwischen beiden Plänen, simuliert auf diesem Feld (FieldShift-Saisonmodell, NASA-POWER-Wetter). CO₂e zählt nur die direkten N₂O-Emissionen des eingesparten Düngers (IPCC 2019, EF1 = 1 %, GWP100 = 273, AR6); Herstellungsemissionen sind nicht enthalten."
plan_sugg_swap_title:
  en: "{year}: grow {new} instead of {old}"
  es: "{year}: siembre {new} en vez de {old}"
  fr: "{year} : cultivez {new} au lieu de {old}"
  sw: "{year}: panda {new} badala ya {old}"
  hi: "{year}: {old} की जगह {new} उगाएँ"
  de: "{year}: {new} statt {old} anbauen"
plan_sugg_avoids: {en: "This avoids: {items}.", es: "Así se evita: {items}.", fr: "Cela évite : {items}.", sw: "Hii inaepusha: {items}.", hi: "इससे बचाव होता है: {items}।", de: "Das vermeidet: {items}."}
plan_sugg_better: {en: "Better fit for this field.", es: "Se adapta mejor a este campo.", fr: "Mieux adapté à cette parcelle.", sw: "Linafaa zaidi shamba hili.", hi: "इस खेत के लिए बेहतर।", de: "Passt besser zu diesem Feld."}
plan_sugg_cover_title:
  en: "{year}: sow {cover} after harvest"
  es: "{year}: siembre {cover} después de la cosecha"
  fr: "{year} : semez {cover} après la récolte"
  sw: "{year}: panda {cover} baada ya mavuno"
  hi: "{year}: कटाई के बाद {cover} बोएँ"
  de: "{year}: nach der Ernte {cover} säen"
plan_sugg_cover_expl:
  en: "Keeps the soil covered over the bare period, adds organic matter and (legume mixes) nitrogen."
  es: "Mantiene el suelo cubierto en el periodo sin cultivo, aporta materia orgánica y (mezclas con leguminosas) nitrógeno."
  fr: "Garde le sol couvert pendant l'interculture, apporte de la matière organique et (mélanges avec légumineuses) de l'azote."
  sw: "Hufunika udongo kipindi kisicho na zao, huongeza mboji na (mchanganyiko wa kunde) naitrojeni."
  hi: "खाली समय में मिट्टी ढकी रखता है, जैविक पदार्थ और (दलहन मिश्रण से) नाइट्रोजन जोड़ता है।"
  de: "Hält den Boden in der Brache bedeckt, liefert organische Substanz und (mit Leguminosen) Stickstoff."
plan_opt_expl:
  en: "Searched thousands of crop sequences that fit this field's climate, scoring each year for disease breaks, nitrogen, soil cover, water and income with your priorities. Changes: {changes}."
  es: "Se evaluaron miles de secuencias de cultivos aptas para el clima de este campo, puntuando cada año por cortes de enfermedades, nitrógeno, cobertura del suelo, agua e ingresos según sus prioridades. Cambios: {changes}."
  fr: "Des milliers de successions adaptées au climat de cette parcelle ont été évaluées, chaque année notée sur la rupture des maladies, l'azote, la couverture du sol, l'eau et le revenu selon vos priorités. Changements : {changes}."
  sw: "Tulipitia maelfu ya mfuatano wa mazao unaofaa hali ya hewa ya shamba hili, tukipima kila mwaka kwa kuvunja magonjwa, naitrojeni, kufunika udongo, maji na mapato kwa vipaumbele vyako. Mabadiliko: {changes}."
  hi: "इस खेत की जलवायु में फिट हज़ारों फसल-क्रम जाँचे गए, हर वर्ष को आपकी प्राथमिकताओं के अनुसार रोग-चक्र तोड़ने, नाइट्रोजन, मिट्टी ढकाव, पानी और आय पर अंक दिए गए। बदलाव: {changes}।"
  de: "Tausende zum Klima dieses Feldes passende Fruchtfolgen wurden durchsucht und jedes Jahr nach Krankheitsunterbrechung, Stickstoff, Bodenbedeckung, Wasser und Einkommen gemäß Ihren Prioritäten bewertet. Änderungen: {changes}."
plan_opt_covers_only: {en: "cover crops only", es: "solo cultivos de cobertura", fr: "couverts végétaux uniquement", sw: "mazao funika tu", hi: "केवल आवरण फसलें", de: "nur Zwischenfrüchte"}
plan_headline_problem:
  en: "{n} year(s) need a change — see the red years."
  es: "{n} año(s) necesitan un cambio: vea los años en rojo."
  fr: "{n} année(s) à modifier — voir les années en rouge."
  sw: "Mwaka/miaka {n} inahitaji mabadiliko — angalia miaka nyekundu."
  hi: "{n} वर्ष में बदलाव चाहिए — लाल वर्ष देखें।"
  de: "{n} Jahr(e) brauchen eine Änderung – siehe die roten Jahre."
plan_headline_caution:
  en: "Workable plan — {n} year(s) could be better."
  es: "Plan viable: {n} año(s) podrían mejorar."
  fr: "Plan réalisable — {n} année(s) pourraient être meilleures."
  sw: "Mpango unaofaa — mwaka/miaka {n} inaweza kuboreshwa."
  hi: "चलने योग्य योजना — {n} वर्ष बेहतर हो सकते हैं।"
  de: "Machbarer Plan – {n} Jahr(e) ließen sich verbessern."
plan_headline_good:
  en: "Good plan — no biological or water problems found."
  es: "Buen plan: no se encontraron problemas biológicos ni de agua."
  fr: "Bon plan — aucun problème biologique ni hydrique détecté."
  sw: "Mpango mzuri — hakuna matatizo ya kibiolojia au ya maji yaliyopatikana."
  hi: "अच्छी योजना — कोई जैविक या पानी की समस्या नहीं मिली।"
  de: "Guter Plan – keine biologischen oder Wasserprobleme gefunden."
plan_headline_opt:
  en: " The optimised plan scores {opt:.0f} vs {base:.0f}."
  es: " El plan optimizado obtiene {opt:.0f} frente a {base:.0f}."
  fr: " Le plan optimisé obtient {opt:.0f} contre {base:.0f}."
  sw: " Mpango ulioboreshwa unapata alama {opt:.0f} dhidi ya {base:.0f}."
  hi: " अनुकूलित योजना का स्कोर {opt:.0f} है, मौजूदा {base:.0f}।"
  de: " Der optimierte Plan erreicht {opt:.0f} statt {base:.0f} Punkte."
plan_disclaimer:
  en: "Rotation rules come from published agronomic research (see Rotation science); yields and water use are simulated with NASA weather at your field. Local conditions, varieties and markets differ — check with your adviser before big changes."
  es: "Las reglas de rotación provienen de investigación agronómica publicada (vea Ciencia de rotaciones); rendimientos y uso de agua se simulan con clima NASA en su campo. Las condiciones locales, variedades y mercados varían: consulte a su asesor antes de cambios grandes."
  fr: "Les règles de rotation viennent de la recherche agronomique publiée (voir Science des rotations) ; rendements et consommation d'eau sont simulés avec la météo NASA sur votre parcelle. Conditions locales, variétés et marchés diffèrent — consultez votre conseiller avant de grands changements."
  sw: "Kanuni za mzunguko zinatoka kwa utafiti wa kilimo uliochapishwa (angalia Sayansi ya mzunguko); mavuno na matumizi ya maji huigwa kwa hali ya hewa ya NASA shambani kwako. Hali za eneo, aina za mbegu na masoko hutofautiana — wasiliana na afisa ugani kabla ya mabadiliko makubwa."
  hi: "फसल-चक्र नियम प्रकाशित कृषि शोध से हैं (फसल-चक्र विज्ञान देखें); उपज और पानी का उपयोग आपके खेत पर NASA मौसम से अनुकरणित है। स्थानीय स्थितियाँ, किस्में और बाज़ार अलग होते हैं — बड़े बदलाव से पहले अपने सलाहकार से पूछें।"
  de: "Die Fruchtfolgeregeln stammen aus veröffentlichter Agrarforschung (siehe Fruchtfolge-Wissenschaft); Erträge und Wasserverbrauch sind mit NASA-Wetter an Ihrem Feld simuliert. Standort, Sorten und Märkte unterscheiden sich – vor großen Änderungen mit Ihrer Beratung sprechen."
