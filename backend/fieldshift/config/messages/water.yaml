gw_sum:
  en: "Water stored in this region is {status}: {slope:+.1f} cm per year since {year} (p = {p:.2f})."
  es: "El agua almacenada en esta región está {status}: {slope:+.1f} cm por año desde {year} (p = {p:.2f})."
  fr: "L'eau stockée dans cette région est {status} : {slope:+.1f} cm par an depuis {year} (p = {p:.2f})."
  sw: "Maji yaliyohifadhiwa katika eneo hili {status}: sm {slope:+.1f} kwa mwaka tangu {year} (p = {p:.2f})."
  hi: "इस क्षेत्र में जमा पानी {status}: {year} से प्रति वर्ष {slope:+.1f} सेमी (p = {p:.2f})।"
  de: "Der Wasservorrat in dieser Region ist {status}: {slope:+.1f} cm pro Jahr seit {year} (p = {p:.2f})."
model_grace:
  en: "Harmonic regression with AR(1)-adjusted trend test on GRACE/GRACE-FO mascons"
  es: "Regresión armónica con prueba de tendencia ajustada AR(1) sobre mascons GRACE/GRACE-FO"
  fr: "Régression harmonique avec test de tendance ajusté AR(1) sur les mascons GRACE/GRACE-FO"
  sw: "Urejeshi wa harmoniki na jaribio la mwelekeo lililorekebishwa kwa AR(1) kwenye mascon za GRACE/GRACE-FO"
  hi: "GRACE/GRACE-FO मैस्कॉन पर AR(1)-समायोजित रुझान परीक्षण के साथ हार्मोनिक प्रतिगमन"
  de: "Harmonische Regression mit AR(1)-korrigiertem Trendtest auf GRACE/GRACE-FO-Mascons"
gw_step_irrigated:
  en: "On an irrigated farm, falling storage means pumping is drawing down the aquifer faster than rain and rivers refill it: wells get deeper and pumping costs rise."
  es: "En una finca con riego, un almacenamiento en descenso significa que el bombeo vacía el acuífero más rápido de lo que la lluvia y los ríos lo recargan: los pozos se hacen más profundos y el bombeo cuesta más."
  fr: "Sur une ferme irriguée, un stock en baisse signifie que le pompage vide l'aquifère plus vite que la pluie et les rivières ne le rechargent : les puits s'approfondissent et le pompage coûte plus cher."
  sw: "Kwenye shamba linalomwagiliwa, hifadhi inayopungua inamaanisha kusukuma maji kunamaliza chemichemi haraka kuliko mvua na mito inavyoijaza: visima vinakuwa virefu zaidi na gharama ya kusukuma inapanda."
  hi: "सिंचित खेत पर घटते भंडार का मतलब है कि पंपिंग जलभृत को बारिश और नदियों के भरने से तेज़ी से खाली कर रही है: कुएँ गहरे होते हैं और पंपिंग महँगी होती है।"
  de: "Auf einem bewässerten Betrieb heißt sinkender Vorrat: Die Pumpen entleeren den Grundwasserleiter schneller, als Regen und Flüsse ihn auffüllen – Brunnen werden tiefer und das Pumpen teurer."
gw_step_rotations:
  en: "Water-saving rotations (fewer thirsty crops in a row, deficit irrigation, winter cover crops instead of summer-irrigated crops) reduce the draw; compare them in the Rotations tab."
  es: "Las rotaciones que ahorran agua (menos cultivos sedientos seguidos, riego deficitario, coberturas de invierno en lugar de cultivos regados en verano) reducen la extracción; compárelas en la pestaña Rotaciones."
  fr: "Les rotations économes en eau (moins de cultures gourmandes à la suite, irrigation déficitaire, couverts d'hiver au lieu de cultures irriguées l'été) réduisent les prélèvements ; comparez-les dans l'onglet Rotations."
  sw: "Mizunguko inayookoa maji (mazao machache yenye kiu mfululizo, umwagiliaji pungufu, mazao funika ya baridi badala ya mazao yanayomwagiliwa kiangazi) hupunguza uvutaji; yalinganishe kwenye kichupo cha Mizunguko."
  hi: "पानी बचाने वाले फसल-चक्र (लगातार कम प्यासी फसलें, घाटा सिंचाई, गर्मियों की सिंचित फसलों की जगह सर्दियों की आवरण फसलें) निकासी घटाते हैं; इन्हें फसल-चक्र टैब में तुलना करें।"
  de: "Wassersparende Fruchtfolgen (weniger durstige Kulturen hintereinander, Defizitbewässerung, Winterzwischenfrüchte statt sommerbewässerter Kulturen) senken die Entnahme; vergleichen Sie sie im Tab Fruchtfolgen."
gw_rotation_note:
  en: "NASA GRACE/GRACE-FO: water storage in this region is falling ({slope:+.1f} cm/yr since {year}, p = {p:.2f}), so water use counts {f:g}× in the ranking. Prefer rotations that pump less."
  es: "NASA GRACE/GRACE-FO: el agua almacenada en esta región está bajando ({slope:+.1f} cm/año desde {year}, p = {p:.2f}), así que el uso de agua cuenta {f:g}× en la clasificación. Prefiera rotaciones que bombeen menos."
  fr: "NASA GRACE/GRACE-FO : le stock d'eau de cette région baisse ({slope:+.1f} cm/an depuis {year}, p = {p:.2f}), donc la consommation d'eau compte {f:g}× dans le classement. Préférez les rotations qui pompent moins."
  sw: "NASA GRACE/GRACE-FO: maji yaliyohifadhiwa katika eneo hili yanapungua (sm {slope:+.1f}/mwaka tangu {year}, p = {p:.2f}), hivyo matumizi ya maji yanahesabiwa mara {f:g} katika mpangilio. Pendelea mizunguko inayosukuma maji kidogo."
  hi: "NASA GRACE/GRACE-FO: इस क्षेत्र में जल भंडार घट रहा है ({year} से {slope:+.1f} सेमी/वर्ष, p = {p:.2f}), इसलिए रैंकिंग में पानी का उपयोग {f:g}× गिना जाता है। कम पंपिंग वाले फसल-चक्र चुनें।"
  de: "NASA GRACE/GRACE-FO: Der Wasservorrat in dieser Region sinkt ({slope:+.1f} cm/Jahr seit {year}, p = {p:.2f}), daher zählt der Wasserverbrauch {f:g}× in der Rangfolge. Fruchtfolgen mit weniger Pumpbedarf bevorzugen."
