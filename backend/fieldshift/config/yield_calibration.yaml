# FieldShift global yield calibration — generated by scripts/yield_benchmark.py evaluate --write-config.
# Y = Y_model × crops[c].factor × regions[r].factor ** crops[c].gap_sensitivity (clipped to bounds).
# Crops not listed are not calibrated (factor 1).
# Do not hand-edit factors: re-run the benchmark. See ADR-022 and docs/VALIDATION.md V10.
version: 1.0.0
generated: '2026-11-15'
model: anchored crop+region×sensitivity
method: 'Structure ''anchored crop+region×sensitivity''. log(FAOSTAT mean yield / simulated mean yield) per country × crop pair (2000→latest) = log(crop factor) + gap_sensitivity(crop) × log(region factor).
  Two stages: crop factors from the reference regions (Northern America, Western and Southern Europe, where crops.yaml typical yields come from; region factor fixed at 1), then region gap factors and crop
  sensitivities on all other pairs by alternating ridge least squares (lambda_crop=0.5, lambda_region=2.0, lambda_sensitivity=1.0). Validated leave-one-country-out (docs/VALIDATION.md V10).'
sources:
- FAOSTAT Crops and livestock products (QCL), national yields, FAO 2025 (CC BY 4.0)
- MIRCA2000 v1.1 harvested areas and crop calendars, Portmann, Siebert & Döll 2010, doi:10.1029/2008GB003435; data doi:10.5281/zenodo.7422506
- 'Sacks, Deryng, Foley & Ramankutty 2010, Crop planting dates: an analysis of global patterns, Global Ecol. Biogeogr. 19:607–620 (sowing and harvest dates)'
- UN M49 standard country/area codes and sub-regions (UN Statistics Division)
- NASA POWER daily agroclimatology (weather driving the simulations)
bounds:
- 0.1
- 2.0
reference_regions:
- northern_america
- southern_europe
- western_europe
