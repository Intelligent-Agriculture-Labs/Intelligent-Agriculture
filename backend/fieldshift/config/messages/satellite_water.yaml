sw_et_note:
  en: "Field-scale satellite measurement, but on clear overpass days only and in large disagreement with the model at the validation field."
  es: "Medición satelital a escala de campo, pero solo en días de paso despejado y con gran discrepancia con el modelo en el campo de validación."
  fr: "Mesure satellite à l'échelle de la parcelle, mais seulement les jours de passage dégagé et en fort désaccord avec le modèle sur la parcelle de validation."
  sw: "Kipimo cha setilaiti kwa kiwango cha shamba, lakini siku za mapito bila mawingu tu na kinatofautiana sana na modeli kwenye shamba la uthibitisho."
  hi: "खेत-स्तर का उपग्रह माप, पर केवल साफ़ आसमान वाले दिनों में, और सत्यापन खेत पर मॉडल से बहुत अलग।"
  de: "Satellitenmessung auf Feldebene, aber nur an wolkenfreien Überflugtagen und am Validierungsfeld in starkem Widerspruch zum Modell."

# ---- GRACE-DA
sw_gda_caveat_1:
  en: "GRACE-DA is a land model (Catchment) that assimilates GRACE/GRACE-FO; it covers ~25 km cells, not your well."
  es: "GRACE-DA es un modelo de suelo (Catchment) que asimila GRACE/GRACE-FO; cubre celdas de ~25 km, no su pozo."
  fr: "GRACE-DA est un modèle de surface (Catchment) qui assimile GRACE/GRACE-FO ; il couvre des mailles de ~25 km, pas votre puits."
  sw: "GRACE-DA ni modeli ya ardhi (Catchment) inayoingiza data za GRACE/GRACE-FO; inashughulikia seli za ~km 25, si kisima chako."
  hi: "GRACE-DA एक भूमि मॉडल (Catchment) है जो GRACE/GRACE-FO डेटा को समाहित करता है; यह ~25 किमी सेल दिखाता है, आपका कुआँ नहीं।"
  de: "GRACE-DA ist ein Landoberflächenmodell (Catchment), das GRACE/GRACE-FO assimiliert; es deckt ~25-km-Zellen ab, nicht Ihren Brunnen."
sw_gda_caveat_2:
  en: "Percentiles compare with the model's own 1948–2012 climatology; the data arrive ~2–3 months late."
  es: "Los percentiles se comparan con la climatología del propio modelo 1948–2012; los datos llegan con ~2–3 meses de retraso."
  fr: "Les centiles se comparent à la climatologie 1948–2012 du modèle lui-même ; les données arrivent avec ~2–3 mois de retard."
  sw: "Asilimia-nafasi hulinganishwa na takwimu za modeli yenyewe za 1948–2012; data hufika kwa kuchelewa ~miezi 2–3."
  hi: "पर्सेंटाइल मॉडल की अपनी 1948–2012 जलवायु से तुलना करते हैं; डेटा ~2–3 महीने देर से आता है।"
  de: "Die Perzentile beziehen sich auf die modelleigene Klimatologie 1948–2012; die Daten kommen ~2–3 Monate verspätet."
