# Multi-year rotation plan check (science/rotation_plan.py, engine/plan_service.py; POST /api/rotations/plan).
rp_estimate: {en: " (estimate)", es: " (estimación)", fr: " (estimation)", sw: " (makadirio)", hi: " (अनुमान)", de: " (Schätzung)"}
rp_rule_title:
  en: "{crop} after {prev}: about {pct:.0f} % yield{conf}"
  es: "{crop} después de {prev}: alrededor de {pct:.0f} % de rendimiento{conf}"
  fr: "{crop} après {prev} : environ {pct:.0f} % de rendement{conf}"
  sw: "{crop} baada ya {prev}: takriban {pct:.0f} % ya mavuno{conf}"
  hi: "{prev} के बाद {crop}: उपज लगभग {pct:.0f} %{conf}"
  de: "{crop} nach {prev}: etwa {pct:.0f} % Ertrag{conf}"
rp_rule_suggestion:
  en: "Put a crop from another family between {prev} and {crop}."
  es: "Ponga un cultivo de otra familia entre {prev} y {crop}."
  fr: "Intercalez une culture d'une autre famille entre {prev} et {crop}."
  sw: "Weka zao la familia nyingine kati ya {prev} na {crop}."
  hi: "{prev} और {crop} के बीच किसी दूसरे परिवार की फसल लगाएँ।"
  de: "Zwischen {prev} und {crop} eine Kultur aus einer anderen Familie anbauen."
rp_rule_benefit:
  en: "{prev} before {crop}: about +{pct:.0f} % yield{conf} — {text}"
  es: "{prev} antes de {crop}: alrededor de +{pct:.0f} % de rendimiento{conf} — {text}"
  fr: "{prev} avant {crop} : environ +{pct:.0f} % de rendement{conf} — {text}"
  sw: "{prev} kabla ya {crop}: takriban +{pct:.0f} % ya mavuno{conf} — {text}"
  hi: "{crop} से पहले {prev}: उपज लगभग +{pct:.0f} %{conf} — {text}"
  de: "{prev} vor {crop}: etwa +{pct:.0f} % Ertrag{conf} – {text}"
rp_return_title:
  en: "{crop} again too soon"
  es: "{crop} otra vez demasiado pronto"
  fr: "{crop} revient trop tôt"
  sw: "{crop} tena mapema mno"
  hi: "{crop} बहुत जल्दी दोबारा"
  de: "{crop} zu früh wieder"
rp_return_expl:
  en: "{crop} was grown {gap} year(s) earlier ({year}). Research recommends waiting at least {need} years before growing it again on the same field, so its soil-borne pests and diseases die out."
  es: "{crop} se sembró {gap} año(s) antes ({year}). La investigación recomienda esperar al menos {need} años antes de repetirlo en el mismo campo, para que mueran sus plagas y enfermedades del suelo."
  fr: "{crop} a été cultivé {gap} an(s) plus tôt ({year}). La recherche recommande d'attendre au moins {need} ans avant de le remettre sur la même parcelle, pour que ses ravageurs et maladies du sol disparaissent."
  sw: "{crop} lilipandwa mwaka/miaka {gap} iliyopita ({year}). Utafiti unashauri kusubiri angalau miaka {need} kabla ya kulipanda tena shamba hilo, ili wadudu na magonjwa yake ya udongoni yafe."
  hi: "{crop} {gap} वर्ष पहले ({year}) बोया गया था। शोध के अनुसार उसी खेत में दोबारा बोने से पहले कम से कम {need} वर्ष रुकें, ताकि मिट्टी के कीट और रोग खत्म हो जाएँ।"
  de: "{crop} stand vor {gap} Jahr(en) ({year}) auf dem Feld. Die Forschung empfiehlt mindestens {need} Jahre Anbaupause auf derselben Fläche, damit bodenbürtige Schädlinge und Krankheiten absterben."
rp_return_sugg:
  en: "Grow a crop from another family here and keep {crop} for {year} or later."
  es: "Siembre aquí un cultivo de otra familia y deje {crop} para {year} o después."
  fr: "Mettez ici une culture d'une autre famille et gardez {crop} pour {year} ou plus tard."
  sw: "Panda hapa zao la familia nyingine na uweke {crop} kwa {year} au baadaye."
  hi: "यहाँ दूसरे परिवार की फसल लगाएँ और {crop} को {year} या उसके बाद के लिए रखें।"
  de: "Hier eine Kultur einer anderen Familie anbauen und {crop} erst ab {year} wieder einplanen."
rp_old_stand_title:
  en: "{crop} stand is {run} years old"
  es: "La pradera de {crop} tiene {run} años"
  fr: "Le peuplement de {crop} a {run} ans"
  sw: "Shamba la {crop} lina umri wa miaka {run}"
  hi: "{crop} की फसल {run} वर्ष पुरानी है"
  de: "Der {crop}-Bestand ist {run} Jahre alt"
rp_old_stand_expl:
  en: "Old stands thin out and yields fall; most guides plough out after 4–5 years."
  es: "Las praderas viejas se ralean y el rendimiento cae; la mayoría de las guías las renuevan tras 4–5 años."
  fr: "Les vieux peuplements s'éclaircissent et le rendement baisse ; la plupart des guides les retournent après 4–5 ans."
  sw: "Mashamba ya zamani hupungua na mavuno hushuka; miongozo mingi hushauri kulima upya baada ya miaka 4–5."
  hi: "पुरानी फसल विरल हो जाती है और उपज घटती है; अधिकांश मार्गदर्शिकाएँ 4–5 वर्ष बाद जुताई की सलाह देती हैं।"
  de: "Alte Bestände lichten sich und der Ertrag sinkt; die meisten Ratgeber empfehlen den Umbruch nach 4–5 Jahren."
rp_old_stand_sugg:
  en: "Plan to end the stand and follow with a cereal that uses its nitrogen."
  es: "Planee terminar la pradera y siga con un cereal que aproveche su nitrógeno."
  fr: "Prévoyez de retourner le peuplement et de suivre avec une céréale qui valorise son azote."
  sw: "Panga kumaliza shamba hilo na ufuatishe nafaka itakayotumia naitrojeni yake."
  hi: "फसल समाप्त करने और उसकी नाइट्रोजन का उपयोग करने वाला अनाज लगाने की योजना बनाएँ।"
  de: "Den Umbruch planen und danach Getreide anbauen, das den Stickstoff nutzt."
rp_family_title:
  en: "Same plant family as {crop}"
  es: "Misma familia botánica que {crop}"
  fr: "Même famille botanique que {crop}"
  sw: "Familia moja ya mimea na {crop}"
  hi: "{crop} जैसा ही पौध परिवार"
  de: "Gleiche Pflanzenfamilie wie {crop}"
rp_family_expl:
  en: "{crop} and {prev} are both {family}; they share pests and diseases. Leave {need} years between crops of this family."
  es: "{crop} y {prev} son ambos {family}; comparten plagas y enfermedades. Deje {need} años entre cultivos de esta familia."
  fr: "{crop} et {prev} sont tous deux des {family} ; ils partagent ravageurs et maladies. Laissez {need} ans entre les cultures de cette famille."
  sw: "{crop} na {prev} zote ni {family}; zinashiriki wadudu na magonjwa. Acha miaka {need} kati ya mazao ya familia hii."
  hi: "{crop} और {prev} दोनों {family} हैं; इनके कीट और रोग एक जैसे हैं। इस परिवार की फसलों के बीच {need} वर्ष का अंतर रखें।"
  de: "{crop} und {prev} gehören beide zu den {family}; sie teilen Schädlinge und Krankheiten. {need} Jahre Abstand zwischen Kulturen dieser Familie einhalten."
rp_family_sugg:
  en: "Alternate plant families (e.g. grass → legume → brassica/other)."
  es: "Alterne familias (p. ej. gramínea → leguminosa → crucífera/otra)."
  fr: "Alternez les familles (p. ex. graminée → légumineuse → crucifère/autre)."
  sw: "Badilisha familia za mimea (mf. nyasi → kunde → kabichi/nyingine)."
  hi: "पौध परिवार बदलते रहें (जैसे घास → दलहन → सरसों/अन्य)।"
  de: "Pflanzenfamilien abwechseln (z. B. Gras → Leguminose → Kreuzblütler/andere)."
rp_level_medium: {en: "Medium", es: "medio", fr: "moyen", sw: "ya wastani", hi: "मध्यम", de: "Mittleres"}
rp_level_high: {en: "High", es: "alto", fr: "élevé", sw: "kubwa", hi: "उच्च", de: "Hohes"}
rp_level_low: {en: "Low", es: "bajo", fr: "faible", sw: "ndogo", hi: "कम", de: "Niedriges"}
rp_path_title:
  en: "{level} {name} risk"
  es: "Riesgo {level} de {name}"
  fr: "Risque {level} : {name}"
  sw: "Hatari {level} ya {name}"
  hi: "{name} का {level} जोखिम"
  de: "{level} Risiko: {name}"
rp_path_expl:
  en: "{note} It survives about {survival} years in the soil, and earlier host crops ({hosts}) kept it alive."
  es: "{note} Sobrevive unos {survival} años en el suelo, y los cultivos hospederos anteriores ({hosts}) lo mantuvieron vivo."
  fr: "{note} Il survit environ {survival} ans dans le sol, et les cultures hôtes précédentes ({hosts}) l'ont entretenu."
  sw: "{note} Huishi takriban miaka {survival} udongoni, na mazao mwenyeji yaliyotangulia ({hosts}) yaliuweka hai."
  hi: "{note} यह मिट्टी में लगभग {survival} वर्ष जीवित रहता है, और पहले की मेज़बान फसलों ({hosts}) ने इसे जीवित रखा।"
  de: "{note} Er überlebt etwa {survival} Jahre im Boden, und frühere Wirtspflanzen ({hosts}) haben ihn erhalten."
rp_path_sugg:
  en: "Leave {years} years without its host crops before {crop}."
  es: "Deje {years} años sin sus cultivos hospederos antes de {crop}."
  fr: "Laissez {years} ans sans ses plantes hôtes avant {crop}."
  sw: "Acha miaka {years} bila mazao mwenyeji wake kabla ya {crop}."
  hi: "{crop} से पहले {years} वर्ष तक इसकी मेज़बान फसलें न लगाएँ।"
  de: "Vor {crop} {years} Jahre ohne Wirtspflanzen einhalten."
rp_poor_title:
  en: "{prev} is a poor crop before {crop}"
  es: "{prev} es un mal antecesor para {crop}"
  fr: "{prev} est un mauvais précédent pour {crop}"
  sw: "{prev} si zao zuri kabla ya {crop}"
  hi: "{crop} से पहले {prev} अच्छी फसल नहीं है"
  de: "{prev} ist eine schlechte Vorfrucht für {crop}"
rp_poor_expl:
  en: "{crop} does worse after {prev} (pests, residue or nitrogen tie-up)."
  es: "{crop} rinde peor después de {prev} (plagas, rastrojo o nitrógeno inmovilizado)."
  fr: "{crop} réussit moins bien après {prev} (ravageurs, résidus ou azote immobilisé)."
  sw: "{crop} hufanya vibaya baada ya {prev} (wadudu, masalia au naitrojeni kufungwa)."
  hi: "{prev} के बाद {crop} कमज़ोर रहती है (कीट, अवशेष या नाइट्रोजन का रुकना)।"
  de: "{crop} gedeiht nach {prev} schlechter (Schädlinge, Ernterückstände oder Stickstoffbindung)."
rp_poor_sugg:
  en: "Put a better predecessor before {crop}."
  es: "Ponga un mejor antecesor antes de {crop}."
  fr: "Placez un meilleur précédent avant {crop}."
  sw: "Weka zao bora zaidi kabla ya {crop}."
  hi: "{crop} से पहले बेहतर पूर्ववर्ती फसल लगाएँ।"
  de: "Vor {crop} eine bessere Vorfrucht anbauen."
rp_poor_sugg_eg:
  en: "Put a better predecessor before {crop}, e.g. {good}."
  es: "Ponga un mejor antecesor antes de {crop}, p. ej. {good}."
  fr: "Placez un meilleur précédent avant {crop}, p. ex. {good}."
  sw: "Weka zao bora zaidi kabla ya {crop}, mf. {good}."
  hi: "{crop} से पहले बेहतर पूर्ववर्ती फसल लगाएँ, जैसे {good}।"
  de: "Vor {crop} eine bessere Vorfrucht anbauen, z. B. {good}."
rp_good_pred:
  en: "{prev} is a good crop before {crop}."
  es: "{prev} es un buen antecesor para {crop}."
  fr: "{prev} est un bon précédent pour {crop}."
  sw: "{prev} ni zao zuri kabla ya {crop}."
  hi: "{crop} से पहले {prev} अच्छी फसल है।"
  de: "{prev} ist eine gute Vorfrucht für {crop}."
rp_good_pred_note:
  en: "{prev} is a good crop before {crop} ({note})"
  es: "{prev} es un buen antecesor para {crop} ({note})"
  fr: "{prev} est un bon précédent pour {crop} ({note})"
  sw: "{prev} ni zao zuri kabla ya {crop} ({note})"
  hi: "{crop} से पहले {prev} अच्छी फसल है ({note})"
  de: "{prev} ist eine gute Vorfrucht für {crop} ({note})"
rp_residue_title:
  en: "Residues of {prev}"
  es: "Rastrojos de {prev}"
  fr: "Résidus de {prev}"
  sw: "Masalia ya {prev}"
  hi: "{prev} के अवशेष"
  de: "Ernterückstände von {prev}"
rp_residue_sugg:
  en: "Incorporate or let residues break down before sowing; avoid very small-seeded crops right after."
  es: "Incorpore o deje descomponer los rastrojos antes de sembrar; evite cultivos de semilla muy pequeña justo después."
  fr: "Enfouissez ou laissez se décomposer les résidus avant le semis ; évitez les cultures à très petites graines juste après."
  sw: "Changanya masalia na udongo au yaache yaoze kabla ya kupanda; epuka mazao ya mbegu ndogo sana mara baada yake."
  hi: "बुवाई से पहले अवशेष मिट्टी में मिलाएँ या सड़ने दें; तुरंत बाद बहुत छोटे बीज वाली फसलें न लगाएँ।"
  de: "Rückstände vor der Saat einarbeiten oder verrotten lassen; direkt danach keine sehr kleinsamigen Kulturen."
rp_n_credit:
  en: "About {n:.0f} kg N/ha left by the previous crops — less fertiliser needed."
  es: "Los cultivos anteriores dejan unos {n:.0f} kg N/ha: se necesita menos fertilizante."
  fr: "Environ {n:.0f} kg N/ha laissés par les cultures précédentes — moins d'engrais nécessaire."
  sw: "Takriban kg {n:.0f} N/ha zimeachwa na mazao yaliyotangulia — mbolea kidogo inahitajika."
  hi: "पिछली फसलों ने लगभग {n:.0f} किग्रा N/हे छोड़ा है — कम उर्वरक चाहिए।"
  de: "Die Vorfrüchte hinterlassen etwa {n:.0f} kg N/ha – weniger Dünger nötig."
rp_n_deficit_title:
  en: "Nitrogen tied up by straw"
  es: "Nitrógeno retenido por la paja"
  fr: "Azote immobilisé par la paille"
  sw: "Naitrojeni imefungwa na makapi"
  hi: "भूसे में नाइट्रोजन बंधी हुई"
  de: "Stickstoff durch Stroh gebunden"
rp_n_deficit_expl:
  en: "Residues of the previous crop tie up about {n:.0f} kg N/ha while they decompose."
  es: "Los rastrojos del cultivo anterior retienen unos {n:.0f} kg N/ha mientras se descomponen."
  fr: "Les résidus de la culture précédente immobilisent environ {n:.0f} kg N/ha pendant leur décomposition."
  sw: "Masalia ya zao lililotangulia hufunga takriban kg {n:.0f} N/ha yakioza."
  hi: "पिछली फसल के अवशेष सड़ते समय लगभग {n:.0f} किग्रा N/हे बाँध लेते हैं।"
  de: "Die Rückstände der Vorfrucht binden beim Abbau etwa {n:.0f} kg N/ha."
rp_n_deficit_sugg:
  en: "Plan a little extra nitrogen at sowing or follow with a legume."
  es: "Prevea un poco más de nitrógeno a la siembra o siga con una leguminosa."
  fr: "Prévoyez un peu d'azote en plus au semis ou suivez avec une légumineuse."
  sw: "Panga kuongeza naitrojeni kidogo wakati wa kupanda au fuatisha zao la jamii ya kunde."
  hi: "बुवाई पर थोड़ी अतिरिक्त नाइट्रोजन दें या बाद में दलहन लगाएँ।"
  de: "Bei der Saat etwas mehr Stickstoff einplanen oder eine Leguminose folgen lassen."
rp_establish_title:
  en: "{crop} establishment year"
  es: "Año de establecimiento de {crop}"
  fr: "Année d'implantation de {crop}"
  sw: "Mwaka wa kuanzisha {crop}"
  hi: "{crop} की स्थापना का वर्ष"
  de: "Ansaatjahr {crop}"
rp_establish_expl:
  en: "A new stand yields about 70 % of a full year while roots establish."
  es: "Una pradera nueva rinde cerca del 70 % de un año completo mientras se establecen las raíces."
  fr: "Un nouveau peuplement donne environ 70 % d'une année pleine pendant l'enracinement."
  sw: "Shamba jipya hutoa takriban 70 % ya mwaka kamili mizizi ikijiimarisha."
  hi: "जड़ें जमने तक नई फसल पूरे वर्ष की लगभग 70 % उपज देती है।"
  de: "Ein neuer Bestand bringt etwa 70 % eines vollen Jahres, solange die Wurzeln sich etablieren."
rp_climate_title:
  en: "{crop} struggles in this climate"
  es: "{crop} sufre en este clima"
  fr: "{crop} peine dans ce climat"
  sw: "{crop} inatatizika katika hali hii ya hewa"
  hi: "इस जलवायु में {crop} को कठिनाई"
  de: "{crop} tut sich in diesem Klima schwer"
rp_climate_sugg:
  en: "Choose a crop from the list that fits this field's season."
  es: "Elija un cultivo de la lista que se ajuste a la temporada de este campo."
  fr: "Choisissez dans la liste une culture adaptée à la saison de cette parcelle."
  sw: "Chagua zao kutoka kwenye orodha linalofaa msimu wa shamba hili."
  hi: "सूची से ऐसी फसल चुनें जो इस खेत के मौसम में फिट हो।"
  de: "Eine Kultur aus der Liste wählen, die zur Saison dieses Feldes passt."
rp_feas_few_seasons:
  en: "Not enough complete seasons in the weather record for this crop here."
  es: "No hay suficientes temporadas completas en el registro climático para este cultivo aquí."
  fr: "Pas assez de saisons complètes dans les données météo pour cette culture ici."
  sw: "Hakuna misimu kamili ya kutosha katika kumbukumbu za hali ya hewa kwa zao hili hapa."
  hi: "यहाँ इस फसल के लिए मौसम रिकॉर्ड में पर्याप्त पूरे मौसम नहीं हैं।"
  de: "Zu wenige vollständige Saisons in den Wetterdaten für diese Kultur hier."
rp_feas_frost:
  en: "Damaging frost during the season in {pct:.0f} % of the last {n} years."
  es: "Heladas dañinas durante la temporada en el {pct:.0f} % de los últimos {n} años."
  fr: "Gel dommageable pendant la saison dans {pct:.0f} % des {n} dernières années."
  sw: "Baridi kali yenye madhara wakati wa msimu katika {pct:.0f} % ya miaka {n} iliyopita."
  hi: "पिछले {n} वर्षों में से {pct:.0f} % में मौसम के दौरान नुकसानदेह पाला।"
  de: "Schädlicher Frost während der Saison in {pct:.0f} % der letzten {n} Jahre."
rp_feas_unfit:
  en: "The local season is too short, cold or dry: simulated yields are below a third of normal."
  es: "La temporada local es demasiado corta, fría o seca: los rendimientos simulados quedan por debajo de un tercio de lo normal."
  fr: "La saison locale est trop courte, froide ou sèche : les rendements simulés sont inférieurs au tiers de la normale."
  sw: "Msimu wa hapa ni mfupi, baridi au mkavu mno: mavuno yaliyoigwa ni chini ya theluthi ya kawaida."
  hi: "स्थानीय मौसम बहुत छोटा, ठंडा या सूखा है: अनुकरणित उपज सामान्य के एक-तिहाई से कम है।"
  de: "Die örtliche Saison ist zu kurz, kalt oder trocken: simulierte Erträge liegen unter einem Drittel des Üblichen."
rp_water_title:
  en: "Needs more water than you have"
  es: "Necesita más agua de la que tiene"
  fr: "Demande plus d'eau que vous n'en avez"
  sw: "Linahitaji maji zaidi ya uliyo nayo"
  hi: "आपके पास जितना पानी है उससे अधिक चाहिए"
  de: "Braucht mehr Wasser, als Sie haben"
rp_water_expl:
  en: "{crop} needs about {irr:.0f} mm of irrigation in a typical year here; your allocation is {alloc:.0f} mm."
  es: "{crop} necesita unos {irr:.0f} mm de riego en un año típico aquí; su cupo es de {alloc:.0f} mm."
  fr: "{crop} demande environ {irr:.0f} mm d'irrigation une année normale ici ; votre quota est de {alloc:.0f} mm."
  sw: "{crop} inahitaji takriban mm {irr:.0f} za umwagiliaji kwa mwaka wa kawaida hapa; mgao wako ni mm {alloc:.0f}."
  hi: "यहाँ सामान्य वर्ष में {crop} को लगभग {irr:.0f} मिमी सिंचाई चाहिए; आपका आवंटन {alloc:.0f} मिमी है।"
  de: "{crop} braucht hier in einem normalen Jahr etwa {irr:.0f} mm Bewässerung; Ihr Kontingent beträgt {alloc:.0f} mm."
rp_water_sugg:
  en: "Pick a lower-water crop, use deficit irrigation, or split the field."
  es: "Elija un cultivo que use menos agua, aplique riego deficitario o divida el campo."
  fr: "Choisissez une culture moins gourmande, pratiquez l'irrigation déficitaire ou divisez la parcelle."
  sw: "Chagua zao linalotumia maji kidogo, tumia umwagiliaji pungufu, au gawanya shamba."
  hi: "कम पानी वाली फसल चुनें, घाटा सिंचाई अपनाएँ या खेत बाँटें।"
  de: "Eine wassersparende Kultur wählen, defizitär bewässern oder das Feld teilen."
rp_drought_title:
  en: "Often fails in dry years"
  es: "Falla a menudo en años secos"
  fr: "Échoue souvent les années sèches"
  sw: "Mara nyingi hushindwa miaka ya ukame"
  hi: "सूखे वर्षों में अक्सर विफल"
  de: "Fällt in trockenen Jahren oft aus"
rp_drought_expl:
  en: "Without irrigation, {crop} failed in {pct:.0f} % of the last {n} seasons at this field."
  es: "Sin riego, {crop} falló en el {pct:.0f} % de las últimas {n} temporadas en este campo."
  fr: "Sans irrigation, {crop} a échoué dans {pct:.0f} % des {n} dernières saisons sur cette parcelle."
  sw: "Bila umwagiliaji, {crop} ilishindwa katika {pct:.0f} % ya misimu {n} iliyopita shambani hapa."
  hi: "बिना सिंचाई के इस खेत में पिछले {n} मौसमों में से {pct:.0f} % में {crop} विफल रही।"
  de: "Ohne Bewässerung fiel {crop} auf diesem Feld in {pct:.0f} % der letzten {n} Saisons aus."
rp_drought_sugg:
  en: "Consider a more drought-tolerant crop (e.g. sorghum, millet, cowpea) or earlier sowing."
  es: "Considere un cultivo más tolerante a la sequía (p. ej. sorgo, mijo, caupí) o sembrar antes."
  fr: "Envisagez une culture plus tolérante à la sécheresse (p. ex. sorgho, mil, niébé) ou un semis plus précoce."
  sw: "Fikiria zao linalostahimili ukame zaidi (mf. mtama, uwele, kunde) au kupanda mapema."
  hi: "अधिक सूखा-सहिष्णु फसल (जैसे ज्वार, बाजरा, लोबिया) या जल्दी बुवाई पर विचार करें।"
  de: "Eine trockenheitstolerantere Kultur (z. B. Sorghum, Hirse, Augenbohne) oder frühere Saat erwägen."
rp_bare_title:
  en: "Soil bare for ~{days} days"
  es: "Suelo desnudo unos {days} días"
  fr: "Sol nu pendant ~{days} jours"
  sw: "Udongo wazi kwa ~siku {days}"
  hi: "~{days} दिन मिट्टी खाली"
  de: "Boden ~{days} Tage unbedeckt"
rp_bare_expl:
  en: "Bare soil loses structure, carbon and — on slopes or in heavy rain — topsoil."
  es: "El suelo desnudo pierde estructura, carbono y, en pendientes o con lluvias fuertes, la capa fértil."
  fr: "Un sol nu perd sa structure, son carbone et — en pente ou sous forte pluie — sa couche arable."
  sw: "Udongo wazi hupoteza muundo, kaboni na — kwenye miteremko au mvua kubwa — udongo wa juu."
  hi: "खाली मिट्टी अपनी संरचना, कार्बन और — ढलान या भारी बारिश में — ऊपरी उपजाऊ परत खोती है।"
  de: "Offener Boden verliert Struktur, Kohlenstoff und – am Hang oder bei Starkregen – Oberboden."
rp_bare_erosion:
  en: " Estimated erosion here: {e:.1f} t/ha per year."
  es: " Erosión estimada aquí: {e:.1f} t/ha por año."
  fr: " Érosion estimée ici : {e:.1f} t/ha par an."
  sw: " Makadirio ya mmomonyoko hapa: t/ha {e:.1f} kwa mwaka."
  hi: " यहाँ अनुमानित कटाव: {e:.1f} t/ha प्रति वर्ष।"
  de: " Geschätzte Erosion hier: {e:.1f} t/ha pro Jahr."
rp_bare_sugg:
  en: "Sow a cover crop after harvest."
  es: "Siembre un cultivo de cobertura después de la cosecha."
  fr: "Semez un couvert végétal après la récolte."
  sw: "Panda zao funika baada ya mavuno."
  hi: "कटाई के बाद आवरण फसल बोएँ।"
  de: "Nach der Ernte eine Zwischenfrucht säen."
plan_gain_water: {en: "{v:.0f} mm less irrigation per year", es: "{v:.0f} mm menos de riego por año", fr: "{v:.0f} mm d'irrigation en moins par an", sw: "mm {v:.0f} chini za umwagiliaji kwa mwaka", hi: "हर साल {v:.0f} मिमी कम सिंचाई", de: "{v:.0f} mm weniger Bewässerung pro Jahr"}
plan_cost_water: {en: "{v:.0f} mm more irrigation per year", es: "{v:.0f} mm más de riego por año", fr: "{v:.0f} mm d'irrigation en plus par an", sw: "mm {v:.0f} zaidi za umwagiliaji kwa mwaka", hi: "हर साल {v:.0f} मिमी अधिक सिंचाई", de: "{v:.0f} mm mehr Bewässerung pro Jahr"}
