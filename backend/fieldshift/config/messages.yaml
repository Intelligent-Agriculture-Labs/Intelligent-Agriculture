# Server-generated card texts. {placeholders} are filled with computed numbers.
# Languages: en, es, fr, sw, hi, de. Missing keys fall back to English.
irrigate_title:
  en: "Irrigate {mm} mm by {day}"
  es: "Riegue {mm} mm antes del {day}"
  fr: "Irriguez {mm} mm d'ici {day}"
  sw: "Mwagilia mm {mm} kabla ya {day}"
  hi: "{day} तक {mm} मिमी सिंचाई करें"
  de: "Bis {day} {mm} mm bewässern"
irrigate_detail:
  en: "The root zone will pass the stress point (RAW) around {day}. Forecast rain ({rain} mm) is not enough."
  es: "La zona de raíces alcanzará el punto de estrés hacia el {day}. La lluvia prevista ({rain} mm) no basta."
  fr: "La zone racinaire atteindra le seuil de stress vers le {day}. La pluie prévue ({rain} mm) ne suffit pas."
  sw: "Udongo wa mizizi utafikia kiwango cha msongo karibu {day}. Mvua inayotarajiwa ({rain} mm) haitoshi."
  hi: "लगभग {day} तक जड़ क्षेत्र तनाव बिंदु पर पहुंच जाएगा। अनुमानित वर्षा ({rain} मिमी) पर्याप्त नहीं है।"
  de: "Der Wurzelraum erreicht um den {day} die Stressgrenze. Der vorhergesagte Regen ({rain} mm) reicht nicht."
no_irrigation_title:
  en: "No irrigation needed for {days} days"
  es: "No hace falta regar en {days} días"
  fr: "Pas d'irrigation nécessaire pendant {days} jours"
  sw: "Hakuna haja ya kumwagilia kwa siku {days}"
  hi: "{days} दिनों तक सिंचाई की आवश्यकता नहीं"
  de: "{days} Tage keine Bewässerung nötig"
no_irrigation_detail:
  en: "Soil water stays above the stress point ({pct}% of available water left today)."
  es: "El agua del suelo se mantiene sobre el punto de estrés (queda {pct}% del agua disponible)."
  fr: "L'eau du sol reste au-dessus du seuil de stress ({pct}% de l'eau disponible aujourd'hui)."
  sw: "Maji ya udongo yako juu ya kiwango cha msongo ({pct}% ya maji yanayopatikana leo)."
  hi: "मिट्टी का पानी तनाव बिंदु से ऊपर है (आज {pct}% उपलब्ध पानी शेष)।"
  de: "Das Bodenwasser bleibt über der Stressgrenze (heute {pct}% des verfügbaren Wassers)."
rainfed_stress_title:
  en: "Crop water stress likely from {day}"
  es: "Estrés hídrico probable desde el {day}"
  fr: "Stress hydrique probable à partir du {day}"
  sw: "Msongo wa maji unatarajiwa kuanzia {day}"
  hi: "{day} से फसल में जल तनाव की संभावना"
  de: "Wasserstress ab {day} wahrscheinlich"
rainfed_stress_detail:
  en: "No irrigation is set for this field. Consider mulching, weeding and delaying top-dressing until rain."
  es: "Campo sin riego. Considere acolchado, deshierbe y retrasar el abonado hasta que llueva."
  fr: "Champ sans irrigation. Pensez au paillage, au désherbage et à retarder l'apport d'engrais jusqu'à la pluie."
  sw: "Shamba hili halimwagiliwi. Fikiria matandazo, palizi na kuchelewesha mbolea hadi mvua inyeshe."
  hi: "इस खेत में सिंचाई नहीं है। मल्चिंग, निराई करें और बारिश तक उर्वरक टॉप-ड्रेसिंग टालें।"
  de: "Keine Bewässerung eingestellt. Mulchen, Unkraut entfernen und Kopfdüngung bis zum Regen verschieben."
drought_title:
  en: "{label} at your field"
  es: "{label} en su campo"
  fr: "{label} sur votre parcelle"
  sw: "{label} shambani kwako"
  hi: "आपके खेत में {label}"
  de: "{label} auf Ihrem Feld"
drought_detail:
  en: "Rain over the last 90 days is in the driest {pct}% of years since 1984. Plan water use carefully."
  es: "La lluvia de los últimos 90 días está entre el {pct}% de años más secos desde 1984. Planifique el agua."
  fr: "La pluie des 90 derniers jours figure parmi les {pct}% d'années les plus sèches depuis 1984."
  sw: "Mvua ya siku 90 zilizopita iko kati ya {pct}% ya miaka kavu zaidi tangu 1984. Panga matumizi ya maji."
  hi: "पिछले 90 दिनों की वर्षा 1984 के बाद के सबसे सूखे {pct}% वर्षों में है। पानी का सावधानी से उपयोग करें।"
  de: "Der Regen der letzten 90 Tage gehört zu den trockensten {pct}% der Jahre seit 1984."
disease_title:
  en: "{risk} {disease} risk from {day}"
  es: "Riesgo {risk} de {disease} desde el {day}"
  fr: "Risque {risk} de {disease} dès le {day}"
  sw: "Hatari {risk} ya {disease} kuanzia {day}"
  hi: "{day} से {disease} का {risk} जोखिम"
  de: "{risk}s {disease}-Risiko ab {day}"
disease_detail:
  en: "Warm, humid hours favour infection. Inspect leaves; consider preventive treatment if you find symptoms."
  es: "Horas cálidas y húmedas favorecen la infección. Revise las hojas; considere tratamiento preventivo."
  fr: "Des heures chaudes et humides favorisent l'infection. Inspectez les feuilles ; envisagez un traitement préventif."
  sw: "Saa za joto na unyevu huchochea maambukizi. Kagua majani; fikiria kinga ukiona dalili."
  hi: "गर्म, नम घंटे संक्रमण को बढ़ाते हैं। पत्तियों की जांच करें; लक्षण दिखें तो निवारक उपचार पर विचार करें।"
  de: "Warme, feuchte Stunden begünstigen Infektionen. Blätter kontrollieren; bei Symptomen vorbeugend behandeln."
pest_title:
  en: "{pest}: {event} in ~{days} days"
  es: "{pest}: {event} en ~{days} días"
  fr: "{pest} : {event} dans ~{days} jours"
  sw: "{pest}: {event} baada ya siku ~{days}"
  hi: "{pest}: ~{days} दिनों में {event}"
  de: "{pest}: {event} in ~{days} Tagen"
pest_soon_title:
  en: "{pest}: {event} within a day"
  es: "{pest}: {event} en un día"
  fr: "{pest} : {event} d'ici un jour"
  sw: "{pest}: {event} ndani ya siku moja"
  hi: "{pest}: एक दिन में {event}"
  de: "{pest}: {event} innerhalb eines Tages"
pest_now_title:
  en: "{pest}: {event} now"
  es: "{pest}: {event} ahora"
  fr: "{pest} : {event} maintenant"
  sw: "{pest}: {event} sasa"
  hi: "{pest}: अभी {event}"
  de: "{pest}: jetzt {event}"
frost_title:
  en: "Frost risk {day}: {t} °C"
  es: "Riesgo de helada el {day}: {t} °C"
  fr: "Risque de gel le {day} : {t} °C"
  sw: "Hatari ya baridi kali {day}: {t} °C"
  hi: "{day} को पाले का जोखिम: {t} °C"
  de: "Frostgefahr am {day}: {t} °C"
frost_detail:
  en: "Forecast minimum is near the damage threshold of {crop} ({kill} °C). Protect seedlings or delay sowing."
  es: "La mínima prevista está cerca del umbral de daño de {crop} ({kill} °C)."
  fr: "La minimale prévue est proche du seuil de dégâts de {crop} ({kill} °C)."
  sw: "Joto la chini linalotarajiwa liko karibu na kiwango cha madhara kwa {crop} ({kill} °C)."
  hi: "अनुमानित न्यूनतम तापमान {crop} की क्षति सीमा ({kill} °C) के पास है।"
  de: "Die vorhergesagte Tiefsttemperatur liegt nahe der Schadschwelle von {crop} ({kill} °C)."
heat_title:
  en: "Heat stress {day}: {t} °C"
  es: "Estrés por calor el {day}: {t} °C"
  fr: "Stress thermique le {day} : {t} °C"
  sw: "Msongo wa joto {day}: {t} °C"
  hi: "{day} को गर्मी का तनाव: {t} °C"
  de: "Hitzestress am {day}: {t} °C"
heat_detail:
  en: "Above {crop}'s heat threshold ({thr} °C). Irrigate before the hot days; avoid spraying in the heat."
  es: "Supera el umbral de calor de {crop} ({thr} °C). Riegue antes; evite aplicar productos con calor."
  fr: "Au-dessus du seuil de chaleur de {crop} ({thr} °C). Irriguez avant ; évitez de traiter par forte chaleur."
  sw: "Juu ya kiwango cha joto cha {crop} ({thr} °C). Mwagilia kabla ya siku za joto."
  hi: "{crop} की ताप सीमा ({thr} °C) से ऊपर। गर्म दिनों से पहले सिंचाई करें।"
  de: "Über der Hitzeschwelle von {crop} ({thr} °C). Vorher bewässern; nicht bei Hitze spritzen."
ndvi_title:
  en: "Scout your field: vegetation {pct}% below normal"
  es: "Revise el campo: vegetación {pct}% bajo lo normal"
  fr: "Inspectez la parcelle : végétation {pct}% sous la normale"
  sw: "Kagua shamba: mimea {pct}% chini ya kawaida"
  hi: "खेत की जांच करें: वनस्पति सामान्य से {pct}% कम"
  de: "Feld kontrollieren: Vegetation {pct}% unter normal"
ndvi_detail:
  en: "MODIS NDVI ({date}) is unusually low for this time of year. Check for water stress, pests or damage."
  es: "El NDVI de MODIS ({date}) es inusualmente bajo para esta época. Busque estrés, plagas o daños."
  fr: "Le NDVI MODIS ({date}) est anormalement bas pour la saison. Cherchez stress, ravageurs ou dégâts."
  sw: "NDVI ya MODIS ({date}) iko chini isivyo kawaida. Angalia msongo wa maji, wadudu au uharibifu."
  hi: "MODIS NDVI ({date}) इस मौसम के लिए असामान्य रूप से कम है। जल तनाव, कीट या क्षति की जांच करें।"
  de: "MODIS-NDVI ({date}) ist für die Jahreszeit ungewöhnlich niedrig. Auf Wasserstress, Schädlinge prüfen."
planting_title:
  en: "Best sowing window: {start} – {end}"
  es: "Mejor ventana de siembra: {start} – {end}"
  fr: "Meilleure fenêtre de semis : {start} – {end}"
  sw: "Kipindi bora cha kupanda: {start} – {end}"
  hi: "बुवाई का सबसे अच्छा समय: {start} – {end}"
  de: "Bestes Saatfenster: {start} – {end}"
planting_detail:
  en: "Simulated over {n} past seasons, this window gave the best yield-to-risk balance ({y} t/ha median)."
  es: "Simulado en {n} temporadas pasadas, esta ventana dio el mejor equilibrio rendimiento/riesgo ({y} t/ha)."
  fr: "Simulée sur {n} saisons, cette fenêtre offre le meilleur compromis rendement/risque ({y} t/ha)."
  sw: "Kwa misimu {n} iliyopita, kipindi hiki kilitoa mavuno bora kwa hatari ndogo ({y} t/ha)."
  hi: "{n} पिछले मौसमों के सिमुलेशन में इस अवधि ने सबसे अच्छा उपज-जोखिम संतुलन दिया ({y} t/ha)।"
  de: "Über {n} vergangene Saisons simuliert: bestes Ertrags-Risiko-Verhältnis ({y} t/ha Median)."
risk_words:
  low: {en: Low, es: bajo, fr: faible, sw: ndogo, hi: कम, de: Gering}
  moderate: {en: Moderate, es: moderado, fr: modéré, sw: wastani, hi: मध्यम, de: Mittler}
  high: {en: High, es: alto, fr: élevé, sw: kubwa, hi: उच्च, de: Hoh}
  severe: {en: Severe, es: severo, fr: sévère, sw: kubwa sana, hi: गंभीर, de: Sehr hoh}
plan_title:
  en: "Off-season: plan next year's rotation"
  es: "Fuera de temporada: planifique la rotación del próximo año"
  fr: "Hors saison : planifiez la rotation de l'an prochain"
  sw: "Nje ya msimu: panga mzunguko wa mazao wa mwaka ujao"
  hi: "ऑफ-सीज़न: अगले साल का फसल चक्र तय करें"
  de: "Nebensaison: Fruchtfolge fürs nächste Jahr planen"
plan_detail:
  en: "Your {crop} is {state}. Compare your rotation with alternatives simulated on 15 seasons of NASA data at your field."
  es: "Su {crop} está {state}. Compare su rotación con alternativas simuladas con 15 temporadas de datos NASA."
  fr: "Votre {crop} est {state}. Comparez votre rotation à des alternatives simulées sur 15 saisons de données NASA."
  sw: "{crop} yako iko {state}. Linganisha mzunguko wako na mbadala zilizoigwa kwa misimu 15 ya data ya NASA."
  hi: "आपकी {crop} {state} है। NASA डेटा के 15 मौसमों पर सिम्युलेट विकल्पों से अपने फसल चक्र की तुलना करें।"
  de: "Ihr {crop} ist {state}. Vergleichen Sie Ihre Fruchtfolge mit Alternativen, simuliert mit 15 Saisons NASA-Daten."
state_dormant: {en: dormant for winter, es: en reposo invernal, fr: en dormance hivernale, sw: imelala wakati wa baridi, hi: सर्दी में सुप्त, de: in Winterruhe}
state_harvested: {en: harvested, es: cosechado, fr: récolté, sw: imevunwa, hi: कटाई हो चुकी, de: geerntet}
rainfed_ok_title:
  en: "No water stress expected for {days} days"
  es: "Sin estrés hídrico previsto en {days} días"
  fr: "Pas de stress hydrique prévu pendant {days} jours"
  sw: "Hakuna msongo wa maji unaotarajiwa kwa siku {days}"
  hi: "{days} दिनों तक जल तनाव की आशंका नहीं"
  de: "{days} Tage kein Wasserstress erwartet"
drought_detail_12m:
  en: "Rain over the last 90 days is in the driest {pct}% of years since 1984, and the 12-month water balance (rain − crop demand) in the driest {pct12}%. Plan water use carefully."
  es: "La lluvia de los últimos 90 días está entre el {pct}% de años más secos desde 1984, y el balance hídrico de 12 meses entre el {pct12}%. Planifique el agua."
  fr: "La pluie des 90 derniers jours figure parmi les {pct}% d'années les plus sèches depuis 1984, et le bilan hydrique sur 12 mois parmi les {pct12}%."
  sw: "Mvua ya siku 90 iko kati ya {pct}% ya miaka kavu zaidi tangu 1984, na mizani ya maji ya miezi 12 kati ya {pct12}%. Panga matumizi ya maji."
  hi: "पिछले 90 दिनों की वर्षा 1984 के बाद के सबसे सूखे {pct}% वर्षों में है, और 12 महीने का जल संतुलन सबसे सूखे {pct12}% में।"
  de: "Der Regen der letzten 90 Tage gehört zu den trockensten {pct}% der Jahre seit 1984, die 12-Monats-Wasserbilanz zu den trockensten {pct12}%."
# ---- rain-season onset advisor (engine/rain_season.py, ADR-021)
onset_before_title:
  en: "{season} rains usually start around {date}"
  es: "Las lluvias de {season} suelen empezar hacia el {date}"
  fr: "Les pluies de {season} débutent en général vers le {date}"
  sw: "Mvua za {season} kwa kawaida huanza karibu {date}"
  hi: "{season} की बारिश आमतौर पर {date} के आसपास शुरू होती है"
  de: "Die {season}-Regenzeit beginnt meist um den {date}"
onset_before_detail:
  en: "In 8 of 10 years the rains start between {p20} and {p80}; {fs}% of seasons had a false start. Prepare land and seed, but don't sow dry."
  es: "En 8 de cada 10 años empiezan entre el {p20} y el {p80}; el {fs}% de las temporadas tuvo un falso inicio. Prepare tierra y semilla, pero no siembre en seco."
  fr: "8 années sur 10, elles débutent entre le {p20} et le {p80} ; {fs}% des saisons ont connu un faux départ. Préparez sol et semences, mais ne semez pas à sec."
  sw: "Katika miaka 8 kati ya 10 mvua huanza kati ya {p20} na {p80}; {fs}% ya misimu ilikuwa na mwanzo wa uongo. Andaa shamba na mbegu, lakini usipande kwenye udongo mkavu."
  hi: "10 में से 8 वर्षों में बारिश {p20} से {p80} के बीच शुरू होती है; {fs}% मौसमों में झूठी शुरुआत हुई। खेत और बीज तैयार रखें, पर सूखी मिट्टी में बुवाई न करें।"
  de: "In 8 von 10 Jahren beginnt sie zwischen {p20} und {p80}; {fs}% der Jahre hatten einen Fehlstart. Boden und Saatgut vorbereiten, aber nicht trocken säen."
onset_waiting_title:
  en: "{season} rains have not started yet"
  es: "Las lluvias de {season} aún no han empezado"
  fr: "Les pluies de {season} n'ont pas encore commencé"
  sw: "Mvua za {season} bado hazijaanza"
  hi: "{season} की बारिश अभी शुरू नहीं हुई है"
  de: "Die {season}-Regenzeit hat noch nicht begonnen"
onset_late_title:
  en: "{season} rains are late"
  es: "Las lluvias de {season} se retrasan"
  fr: "Les pluies de {season} sont en retard"
  sw: "Mvua za {season} zimechelewa"
  hi: "{season} की बारिश देर से है"
  de: "Die {season}-Regenzeit ist spät dran"
onset_waiting_detail:
  en: "Typical start {p50} (8 in 10 years: {p20}–{p80}). Sow only after at least {mm} mm have fallen within 3 days."
  es: "Inicio típico {p50} (8 de 10 años: {p20}–{p80}). Siembre solo tras al menos {mm} mm en 3 días."
  fr: "Début typique {p50} (8 années sur 10 : {p20}–{p80}). Semez seulement après au moins {mm} mm en 3 jours."
  sw: "Kwa kawaida huanza {p50} (miaka 8 kati ya 10: {p20}–{p80}). Panda tu baada ya angalau mm {mm} kunyesha ndani ya siku 3."
  hi: "सामान्य शुरुआत {p50} (10 में से 8 वर्ष: {p20}–{p80})। 3 दिनों में कम से कम {mm} मिमी बारिश के बाद ही बुवाई करें।"
  de: "Typischer Beginn {p50} (8 von 10 Jahren: {p20}–{p80}). Erst säen, wenn mindestens {mm} mm in 3 Tagen gefallen sind."
onset_forecast_title:
  en: "{season} rains forecast to start {day}"
  es: "Se prevé que las lluvias de {season} empiecen el {day}"
  fr: "Début des pluies de {season} prévu le {day}"
  sw: "Mvua za {season} zinatarajiwa kuanza {day}"
  hi: "{season} की बारिश {day} को शुरू होने का अनुमान"
  de: "{season}-Regen soll am {day} einsetzen"
onset_forecast_detail:
  en: "Get seed and labour ready. Sow once at least {mm} mm have actually fallen and the soil is moist a hand deep."
  es: "Prepare semilla y mano de obra. Siembre cuando hayan caído de verdad al menos {mm} mm y el suelo esté húmedo a un palmo."
  fr: "Préparez semences et main-d'œuvre. Semez quand au moins {mm} mm sont réellement tombés et que le sol est humide sur une main de profondeur."
  sw: "Andaa mbegu na nguvu kazi. Panda baada ya angalau mm {mm} kunyesha kweli na udongo kuwa na unyevu kina cha kiganja."
  hi: "बीज और मजदूर तैयार रखें। कम से कम {mm} मिमी वास्तव में बरसने और मिट्टी एक हथेली गहराई तक नम होने पर बुवाई करें।"
  de: "Saatgut und Arbeitskräfte bereithalten. Säen, sobald mindestens {mm} mm tatsächlich gefallen sind und der Boden eine Handbreit tief feucht ist."
onset_started_title:
  en: "{season} rains likely started {day} · false-start risk {pct}%"
  es: "Las lluvias de {season} probablemente empezaron el {day} · riesgo de falso inicio {pct}%"
  fr: "Les pluies de {season} ont sans doute commencé le {day} · risque de faux départ {pct}%"
  sw: "Mvua za {season} huenda zilianza {day} · hatari ya mwanzo wa uongo {pct}%"
  hi: "{season} की बारिश संभवतः {day} को शुरू हुई · झूठी शुरुआत का जोखिम {pct}%"
  de: "{season}-Regenzeit hat wohl am {day} begonnen · Fehlstart-Risiko {pct}%"
onset_advice_sow_now:
  en: "Sow now: in similar past seasons the rains rarely stopped for more than {n} days after such a start."
  es: "Siembre ya: en temporadas parecidas la lluvia rara vez paró más de {n} días tras un inicio así."
  fr: "Semez maintenant : lors de saisons semblables, la pluie s'est rarement arrêtée plus de {n} jours après un tel début."
  sw: "Panda sasa: katika misimu kama hii mvua mara chache ilikatika zaidi ya siku {n} baada ya mwanzo kama huu."
  hi: "अभी बुवाई करें: ऐसी शुरुआत के बाद पिछले समान मौसमों में बारिश शायद ही {n} दिनों से अधिक रुकी।"
  de: "Jetzt säen: In ähnlichen Jahren setzte der Regen nach so einem Beginn selten länger als {n} Tage aus."
onset_advice_sow_with_care:
  en: "Sow if the soil is moist a hand deep; keep seed to re-sow, or start with drought-tolerant crops."
  es: "Siembre si el suelo está húmedo a un palmo; guarde semilla para resembrar o empiece con cultivos tolerantes a la sequía."
  fr: "Semez si le sol est humide sur une main de profondeur ; gardez des semences pour ressemer ou commencez par des cultures tolérantes à la sécheresse."
  sw: "Panda ikiwa udongo una unyevu kina cha kiganja; weka mbegu za kupanda tena, au anza na mazao yanayostahimili ukame."
  hi: "मिट्टी एक हथेली गहराई तक नम हो तो बुवाई करें; दोबारा बुवाई के लिए बीज बचाएं या सूखा-सहनशील फसलों से शुरू करें।"
  de: "Säen, wenn der Boden eine Handbreit tief feucht ist; Saatgut für eine Nachsaat zurückhalten oder mit trockenheitstoleranten Kulturen beginnen."
onset_advice_wait:
  en: "Wait: a dry spell of more than {n} days often follows such a start here. Sow after the next good rain."
  es: "Espere: aquí suele seguir una racha seca de más de {n} días a un inicio así. Siembre tras la próxima buena lluvia."
  fr: "Attendez : ici, une période sèche de plus de {n} jours suit souvent un tel début. Semez après la prochaine bonne pluie."
  sw: "Subiri: hapa kipindi kikavu cha zaidi ya siku {n} mara nyingi hufuata mwanzo kama huu. Panda baada ya mvua nzuri inayofuata."
  hi: "रुकें: यहाँ ऐसी शुरुआत के बाद अक्सर {n} दिनों से अधिक का सूखा आता है। अगली अच्छी बारिश के बाद बुवाई करें।"
  de: "Abwarten: Hier folgt auf so einen Beginn oft eine Trockenphase von mehr als {n} Tagen. Nach dem nächsten guten Regen säen."
onset_false_title:
  en: "False start: dry spell after the rains of {day}"
  es: "Falso inicio: racha seca tras las lluvias del {day}"
  fr: "Faux départ : période sèche après les pluies du {day}"
  sw: "Mwanzo wa uongo: kipindi kikavu baada ya mvua za {day}"
  hi: "झूठी शुरुआत: {day} की बारिश के बाद सूखा"
  de: "Fehlstart: Trockenphase nach dem Regen vom {day}"
onset_false_detail:
  en: "Wait for the next {mm} mm in 3 days before sowing. If you already sowed, check emergence and re-sow gaps."
  es: "Espere a los próximos {mm} mm en 3 días para sembrar. Si ya sembró, revise la emergencia y resiembre los huecos."
  fr: "Attendez les prochains {mm} mm en 3 jours pour semer. Si vous avez déjà semé, vérifiez la levée et ressemez les manques."
  sw: "Subiri mm {mm} zinazofuata ndani ya siku 3 kabla ya kupanda. Kama ulishapanda, kagua uotaji na panda tena mapengo."
  hi: "बुवाई से पहले 3 दिनों में अगली {mm} मिमी बारिश की प्रतीक्षा करें। यदि बो चुके हैं तो अंकुरण जांचें और खाली जगह दोबारा बोएं।"
  de: "Vor der Saat auf die nächsten {mm} mm in 3 Tagen warten. Schon gesät? Auflauf prüfen und Lücken nachsäen."
onset_established_title:
  en: "{season} rainy season under way since {day}"
  es: "Temporada de lluvias {season} en marcha desde el {day}"
  fr: "Saison des pluies {season} installée depuis le {day}"
  sw: "Msimu wa mvua wa {season} umeanza tangu {day}"
  hi: "{season} वर्षा ऋतु {day} से जारी है"
  de: "{season}-Regenzeit läuft seit {day}"
onset_established_detail:
  en: "In 8 of 10 years the rains last at least until {end}."
  es: "En 8 de cada 10 años las lluvias duran al menos hasta el {end}."
  fr: "8 années sur 10, les pluies durent au moins jusqu'au {end}."
  sw: "Katika miaka 8 kati ya 10 mvua hudumu angalau hadi {end}."
  hi: "10 में से 8 वर्षों में बारिश कम से कम {end} तक चलती है।"
  de: "In 8 von 10 Jahren hält der Regen mindestens bis {end} an."
onset_failed_title:
  en: "{season} rains have failed so far"
  es: "Las lluvias de {season} han fallado hasta ahora"
  fr: "Les pluies de {season} ont fait défaut jusqu'ici"
  sw: "Mvua za {season} zimeshindwa hadi sasa"
  hi: "{season} की बारिश अब तक विफल रही है"
  de: "Die {season}-Regenzeit ist bisher ausgefallen"
onset_failed_detail:
  en: "No reliable start this season. Save seed for the next season, or sow only very short-cycle crops after good rain."
  es: "Sin un inicio fiable esta temporada. Guarde semilla para la próxima o siembre solo cultivos de ciclo muy corto tras buena lluvia."
  fr: "Pas de démarrage fiable cette saison. Gardez les semences pour la prochaine ou ne semez que des cultures à cycle très court après une bonne pluie."
  sw: "Hakuna mwanzo wa uhakika msimu huu. Hifadhi mbegu kwa msimu ujao, au panda mazao ya muda mfupi sana baada ya mvua nzuri tu."
  hi: "इस मौसम में भरोसेमंद शुरुआत नहीं हुई। अगले मौसम के लिए बीज बचाएं या अच्छी बारिश के बाद केवल बहुत कम अवधि की फसलें बोएं।"
  de: "Kein verlässlicher Beginn in dieser Saison. Saatgut für die nächste aufheben oder nach gutem Regen nur sehr kurzlebige Kulturen säen."
onset_sow_until:
  en: "Sow {crop} by {day}."
  es: "Siembre {crop} antes del {day}."
  fr: "Semez {crop} avant le {day}."
  sw: "Panda {crop} kabla ya {day}."
  hi: "{crop} की बुवाई {day} तक करें।"
  de: "{crop} bis {day} säen."
onset_short_cycle:
  en: "{crop} ({cycle} days) finishes before the rains end in only {fit}% of years: choose an early variety (≤ {days} days) or a shorter crop such as {alt}."
  es: "{crop} ({cycle} días) termina antes del fin de las lluvias solo en el {fit}% de los años: elija una variedad precoz (≤ {days} días) o un cultivo más corto como {alt}."
  fr: "{crop} ({cycle} jours) ne termine avant la fin des pluies que {fit}% des années : choisissez une variété précoce (≤ {days} jours) ou une culture plus courte comme {alt}."
  sw: "{crop} (siku {cycle}) hukomaa kabla mvua kuisha katika {fit}% tu ya miaka: chagua aina inayokomaa mapema (≤ siku {days}) au zao fupi kama {alt}."
  hi: "{crop} ({cycle} दिन) केवल {fit}% वर्षों में बारिश खत्म होने से पहले पकती है: जल्दी पकने वाली किस्म (≤ {days} दिन) या {alt} जैसी छोटी फसल चुनें।"
  de: "{crop} ({cycle} Tage) wird nur in {fit}% der Jahre vor Ende der Regenzeit fertig: frühe Sorte (≤ {days} Tage) oder eine kürzere Kultur wie {alt} wählen."
onset_too_late:
  en: "It is late to sow {crop} this season; a short crop such as {alt} still finishes in {fit}% of years."
  es: "Es tarde para sembrar {crop} esta temporada; un cultivo corto como {alt} aún termina en el {fit}% de los años."
  fr: "Il est tard pour semer {crop} cette saison ; une culture courte comme {alt} termine encore {fit}% des années."
  sw: "Ni kuchelewa kupanda {crop} msimu huu; zao fupi kama {alt} bado hukomaa katika {fit}% ya miaka."
  hi: "इस मौसम में {crop} बोने में देर हो चुकी है; {alt} जैसी छोटी फसल अब भी {fit}% वर्षों में पक जाती है।"
  de: "Für {crop} ist es diese Saison spät; eine kurze Kultur wie {alt} wird noch in {fit}% der Jahre fertig."
onset_why_summary:
  en: "Sowing at the true start of the {season} rains, not at the first shower, avoids losing seed and seedlings to a dry spell."
  es: "Sembrar al inicio real de las lluvias de {season}, no con el primer chaparrón, evita perder semilla y plántulas por una racha seca."
  fr: "Semer au vrai début des pluies de {season}, pas à la première averse, évite de perdre semences et plantules lors d'une période sèche."
  sw: "Kupanda mwanzoni halisi mwa mvua za {season}, si kwenye manyunyu ya kwanza, huzuia kupoteza mbegu na miche kwa ukame."
  hi: "{season} की असली शुरुआत पर बुवाई, पहली बौछार पर नहीं, सूखे में बीज और पौध खोने से बचाती है।"
  de: "Wer zum echten Beginn der {season}-Regenzeit sät statt beim ersten Schauer, verliert Saat und Keimlinge nicht an eine Trockenphase."
