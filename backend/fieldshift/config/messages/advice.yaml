wb_step_season:
  en: "Season started {date}; crop stage today: {stage} (Kc ≈ {kc:.2f})."
  es: "La temporada empezó el {date}; etapa del cultivo hoy: {stage} (Kc ≈ {kc:.2f})."
  fr: "Saison commencée le {date} ; stade de la culture aujourd'hui : {stage} (Kc ≈ {kc:.2f})."
  sw: "Msimu ulianza {date}; hatua ya zao leo: {stage} (Kc ≈ {kc:.2f})."
  hi: "मौसम {date} को शुरू हुआ; आज फसल की अवस्था: {stage} (Kc ≈ {kc:.2f})।"
  de: "Saisonbeginn {date}; Entwicklungsstadium heute: {stage} (Kc ≈ {kc:.2f})."
wb_step_et0:
  en: "Reference evapotranspiration ET₀ (FAO-56 Penman–Monteith from NASA POWER) over the next 7 days: {et0:.0f} mm; forecast rain: {rain:.0f} mm."
  es: "Evapotranspiración de referencia ET₀ (FAO-56 Penman–Monteith con NASA POWER) en los próximos 7 días: {et0:.0f} mm; lluvia prevista: {rain:.0f} mm."
  fr: "Évapotranspiration de référence ET₀ (FAO-56 Penman–Monteith, NASA POWER) sur les 7 prochains jours : {et0:.0f} mm ; pluie prévue : {rain:.0f} mm."
  sw: "Uvukizaji wa marejeo ET₀ (FAO-56 Penman–Monteith kutoka NASA POWER) kwa siku 7 zijazo: mm {et0:.0f}; mvua inayotarajiwa: mm {rain:.0f}."
  hi: "अगले 7 दिनों में संदर्भ वाष्पोत्सर्जन ET₀ (NASA POWER से FAO-56 पेनमैन–मॉन्टिथ): {et0:.0f} मिमी; अनुमानित वर्षा: {rain:.0f} मिमी।"
  de: "Referenzverdunstung ET₀ (FAO-56 Penman–Monteith aus NASA POWER) in den nächsten 7 Tagen: {et0:.0f} mm; vorhergesagter Regen: {rain:.0f} mm."
wb_step_soil:
  en: "Soil: {soil} holds ~{taw_m:.0f} mm water per metre; root zone today holds {taw:.0f} mm (TAW); stress begins after {raw:.0f} mm are used (RAW)."
  es: "Suelo: {soil} retiene ~{taw_m:.0f} mm de agua por metro; la zona de raíces guarda hoy {taw:.0f} mm (TAW); el estrés empieza tras usar {raw:.0f} mm (RAW)."
  fr: "Sol : {soil}, retient ~{taw_m:.0f} mm d'eau par mètre ; la zone racinaire contient aujourd'hui {taw:.0f} mm (TAW) ; le stress commence après {raw:.0f} mm consommés (RAW)."
  sw: "Udongo: {soil} hushika ~mm {taw_m:.0f} za maji kwa mita; eneo la mizizi leo lina mm {taw:.0f} (TAW); msongo huanza baada ya mm {raw:.0f} kutumika (RAW)."
  hi: "मिट्टी: {soil}, प्रति मीटर ~{taw_m:.0f} मिमी पानी रखती है; आज जड़ क्षेत्र में {taw:.0f} मिमी (TAW) है; {raw:.0f} मिमी उपयोग होने के बाद तनाव शुरू होता है (RAW)।"
  de: "Boden: {soil}, speichert ~{taw_m:.0f} mm Wasser pro Meter; der Wurzelraum fasst heute {taw:.0f} mm (TAW); Stress beginnt nach {raw:.0f} mm Verbrauch (RAW)."
wb_step_used:
  en: "Estimated water used from the root zone today: {dr:.0f} mm ({pct}% of available water left)."
  es: "Agua usada estimada de la zona de raíces hoy: {dr:.0f} mm (queda {pct}% del agua disponible)."
  fr: "Eau consommée estimée dans la zone racinaire aujourd'hui : {dr:.0f} mm ({pct} % de l'eau disponible restante)."
  sw: "Makadirio ya maji yaliyotumika eneo la mizizi leo: mm {dr:.0f} ({pct}% ya maji yanayopatikana yamebaki)."
  hi: "आज जड़ क्षेत्र से अनुमानित उपयोग हुआ पानी: {dr:.0f} मिमी ({pct}% उपलब्ध पानी शेष)।"
  de: "Geschätzter Wasserverbrauch im Wurzelraum heute: {dr:.0f} mm ({pct} % des verfügbaren Wassers übrig)."
wb_step_ecostress:
  en: "NASA ECOSTRESS measured {et:.1f} mm/day of evapotranspiration on this field on {date} (70 m); the model had {model:.1f} mm/day."
  es: "NASA ECOSTRESS midió {et:.1f} mm/día de evapotranspiración en este campo el {date} (70 m); el modelo tenía {model:.1f} mm/día."
  fr: "NASA ECOSTRESS a mesuré {et:.1f} mm/jour d'évapotranspiration sur cette parcelle le {date} (70 m) ; le modèle donnait {model:.1f} mm/jour."
  sw: "NASA ECOSTRESS ilipima uvukizaji wa mm {et:.1f}/siku shambani hapa tarehe {date} (m 70); modeli ilikuwa na mm {model:.1f}/siku."
  hi: "NASA ECOSTRESS ने {date} को इस खेत पर {et:.1f} मिमी/दिन वाष्पोत्सर्जन मापा (70 मी); मॉडल में {model:.1f} मिमी/दिन था।"
  de: "NASA ECOSTRESS hat am {date} auf diesem Feld {et:.1f} mm/Tag Verdunstung gemessen (70 m); das Modell hatte {model:.1f} mm/Tag."
wb_step_fusion:
  en: "Sentinel-2 ({date}, 10 m) shows field NDVI {ndvi:.2f} → satellite crop coefficient {kcb:.2f} vs. {kc:.2f} in the crop model; crop water use from that day is scaled by {scale:.2f} (data fusion)."
  es: "Sentinel-2 ({date}, 10 m) muestra un NDVI de {ndvi:.2f} → coeficiente de cultivo satelital {kcb:.2f} frente a {kc:.2f} en el modelo; el uso de agua desde ese día se escala por {scale:.2f} (fusión de datos)."
  fr: "Sentinel-2 ({date}, 10 m) indique un NDVI de {ndvi:.2f} → coefficient cultural satellite {kcb:.2f} contre {kc:.2f} dans le modèle ; la consommation d'eau dès ce jour est multipliée par {scale:.2f} (fusion de données)."
  sw: "Sentinel-2 ({date}, m 10) inaonyesha NDVI {ndvi:.2f} → kigezo cha zao cha setilaiti {kcb:.2f} dhidi ya {kc:.2f} kwenye modeli; matumizi ya maji kuanzia siku hiyo yanazidishwa kwa {scale:.2f} (kuunganisha data)."
  hi: "Sentinel-2 ({date}, 10 मी) खेत का NDVI {ndvi:.2f} दिखाता है → उपग्रह फसल गुणांक {kcb:.2f} बनाम मॉडल में {kc:.2f}; उस दिन से फसल जल उपयोग को {scale:.2f} से गुणा किया गया (डेटा संलयन)।"
  de: "Sentinel-2 ({date}, 10 m) zeigt Feld-NDVI {ndvi:.2f} → Satelliten-Kulturkoeffizient {kcb:.2f} statt {kc:.2f} im Modell; der Wasserverbrauch ab diesem Tag wird mit {scale:.2f} skaliert (Datenfusion)."
wb_caveat_assumed:
  en: "We assume you irrigated whenever the model said so. Enter your last irrigation for a sharper estimate."
  es: "Suponemos que regó cada vez que el modelo lo indicó. Anote su último riego para una estimación más precisa."
  fr: "Nous supposons que vous avez irrigué chaque fois que le modèle l'indiquait. Saisissez votre dernière irrigation pour une estimation plus fine."
  sw: "Tunadhani ulimwagilia kila modeli iliposema. Weka umwagiliaji wako wa mwisho kupata makadirio sahihi zaidi."
  hi: "हम मानते हैं कि मॉडल के कहने पर आपने हर बार सिंचाई की। अधिक सटीक अनुमान के लिए अपनी पिछली सिंचाई दर्ज करें।"
  de: "Wir nehmen an, dass Sie immer bewässert haben, wenn das Modell es empfahl. Tragen Sie Ihre letzte Bewässerung ein, um die Schätzung zu verbessern."
wb_step_stress_on:
  en: "Projecting forward with the forecast, depletion reaches the stress point on {date}."
  es: "Proyectando con el pronóstico, el agotamiento alcanza el punto de estrés el {date}."
  fr: "En projetant avec la prévision, l'épuisement atteint le seuil de stress le {date}."
  sw: "Tukiendeleza kwa utabiri, upungufu unafikia kiwango cha msongo tarehe {date}."
  hi: "पूर्वानुमान के साथ आगे देखने पर, कमी {date} को तनाव बिंदु पर पहुँचती है।"
  de: "Mit der Vorhersage fortgeschrieben erreicht die Entleerung am {date} die Stressgrenze."
wb_step_refill:
  en: "Refilling the root zone needs ~{net:.0f} mm net; with {method} irrigation (~{eff:.0%} efficient) apply ~{gross} mm."
  es: "Rellenar la zona de raíces requiere ~{net:.0f} mm netos; con riego por {method} (~{eff:.0%} de eficiencia) aplique ~{gross} mm."
  fr: "Recharger la zone racinaire demande ~{net:.0f} mm nets ; en irrigation {method} (efficience ~{eff:.0%}) apportez ~{gross} mm."
  sw: "Kujaza eneo la mizizi kunahitaji ~mm {net:.0f} halisi; kwa umwagiliaji wa {method} (ufanisi ~{eff:.0%}) weka ~mm {gross}."
  hi: "जड़ क्षेत्र को भरने के लिए ~{net:.0f} मिमी शुद्ध पानी चाहिए; {method} सिंचाई (~{eff:.0%} दक्षता) से ~{gross} मिमी दें।"
  de: "Zum Auffüllen des Wurzelraums braucht es ~{net:.0f} mm netto; mit {method}bewässerung (~{eff:.0%} Wirkungsgrad) ~{gross} mm ausbringen."
wb_sum_irrigate:
  en: "Your crop will run short of easily available soil water around {date}. Irrigating ~{gross} mm before then avoids yield loss."
  es: "Su cultivo se quedará sin agua fácilmente disponible hacia el {date}. Regar ~{gross} mm antes evita pérdidas de rendimiento."
  fr: "Votre culture manquera d'eau facilement disponible vers le {date}. Irriguer ~{gross} mm avant évite une perte de rendement."
  sw: "Zao lako litakosa maji yanayopatikana kwa urahisi karibu {date}. Kumwagilia ~mm {gross} kabla ya hapo kunazuia hasara ya mavuno."
  hi: "लगभग {date} तक आपकी फसल को आसानी से मिलने वाला पानी कम पड़ेगा। उससे पहले ~{gross} मिमी सिंचाई करने से उपज का नुकसान नहीं होगा।"
  de: "Ihrer Kultur geht um den {date} das leicht verfügbare Bodenwasser aus. Wer vorher ~{gross} mm bewässert, vermeidet Ertragsverluste."
model_water_balance:
  en: "FAO-56 single-Kc root-zone water balance"
  es: "Balance hídrico de la zona de raíces FAO-56 (Kc único)"
  fr: "Bilan hydrique de la zone racinaire FAO-56 (Kc unique)"
  sw: "Mizania ya maji ya eneo la mizizi FAO-56 (Kc moja)"
  hi: "FAO-56 एकल-Kc जड़ क्षेत्र जल संतुलन"
  de: "FAO-56-Wasserbilanz des Wurzelraums (Einzel-Kc)"
wb_note_assumed:
  en: "Water balance driven by NASA POWER and forecast; field irrigation history is assumed."
  es: "Balance hídrico con NASA POWER y pronóstico; el historial de riego del campo es supuesto."
  fr: "Bilan hydrique piloté par NASA POWER et la prévision ; l'historique d'irrigation est supposé."
  sw: "Mizania ya maji kwa NASA POWER na utabiri; historia ya umwagiliaji wa shamba imekisiwa."
  hi: "जल संतुलन NASA POWER और पूर्वानुमान से; खेत की सिंचाई का इतिहास माना गया है।"
  de: "Wasserbilanz aus NASA POWER und Vorhersage; die Bewässerungshistorie des Feldes ist angenommen."
wb_note:
  en: "Water balance driven by NASA POWER and forecast."
  es: "Balance hídrico con NASA POWER y pronóstico."
  fr: "Bilan hydrique piloté par NASA POWER et la prévision."
  sw: "Mizania ya maji kwa NASA POWER na utabiri."
  hi: "जल संतुलन NASA POWER और पूर्वानुमान से।"
  de: "Wasserbilanz aus NASA POWER und Vorhersage."
wb_note_rainfed:
  en: "Rain-fed estimate from NASA POWER + forecast."
  es: "Estimación de secano con NASA POWER + pronóstico."
  fr: "Estimation en pluvial avec NASA POWER + prévision."
  sw: "Makadirio ya kilimo cha mvua kutoka NASA POWER + utabiri."
  hi: "NASA POWER + पूर्वानुमान से वर्षा-आधारित अनुमान।"
  de: "Regenfeldbau-Schätzung aus NASA POWER + Vorhersage."
wb_step_no_stress:
  en: "With the forecast, depletion stays below the stress point for at least {days} days."
  es: "Con el pronóstico, el agotamiento se mantiene bajo el punto de estrés al menos {days} días."
  fr: "Avec la prévision, l'épuisement reste sous le seuil de stress pendant au moins {days} jours."
  sw: "Kwa utabiri, upungufu unabaki chini ya kiwango cha msongo kwa angalau siku {days}."
  hi: "पूर्वानुमान के साथ, कमी कम से कम {days} दिनों तक तनाव बिंदु से नीचे रहती है।"
  de: "Mit der Vorhersage bleibt die Entleerung mindestens {days} Tage unter der Stressgrenze."
wb_sum_no_irrigation:
  en: "Soil water stays above the stress point for the next {days} days."
  es: "El agua del suelo se mantiene sobre el punto de estrés los próximos {days} días."
  fr: "L'eau du sol reste au-dessus du seuil de stress pendant les {days} prochains jours."
  sw: "Maji ya udongo yanabaki juu ya kiwango cha msongo kwa siku {days} zijazo."
  hi: "अगले {days} दिनों तक मिट्टी का पानी तनाव बिंदु से ऊपर रहेगा।"
  de: "Das Bodenwasser bleibt in den nächsten {days} Tagen über der Stressgrenze."
wb_step_rainfed_ok:
  en: "With the forecast, the crop stays above the stress point for at least {days} days."
  es: "Con el pronóstico, el cultivo se mantiene sobre el punto de estrés al menos {days} días."
  fr: "Avec la prévision, la culture reste au-dessus du seuil de stress pendant au moins {days} jours."
  sw: "Kwa utabiri, zao linabaki juu ya kiwango cha msongo kwa angalau siku {days}."
  hi: "पूर्वानुमान के साथ, फसल कम से कम {days} दिनों तक तनाव बिंदु से ऊपर रहती है।"
  de: "Mit der Vorhersage bleibt die Kultur mindestens {days} Tage über der Stressgrenze."
wb_sum_rainfed_ok:
  en: "Rain and stored soil water cover crop demand for the next {days} days."
  es: "La lluvia y el agua almacenada en el suelo cubren la demanda del cultivo los próximos {days} días."
  fr: "La pluie et l'eau stockée dans le sol couvrent les besoins de la culture pendant les {days} prochains jours."
  sw: "Mvua na maji yaliyohifadhiwa udongoni yanatosheleza mahitaji ya zao kwa siku {days} zijazo."
  hi: "अगले {days} दिनों तक वर्षा और मिट्टी में जमा पानी फसल की ज़रूरत पूरी करते हैं।"
  de: "Regen und gespeichertes Bodenwasser decken den Bedarf der Kultur in den nächsten {days} Tagen."
wb_sum_rainfed_stress:
  en: "Without rain or irrigation, the crop will start to close its stomata and lose yield."
  es: "Sin lluvia ni riego, el cultivo empezará a cerrar sus estomas y a perder rendimiento."
  fr: "Sans pluie ni irrigation, la culture va fermer ses stomates et perdre du rendement."
  sw: "Bila mvua au umwagiliaji, zao litaanza kufunga vinyweleo vyake na kupoteza mavuno."
  hi: "बारिश या सिंचाई के बिना फसल अपने रंध्र बंद करने लगेगी और उपज घटेगी।"
  de: "Ohne Regen oder Bewässerung schließt die Kultur ihre Spaltöffnungen und verliert Ertrag."
plan_why_summary:
  en: "Between seasons is the time to decide what to grow next. IA simulates your current rotation and alternatives over the last 15 seasons of NASA POWER weather at this location."
  es: "Entre temporadas es el momento de decidir qué sembrar después. IA simula su rotación actual y alternativas con las últimas 15 temporadas de clima NASA POWER en este lugar."
  fr: "L'intersaison est le moment de décider quoi cultiver ensuite. IA simule votre rotation actuelle et des alternatives sur les 15 dernières saisons de météo NASA POWER à cet endroit."
  sw: "Kati ya misimu ndio wakati wa kuamua utapanda nini kinachofuata. IA huiga mzunguko wako wa sasa na mbadala kwa misimu 15 iliyopita ya hali ya hewa ya NASA POWER mahali hapa."
  hi: "दो मौसमों के बीच यह तय करने का समय है कि आगे क्या उगाएँ। IA इस स्थान पर पिछले 15 मौसमों के NASA POWER मौसम पर आपके मौजूदा फसल-चक्र और विकल्पों का अनुकरण करता है।"
  de: "Zwischen den Saisons entscheidet man, was als Nächstes wächst. IA simuliert Ihre jetzige Fruchtfolge und Alternativen mit den letzten 15 Jahren NASA-POWER-Wetter an diesem Ort."
plan_why_step_compare:
  en: "Rotations are compared on water, income, soil health, erosion, pest cycles and climate risk."
  es: "Las rotaciones se comparan por agua, ingresos, salud del suelo, erosión, ciclos de plagas y riesgo climático."
  fr: "Les rotations sont comparées sur l'eau, le revenu, la santé du sol, l'érosion, les cycles de ravageurs et le risque climatique."
  sw: "Mizunguko inalinganishwa kwa maji, mapato, afya ya udongo, mmomonyoko, mizunguko ya wadudu na hatari ya hali ya hewa."
  hi: "फसल-चक्रों की तुलना पानी, आय, मिट्टी की सेहत, कटाव, कीट-चक्र और जलवायु जोखिम पर होती है।"
  de: "Fruchtfolgen werden nach Wasser, Einkommen, Bodengesundheit, Erosion, Schädlingszyklen und Klimarisiko verglichen."
plan_why_step_cold:
  en: "7-day mean temperature {temp:.1f} °C; {crop} grows very little below ~{tbase} °C."
  es: "Temperatura media de 7 días {temp:.1f} °C; {crop} casi no crece por debajo de ~{tbase} °C."
  fr: "Température moyenne sur 7 jours {temp:.1f} °C ; {crop} pousse très peu sous ~{tbase} °C."
  sw: "Wastani wa joto la siku 7 ni {temp:.1f} °C; {crop} hukua kidogo sana chini ya ~{tbase} °C."
  hi: "7 दिन का औसत तापमान {temp:.1f} °C; ~{tbase} °C से नीचे {crop} बहुत कम बढ़ता है।"
  de: "7-Tage-Mitteltemperatur {temp:.1f} °C; {crop} wächst unter ~{tbase} °C kaum."
