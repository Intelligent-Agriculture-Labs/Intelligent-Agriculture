clim_insight_up:
  en: "{label} has risen by {slope:.1f} {unit} per decade since {year} ({base:.0f} → {recent:.0f} {unit}; Mann–Kendall p = {p:.2f})."
  es: "{label} ha subido {slope:.1f} {unit} por década desde {year} ({base:.0f} → {recent:.0f} {unit}; Mann–Kendall p = {p:.2f})."
  fr: "{label} : hausse de {slope:.1f} {unit} par décennie depuis {year} ({base:.0f} → {recent:.0f} {unit} ; Mann–Kendall p = {p:.2f})."
  sw: "{label} imeongezeka kwa {slope:.1f} {unit} kila muongo tangu {year} ({base:.0f} → {recent:.0f} {unit}; Mann–Kendall p = {p:.2f})."
  hi: "{label} {year} से प्रति दशक {slope:.1f} {unit} बढ़ा है ({base:.0f} → {recent:.0f} {unit}; मैन–केंडल p = {p:.2f})।"
  de: "{label}: Anstieg um {slope:.1f} {unit} pro Jahrzehnt seit {year} ({base:.0f} → {recent:.0f} {unit}; Mann-Kendall p = {p:.2f})."
clim_insight_down:
