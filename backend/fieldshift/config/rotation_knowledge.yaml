    preceding_crop_value: high
    soil_structure_effect: improves
    residue_c_t_ha: 3.0
    allelopathy: null
    good_predecessors: [clover_grass_ley, field_pea, faba_bean, potato, winter_wheat]
    poor_predecessors: [hemp, sunflower, soybean, winter_rapeseed]
    note: Dense, fast canopy suppresses weeds and a deep taproot loosens subsoil — a good predecessor for cereals; susceptible to Sclerotinia.
    sources:
    - Amaducci S. et al. 2015, Key cultivation techniques for hemp in Europe and China, https://doi.org/10.1016/j.indcrop.2014.06.041
    - 'Bolton M.D. et al. 2006, Sclerotinia sclerotiorum (Lib.) de Bary: biology and molecular traits of a cosmopolitan pathogen, https://doi.org/10.1111/j.1364-3703.2005.00316.x'
  clover_grass_ley:
    min_return_years: 3
    self_tolerance: medium
    family_return_years: 2
    root_system: mixed
    root_depth_class: deep
    n_effect_kg_ha: 100
    preceding_crop_value: high
    soil_structure_effect: improves
    residue_c_t_ha: 3.0
    allelopathy: null
    good_predecessors: [winter_wheat, barley, oats, winter_rye, spring_wheat, winter_barley]
    poor_predecessors: [clover_grass_ley, alfalfa, field_pea, faba_bean]
    note: Builds soil organic matter, structure and N (grass–clover mixtures fix more N than clover alone), and cleans out annual weeds. Wireworms build up — avoid potatoes/maize/root crops for 2–3 years
      after ploughing it out.
    sources:
    - Nyfeler D. et al. 2011, Grass–legume mixtures can yield more nitrogen than legume pure stands due to mutual stimulation of nitrogen uptake from symbiotic and non-symbiotic sources, https://doi.org/10.1016/j.agee.2010.11.022
    - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
    - Parker W.E. et al. 2001, The biology and management of wireworms (Agriotes spp.) on potato with particular reference to the U.K, https://doi.org/10.1046/j.1461-9563.2001.00094.x
    - AHDB. Non-chemical control of take-all in cereals. https://ahdb.org.uk/knowledge-library/non-chemical-control-of-take-all-in-cereals
  phacelia_cover:
    min_return_years: 1
    self_tolerance: high
    family_return_years: null
    root_system: fibrous
    root_depth_class: medium
    n_effect_kg_ha: 10
    preceding_crop_value: high
    soil_structure_effect: improves
    residue_c_t_ha: 2.5
    allelopathy: null
    good_predecessors: [winter_wheat, barley, winter_barley, spring_wheat, field_pea]
    poor_predecessors: []
    note: Not related to any major crop, so it fits almost any rotation without spreading diseases; fine roots improve topsoil crumb and it catches leftover N.
    sources:
    - Clark A. (ed.) 2007, Managing Cover Crops Profitably, 3rd ed, https://www.sare.org/resources/managing-cover-crops-profitably-3rd-edition/
  sorghum_sudan:
    min_return_years: 1
    self_tolerance: medium
    family_return_years: 1
    root_system: fibrous
    root_depth_class: deep
    n_effect_kg_ha: -20
    preceding_crop_value: medium
    soil_structure_effect: improves
    residue_c_t_ha: 2.0
    allelopathy: Sorghum roots/residues exude sorgoleone and phenolics that suppress weeds and can reduce stands/growth of small-seeded following crops (wheat, vegetables) for weeks.
    good_predecessors: [winter_wheat, soybean, field_pea, potato]
    poor_predecessors: [sorghum, sorghum_sudan, maize]
    note: Huge root system breaks compaction; some cultivars suppress root-knot nematodes (dhurrin/HCN). Allelopathic — wait before sowing small-seeded crops.
    sources:
    - Clark A. (ed.) 2007, Managing Cover Crops Profitably, 3rd ed, https://www.sare.org/resources/managing-cover-crops-profitably-3rd-edition/
    - Weston L.A. 1996, Utilization of allelopathy for weed management in agroecosystems, https://doi.org/10.2134/agronj1996.00021962003600060004x
    - Moens M. et al. 2009, Meloidogyne species — a diverse group of novel and important plant parasites, https://doi.org/10.1079/9781845934927.0001
    - Larkin R.P. et al. 2011, Effects of different potato cropping system approaches and water management on soilborne diseases and soil microbial communities, https://doi.org/10.1094/PHYTO-04-10-0100
rules:
- id: cereal_after_cereal
  text: 'Wheat after wheat (or another take-all/eyespot host cereal) yields less than after a break crop: Angus et al. found +0.5 t/ha (after oats) to +1.2 t/ha (after pulses) for the break. Typical loss
    5–15 % (midpoint −10 %).'
  yield_effect_pct: -10
  applies_to: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage]
  after: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye]
  sources:
  - Angus J.F. et al. 2015, Break crops and rotations for wheat, https://doi.org/10.1071/CP14252
  - Kirkegaard J. et al. 2008, Break crop benefits in temperate wheat production, https://doi.org/10.1016/j.fcr.2008.02.010
  - Cook R.J. 2003, Take-all of wheat, https://doi.org/10.1016/S0885-5765(03)00042-0
- id: legume_before_cereal
  text: A grain legume before a cereal adds residual N and breaks cereal diseases; wheat yielded on average 1.2 t/ha more after pulses than after wheat (≈+20 % at 5–6 t/ha). Reduce N fertiliser by the crop's
    n_effect_kg_ha.
  yield_effect_pct: 20
  applies_to: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, winter_rye, oats, maize, maize_silage, sweet_corn, sorghum, pearl_millet, rice]
  after: [field_pea, lentil, chickpea, faba_bean, soybean, dry_bean, cowpea, groundnut, pigeon_pea, mung_bean, alfalfa, clover_grass_ley]
  sources:
  - Angus J.F. et al. 2015, Break crops and rotations for wheat, https://doi.org/10.1071/CP14252
  - Peoples M.B. et al. 2009, The contributions of nitrogen-fixing crop legumes to the productivity of agricultural systems, https://doi.org/10.1007/BF03179980
  - Herridge D.F. et al. 2008, Global inputs of biological nitrogen fixation in agricultural systems, https://doi.org/10.1007/s11104-008-9668-3
- id: oilseed_before_cereal
  text: 'Canola, mustard or flax before wheat breaks take-all and other cereal root diseases: about +0.8 t/ha (≈+15 %); the benefit carries ~20 % into a second wheat.'
  yield_effect_pct: 15
  applies_to: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley]
  after: [winter_rapeseed, mustard_cover, flax]
  sources:
  - Angus J.F. et al. 2015, Break crops and rotations for wheat, https://doi.org/10.1071/CP14252
  - Kirkegaard J. et al. 2008, Break crop benefits in temperate wheat production, https://doi.org/10.1016/j.fcr.2008.02.010
- id: continuous_maize
  text: 'Maize after maize: continuous corn yielded 1.36 t/ha (−13 %) less than corn after soybean in Illinois and ~15 % less in Wisconsin; the penalty grows with years of continuous maize (N tie-up, residue,
    rootworm).'
  yield_effect_pct: -13
  applies_to: &id001 [maize, maize_silage, sweet_corn]
  after: *id001
  sources:
  - Gentry L.F. et al. 2013, Identifying factors controlling the continuous corn yield penalty, https://doi.org/10.2134/agronj2012.0246
  - Pedersen P. et al. 2003, Corn and soybean response to rotation sequence, row spacing, and tillage system, https://doi.org/10.2134/agronj2003.9650
  - 'Gray M.E. et al. 2009, Adaptation and invasiveness of western corn rootworm: intensifying research on a worsening pest, https://doi.org/10.1146/annurev.ento.54.110807.090434'
- id: maize_before_wheat_fusarium
  text: Wheat, durum or barley directly after maize has the highest Fusarium head blight and DON risk, especially with surface residue (no-till). Plough/chop residue or choose a different predecessor.
  yield_effect_pct: -5
  applies_to: [winter_wheat, spring_wheat, durum_wheat, spelt, barley, winter_barley, triticale_forage, oats]
  after: [maize, maize_silage, sweet_corn, sorghum]
  low_confidence: true
  sources:
  - Dill-Macky R. et al. 2000, The effect of previous crop residues and tillage on Fusarium head blight of wheat, https://doi.org/10.1094/PDIS.2000.84.1.71
  - 'McMullen M. et al. 2012, A unified effort to fight an enemy of wheat and barley: Fusarium head blight, https://doi.org/10.1094/PDIS-03-12-0291-FE'
- id: soybean_after_soybean
  text: 'Soybean after soybean: first-year soybean yielded ~8 % more than soybean in longer soybean sequences; SCN, Phytophthora and white mould increase.'
  yield_effect_pct: -8
  applies_to: [soybean]
  after: [soybean]
  sources:
  - Pedersen P. et al. 2003, Corn and soybean response to rotation sequence, row spacing, and tillage system, https://doi.org/10.2134/agronj2003.9650
  - Niblack T.L. 2005, Soybean cyst nematode management reconsidered, https://doi.org/10.1094/PD-89-1020
- id: alfalfa_autotoxicity
  text: 'Do not reseed alfalfa into (or right after) an old alfalfa stand: autotoxic compounds reduce seedling growth and the new stand''s yield. Wait ≥1 year with another crop.'
  yield_effect_pct: -20
  applies_to: [alfalfa]
  after: [alfalfa]
  low_confidence: true
  sources:
  - Jennings J.A. et al. 1998, Influence of soil texture on alfalfa autotoxicity, https://doi.org/10.2134/agronj1998.00021962009000010010x
- id: brassica_return
  text: 'Brassicas (oilseed rape, mustard, cabbage) need ≥2 clear years between them: each additional crop between canola crops added 0.20–0.36 t/ha (midpoint 0.28 t/ha ≈ −11 % per missing break year) via
    less blackleg and root maggot.'
  yield_effect_pct: -11
  applies_to: &id002 [winter_rapeseed, mustard_cover, cabbage]
  after: *id002
  window_years: 2
  sources:
  - Harker K.N. et al. 2015, Canola rotation frequency impacts canola yield and associated pest species, https://doi.org/10.4141/cjps-2014-289
  - Canola Council of Canada. Canola Encyclopedia — Clubroot (spores survive up to 15–20 years; at least a two-year break). https://www.canolacouncil.org/canola-encyclopedia/diseases/clubroot/
  - Canola Council of Canada. Canola Encyclopedia — Blackleg. https://www.canolacouncil.org/canola-encyclopedia/diseases/blackleg/
- id: pulse_return
  text: Peas and lentils within 4–5 years of another pea/lentil/faba/alfalfa crop risk Aphanomyces root rot and Ascochyta; once established, yield losses in infested fields can be severe.
  yield_effect_pct: -15
  applies_to: [field_pea, lentil]
  after: [field_pea, lentil, chickpea, faba_bean, alfalfa, clover_grass_ley]
  window_years: 4
  low_confidence: true
  sources:
  - Gaulin E. et al. 2007, Root rot disease of legumes caused by Aphanomyces euteiches, https://doi.org/10.1111/j.1364-3703.2007.00413.x
  - Tivoli B. et al. 2007, Comparison of the epidemiology of ascochyta blights on grain legumes, https://doi.org/10.1007/s10658-007-9117-9
  - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
- id: solanaceae_short_rotation
  text: 'Potato/tomato/pepper less than 3 years after another Solanaceae: PCN, Verticillium, Rhizoctonia and scab build up; rotations reduced stem canker 10–50 %, black scurf 18–58 % and scab 15–45 % vs
    continuous potato.'
  yield_effect_pct: -10
  applies_to: &id003 [potato, tomato, pepper]
  after: *id003
  window_years: 3
  low_confidence: true
  sources:
  - Larkin R.P. et al. 2011, Effects of different potato cropping system approaches and water management on soilborne diseases and soil microbial communities, https://doi.org/10.1094/PHYTO-04-10-0100
  - Whitehead A.G. 1995, Decline of potato cyst nematodes, Globodera rostochiensis and G, https://doi.org/10.1111/j.1365-3059.1995.tb02728.x
  - Fradin E.F. et al. 2006, Physiology and molecular aspects of Verticillium wilt diseases caused by V, https://doi.org/10.1111/j.1364-3703.2006.00323.x
- id: beet_short_rotation
  text: 'Sugar beet less than 4 years after beet or another BCN host (oilseed rape, cabbage, non-resistant mustard, quinoa): cyst nematode, rhizomania and Rhizoctonia increase.'
  yield_effect_pct: -10
  applies_to: [sugar_beet]
  after: [sugar_beet, winter_rapeseed, cabbage, mustard_cover, quinoa]
  window_years: 4
  low_confidence: true
  sources:
  - UC IPM. Sugarbeet — Sugarbeet cyst nematode (Heterodera schachtii). University of California Agriculture and Natural Resources. https://ipm.ucanr.edu/agriculture/sugarbeet/sugarbeet-cyst-nematode/
  - McGrann G.R.D. et al. 2009, Progress towards the understanding and control of sugar beet rhizomania disease, https://doi.org/10.1111/j.1364-3703.2008.00514.x
  - Hof-Kautz C. 2024, Fruchtfolgen im Ökolandbau (Anbaupausen table, after Kolbe et al.), https://www.oekolandbau.nrw.de/sites/default/files/2024-06/2024_2_DLG_Poster_Fruchtfolgen_im_Ökolandbau.pdf
- id: sclerotinia_host_sequence
  text: Two Sclerotinia hosts within 3 years (sunflower, canola, soybean, beans, pulses, carrot, potato …) let sclerotia (surviving ~5 years) build up; put a cereal or maize between them.
  yield_effect_pct: -10
  host_group: sclerotinia
  window_years: 3
  low_confidence: true
  sources:
  - 'Bolton M.D. et al. 2006, Sclerotinia sclerotiorum (Lib.) de Bary: biology and molecular traits of a cosmopolitan pathogen, https://doi.org/10.1111/j.1364-3703.2005.00316.x'
  - Kirkegaard J. et al. 2008, Break crop benefits in temperate wheat production, https://doi.org/10.1016/j.fcr.2008.02.010
- id: wireworm_after_grass
  text: Potatoes, maize, beet and root vegetables in the first 2–4 years after grassland or a ley face wireworm damage (larvae live 4–5 years); a cereal first lowers the risk.
  yield_effect_pct: -10
  applies_to: [potato, sweet_potato, maize, maize_silage, sweet_corn, sugar_beet, carrot, onion]
  after: [clover_grass_ley]
  window_years: 3
  low_confidence: true
  sources:
  - Parker W.E. et al. 2001, The biology and management of wireworms (Agriotes spp.) on potato with particular reference to the U.K, https://doi.org/10.1046/j.1461-9563.2001.00094.x
- id: striga_trap_crop
  text: Where Striga occurs, cereal after cereal multiplies the seedbank; a legume or cotton 'trap crop' year triggers suicidal germination, adds N and lowers Striga in the next cereal.
  yield_effect_pct: 15
  applies_to: [maize, sorghum, pearl_millet, rice]
  after: [cowpea, groundnut, soybean, cotton, pigeon_pea, mung_bean]
  low_confidence: true
  sources:
  - Oswald A. 2005, Striga control — technologies and their dissemination, https://doi.org/10.1016/j.cropro.2004.09.003
  - Parker C. 2009, Observations on the current status of Orobanche and Striga problems worldwide, https://doi.org/10.1002/ps.1713
- id: rotation_diversity
  text: More diverse rotations (≥3 crops incl. a legume or perennial) raised maize yields 28.1 % on average across 11 long-term North American experiments (22.6 % in favourable years) and cut drought losses
    by 14–90 %.
  yield_effect_pct: 28
  applies_to: [maize]
  condition: rotation has >= 3 distinct crops including a legume, ley or small grain
  sources:
  - Bowles T.M. et al. 2020, Long-term evidence shows that crop-rotation diversification increases agricultural resilience to adverse growing conditions in North America, https://doi.org/10.1016/j.oneear.2020.02.007
- id: predecessor_value_scale
  text: 'German predecessor-suitability classes: very favourable predecessor = 110–120 % relative yield, favourable 100–110 %, unfavourable 90–100 %, very unfavourable 80–90 %. Used to translate preceding_crop_value
    high/medium/low into +15/+5/−5 % (class midpoints).'
  yield_effect_pct: 0
  scale:
    high: 15
    medium: 5
    low: -5
    very_low: -15
  sources:
  - Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie (LfULG). Vorfruchteignung der Kulturarten im Ökologischen Landbau (Fruchtfolgegrundsätze, Tabelle; predecessor classes = 80–90/90–100/100–110/110–120
    % relative yield). https://www.landwirtschaft.sachsen.de/download/Fruchtfolgegrundsaetze_Tabelle.pdf
- id: cover_crop_fallow
  text: Replacing bare winter fallow with a cover crop cuts nitrate leaching and erosion; non-legume covers had no significant yield penalty and legume covers can replace part of the N fertiliser.
  yield_effect_pct: 0
  sources:
  - 'Tonitto C. et al. 2006, Replacing bare fallows with cover crops in fertilizer-intensive cropping systems: a meta-analysis of crop yield and N dynamics, https://doi.org/10.1016/j.agee.2005.07.003'
  - Clark A. (ed.) 2007, Managing Cover Crops Profitably, 3rd ed, https://www.sare.org/resources/managing-cover-crops-profitably-3rd-edition/
- id: mycorrhiza_long_fallow
  text: Strongly mycorrhizal crops (sunflower, flax, maize, chickpea, pigeon pea, cotton, cassava, faba bean) grow poorly and show P deficiency after long bare fallow or non-mycorrhizal crops (brassicas,
    beet, quinoa); inoculation with cropped soil more than doubled sunflower growth.
  yield_effect_pct: -10
  applies_to: [sunflower, flax, maize, chickpea, pigeon_pea, cotton, cassava, faba_bean]
  after: [winter_rapeseed, mustard_cover, cabbage, sugar_beet, quinoa]
  low_confidence: true
  sources:
  - Thompson J.P. 1987, Decline of vesicular-arbuscular mycorrhizae in long fallow disorder of field crops and its expression in phosphorus deficiency of sunflower, https://doi.org/10.1071/AR9870847
- id: allelopathic_residue
  text: Small-seeded crops sown soon after sorghum, sorghum-sudangrass, sunflower or cereal-rye residues can suffer reduced emergence (sorgoleone, phenolics, benzoxazinoids); leave 2–4 weeks or incorporate
    residues.
  yield_effect_pct: -5
  applies_to: [carrot, onion, cabbage, lentil, flax, teff, quinoa, winter_wheat, durum_wheat]
  after: [sorghum, sorghum_sudan, sunflower, cover_rye_vetch, winter_rye]
