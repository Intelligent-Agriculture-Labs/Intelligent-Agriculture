sat_zone_medhigh: {en: "Medium-high vigour", es: "Vigor medio-alto", fr: "Vigueur moyenne à forte", sw: "Ukuaji wa wastani hadi nguvu", hi: "मध्यम-उच्च ओज", de: "Mittel-hohe Wüchsigkeit"}
sat_zone_medlow: {en: "Medium-low vigour", es: "Vigor medio-bajo", fr: "Vigueur moyenne à faible", sw: "Ukuaji wa wastani hadi dhaifu", hi: "मध्यम-निम्न ओज", de: "Mittel-geringe Wüchsigkeit"}
sat_adv_uniform:
  en: "The field is fairly uniform; manage it as one unit."
  es: "El campo es bastante uniforme; manéjelo como una sola unidad."
  fr: "La parcelle est assez homogène ; conduisez-la comme une seule unité."
  sw: "Shamba linafanana kwa kiasi kikubwa; lisimamie kama kitengo kimoja."
  hi: "खेत काफ़ी एक-समान है; इसे एक इकाई की तरह संभालें।"
  de: "Das Feld ist recht einheitlich; als eine Einheit bewirtschaften."
sat_adv_gap:
  en: "Vigour differs by {gap} NDVI between the best ({hi} % of the field) and the weakest zone ({lo} %)."
  es: "El vigor difiere en {gap} de NDVI entre la mejor zona ({hi} % del campo) y la más débil ({lo} %)."
  fr: "La vigueur diffère de {gap} de NDVI entre la meilleure zone ({hi} % de la parcelle) et la plus faible ({lo} %)."
  sw: "Nguvu ya ukuaji inatofautiana kwa NDVI {gap} kati ya kanda bora ({hi} % ya shamba) na dhaifu zaidi ({lo} %)."
  hi: "सबसे अच्छे क्षेत्र (खेत का {hi} %) और सबसे कमज़ोर क्षेत्र ({lo} %) के बीच ओज में {gap} NDVI का अंतर है।"
  de: "Die Wüchsigkeit unterscheidet sich um {gap} NDVI zwischen der besten Zone ({hi} % des Feldes) und der schwächsten ({lo} %)."
sat_adv_wet:
  en: "The weak zone sits where water collects: check for waterlogging, drainage or salinity before adding inputs."
  es: "La zona débil está donde se acumula el agua: revise encharcamiento, drenaje o salinidad antes de añadir insumos."
  fr: "La zone faible se trouve là où l'eau s'accumule : vérifiez engorgement, drainage ou salinité avant d'ajouter des intrants."
  sw: "Kanda dhaifu iko mahali maji hukusanyika: kagua kutuama kwa maji, mifereji au chumvi kabla ya kuongeza pembejeo."
  hi: "कमज़ोर क्षेत्र वहाँ है जहाँ पानी जमा होता है: खाद-दवा डालने से पहले जलभराव, निकासी या लवणता जाँचें।"
  de: "Die schwache Zone liegt, wo sich Wasser sammelt: vor weiteren Betriebsmitteln Staunässe, Drainage oder Versalzung prüfen."
sat_adv_slope:
  en: "The weak zone is on steeper ground: likely thinner soil and erosion — keep it covered and consider lower seeding rates."
  es: "La zona débil está en terreno más empinado: probablemente suelo más delgado y erosión; manténgala cubierta y considere densidades de siembra menores."
  fr: "La zone faible est sur un terrain plus pentu : sol probablement plus mince et érosion — gardez-la couverte et envisagez des densités de semis plus faibles."
  sw: "Kanda dhaifu iko kwenye mteremko mkali zaidi: huenda udongo ni mwembamba na kuna mmomonyoko — ifunike na fikiria kupanda mbegu chache."
  hi: "कमज़ोर क्षेत्र अधिक ढलान पर है: संभवतः पतली मिट्टी और कटाव — इसे ढका रखें और कम बीज दर पर विचार करें।"
  de: "Die schwache Zone liegt am steileren Hang: vermutlich flachgründiger Boden und Erosion – bedeckt halten und geringere Saatstärken erwägen."
sat_adv_samples:
  en: "Take separate soil samples in each zone: weak vigour often traces back to compaction, pH or nutrient patches."
  es: "Tome muestras de suelo separadas en cada zona: el bajo vigor suele deberse a compactación, pH o manchas de nutrientes."
  fr: "Prélevez des échantillons de sol séparés dans chaque zone : une faible vigueur vient souvent du tassement, du pH ou de carences localisées."
  sw: "Chukua sampuli tofauti za udongo katika kila kanda: ukuaji dhaifu mara nyingi hutokana na udongo kugandamizwa, pH au upungufu wa virutubisho sehemu fulani."
  hi: "हर क्षेत्र से अलग मिट्टी नमूने लें: कमज़ोर ओज अक्सर मिट्टी के दबाव, pH या पोषक तत्वों की कमी वाले हिस्सों से होता है।"
  de: "In jeder Zone getrennte Bodenproben nehmen: schwache Wüchsigkeit geht oft auf Verdichtung, pH oder Nährstoffnester zurück."
sat_adv_use:
  en: "Use the zones for variable-rate seeding/fertiliser or targeted scouting; walk the weakest zone first."
  es: "Use las zonas para siembra o fertilización variable o para inspecciones dirigidas; recorra primero la zona más débil."
  fr: "Utilisez les zones pour une modulation du semis/de la fertilisation ou une observation ciblée ; parcourez d'abord la zone la plus faible."
  sw: "Tumia kanda kwa upandaji/mbolea kwa viwango tofauti au ukaguzi maalum; tembelea kanda dhaifu zaidi kwanza."
  hi: "क्षेत्रों का उपयोग अलग-अलग बीज/उर्वरक दर या लक्षित निरीक्षण के लिए करें; सबसे कमज़ोर क्षेत्र पहले देखें।"
  de: "Die Zonen für teilflächenspezifische Saat/Düngung oder gezielte Kontrollen nutzen; die schwächste Zone zuerst begehen."
sat_adv_variable:
  en: "The weak zone is also the most variable over time — a sign of stress in dry spells (water-holding capacity)."
  es: "La zona débil es también la más variable en el tiempo: señal de estrés en periodos secos (capacidad de retención de agua)."
  fr: "La zone faible est aussi la plus variable dans le temps — signe de stress pendant les périodes sèches (réserve utile)."
  sw: "Kanda dhaifu pia ndiyo inayobadilika zaidi kwa muda — ishara ya msongo wakati wa ukame (uwezo wa kushika maji)."
  hi: "कमज़ोर क्षेत्र समय के साथ सबसे अधिक बदलता भी है — सूखे दौर में तनाव का संकेत (जल धारण क्षमता)।"
  de: "Die schwache Zone schwankt auch zeitlich am stärksten – ein Zeichen für Stress in Trockenphasen (Wasserhaltevermögen)."
sat_src_name: {en: "Copernicus Sentinel-2 L2A (via Earth Search, AWS Open Data)", es: "Copernicus Sentinel-2 L2A (vía Earth Search, AWS Open Data)", fr: "Copernicus Sentinel-2 L2A (via Earth Search, AWS Open Data)", sw: "Copernicus Sentinel-2 L2A (kupitia Earth Search, AWS Open Data)", hi: "Copernicus Sentinel-2 L2A (Earth Search, AWS Open Data के माध्यम से)", de: "Copernicus Sentinel-2 L2A (über Earth Search, AWS Open Data)"}
