# Active fires nearby and crop-residue burning (engine/fire_cards.py) — Why view texts.
fire_caveat_pixel:
  en: "A detection is a 375 m (VIIRS) or 1 km (MODIS) pixel containing an active fire at satellite overpass; small or short fires and fires under thick cloud or smoke can be missed."
  es: "Una detección es un píxel de 375 m (VIIRS) o 1 km (MODIS) con un fuego activo al paso del satélite; pueden escaparse fuegos pequeños o breves y los cubiertos por nubes densas o humo."
  fr: "Une détection est un pixel de 375 m (VIIRS) ou 1 km (MODIS) contenant un feu actif au passage du satellite ; les feux petits ou brefs et ceux sous nuages épais ou fumée peuvent échapper."
  sw: "Ugunduzi ni pikseli ya m 375 (VIIRS) au km 1 (MODIS) yenye moto unaowaka setilaiti inapopita; moto mdogo au wa muda mfupi na moto chini ya mawingu mazito au moshi unaweza kukosekana."
  hi: "एक पहचान 375 मी (VIIRS) या 1 किमी (MODIS) का पिक्सेल है जिसमें उपग्रह गुज़रते समय आग जल रही थी; छोटी या थोड़ी देर की आग और घने बादल या धुएँ के नीचे की आग छूट सकती है।"
  de: "Eine Detektion ist ein 375-m- (VIIRS) oder 1-km-Pixel (MODIS) mit aktivem Feuer beim Überflug; kleine oder kurze Feuer sowie Feuer unter dichten Wolken oder Rauch können fehlen."
fire_caveat_ground:
  en: "Detections are not checked on the ground; low-confidence detections are excluded."
  es: "Las detecciones no se verifican en terreno; se excluyen las de baja confianza."
  fr: "Les détections ne sont pas vérifiées au sol ; celles de faible confiance sont exclues."
  sw: "Ugunduzi hauthibitishwi ardhini; ule wenye uhakika mdogo umeondolewa."
  hi: "पहचान की ज़मीन पर पुष्टि नहीं होती; कम भरोसे वाली पहचान हटाई गई हैं।"
  de: "Detektionen werden nicht am Boden geprüft; solche mit geringer Konfidenz sind ausgeschlossen."
fire_note_keyless:
  en: "Keyless FIRMS feed covers the last 24 h only; add a free MAP_KEY for 48 h and MODIS."
  es: "El servicio FIRMS sin clave cubre solo las últimas 24 h; añada una MAP_KEY gratuita para 48 h y MODIS."
  fr: "Le flux FIRMS sans clé ne couvre que les dernières 24 h ; ajoutez une MAP_KEY gratuite pour 48 h et MODIS."
  sw: "Huduma ya FIRMS bila ufunguo inashughulikia saa 24 zilizopita tu; ongeza MAP_KEY ya bure kupata saa 48 na MODIS."
  hi: "बिना कुंजी वाला FIRMS फ़ीड केवल पिछले 24 घंटे दिखाता है; 48 घंटे और MODIS के लिए मुफ़्त MAP_KEY जोड़ें।"
  de: "Der FIRMS-Feed ohne Schlüssel deckt nur die letzten 24 h ab; für 48 h und MODIS einen kostenlosen MAP_KEY eintragen."
fire_note_demo:
  en: "Recorded FIRMS detections (demo data)."
  es: "Detecciones FIRMS grabadas (datos de demostración)."
  fr: "Détections FIRMS enregistrées (données de démonstration)."
  sw: "Ugunduzi wa FIRMS uliorekodiwa (data ya maonyesho)."
  hi: "रिकॉर्ड की गई FIRMS पहचान (डेमो डेटा)।"
  de: "Aufgezeichnete FIRMS-Detektionen (Demodaten)."
fire_step_count:
  en: "{src}: {n} active-fire detections within {km:.0f} km between {start} and {end} (satellites: {sats})."
  es: "{src}: {n} detecciones de fuego activo a menos de {km:.0f} km entre el {start} y el {end} (satélites: {sats})."
  fr: "{src} : {n} détections de feux actifs à moins de {km:.0f} km entre le {start} et le {end} (satellites : {sats})."
  sw: "{src}: ugunduzi {n} wa moto unaowaka ndani ya km {km:.0f} kati ya {start} na {end} (setilaiti: {sats})."
  hi: "{src}: {start} से {end} के बीच {km:.0f} किमी के भीतर {n} सक्रिय आग की पहचान (उपग्रह: {sats})।"
  de: "{src}: {n} Feuerdetektionen im Umkreis von {km:.0f} km zwischen {start} und {end} (Satelliten: {sats})."
fire_step_nearest:
  en: "{n} within {km:.0f} km of the field; nearest {d:.1f} km {dir} on {date} {time} UTC (fire radiative power {frp:.1f} MW, {conf} confidence)."
  es: "{n} a menos de {km:.0f} km del campo; el más cercano a {d:.1f} km al {dir} el {date} a las {time} UTC (potencia radiativa {frp:.1f} MW, confianza {conf})."
  fr: "{n} à moins de {km:.0f} km de la parcelle ; le plus proche à {d:.1f} km au {dir} le {date} à {time} UTC (puissance radiative {frp:.1f} MW, confiance {conf})."
  sw: "{n} ndani ya km {km:.0f} kutoka shamba; ulio karibu zaidi km {d:.1f} {dir} tarehe {date} saa {time} UTC (nguvu ya mionzi ya moto MW {frp:.1f}, uhakika {conf})."
  hi: "खेत से {km:.0f} किमी के भीतर {n}; सबसे पास {d:.1f} किमी {dir} में, {date} {time} UTC (आग की विकिरण शक्ति {frp:.1f} MW, भरोसा {conf})।"
  de: "{n} im Umkreis von {km:.0f} km um das Feld; das nächste {d:.1f} km {dir} am {date} um {time} UTC (Feuerstrahlungsleistung {frp:.1f} MW, Konfidenz {conf})."
fire_conf_low: {en: "low", es: "baja", fr: "faible", sw: "ndogo", hi: "कम", de: "gering"}
fire_conf_nominal: {en: "nominal", es: "normal", fr: "normale", sw: "ya kawaida", hi: "सामान्य", de: "normal"}
fire_conf_high: {en: "high", es: "alta", fr: "élevée", sw: "kubwa", hi: "उच्च", de: "hoch"}
fire_step_frp:
  en: "Total fire radiative power within {km:.0f} km: {mw:.0f} MW — many fires upwind mean smoke and poor air (PM2.5)."
  es: "Potencia radiativa total a menos de {km:.0f} km: {mw:.0f} MW; muchos fuegos a barlovento significan humo y mala calidad del aire (PM2,5)."
  fr: "Puissance radiative totale à moins de {km:.0f} km : {mw:.0f} MW — beaucoup de feux au vent signifient fumée et air pollué (PM2,5)."
  sw: "Jumla ya nguvu ya mionzi ya moto ndani ya km {km:.0f}: MW {mw:.0f} — moto mingi upande wa upepo humaanisha moshi na hewa chafu (PM2.5)."
  hi: "{km:.0f} किमी के भीतर कुल आग विकिरण शक्ति: {mw:.0f} MW — हवा की दिशा में कई आग का मतलब धुआँ और खराब हवा (PM2.5)।"
  de: "Gesamte Feuerstrahlungsleistung im Umkreis von {km:.0f} km: {mw:.0f} MW – viele Feuer im Luv bedeuten Rauch und schlechte Luft (PM2,5)."
fire_step_fuel:
  en: "Risk to the field rises with dry fuel (stubble, dry grass, hay) and wind towards the field."
  es: "El riesgo para el campo aumenta con combustible seco (rastrojo, pasto seco, heno) y viento hacia el campo."
  fr: "Le risque pour la parcelle augmente avec le combustible sec (chaume, herbe sèche, foin) et le vent vers la parcelle."
  sw: "Hatari kwa shamba huongezeka kukiwa na nishati kavu (makapi, nyasi kavu, nyasi za mifugo) na upepo kuelekea shambani."
  hi: "सूखा ईंधन (ठूँठ, सूखी घास, भूसा) और खेत की ओर हवा होने पर खतरा बढ़ता है।"
  de: "Das Risiko für das Feld steigt mit trockenem Brennmaterial (Stoppeln, trockenes Gras, Heu) und Wind zum Feld hin."
fire_sum:
  en: "NASA satellites detected {n} active fires within {km:.0f} km in the last 48 hours; the nearest is {d:.1f} km away."
  es: "Los satélites de la NASA detectaron {n} fuegos activos a menos de {km:.0f} km en las últimas 48 horas; el más cercano está a {d:.1f} km."
  fr: "Les satellites de la NASA ont détecté {n} feux actifs à moins de {km:.0f} km ces 48 dernières heures ; le plus proche est à {d:.1f} km."
  sw: "Setilaiti za NASA ziligundua moto {n} unaowaka ndani ya km {km:.0f} katika saa 48 zilizopita; ulio karibu zaidi uko km {d:.1f}."
  hi: "NASA उपग्रहों ने पिछले 48 घंटों में {km:.0f} किमी के भीतर {n} सक्रिय आग देखीं; सबसे पास वाली {d:.1f} किमी दूर है।"
  de: "NASA-Satelliten haben in den letzten 48 Stunden {n} aktive Feuer im Umkreis von {km:.0f} km erfasst; das nächste ist {d:.1f} km entfernt."
model_fire:
  en: "Distance to NASA FIRMS active-fire detections (VIIRS 375 m / MODIS 1 km, Schroeder et al. 2014; Giglio et al. 2016)"
  es: "Distancia a las detecciones de fuego activo de NASA FIRMS (VIIRS 375 m / MODIS 1 km, Schroeder et al. 2014; Giglio et al. 2016)"
  fr: "Distance aux détections de feux actifs NASA FIRMS (VIIRS 375 m / MODIS 1 km, Schroeder et al. 2014 ; Giglio et al. 2016)"
  sw: "Umbali hadi ugunduzi wa moto wa NASA FIRMS (VIIRS m 375 / MODIS km 1, Schroeder et al. 2014; Giglio et al. 2016)"
  hi: "NASA FIRMS सक्रिय-आग पहचान से दूरी (VIIRS 375 मी / MODIS 1 किमी, Schroeder et al. 2014; Giglio et al. 2016)"
  de: "Abstand zu NASA-FIRMS-Feuerdetektionen (VIIRS 375 m / MODIS 1 km, Schroeder et al. 2014; Giglio et al. 2016)"
fire_note:
  en: "Satellite detections are reliable for flaming fires; they say nothing about wind direction at your field."
  es: "Las detecciones satelitales son fiables para fuegos con llama; no dicen nada sobre la dirección del viento en su campo."
  fr: "Les détections satellite sont fiables pour les feux flambants ; elles ne disent rien de la direction du vent sur votre parcelle."
  sw: "Ugunduzi wa setilaiti unaaminika kwa moto wenye miali; hauelezi chochote kuhusu mwelekeo wa upepo shambani kwako."
  hi: "उपग्रह पहचान लपटों वाली आग के लिए भरोसेमंद है; यह आपके खेत पर हवा की दिशा के बारे में कुछ नहीं बताती।"
  de: "Satellitendetektionen sind für offene Flammen zuverlässig; über die Windrichtung an Ihrem Feld sagen sie nichts."
residue_region_nw_indo_gangetic: {en: "North-west Indo-Gangetic Plain (Punjab, Haryana, W. Uttar Pradesh; Pakistani Punjab)", es: "Noroeste de la llanura indogangética (Punyab, Haryana, oeste de Uttar Pradesh; Punyab pakistaní)", fr: "Nord-ouest de la plaine indo-gangétique (Pendjab, Haryana, ouest de l'Uttar Pradesh ; Pendjab pakistanais)", sw: "Kaskazini-magharibi mwa Uwanda wa Indo-Gangetic (Punjab, Haryana, magharibi mwa Uttar Pradesh; Punjab ya Pakistani)", hi: "उत्तर-पश्चिमी सिंधु-गंगा मैदान (पंजाब, हरियाणा, पश्चिमी उत्तर प्रदेश; पाकिस्तानी पंजाब)", de: "Nordwestliche Indus-Ganges-Ebene (Punjab, Haryana, westliches Uttar Pradesh; pakistanischer Punjab)"}
residue_region_east_indo_gangetic: {en: "Eastern Indo-Gangetic Plain and Bangladesh", es: "Este de la llanura indogangética y Bangladés", fr: "Est de la plaine indo-gangétique et Bangladesh", sw: "Mashariki mwa Uwanda wa Indo-Gangetic na Bangladesh", hi: "पूर्वी सिंधु-गंगा मैदान और बांग्लादेश", de: "Östliche Indus-Ganges-Ebene und Bangladesch"}
residue_region_mainland_southeast_asia: {en: "Mainland South-East Asia (Myanmar, Thailand, Laos, Cambodia, Vietnam)", es: "Sudeste Asiático continental (Myanmar, Tailandia, Laos, Camboya, Vietnam)", fr: "Asie du Sud-Est continentale (Myanmar, Thaïlande, Laos, Cambodge, Viêt Nam)", sw: "Kusini-Mashariki mwa Asia bara (Myanmar, Thailand, Laos, Kambodia, Vietnam)", hi: "मुख्यभूमि दक्षिण-पूर्व एशिया (म्यांमार, थाईलैंड, लाओस, कंबोडिया, वियतनाम)", de: "Festländisches Südostasien (Myanmar, Thailand, Laos, Kambodscha, Vietnam)"}
residue_region_north_east_china: {en: "North-east China Plain", es: "Llanura del noreste de China", fr: "Plaine du Nord-Est de la Chine", sw: "Uwanda wa Kaskazini-Mashariki mwa China", hi: "पूर्वोत्तर चीन का मैदान", de: "Nordostchinesische Ebene"}
res_step_region:
  en: "Your field is in a residue-burning region: {region} (burning peaks in months {months}; {ref})."
  es: "Su campo está en una región donde se queman rastrojos: {region} (la quema alcanza su máximo en los meses {months}; {ref})."
  fr: "Votre parcelle est dans une région de brûlage des résidus : {region} (pic de brûlage aux mois {months} ; {ref})."
  sw: "Shamba lako liko katika eneo la kuchoma masalia: {region} (uchomaji hufikia kilele miezi {months}; {ref})."
  hi: "आपका खेत पराली जलाने वाले क्षेत्र में है: {region} (जलाना महीनों {months} में चरम पर; {ref})।"
  de: "Ihr Feld liegt in einer Region, in der Ernterückstände verbrannt werden: {region} (Höhepunkt in den Monaten {months}; {ref})."
res_step_amount:
  en: "Typical {crop} yield {y} t/ha × residue-to-grain ratio {rgr} → ~{res:.1f} t/ha of residue holding {c:.1f} t carbon."
  es: "Rendimiento típico de {crop} {y} t/ha × relación rastrojo/grano {rgr} → ~{res:.1f} t/ha de rastrojo con {c:.1f} t de carbono."
  fr: "Rendement typique de {crop} {y} t/ha × rapport résidus/grain {rgr} → ~{res:.1f} t/ha de résidus contenant {c:.1f} t de carbone."
  sw: "Mavuno ya kawaida ya {crop} t/ha {y} × uwiano wa masalia kwa nafaka {rgr} → ~t/ha {res:.1f} za masalia zenye t {c:.1f} za kaboni."
  hi: "{crop} की सामान्य उपज {y} t/ha × अवशेष-से-दाना अनुपात {rgr} → ~{res:.1f} t/ha अवशेष, जिसमें {c:.1f} t कार्बन।"
  de: "Typischer {crop}-Ertrag {y} t/ha × Stroh-Korn-Verhältnis {rgr} → ~{res:.1f} t/ha Rückstände mit {c:.1f} t Kohlenstoff."
res_step_loss:
  en: "Burning it loses ~{n:.0f} kg N, {p:.1f} kg P, {k:.0f} kg K and {s:.1f} kg S per ha (≈90% of N, 25% of P, 20% of K; Dobermann & Fairhurst 2002) and releases ~{co2:.1f} t CO₂/ha plus smoke (PM2.5)."
  es: "Quemarlo pierde ~{n:.0f} kg de N, {p:.1f} kg de P, {k:.0f} kg de K y {s:.1f} kg de S por ha (≈90% del N, 25% del P, 20% del K; Dobermann y Fairhurst 2002) y libera ~{co2:.1f} t CO₂/ha además de humo (PM2,5)."
  fr: "Le brûler fait perdre ~{n:.0f} kg de N, {p:.1f} kg de P, {k:.0f} kg de K et {s:.1f} kg de S par ha (≈90 % du N, 25 % du P, 20 % du K ; Dobermann et Fairhurst 2002) et libère ~{co2:.1f} t CO₂/ha plus de la fumée (PM2,5)."
  sw: "Kuyachoma hupoteza ~kg {n:.0f} N, kg {p:.1f} P, kg {k:.0f} K na kg {s:.1f} S kwa ha (≈90% ya N, 25% ya P, 20% ya K; Dobermann & Fairhurst 2002) na hutoa ~t {co2:.1f} CO₂/ha pamoja na moshi (PM2.5)."
  hi: "इसे जलाने से प्रति हेक्टेयर ~{n:.0f} किग्रा N, {p:.1f} किग्रा P, {k:.0f} किग्रा K और {s:.1f} किग्रा S नष्ट होते हैं (≈90% N, 25% P, 20% K; Dobermann & Fairhurst 2002) और ~{co2:.1f} t CO₂/हे व धुआँ (PM2.5) निकलता है।"
  de: "Beim Verbrennen gehen je ha ~{n:.0f} kg N, {p:.1f} kg P, {k:.0f} kg K und {s:.1f} kg S verloren (≈90 % des N, 25 % des P, 20 % des K; Dobermann & Fairhurst 2002), und es entstehen ~{co2:.1f} t CO₂/ha plus Rauch (PM2,5)."
res_step_soc:
  en: "Kept as mulch or incorporated, ~{soc:.2f} t C/ha is added to soil organic carbon in the first year (≈12% humification; Powlson et al. 2008), improving water infiltration and soil structure year on year."
  es: "Si se deja como mantillo o se incorpora, ~{soc:.2f} t C/ha pasan al carbono orgánico del suelo el primer año (≈12% de humificación; Powlson et al. 2008), mejorando año tras año la infiltración y la estructura del suelo."
  fr: "Laissé en paillis ou enfoui, ~{soc:.2f} t C/ha s'ajoutent au carbone organique du sol la première année (≈12 % d'humification ; Powlson et al. 2008), améliorant année après année l'infiltration et la structure du sol."
  sw: "Yakiachwa kama matandazo au kuchanganywa na udongo, ~t {soc:.2f} C/ha huongezwa kwenye kaboni ya udongo mwaka wa kwanza (≈12% hubadilika kuwa mboji; Powlson et al. 2008), na kuboresha upenyaji wa maji na muundo wa udongo mwaka hadi mwaka."
  hi: "मल्च के रूप में छोड़ने या मिट्टी में मिलाने पर पहले वर्ष ~{soc:.2f} t C/हे मिट्टी के जैविक कार्बन में जुड़ता है (≈12% ह्यूमीकरण; Powlson et al. 2008), जिससे हर साल पानी का रिसाव और मिट्टी की संरचना सुधरती है।"
  de: "Als Mulch belassen oder eingearbeitet, gehen im ersten Jahr ~{soc:.2f} t C/ha in den Humus über (≈12 % Humifizierung; Powlson et al. 2008) und verbessern Jahr für Jahr Wasseraufnahme und Bodenstruktur."
res_step_options:
  en: "Options: sow the next crop directly into the standing stubble (Happy Seeder / Super Seeder; Sidhu et al. 2015), chop and spread the straw (Super-SMS on the combine), or incorporate with a mulcher + disc 2–3 weeks before sowing. Shyamsundar et al. (2019, Science) found Happy Seeder sowing the most profitable option."
  es: "Opciones: sembrar el siguiente cultivo directamente sobre el rastrojo en pie (Happy Seeder / Super Seeder; Sidhu et al. 2015), picar y esparcir la paja (Super-SMS en la cosechadora) o incorporarla con trituradora + disco 2–3 semanas antes de sembrar. Shyamsundar et al. (2019, Science) encontraron que la siembra con Happy Seeder es la opción más rentable."
  fr: "Options : semer la culture suivante directement dans le chaume debout (Happy Seeder / Super Seeder ; Sidhu et al. 2015), broyer et étaler la paille (Super-SMS sur la moissonneuse) ou l'enfouir au broyeur + disques 2–3 semaines avant le semis. Shyamsundar et al. (2019, Science) ont montré que le semis au Happy Seeder est l'option la plus rentable."
  sw: "Njia mbadala: panda zao linalofuata moja kwa moja kwenye makapi yaliyosimama (Happy Seeder / Super Seeder; Sidhu et al. 2015), katakata na sambaza majani (Super-SMS kwenye kivunaji), au changanya na udongo kwa mashine ya kusaga + diski wiki 2–3 kabla ya kupanda. Shyamsundar et al. (2019, Science) waligundua kupanda kwa Happy Seeder ndiyo njia yenye faida zaidi."
  hi: "विकल्प: अगली फसल सीधे खड़े ठूँठ में बोएँ (हैप्पी सीडर / सुपर सीडर; Sidhu et al. 2015), पुआल काटकर फैलाएँ (कंबाइन पर सुपर-SMS), या बुवाई से 2–3 सप्ताह पहले मल्चर + डिस्क से मिट्टी में मिलाएँ। Shyamsundar et al. (2019, Science) के अनुसार हैप्पी सीडर से बुवाई सबसे लाभदायक है।"
  de: "Möglichkeiten: die Folgekultur direkt in die stehenden Stoppeln säen (Happy Seeder / Super Seeder; Sidhu et al. 2015), das Stroh häckseln und verteilen (Super-SMS am Mähdrescher) oder 2–3 Wochen vor der Saat mit Mulcher + Scheibenegge einarbeiten. Laut Shyamsundar et al. (2019, Science) ist die Saat mit dem Happy Seeder die rentabelste Option."
res_step_fires_now:
  en: "NASA FIRMS currently shows {n} fires within {km:.0f} km — burning is happening around you now."
  es: "NASA FIRMS muestra ahora {n} fuegos a menos de {km:.0f} km: se está quemando a su alrededor en este momento."
  fr: "NASA FIRMS montre actuellement {n} feux à moins de {km:.0f} km — on brûle autour de vous en ce moment."
  sw: "NASA FIRMS kwa sasa inaonyesha moto {n} ndani ya km {km:.0f} — uchomaji unaendelea karibu nawe sasa."
  hi: "NASA FIRMS अभी {km:.0f} किमी के भीतर {n} आग दिखा रहा है — आपके आसपास अभी जलाया जा रहा है।"
  de: "NASA FIRMS zeigt derzeit {n} Feuer im Umkreis von {km:.0f} km – in Ihrer Umgebung wird gerade verbrannt."
res_sum:
  en: "Burning {crop} residue destroys nitrogen, sulphur and carbon your soil needs; mulching or incorporating keeps them."
  es: "Quemar el rastrojo de {crop} destruye nitrógeno, azufre y carbono que su suelo necesita; dejarlo como mantillo o incorporarlo los conserva."
  fr: "Brûler les résidus de {crop} détruit l'azote, le soufre et le carbone dont votre sol a besoin ; le paillage ou l'enfouissement les conserve."
  sw: "Kuchoma masalia ya {crop} huharibu naitrojeni, salfa na kaboni ambazo udongo wako unahitaji; kuyaacha kama matandazo au kuyachanganya huyahifadhi."
  hi: "{crop} के अवशेष जलाने से आपकी मिट्टी के लिए ज़रूरी नाइट्रोजन, गंधक और कार्बन नष्ट होते हैं; मल्च बनाने या मिट्टी में मिलाने से ये बचते हैं।"
  de: "Das Verbrennen von {crop}-Rückständen zerstört Stickstoff, Schwefel und Kohlenstoff, die Ihr Boden braucht; Mulchen oder Einarbeiten erhält sie."
model_residue:
  en: "Residue nutrient balance (residue-to-grain ratio × nutrient content × burning loss)"
  es: "Balance de nutrientes del rastrojo (relación rastrojo/grano × contenido de nutrientes × pérdida por quema)"
  fr: "Bilan des éléments nutritifs des résidus (rapport résidus/grain × teneur × perte au brûlage)"
  sw: "Mizania ya virutubisho vya masalia (uwiano wa masalia kwa nafaka × kiwango cha virutubisho × upotevu wa kuchoma)"
  hi: "अवशेष पोषक संतुलन (अवशेष-से-दाना अनुपात × पोषक मात्रा × जलाने से हानि)"
  de: "Nährstoffbilanz der Rückstände (Stroh-Korn-Verhältnis × Nährstoffgehalt × Verbrennungsverlust)"
res_note:
  en: "Residue amount scales with your actual yield; nutrient contents are literature averages."
  es: "La cantidad de rastrojo depende de su rendimiento real; los contenidos de nutrientes son promedios de la literatura."
  fr: "La quantité de résidus suit votre rendement réel ; les teneurs en nutriments sont des moyennes publiées."
  sw: "Kiasi cha masalia hutegemea mavuno yako halisi; viwango vya virutubisho ni wastani wa machapisho."
  hi: "अवशेष की मात्रा आपकी वास्तविक उपज पर निर्भर है; पोषक मात्राएँ शोध-औसत हैं।"
  de: "Die Rückstandsmenge hängt von Ihrem tatsächlichen Ertrag ab; Nährstoffgehalte sind Literaturmittel."
res_caveat_yield:
  en: "Uses a typical yield for the crop; enter your own yield for a sharper estimate."
  es: "Usa un rendimiento típico del cultivo; indique su propio rendimiento para una estimación más precisa."
  fr: "Utilise un rendement typique de la culture ; saisissez votre propre rendement pour une estimation plus fine."
  sw: "Inatumia mavuno ya kawaida ya zao; weka mavuno yako mwenyewe kupata makadirio sahihi zaidi."
  hi: "फसल की सामान्य उपज मानी गई है; अधिक सटीक अनुमान के लिए अपनी उपज डालें।"
  de: "Nutzt einen typischen Ertrag der Kultur; mit Ihrem eigenen Ertrag wird die Schätzung genauer."
res_caveat_bans:
  en: "Burning bans and machinery subsidies (e.g. CRM scheme in India) differ by state."
  es: "Las prohibiciones de quema y los subsidios a maquinaria (p. ej. el programa CRM en India) varían según el estado."
  fr: "Interdictions de brûlage et aides aux machines (p. ex. programme CRM en Inde) varient selon l'État."
  sw: "Marufuku ya kuchoma na ruzuku za mashine (mf. mpango wa CRM nchini India) hutofautiana kwa kila jimbo."
  hi: "जलाने पर रोक और मशीनरी सब्सिडी (जैसे भारत में CRM योजना) राज्य के अनुसार अलग हैं।"
  de: "Verbrennungsverbote und Maschinenförderung (z. B. CRM-Programm in Indien) unterscheiden sich je nach Bundesstaat."
