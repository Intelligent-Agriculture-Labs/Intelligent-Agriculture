    - Jacobsen S.-E. 2003, The worldwide potential for quinoa (Chenopodium quinoa Willd.), https://doi.org/10.1081/FRI-120018883
    - UC IPM. Sugarbeet — Sugarbeet cyst nematode (Heterodera schachtii). University of California Agriculture and Natural Resources. https://ipm.ucanr.edu/agriculture/sugarbeet/sugarbeet-cyst-nematode/
  hemp:
