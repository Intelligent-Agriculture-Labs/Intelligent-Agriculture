# Server-generated card texts. {placeholders} are filled with computed numbers.
# Languages: en, es, fr, sw, hi, de. Missing keys fall back to English.
irrigate_title:
  en: "Irrigate {mm} mm by {day}"
  es: "Riegue {mm} mm antes del {day}"
  fr: "Irriguez {mm} mm d'ici {day}"
  sw: "Mwagilia mm {mm} kabla ya {day}"
  hi: "{day} तक {mm} मिमी सिंचाई करें"
  de: "Bis {day} {mm} mm bewässern"
irrigate_detail:
  en: "The root zone will pass the stress point (RAW) around {day}. Forecast rain ({rain} mm) is not enough."
  es: "La zona de raíces alcanzará el punto de estrés hacia el {day}. La lluvia prevista ({rain} mm) no basta."
  fr: "La zone racinaire atteindra le seuil de stress vers le {day}. La pluie prévue ({rain} mm) ne suffit pas."
  sw: "Udongo wa mizizi utafikia kiwango cha msongo karibu {day}. Mvua inayotarajiwa ({rain} mm) haitoshi."
  hi: "लगभग {day} तक जड़ क्षेत्र तनाव बिंदु पर पहुंच जाएगा। अनुमानित वर्षा ({rain} मिमी) पर्याप्त नहीं है।"
  de: "Der Wurzelraum erreicht um den {day} die Stressgrenze. Der vorhergesagte Regen ({rain} mm) reicht nicht."
no_irrigation_title:
  en: "No irrigation needed for {days} days"
  es: "No hace falta regar en {days} días"
  fr: "Pas d'irrigation nécessaire pendant {days} jours"
  sw: "Hakuna haja ya kumwagilia kwa siku {days}"
  hi: "{days} दिनों तक सिंचाई की आवश्यकता नहीं"
  de: "{days} Tage keine Bewässerung nötig"
no_irrigation_detail:
  en: "Soil water stays above the stress point ({pct}% of available water left today)."
  es: "El agua del suelo se mantiene sobre el punto de estrés (queda {pct}% del agua disponible)."
  fr: "L'eau du sol reste au-dessus du seuil de stress ({pct}% de l'eau disponible aujourd'hui)."
  sw: "Maji ya udongo yako juu ya kiwango cha msongo ({pct}% ya maji yanayopatikana leo)."
  hi: "मिट्टी का पानी तनाव बिंदु से ऊपर है (आज {pct}% उपलब्ध पानी शेष)।"
  de: "Das Bodenwasser bleibt über der Stressgrenze (heute {pct}% des verfügbaren Wassers)."
rainfed_stress_title:
  en: "Crop water stress likely from {day}"
  es: "Estrés hídrico probable desde el {day}"
  fr: "Stress hydrique probable à partir du {day}"
  sw: "Msongo wa maji unatarajiwa kuanzia {day}"
  hi: "{day} से फसल में जल तनाव की संभावना"
  de: "Wasserstress ab {day} wahrscheinlich"
rainfed_stress_detail:
  en: "No irrigation is set for this field. Consider mulching, weeding and delaying top-dressing until rain."
  es: "Campo sin riego. Considere acolchado, deshierbe y retrasar el abonado hasta que llueva."
  fr: "Champ sans irrigation. Pensez au paillage, au désherbage et à retarder l'apport d'engrais jusqu'à la pluie."
  sw: "Shamba hili halimwagiliwi. Fikiria matandazo, palizi na kuchelewesha mbolea hadi mvua inyeshe."
  hi: "इस खेत में सिंचाई नहीं है। मल्चिंग, निराई करें और बारिश तक उर्वरक टॉप-ड्रेसिंग टालें।"
  de: "Keine Bewässerung eingestellt. Mulchen, Unkraut entfernen und Kopfdüngung bis zum Regen verschieben."
drought_title:
  en: "{label} at your field"
  es: "{label} en su campo"
  fr: "{label} sur votre parcelle"
  sw: "{label} shambani kwako"
  hi: "आपके खेत में {label}"
  de: "{label} auf Ihrem Feld"
drought_detail:
  en: "Rain over the last 90 days is in the driest {pct}% of years since 1984. Plan water use carefully."
  es: "La lluvia de los últimos 90 días está entre el {pct}% de años más secos desde 1984. Planifique el agua."
  fr: "La pluie des 90 derniers jours figure parmi les {pct}% d'années les plus sèches depuis 1984."
  sw: "Mvua ya siku 90 zilizopita iko kati ya {pct}% ya miaka kavu zaidi tangu 1984. Panga matumizi ya maji."
  hi: "पिछले 90 दिनों की वर्षा 1984 के बाद के सबसे सूखे {pct}% वर्षों में है। पानी का सावधानी से उपयोग करें।"
  de: "Der Regen der letzten 90 Tage gehört zu den trockensten {pct}% der Jahre seit 1984."
disease_title:
  en: "{risk} {disease} risk from {day}"
  es: "Riesgo {risk} de {disease} desde el {day}"
  fr: "Risque {risk} de {disease} dès le {day}"
  sw: "Hatari {risk} ya {disease} kuanzia {day}"
  hi: "{day} से {disease} का {risk} जोखिम"
  de: "{risk}s {disease}-Risiko ab {day}"
disease_detail:
  en: "Warm, humid hours favour infection. Inspect leaves; consider preventive treatment if you find symptoms."
  es: "Horas cálidas y húmedas favorecen la infección. Revise las hojas; considere tratamiento preventivo."
  fr: "Des heures chaudes et humides favorisent l'infection. Inspectez les feuilles ; envisagez un traitement préventif."
  sw: "Saa za joto na unyevu huchochea maambukizi. Kagua majani; fikiria kinga ukiona dalili."
  hi: "गर्म, नम घंटे संक्रमण को बढ़ाते हैं। पत्तियों की जांच करें; लक्षण दिखें तो निवारक उपचार पर विचार करें।"
  de: "Warme, feuchte Stunden begünstigen Infektionen. Blätter kontrollieren; bei Symptomen vorbeugend behandeln."
pest_title:
  en: "{pest}: {event} in ~{days} days"
  es: "{pest}: {event} en ~{days} días"
  fr: "{pest} : {event} dans ~{days} jours"
  sw: "{pest}: {event} baada ya siku ~{days}"
  hi: "{pest}: ~{days} दिनों में {event}"
  de: "{pest}: {event} in ~{days} Tagen"
pest_now_title:
  en: "{pest}: {event} now"
  es: "{pest}: {event} ahora"
  fr: "{pest} : {event} maintenant"
  sw: "{pest}: {event} sasa"
  hi: "{pest}: अभी {event}"
  de: "{pest}: jetzt {event}"
frost_title:
  en: "Frost risk {day}: {t} °C"
  es: "Riesgo de helada el {day}: {t} °C"
  fr: "Risque de gel le {day} : {t} °C"
  sw: "Hatari ya baridi kali {day}: {t} °C"
  hi: "{day} को पाले का जोखिम: {t} °C"
  de: "Frostgefahr am {day}: {t} °C"
frost_detail:
  en: "Forecast minimum is near the damage threshold of {crop} ({kill} °C). Protect seedlings or delay sowing."
  es: "La mínima prevista está cerca del umbral de daño de {crop} ({kill} °C)."
  fr: "La minimale prévue est proche du seuil de dégâts de {crop} ({kill} °C)."
  sw: "Joto la chini linalotarajiwa liko karibu na kiwango cha madhara kwa {crop} ({kill} °C)."
  hi: "अनुमानित न्यूनतम तापमान {crop} की क्षति सीमा ({kill} °C) के पास है।"
  de: "Die vorhergesagte Tiefsttemperatur liegt nahe der Schadschwelle von {crop} ({kill} °C)."
heat_title:
  en: "Heat stress {day}: {t} °C"
  es: "Estrés por calor el {day}: {t} °C"
  fr: "Stress thermique le {day} : {t} °C"
  sw: "Msongo wa joto {day}: {t} °C"
  hi: "{day} को गर्मी का तनाव: {t} °C"
  de: "Hitzestress am {day}: {t} °C"
heat_detail:
  en: "Above {crop}'s heat threshold ({thr} °C). Irrigate before the hot days; avoid spraying in the heat."
  es: "Supera el umbral de calor de {crop} ({thr} °C). Riegue antes; evite aplicar productos con calor."
  fr: "Au-dessus du seuil de chaleur de {crop} ({thr} °C). Irriguez avant ; évitez de traiter par forte chaleur."
  sw: "Juu ya kiwango cha joto cha {crop} ({thr} °C). Mwagilia kabla ya siku za joto."
  hi: "{crop} की ताप सीमा ({thr} °C) से ऊपर। गर्म दिनों से पहले सिंचाई करें।"
  de: "Über der Hitzeschwelle von {crop} ({thr} °C). Vorher bewässern; nicht bei Hitze spritzen."
ndvi_title:
  en: "Scout your field: vegetation {pct}% below normal"
  es: "Revise el campo: vegetación {pct}% bajo lo normal"
  fr: "Inspectez la parcelle : végétation {pct}% sous la normale"
  sw: "Kagua shamba: mimea {pct}% chini ya kawaida"
  hi: "खेत की जांच करें: वनस्पति सामान्य से {pct}% कम"
  de: "Feld kontrollieren: Vegetation {pct}% unter normal"
ndvi_detail:
  en: "MODIS NDVI ({date}) is unusually low for this time of year. Check for water stress, pests or damage."
  es: "El NDVI de MODIS ({date}) es inusualmente bajo para esta época. Busque estrés, plagas o daños."
  fr: "Le NDVI MODIS ({date}) est anormalement bas pour la saison. Cherchez stress, ravageurs ou dégâts."
  sw: "NDVI ya MODIS ({date}) iko chini isivyo kawaida. Angalia msongo wa maji, wadudu au uharibifu."
  hi: "MODIS NDVI ({date}) इस मौसम के लिए असामान्य रूप से कम है। जल तनाव, कीट या क्षति की जांच करें।"
  de: "MODIS-NDVI ({date}) ist für die Jahreszeit ungewöhnlich niedrig. Auf Wasserstress, Schädlinge prüfen."
planting_title:
  en: "Best sowing window: {start} – {end}"
  es: "Mejor ventana de siembra: {start} – {end}"
  fr: "Meilleure fenêtre de semis : {start} – {end}"
  sw: "Kipindi bora cha kupanda: {start} – {end}"
  hi: "बुवाई का सबसे अच्छा समय: {start} – {end}"
  de: "Bestes Saatfenster: {start} – {end}"
planting_detail:
  en: "Simulated over {n} past seasons, this window gave the best yield-to-risk balance ({y} t/ha median)."
  es: "Simulado en {n} temporadas pasadas, esta ventana dio el mejor equilibrio rendimiento/riesgo ({y} t/ha)."
  fr: "Simulée sur {n} saisons, cette fenêtre offre le meilleur compromis rendement/risque ({y} t/ha)."
  sw: "Kwa misimu {n} iliyopita, kipindi hiki kilitoa mavuno bora kwa hatari ndogo ({y} t/ha)."
  hi: "{n} पिछले मौसमों के सिमुलेशन में इस अवधि ने सबसे अच्छा उपज-जोखिम संतुलन दिया ({y} t/ha)।"
  de: "Über {n} vergangene Saisons simuliert: bestes Ertrags-Risiko-Verhältnis ({y} t/ha Median)."
risk_words:
  low: {en: Low, es: bajo, fr: faible, sw: ndogo, hi: कम, de: Gering}
  moderate: {en: Moderate, es: moderado, fr: modéré, sw: wastani, hi: मध्यम, de: Mittler}
  high: {en: High, es: alto, fr: élevé, sw: kubwa, hi: उच्च, de: Hoh}
  severe: {en: Severe, es: severo, fr: sévère, sw: kubwa sana, hi: गंभीर, de: Sehr hoh}
