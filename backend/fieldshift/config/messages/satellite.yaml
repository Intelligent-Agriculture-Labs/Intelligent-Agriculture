sat_src_latency: {en: "~1 day", es: "~1 día", fr: "~1 jour", sw: "~siku 1", hi: "~1 दिन", de: "~1 Tag"}
sat_caveat_clouds:
  en: "Clouds and shadows are masked with the Sentinel-2 scene classification; scenes with < 60 % clear field pixels are skipped."
  es: "Las nubes y sombras se enmascaran con la clasificación de escena de Sentinel-2; se omiten las escenas con < 60 % de píxeles despejados del campo."
  fr: "Nuages et ombres sont masqués avec la classification de scène Sentinel-2 ; les scènes avec < 60 % de pixels dégagés sur la parcelle sont ignorées."
  sw: "Mawingu na vivuli vinafichwa kwa uainishaji wa picha wa Sentinel-2; picha zenye < 60 % ya pikseli safi za shamba zinarukwa."
  hi: "बादल और छाया Sentinel-2 दृश्य वर्गीकरण से हटाए जाते हैं; जिन दृश्यों में खेत के < 60 % पिक्सेल साफ़ हों उन्हें छोड़ दिया जाता है।"
  de: "Wolken und Schatten werden mit der Sentinel-2-Szenenklassifikation maskiert; Aufnahmen mit < 60 % klaren Feldpixeln werden übersprungen."
sat_caveat_ndvi:
  en: "NDVI shows canopy greenness, not yield; differences between zones need to be checked on the ground."
  es: "El NDVI muestra el verdor del follaje, no el rendimiento; las diferencias entre zonas deben comprobarse en terreno."
  fr: "Le NDVI montre la verdure du couvert, pas le rendement ; les différences entre zones doivent être vérifiées sur le terrain."
  sw: "NDVI huonyesha ukijani wa majani, si mavuno; tofauti kati ya kanda zinahitaji kuthibitishwa shambani."
  hi: "NDVI छत्र की हरियाली दिखाता है, उपज नहीं; क्षेत्रों के अंतर खेत में जाकर जाँचें।"
  de: "NDVI zeigt das Grün des Bestands, nicht den Ertrag; Unterschiede zwischen Zonen müssen vor Ort geprüft werden."
sat_caveat_zones:
  en: "Management zones are statistical (unsupervised); their causes (soil, water, pests) need local diagnosis."
  es: "Las zonas de manejo son estadísticas (no supervisadas); sus causas (suelo, agua, plagas) requieren un diagnóstico local."
  fr: "Les zones de gestion sont statistiques (non supervisées) ; leurs causes (sol, eau, ravageurs) demandent un diagnostic local."
  sw: "Kanda za usimamizi ni za kitakwimu (bila usimamizi); sababu zake (udongo, maji, wadudu) zinahitaji uchunguzi wa eneo."
  hi: "प्रबंधन क्षेत्र सांख्यिकीय (बिना निगरानी) हैं; उनके कारण (मिट्टी, पानी, कीट) स्थानीय जाँच से पता करें।"
  de: "Bewirtschaftungszonen sind statistisch (unüberwacht); ihre Ursachen (Boden, Wasser, Schädlinge) brauchen eine Diagnose vor Ort."
