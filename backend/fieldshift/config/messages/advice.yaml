dr_step_rain90:
  en: "Rain in the last 90 days: {rain:.0f} mm; typical for this time of year: {typ:.0f} mm (NASA POWER 1984–{year})."
  es: "Lluvia de los últimos 90 días: {rain:.0f} mm; lo típico en esta época: {typ:.0f} mm (NASA POWER 1984–{year})."
  fr: "Pluie des 90 derniers jours : {rain:.0f} mm ; normale à cette période : {typ:.0f} mm (NASA POWER 1984–{year})."
  sw: "Mvua ya siku 90 zilizopita: mm {rain:.0f}; kawaida kwa wakati huu wa mwaka: mm {typ:.0f} (NASA POWER 1984–{year})."
  hi: "पिछले 90 दिनों की वर्षा: {rain:.0f} मिमी; साल के इस समय सामान्य: {typ:.0f} मिमी (NASA POWER 1984–{year})।"
  de: "Regen der letzten 90 Tage: {rain:.0f} mm; üblich zu dieser Jahreszeit: {typ:.0f} mm (NASA POWER 1984–{year})."
