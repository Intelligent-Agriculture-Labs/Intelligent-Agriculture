  de: "Kulturkoeffizient (Bestandesentwicklung)"
series_depletion_short:
  en: "Root-zone depletion"
  es: "Agotamiento de la zona de raíces"
  fr: "Épuisement de la zone racinaire"
  sw: "Upungufu wa maji eneo la mizizi"
  hi: "जड़ क्षेत्र में पानी की कमी"
  de: "Entleerung des Wurzelraums"
strategy_rainfed: {en: "rain-fed", es: "secano", fr: "pluvial", sw: "kutegemea mvua", hi: "वर्षा-आधारित", de: "Regenfeldbau"}
strategy_full: {en: "full", es: "riego completo", fr: "complète", sw: "kamili", hi: "पूर्ण", de: "volle"}
strategy_deficit_75: {en: "deficit 75 %", es: "deficitario 75 %", fr: "déficitaire 75 %", sw: "pungufu 75 %", hi: "घाटा 75 %", de: "Defizit 75 %"}
strategy_deficit_50: {en: "deficit 50 %", es: "deficitario 50 %", fr: "déficitaire 50 %", sw: "pungufu 50 %", hi: "घाटा 50 %", de: "Defizit 50 %"}
strategy_allocation: {en: "water-allocation", es: "por cupo de agua", fr: "sous quota d'eau", sw: "kwa mgao wa maji", hi: "जल-आवंटन", de: "Wasserkontingent-"}
sim_step_years:
  en: "Simulated {n} seasons ({y0}–{y1}) of real NASA POWER weather at this location."
  es: "Se simularon {n} temporadas ({y0}–{y1}) con clima real NASA POWER en este lugar."
  fr: "{n} saisons simulées ({y0}–{y1}) avec la météo réelle NASA POWER à cet endroit."
  sw: "Misimu {n} ({y0}–{y1}) ya hali halisi ya hewa ya NASA POWER mahali hapa iliigwa."
  hi: "इस स्थान पर वास्तविक NASA POWER मौसम के {n} मौसमों ({y0}–{y1}) का अनुकरण किया गया।"
  de: "{n} Saisons ({y0}–{y1}) mit echtem NASA-POWER-Wetter an diesem Ort simuliert."
sim_step_scenario:
  en: "Scenario: {strategy} irrigation, {dt:+.1f} °C, rain × {rf:.2f}."
  es: "Escenario: riego {strategy}, {dt:+.1f} °C, lluvia × {rf:.2f}."
  fr: "Scénario : irrigation {strategy}, {dt:+.1f} °C, pluie × {rf:.2f}."
  sw: "Hali: umwagiliaji {strategy}, {dt:+.1f} °C, mvua × {rf:.2f}."
  hi: "परिदृश्य: {strategy} सिंचाई, {dt:+.1f} °C, वर्षा × {rf:.2f}।"
  de: "Szenario: {strategy} Bewässerung, {dt:+.1f} °C, Regen × {rf:.2f}."
sim_step_yield:
  en: "Median yield {y} t/ha vs. {base} t/ha with full irrigation and today's climate."
  es: "Rendimiento mediano {y} t/ha frente a {base} t/ha con riego completo y el clima actual."
  fr: "Rendement médian {y} t/ha contre {base} t/ha avec irrigation complète et le climat actuel."
  sw: "Mavuno ya wastani wa kati t/ha {y} dhidi ya t/ha {base} kwa umwagiliaji kamili na hali ya hewa ya sasa."
  hi: "माध्यिका उपज {y} t/ha, जबकि पूर्ण सिंचाई और आज की जलवायु में {base} t/ha।"
  de: "Medianer Ertrag {y} t/ha gegenüber {base} t/ha bei voller Bewässerung und heutigem Klima."
sim_step_irrigation:
  en: "Median irrigation {v} mm vs. {base} mm."
  es: "Riego mediano {v} mm frente a {base} mm."
  fr: "Irrigation médiane {v} mm contre {base} mm."
  sw: "Umwagiliaji wa wastani wa kati mm {v} dhidi ya mm {base}."
  hi: "माध्यिका सिंचाई {v} मिमी, तुलना में {base} मिमी।"
  de: "Mediane Bewässerung {v} mm gegenüber {base} mm."
sim_step_warmer:
  en: "Warmer scenarios shorten the season (thermal time) and raise water demand (ET₀ +3 %/°C)."
  es: "Los escenarios más cálidos acortan la temporada (tiempo térmico) y aumentan la demanda de agua (ET₀ +3 %/°C)."
  fr: "Les scénarios plus chauds raccourcissent la saison (temps thermique) et augmentent les besoins en eau (ET₀ +3 %/°C)."
  sw: "Hali za joto zaidi hufupisha msimu (muda wa joto) na kuongeza mahitaji ya maji (ET₀ +3 %/°C)."
  hi: "गर्म परिदृश्य मौसम को छोटा करते हैं (ताप-समय) और पानी की माँग बढ़ाते हैं (ET₀ +3 %/°C)।"
  de: "Wärmere Szenarien verkürzen die Saison (Wärmesumme) und erhöhen den Wasserbedarf (ET₀ +3 %/°C)."
sim_sum:
  en: "What-if results from the FieldShift season model (FAO-56 water balance + FAO-33 yield response)."
  es: "Resultados de escenarios del modelo de temporada FieldShift (balance hídrico FAO-56 + respuesta del rendimiento FAO-33)."
  fr: "Résultats de scénarios du modèle de saison FieldShift (bilan hydrique FAO-56 + réponse du rendement FAO-33)."
  sw: "Matokeo ya 'itakuwaje kama' kutoka modeli ya msimu ya FieldShift (mizania ya maji FAO-56 + mwitikio wa mavuno FAO-33)."
  hi: "FieldShift मौसम मॉडल से 'क्या होगा अगर' परिणाम (FAO-56 जल संतुलन + FAO-33 उपज प्रतिक्रिया)।"
  de: "Was-wäre-wenn-Ergebnisse des FieldShift-Saisonmodells (FAO-56-Wasserbilanz + FAO-33-Ertragsreaktion)."
model_season:
  en: "FAO-56 water balance + FAO-33 yield response + thermal-time phenology"
  es: "Balance hídrico FAO-56 + respuesta del rendimiento FAO-33 + fenología por tiempo térmico"
  fr: "Bilan hydrique FAO-56 + réponse du rendement FAO-33 + phénologie en temps thermique"
  sw: "Mizania ya maji FAO-56 + mwitikio wa mavuno FAO-33 + fenolojia ya muda wa joto"
  hi: "FAO-56 जल संतुलन + FAO-33 उपज प्रतिक्रिया + ताप-समय फ़ीनोलॉजी"
  de: "FAO-56-Wasserbilanz + FAO-33-Ertragsreaktion + Wärmesummen-Phänologie"
sim_note:
  en: "Relative differences between scenarios are more reliable than absolute yields."
  es: "Las diferencias relativas entre escenarios son más fiables que los rendimientos absolutos."
  fr: "Les écarts relatifs entre scénarios sont plus fiables que les rendements absolus."
  sw: "Tofauti kati ya hali mbalimbali zinaaminika zaidi kuliko mavuno kamili."
  hi: "परिदृश्यों के बीच सापेक्ष अंतर निरपेक्ष उपज से अधिक भरोसेमंद हैं।"
  de: "Relative Unterschiede zwischen Szenarien sind verlässlicher als absolute Erträge."
sim_caveat_yieldgap:
  en: "Yields are water-limited potentials for good management (scaled to typical yields). Low-input farms often reach far less (the 'yield gap'); compare scenarios, not absolute numbers."
  es: "Los rendimientos son potenciales limitados por agua con buen manejo (escalados a rendimientos típicos). Las fincas con pocos insumos suelen obtener mucho menos (la 'brecha de rendimiento'); compare escenarios, no cifras absolutas."
  fr: "Les rendements sont des potentiels limités par l'eau avec une bonne conduite (ajustés aux rendements typiques). Les exploitations à faibles intrants obtiennent souvent bien moins (« écart de rendement ») ; comparez les scénarios, pas les chiffres absolus."
  sw: "Mavuno ni uwezo unaozuiliwa na maji kwa usimamizi mzuri (yamepimwa kwa mavuno ya kawaida). Mashamba yenye pembejeo chache mara nyingi hupata kidogo zaidi ('pengo la mavuno'); linganisha hali, si namba kamili."
  hi: "उपज अच्छे प्रबंधन में जल-सीमित संभावित उपज है (सामान्य उपज के अनुसार समायोजित)। कम-लागत वाले खेत अक्सर बहुत कम पाते हैं ('उपज अंतर'); परिदृश्यों की तुलना करें, निरपेक्ष संख्याओं की नहीं।"
  de: "Erträge sind wasserbegrenzte Potenziale bei guter Bewirtschaftung (auf typische Erträge skaliert). Betriebe mit wenig Betriebsmitteln erreichen oft deutlich weniger („Ertragslücke“); vergleichen Sie Szenarien, nicht absolute Zahlen."
sim_caveat_pests:
  en: "Pests, diseases and nutrient limits are not simulated."
  es: "No se simulan plagas, enfermedades ni límites de nutrientes."
  fr: "Ravageurs, maladies et carences en nutriments ne sont pas simulés."
  sw: "Wadudu, magonjwa na upungufu wa virutubisho haviigwi."
  hi: "कीट, रोग और पोषक तत्वों की कमी का अनुकरण नहीं किया गया।"
  de: "Schädlinge, Krankheiten und Nährstoffmangel werden nicht simuliert."
