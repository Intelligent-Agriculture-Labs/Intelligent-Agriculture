  en: "{pest}: {stage} — {action}"
  es: "{pest}: {stage} — {action}"
  fr: "{pest} : {stage} — {action}"
  sw: "{pest}: {stage} — {action}"
  hi: "{pest}: {stage} — {action}"
  de: "{pest}: {stage} – {action}"
plan_op_peak_irrigation:
  en: "Peak irrigation month: ~{mm:.0f} mm"
  es: "Mes de mayor riego: ~{mm:.0f} mm"
  fr: "Mois de pointe d'irrigation : ~{mm:.0f} mm"
  sw: "Mwezi wa kilele cha umwagiliaji: ~mm {mm:.0f}"
  hi: "सबसे अधिक सिंचाई का महीना: ~{mm:.0f} मिमी"
  de: "Monat mit dem höchsten Bewässerungsbedarf: ~{mm:.0f} mm"
plan_alloc_note:
  en: "Your allocation covers ~{pct} % of the full-irrigation need ({need} mm); plan deficit irrigation, a split season, or a shorter-season crop."
  es: "Su cupo cubre ~{pct} % de la necesidad de riego completo ({need} mm); planifique riego deficitario, una temporada partida o un cultivo de ciclo más corto."
  fr: "Votre quota couvre ~{pct} % du besoin d'irrigation complète ({need} mm) ; prévoyez une irrigation déficitaire, une saison fractionnée ou une culture plus courte."
  sw: "Mgao wako unatosheleza ~{pct} % ya mahitaji ya umwagiliaji kamili (mm {need}); panga umwagiliaji pungufu, msimu uliogawanywa, au zao la msimu mfupi."
  hi: "आपका आवंटन पूर्ण सिंचाई ज़रूरत ({need} मिमी) का ~{pct} % पूरा करता है; घाटा सिंचाई, बँटा हुआ मौसम या कम अवधि की फसल की योजना बनाएँ।"
  de: "Ihr Kontingent deckt ~{pct} % des vollen Bewässerungsbedarfs ({need} mm); Defizitbewässerung, eine geteilte Saison oder eine kürzere Kultur einplanen."
plan_why:
  en: "Every number here comes from re-running the IA season model for each of the last 15 seasons of NASA POWER weather at your field: dates are medians, 'spread' is the 10–90 % range between years."
  es: "Cada número viene de volver a correr el modelo de temporada IA para cada una de las últimas 15 temporadas de clima NASA POWER en su campo: las fechas son medianas y la 'dispersión' es el rango 10–90 % entre años."
  fr: "Chaque chiffre provient du modèle de saison IA relancé pour chacune des 15 dernières saisons de météo NASA POWER sur votre parcelle : les dates sont des médianes, l'« écart » est la plage 10–90 % entre années."
  sw: "Kila namba hapa inatokana na kuendesha upya modeli ya msimu ya IA kwa kila moja ya misimu 15 iliyopita ya hali ya hewa ya NASA POWER shambani kwako: tarehe ni wastani wa kati, 'tofauti' ni kiwango cha 10–90 % kati ya miaka."
  hi: "यहाँ हर संख्या आपके खेत पर पिछले 15 मौसमों के NASA POWER मौसम के लिए IA मौसम मॉडल दोबारा चलाकर मिली है: तिथियाँ माध्यिका हैं, 'फैलाव' वर्षों के बीच 10–90 % सीमा है।"
  de: "Jede Zahl hier stammt aus dem IA-Saisonmodell, neu gerechnet für jede der letzten 15 Saisons mit NASA-POWER-Wetter an Ihrem Feld: Termine sind Mediane, „Streuung“ ist der 10–90-%-Bereich zwischen den Jahren."
