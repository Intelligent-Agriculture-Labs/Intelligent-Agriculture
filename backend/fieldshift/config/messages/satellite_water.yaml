# ---- SMAP L4
sw_smap_caveat_1:
  en: "SMAP L4 is a 9 km cell: it mixes your field with its surroundings and does not see irrigation on a single field."
  es: "SMAP L4 es una celda de 9 km: mezcla su campo con el entorno y no ve el riego de un solo campo."
  fr: "SMAP L4 est une maille de 9 km : elle mélange votre parcelle avec ses alentours et ne voit pas l'irrigation d'une seule parcelle."
  sw: "SMAP L4 ni seli ya km 9: inachanganya shamba lako na mazingira yake na haioni umwagiliaji wa shamba moja."
  hi: "SMAP L4 एक 9 किमी सेल है: यह आपके खेत को आसपास की ज़मीन के साथ मिला देता है और किसी एक खेत की सिंचाई नहीं देखता।"
  de: "SMAP L4 ist eine 9-km-Zelle: Sie mischt Ihr Feld mit seiner Umgebung und sieht keine Bewässerung auf einem einzelnen Feld."
sw_smap_caveat_2:
  en: "SMAP L4 merges the satellite's surface measurement with a land model (NASA GMAO); the root zone is modelled, not measured directly."
  es: "SMAP L4 combina la medición satelital de superficie con un modelo de suelo (NASA GMAO); la zona de raíces se modela, no se mide directamente."
  fr: "SMAP L4 fusionne la mesure de surface du satellite avec un modèle de surface (NASA GMAO) ; la zone racinaire est modélisée, pas mesurée directement."
  sw: "SMAP L4 huunganisha kipimo cha setilaiti cha juu ya udongo na modeli ya ardhi (NASA GMAO); eneo la mizizi linakadiriwa kwa modeli, halipimwi moja kwa moja."
  hi: "SMAP L4 उपग्रह के सतही माप को एक भूमि मॉडल (NASA GMAO) से मिलाता है; जड़ क्षेत्र मॉडल से निकाला जाता है, सीधे मापा नहीं जाता।"
  de: "SMAP L4 verbindet die Oberflächenmessung des Satelliten mit einem Landoberflächenmodell (NASA GMAO); der Wurzelraum ist modelliert, nicht direkt gemessen."
sw_smap_step_obs:
  en: "NASA SMAP L4 ({date}, 9 km): root-zone soil moisture "
  es: "NASA SMAP L4 ({date}, 9 km): humedad del suelo en la zona de raíces "
  fr: "NASA SMAP L4 ({date}, 9 km) : humidité du sol dans la zone racinaire "
  sw: "NASA SMAP L4 ({date}, km 9): unyevu wa udongo katika eneo la mizizi "
  hi: "NASA SMAP L4 ({date}, 9 किमी): जड़ क्षेत्र की मिट्टी की नमी "
  de: "NASA SMAP L4 ({date}, 9 km): Bodenfeuchte im Wurzelraum "
sw_smap_rz_val: {en: "{v:.3f} m³/m³", es: "{v:.3f} m³/m³", fr: "{v:.3f} m³/m³", sw: "{v:.3f} m³/m³", hi: "{v:.3f} m³/m³", de: "{v:.3f} m³/m³"}
sw_smap_sf_val: {en: ", surface {v:.3f} m³/m³", es: ", superficie {v:.3f} m³/m³", fr: ", surface {v:.3f} m³/m³", sw: ", juu ya udongo {v:.3f} m³/m³", hi: ", सतह {v:.3f} m³/m³", de: ", Oberfläche {v:.3f} m³/m³"}
sw_smap_pctl:
  en: "; wetter than {pct:.0f} % of days in SMAP's record for this place and season ({cls})."
  es: "; más húmeda que el {pct:.0f} % de los días del registro de SMAP para este lugar y época ({cls})."
  fr: "; plus humide que {pct:.0f} % des jours de l'archive SMAP pour ce lieu et cette saison ({cls})."
  sw: "; yenye unyevu zaidi kuliko {pct:.0f} % ya siku katika kumbukumbu za SMAP kwa mahali hapa na msimu huu ({cls})."
  hi: "; इस स्थान और मौसम के SMAP रिकॉर्ड के {pct:.0f} % दिनों से अधिक नम ({cls})।"
  de: "; feuchter als an {pct:.0f} % der Tage in SMAPs Aufzeichnung für diesen Ort und diese Jahreszeit ({cls})."
sw_smap_model:
  en: "IA's water balance for your crop: {pct:.0f} % of available root-zone water left."
  es: "Balance hídrico de IA para su cultivo: queda el {pct:.0f} % del agua disponible en la zona de raíces."
  fr: "Bilan hydrique IA pour votre culture : il reste {pct:.0f} % de l'eau disponible de la zone racinaire."
  sw: "Mizania ya maji ya IA kwa zao lako: imebaki {pct:.0f} % ya maji yanayopatikana katika eneo la mizizi."
  hi: "आपकी फसल के लिए IA का जल संतुलन: जड़ क्षेत्र का {pct:.0f} % उपलब्ध पानी बचा है।"
  de: "IA-Wasserbilanz für Ihre Kultur: {pct:.0f} % des verfügbaren Wassers im Wurzelraum sind noch da."
sw_smap_validation:
  en: "Check against SMAP L4 over 9 growing seasons (VALIDATION V3): the model's rain-fed root-zone water moved with SMAP's root zone with a median per-season correlation of 0.92 in Iowa, 0.66 in Córdoba and 0.64 in Machakos. SMAP is independent of the NASA POWER rain that drives the model."
  es: "Comprobación con SMAP L4 en 9 temporadas (VALIDACIÓN V3): el agua de la zona de raíces del modelo en secano siguió a la de SMAP con una correlación mediana por temporada de 0,92 en Iowa, 0,66 en Córdoba y 0,64 en Machakos. SMAP es independiente de la lluvia NASA POWER que alimenta el modelo."
  fr: "Contrôle avec SMAP L4 sur 9 saisons (VALIDATION V3) : l'eau de la zone racinaire du modèle en pluvial a suivi celle de SMAP avec une corrélation médiane par saison de 0,92 en Iowa, 0,66 à Córdoba et 0,64 à Machakos. SMAP est indépendant de la pluie NASA POWER qui alimente le modèle."
  sw: "Ukaguzi dhidi ya SMAP L4 kwa misimu 9 (UTHIBITISHO V3): maji ya eneo la mizizi ya modeli kwa kilimo cha mvua yalienda sambamba na ya SMAP kwa uhusiano wa wastani wa 0.92 Iowa, 0.66 Córdoba na 0.64 Machakos kwa kila msimu. SMAP haitegemei mvua ya NASA POWER inayoendesha modeli."
  hi: "9 मौसमों में SMAP L4 से जाँच (सत्यापन V3): वर्षा-आधारित खेती में मॉडल का जड़-क्षेत्र जल SMAP के साथ चला — प्रति मौसम माध्यिका सहसंबंध आयोवा में 0.92, कॉर्डोबा में 0.66 और मचाकोस में 0.64। SMAP मॉडल को चलाने वाली NASA POWER वर्षा से स्वतंत्र है।"
  de: "Abgleich mit SMAP L4 über 9 Anbauperioden (VALIDIERUNG V3): Das Wurzelraumwasser des Modells (Regenfeldbau) lief mit dem von SMAP mit einer medianen Korrelation je Saison von 0,92 in Iowa, 0,66 in Córdoba und 0,64 in Machakos. SMAP ist unabhängig vom NASA-POWER-Regen, der das Modell antreibt."
sw_smap_step_drier:
  en: "The satellite sees drier soil than the model: rain may have missed your area (the model's rain is a ~50 km grid average) or the soil holds less water than assumed. Check the soil by hand before relying on the model."
  es: "El satélite ve el suelo más seco que el modelo: puede que la lluvia no haya caído en su zona (la lluvia del modelo es un promedio de una cuadrícula de ~50 km) o que el suelo retenga menos agua de lo supuesto. Revise el suelo a mano antes de fiarse del modelo."
  fr: "Le satellite voit un sol plus sec que le modèle : la pluie a pu manquer votre secteur (la pluie du modèle est une moyenne sur une maille de ~50 km) ou le sol retient moins d'eau que prévu. Vérifiez le sol à la main avant de vous fier au modèle."
  sw: "Setilaiti inaona udongo mkavu kuliko modeli: huenda mvua haikunyesha eneo lako (mvua ya modeli ni wastani wa gridi ya ~km 50) au udongo unashika maji kidogo kuliko ilivyodhaniwa. Kagua udongo kwa mkono kabla ya kutegemea modeli."
  hi: "उपग्रह मिट्टी को मॉडल से ज़्यादा सूखी देखता है: हो सकता है बारिश आपके इलाक़े में न हुई हो (मॉडल की बारिश ~50 किमी ग्रिड का औसत है) या मिट्टी अनुमान से कम पानी रखती हो। मॉडल पर भरोसा करने से पहले हाथ से मिट्टी जाँचें।"
  de: "Der Satellit sieht trockeneren Boden als das Modell: Der Regen hat Ihre Gegend vielleicht verfehlt (der Modellregen ist ein ~50-km-Gittermittel) oder der Boden hält weniger Wasser als angenommen. Prüfen Sie den Boden von Hand, bevor Sie sich auf das Modell verlassen."
sw_smap_step_wetter:
  en: "The satellite sees wetter soil than the model: local rain the weather grid missed, or a shallow water table. Check the soil before irrigating or replanting."
  es: "El satélite ve el suelo más húmedo que el modelo: lluvia local que la cuadrícula meteorológica no captó, o un nivel freático poco profundo. Revise el suelo antes de regar o resembrar."
  fr: "Le satellite voit un sol plus humide que le modèle : pluie locale manquée par la grille météo, ou nappe peu profonde. Vérifiez le sol avant d'irriguer ou de ressemer."
  sw: "Setilaiti inaona udongo wenye unyevu zaidi kuliko modeli: mvua ya eneo ambayo gridi ya hali ya hewa haikuiona, au maji ya ardhini yaliyo karibu na juu. Kagua udongo kabla ya kumwagilia au kupanda upya."
  hi: "उपग्रह मिट्टी को मॉडल से ज़्यादा नम देखता है: स्थानीय बारिश जो मौसम ग्रिड से छूट गई, या उथला जल स्तर। सिंचाई या दोबारा बुवाई से पहले मिट्टी जाँचें।"
  de: "Der Satellit sieht feuchteren Boden als das Modell: lokaler Regen, den das Wettergitter nicht erfasst hat, oder ein hoher Grundwasserspiegel. Prüfen Sie den Boden, bevor Sie bewässern oder nachsäen."
sw_smap_step_agree:
  en: "Satellite and model tell the same story; this raises confidence in the water advice."
  es: "Satélite y modelo coinciden; esto aumenta la confianza en el consejo de agua."
  fr: "Satellite et modèle racontent la même histoire ; cela renforce la confiance dans le conseil sur l'eau."
  sw: "Setilaiti na modeli zinakubaliana; hii inaongeza imani katika ushauri wa maji."
  hi: "उपग्रह और मॉडल एक ही बात कहते हैं; इससे पानी की सलाह पर भरोसा बढ़ता है।"
  de: "Satellit und Modell zeigen dasselbe Bild; das stärkt das Vertrauen in die Wasserempfehlung."
sw_smap_step_irrigated:
  en: "On an irrigated field the 9 km SMAP cell mostly reflects the surrounding land, so it is shown for context only."
  es: "En un campo regado, la celda SMAP de 9 km refleja sobre todo el terreno circundante, así que solo se muestra como contexto."
  fr: "Sur une parcelle irriguée, la maille SMAP de 9 km reflète surtout les terres alentour ; elle n'est montrée qu'à titre de contexte."
  sw: "Kwenye shamba linalomwagiliwa, seli ya SMAP ya km 9 huonyesha zaidi ardhi inayozunguka, kwa hiyo inaonyeshwa kama muktadha tu."
  hi: "सिंचित खेत पर 9 किमी का SMAP सेल ज़्यादातर आसपास की ज़मीन दिखाता है, इसलिए इसे केवल संदर्भ के लिए दिखाया गया है।"
  de: "Auf einem bewässerten Feld spiegelt die 9-km-SMAP-Zelle vor allem das Umland wider; sie wird daher nur zur Einordnung gezeigt."
sw_smap_summary_satellite_drier:
  en: "NASA SMAP soil moisture compared with the model's root zone: the satellite sees drier soil."
  es: "Humedad del suelo NASA SMAP comparada con la zona de raíces del modelo: el satélite ve el suelo más seco."
  fr: "Humidité du sol NASA SMAP comparée à la zone racinaire du modèle : le satellite voit un sol plus sec."
  sw: "Unyevu wa udongo wa NASA SMAP ukilinganishwa na eneo la mizizi la modeli: setilaiti inaona udongo mkavu zaidi."
  hi: "NASA SMAP मिट्टी की नमी बनाम मॉडल का जड़ क्षेत्र: उपग्रह मिट्टी को ज़्यादा सूखी देखता है।"
  de: "NASA-SMAP-Bodenfeuchte im Vergleich zum Wurzelraum des Modells: Der Satellit sieht trockeneren Boden."
sw_smap_summary_satellite_wetter:
  en: "NASA SMAP soil moisture compared with the model's root zone: the satellite sees wetter soil."
  es: "Humedad del suelo NASA SMAP comparada con la zona de raíces del modelo: el satélite ve el suelo más húmedo."
  fr: "Humidité du sol NASA SMAP comparée à la zone racinaire du modèle : le satellite voit un sol plus humide."
  sw: "Unyevu wa udongo wa NASA SMAP ukilinganishwa na eneo la mizizi la modeli: setilaiti inaona udongo wenye unyevu zaidi."
  hi: "NASA SMAP मिट्टी की नमी बनाम मॉडल का जड़ क्षेत्र: उपग्रह मिट्टी को ज़्यादा नम देखता है।"
  de: "NASA-SMAP-Bodenfeuchte im Vergleich zum Wurzelraum des Modells: Der Satellit sieht feuchteren Boden."
sw_smap_summary_agree:
  en: "NASA SMAP soil moisture compared with the model's root zone: they agree."
  es: "Humedad del suelo NASA SMAP comparada con la zona de raíces del modelo: coinciden."
  fr: "Humidité du sol NASA SMAP comparée à la zone racinaire du modèle : ils concordent."
  sw: "Unyevu wa udongo wa NASA SMAP ukilinganishwa na eneo la mizizi la modeli: vinakubaliana."
  hi: "NASA SMAP मिट्टी की नमी बनाम मॉडल का जड़ क्षेत्र: दोनों मेल खाते हैं।"
  de: "NASA-SMAP-Bodenfeuchte im Vergleich zum Wurzelraum des Modells: Beide stimmen überein."
sw_smap_summary_unknown:
  en: "NASA SMAP soil moisture compared with the model's root zone."
  es: "Humedad del suelo NASA SMAP comparada con la zona de raíces del modelo."
  fr: "Humidité du sol NASA SMAP comparée à la zone racinaire du modèle."
  sw: "Unyevu wa udongo wa NASA SMAP ukilinganishwa na eneo la mizizi la modeli."
  hi: "NASA SMAP मिट्टी की नमी बनाम मॉडल का जड़ क्षेत्र।"
  de: "NASA-SMAP-Bodenfeuchte im Vergleich zum Wurzelraum des Modells."
sw_smap_model_name:
  en: "SMAP L4 percentile vs. FAO-56 root-zone water balance"
  es: "Percentil SMAP L4 frente al balance hídrico FAO-56 de la zona de raíces"
  fr: "Centile SMAP L4 vs. bilan hydrique FAO-56 de la zone racinaire"
  sw: "Asilimia-nafasi ya SMAP L4 dhidi ya mizania ya maji ya FAO-56 ya eneo la mizizi"
  hi: "SMAP L4 पर्सेंटाइल बनाम FAO-56 जड़-क्षेत्र जल संतुलन"
  de: "SMAP-L4-Perzentil vs. FAO-56-Wasserbilanz des Wurzelraums"
sw_smap_note:
  en: "Two independent estimates; SMAP's 9 km cell is coarse for one field."
  es: "Dos estimaciones independientes; la celda de 9 km de SMAP es gruesa para un solo campo."
  fr: "Deux estimations indépendantes ; la maille de 9 km de SMAP est grossière pour une seule parcelle."
  sw: "Makadirio mawili huru; seli ya SMAP ya km 9 ni kubwa mno kwa shamba moja."
  hi: "दो स्वतंत्र अनुमान; एक खेत के लिए SMAP का 9 किमी सेल मोटा है।"
  de: "Zwei unabhängige Schätzungen; die 9-km-Zelle von SMAP ist für ein einzelnes Feld grob."

# ---- ECOSTRESS
sw_et_caveat_1:
  en: "ECOSTRESS flies on the Space Station: overpasses are irregular and clouds block many of them."
  es: "ECOSTRESS va en la Estación Espacial: los pasos son irregulares y las nubes bloquean muchos."
  fr: "ECOSTRESS est à bord de la Station spatiale : les passages sont irréguliers et les nuages en masquent beaucoup."
  sw: "ECOSTRESS iko kwenye Kituo cha Anga: inapita kwa vipindi visivyo vya kawaida na mawingu huzuia mapito mengi."
  hi: "ECOSTRESS अंतरिक्ष स्टेशन पर है: इसके गुज़रने का समय अनियमित है और बादल कई बार उसे रोक देते हैं।"
  de: "ECOSTRESS fliegt auf der Raumstation: Die Überflüge sind unregelmäßig, und Wolken verdecken viele davon."
sw_et_caveat_2:
  en: "One overpass is an instantaneous snapshot scaled to a daily total; single days are noisy (±1–2 mm/day)."
  es: "Cada paso es una instantánea escalada a un total diario; los días sueltos son ruidosos (±1–2 mm/día)."
  fr: "Un passage est un instantané extrapolé à un total journalier ; les jours isolés sont bruités (±1–2 mm/jour)."
  sw: "Pito moja ni picha ya papo hapo iliyopanuliwa kuwa jumla ya siku; siku moja moja zina makosa (±1–2 mm/siku)."
  hi: "एक बार गुज़रना एक क्षणिक तस्वीर है जिसे दैनिक कुल में बदला जाता है; अकेले दिनों में उतार-चढ़ाव होता है (±1–2 मिमी/दिन)।"
  de: "Ein Überflug ist eine Momentaufnahme, hochgerechnet auf eine Tagessumme; einzelne Tage streuen stark (±1–2 mm/Tag)."
sw_et_step_obs:
  en: "NASA ECOSTRESS (70 m, sees this field) measured {et:.1f} mm/day of evapotranspiration on {date}"
  es: "NASA ECOSTRESS (70 m, ve este campo) midió {et:.1f} mm/día de evapotranspiración el {date}"
  fr: "NASA ECOSTRESS (70 m, voit cette parcelle) a mesuré {et:.1f} mm/jour d'évapotranspiration le {date}"
  sw: "NASA ECOSTRESS (m 70, inaona shamba hili) ilipima mvukeuvukizaji wa {et:.1f} mm/siku tarehe {date}"
  hi: "NASA ECOSTRESS (70 मी, यह खेत देखता है) ने {date} को {et:.1f} मिमी/दिन वाष्पोत्सर्जन मापा"
  de: "NASA ECOSTRESS (70 m, sieht dieses Feld) maß am {date} eine Evapotranspiration von {et:.1f} mm/Tag"
sw_et_model_val:
  en: "; the model had {et:.1f} mm/day."
  es: "; el modelo tenía {et:.1f} mm/día."
  fr: " ; le modèle donnait {et:.1f} mm/jour."
  sw: "; modeli ilikuwa na {et:.1f} mm/siku."
  hi: "; मॉडल में {et:.1f} मिमी/दिन था।"
  de: "; das Modell hatte {et:.1f} mm/Tag."
sw_et_step_recent:
  en: "Clear overpasses in the last {days} days: {n}; satellite / model ET = {ratio:.2f}."
  es: "Pasos despejados en los últimos {days} días: {n}; ET satélite / modelo = {ratio:.2f}."
  fr: "Passages dégagés sur les {days} derniers jours : {n} ; ET satellite / modèle = {ratio:.2f}."
  sw: "Mapito bila mawingu katika siku {days} zilizopita: {n}; ET ya setilaiti / modeli = {ratio:.2f}."
  hi: "पिछले {days} दिनों में साफ़ आसमान वाले पास: {n}; उपग्रह / मॉडल ET = {ratio:.2f}।"
  de: "Wolkenfreie Überflüge in den letzten {days} Tagen: {n}; ET Satellit / Modell = {ratio:.2f}."
sw_et_validation:
  en: "Check at the Fallon alfalfa field (VALIDATION V6): on 110 clear summer overpasses 2018–2024 ECOSTRESS averaged 2.3 mm/day and the model 6.2 mm/day, with no day-to-day agreement. The model assumes a well-watered crop without cutting cycles; ECOSTRESS's daily total is scaled from one instant. Which is closer on your field cannot be told from one check, so this comparison is shown but does not trigger advice."
  es: "Comprobación en el campo de alfalfa de Fallon (VALIDACIÓN V6): en 110 pasos despejados de verano 2018–2024, ECOSTRESS promedió 2,3 mm/día y el modelo 6,2 mm/día, sin concordancia día a día. El modelo supone un cultivo bien regado sin ciclos de corte; el total diario de ECOSTRESS se escala desde un instante. Con una sola comprobación no se puede saber cuál se acerca más en su campo, así que esta comparación se muestra pero no genera consejos."
  fr: "Contrôle sur la luzerne de Fallon (VALIDATION V6) : sur 110 passages d'été dégagés 2018–2024, ECOSTRESS donnait en moyenne 2,3 mm/jour et le modèle 6,2 mm/jour, sans accord jour par jour. Le modèle suppose une culture bien arrosée sans cycles de coupe ; le total journalier d'ECOSTRESS est extrapolé d'un instant. Un seul contrôle ne permet pas de dire lequel est le plus proche sur votre parcelle : cette comparaison est montrée mais ne déclenche pas de conseil."
  sw: "Ukaguzi kwenye shamba la alfalfa la Fallon (UTHIBITISHO V6): katika mapito 110 ya kiangazi bila mawingu 2018–2024, ECOSTRESS ilikuwa wastani wa 2.3 mm/siku na modeli 6.2 mm/siku, bila kukubaliana siku kwa siku. Modeli inadhani zao lenye maji ya kutosha bila mizunguko ya ukataji; jumla ya siku ya ECOSTRESS hupanuliwa kutoka papo hapo moja. Kipi kiko karibu zaidi kwenye shamba lako hakiwezi kujulikana kwa ukaguzi mmoja, kwa hiyo ulinganisho huu unaonyeshwa lakini hauleti ushauri."
  hi: "फ़ॉलन अल्फ़ाल्फ़ा खेत पर जाँच (सत्यापन V6): 2018–2024 की गर्मियों के 110 साफ़ पासों पर ECOSTRESS का औसत 2.3 मिमी/दिन और मॉडल का 6.2 मिमी/दिन रहा, दिन-प्रतिदिन कोई मेल नहीं। मॉडल कटाई चक्रों के बिना भरपूर पानी वाली फसल मानता है; ECOSTRESS का दैनिक कुल एक क्षण से निकाला जाता है। एक जाँच से यह नहीं कहा जा सकता कि आपके खेत पर कौन ज़्यादा सही है, इसलिए यह तुलना दिखाई जाती है पर इससे कोई सलाह नहीं बनती।"
  de: "Abgleich am Luzernefeld in Fallon (VALIDIERUNG V6): Bei 110 wolkenfreien Sommerüberflügen 2018–2024 lag ECOSTRESS im Mittel bei 2,3 mm/Tag und das Modell bei 6,2 mm/Tag, ohne Übereinstimmung von Tag zu Tag. Das Modell nimmt einen gut versorgten Bestand ohne Schnittzyklen an; die Tagessumme von ECOSTRESS ist aus einem Moment hochgerechnet. Welcher Wert auf Ihrem Feld näher liegt, lässt sich aus einem Abgleich nicht sagen; der Vergleich wird daher gezeigt, löst aber keine Empfehlung aus."
