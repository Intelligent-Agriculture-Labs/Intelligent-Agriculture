  es: "NASA ECOSTRESS midió una ET del campo de {et:.1f} mm/día el {date}"
  fr: "NASA ECOSTRESS a mesuré une ET de la parcelle de {et:.1f} mm/jour le {date}"
  sw: "NASA ECOSTRESS ilipima ET ya shamba ya {et:.1f} mm/siku tarehe {date}"
  hi: "NASA ECOSTRESS ने {date} को खेत का ET {et:.1f} मिमी/दिन मापा"
  de: "NASA ECOSTRESS maß am {date} eine Feld-ET von {et:.1f} mm/Tag"
