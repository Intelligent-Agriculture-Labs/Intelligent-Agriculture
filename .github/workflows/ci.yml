name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 .venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check . ../scripts && .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy fieldshift
      - name: Tests (network-free, synthetic fixtures)
        run: .venv/bin/pytest -q
      - name: Offline smoke test against the committed demo cache
        env:
          FIELDSHIFT_OFFLINE: "1"
        run: |
          .venv/bin/uvicorn fieldshift.main:app --port 8000 &
          sleep 5
          curl -fsS -X POST localhost:8000/api/advice -H 'content-type: application/json' \
            -d '{"lat":39.472,"lon":-118.777,"crop":"alfalfa","planting_date":"2022-03-15","irrigation":"flood","as_of":"2025-07-15"}' | head -c 300

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run export:web

  docker:
    runs-on: ubuntu-latest
    needs: [backend, app]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
