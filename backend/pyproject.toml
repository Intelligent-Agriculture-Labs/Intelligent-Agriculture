[project]
name = "fieldshift"
version = "1.0.0"
description = "FieldShift API: NASA Earth observations -> farm decisions (water, drought, pests, disease, rotations)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "rasterio>=1.4",
  "scikit-learn>=1.5",
  "scikit-image>=0.24",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldshift"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N802", "N803", "N806", "N818", "SIM102"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
