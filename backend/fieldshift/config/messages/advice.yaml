dr_ind_vhi: {en: "vegetation health index", es: "índice de salud de la vegetación", fr: "indice de santé de la végétation", sw: "kielelezo cha afya ya mimea", hi: "वनस्पति स्वास्थ्य सूचकांक", de: "Vegetationsgesundheitsindex"}
dr_step_scale:
  en: "Levels follow the U.S. Drought Monitor scale (D0–D4); indicators are blended by a weighted 'convergence of evidence'."
  es: "Los niveles siguen la escala del U.S. Drought Monitor (D0–D4); los indicadores se combinan por 'convergencia de evidencias' ponderada."
  fr: "Les niveaux suivent l'échelle de l'U.S. Drought Monitor (D0–D4) ; les indicateurs sont combinés par « convergence des preuves » pondérée."
  sw: "Viwango vinafuata kipimo cha U.S. Drought Monitor (D0–D4); viashiria vinaunganishwa kwa uzito wa 'ushahidi unaokubaliana'."
  hi: "स्तर U.S. Drought Monitor पैमाने (D0–D4) पर हैं; संकेतकों को भारित 'साक्ष्य अभिसरण' से मिलाया जाता है।"
  de: "Die Stufen folgen der Skala des U.S. Drought Monitor (D0–D4); die Indikatoren werden gewichtet nach dem Prinzip „übereinstimmender Belege“ kombiniert."
dr_step_grace:
  en: "Long-term water supply (NASA GRACE/GRACE-FO, ~300 km): storage trend {slope:+.1f} cm/yr (p = {p:.2f}), {change:+.0f} cm since 2003. Shown for context; it does not change the drought level (multi-month latency, regional footprint)."
  es: "Agua a largo plazo (NASA GRACE/GRACE-FO, ~300 km): tendencia de almacenamiento {slope:+.1f} cm/año (p = {p:.2f}), {change:+.0f} cm desde 2003. Se muestra como contexto; no cambia el nivel de sequía (retraso de meses, escala regional)."
  fr: "Ressource en eau à long terme (NASA GRACE/GRACE-FO, ~300 km) : tendance du stock {slope:+.1f} cm/an (p = {p:.2f}), {change:+.0f} cm depuis 2003. Donné pour contexte ; ne modifie pas le niveau de sécheresse (délai de plusieurs mois, échelle régionale)."
  sw: "Upatikanaji wa maji wa muda mrefu (NASA GRACE/GRACE-FO, ~km 300): mwelekeo wa hifadhi sm {slope:+.1f}/mwaka (p = {p:.2f}), sm {change:+.0f} tangu 2003. Ni kwa muktadha tu; haubadilishi kiwango cha ukame (huchelewa miezi kadhaa, eneo pana)."
  hi: "दीर्घकालिक जल आपूर्ति (NASA GRACE/GRACE-FO, ~300 किमी): भंडारण रुझान {slope:+.1f} सेमी/वर्ष (p = {p:.2f}), 2003 से {change:+.0f} सेमी। केवल संदर्भ के लिए; यह सूखा स्तर नहीं बदलता (कई महीनों की देरी, क्षेत्रीय पैमाना)।"
  de: "Langfristiger Wasservorrat (NASA GRACE/GRACE-FO, ~300 km): Speichertrend {slope:+.1f} cm/Jahr (p = {p:.2f}), {change:+.0f} cm seit 2003. Nur zur Einordnung; ändert die Dürrestufe nicht (Monate Verzögerung, regionaler Maßstab)."
model_drought_rules:
  en: "SPI/SPEI (McKee 1993; Vicente-Serrano 2010) + satellite indicators"
  es: "SPI/SPEI (McKee 1993; Vicente-Serrano 2010) + indicadores satelitales"
  fr: "SPI/SPEI (McKee 1993 ; Vicente-Serrano 2010) + indicateurs satellitaires"
  sw: "SPI/SPEI (McKee 1993; Vicente-Serrano 2010) + viashiria vya setilaiti"
  hi: "SPI/SPEI (McKee 1993; Vicente-Serrano 2010) + उपग्रह संकेतक"
  de: "SPI/SPEI (McKee 1993; Vicente-Serrano 2010) + Satellitenindikatoren"
model_drought_ml:
  en: "AI drought classifier (gradient boosting on drought-monitor labels, NASA POWER features) + rule-based SPI/SPEI blend"
  es: "Clasificador de sequía con IA (gradient boosting sobre etiquetas de monitores de sequía, variables NASA POWER) + combinación SPI/SPEI por reglas"
  fr: "Classificateur de sécheresse par IA (gradient boosting sur les cartes des observatoires de sécheresse, variables NASA POWER) + combinaison SPI/SPEI par règles"
  sw: "Kiainishi cha ukame cha AI (gradient boosting kwa lebo za ufuatiliaji wa ukame, vigezo vya NASA POWER) + mchanganyiko wa SPI/SPEI kwa kanuni"
  hi: "AI सूखा वर्गीकरणकर्ता (सूखा-मॉनिटर लेबल पर ग्रेडिएंट बूस्टिंग, NASA POWER विशेषताएँ) + नियम-आधारित SPI/SPEI मिश्रण"
  de: "KI-Dürreklassifikator (Gradient Boosting auf Dürremonitor-Karten, NASA-POWER-Merkmale) + regelbasierte SPI/SPEI-Kombination"
dr_ml_where_region:
  en: "held-out sites in this region ({n} sites, labels: {label})"
  es: "sitios de prueba en esta región ({n} sitios, etiquetas: {label})"
  fr: "sites de test de cette région ({n} sites, étiquettes : {label})"
  sw: "maeneo ya majaribio katika ukanda huu (maeneo {n}, lebo: {label})"
  hi: "इस क्षेत्र के परीक्षण स्थल ({n} स्थल, लेबल: {label})"
  de: "zurückgehaltenen Orten dieser Region ({n} Orte, Labels: {label})"
dr_ml_where_us:
  en: "U.S. counties it never saw"
  es: "condados de EE. UU. que nunca vio"
  fr: "comtés américains jamais vus"
  sw: "kaunti za Marekani ambazo haijawahi kuona"
  hi: "अमेरिकी काउंटी जो इसने कभी नहीं देखीं"
  de: "US-Countys, die es nie gesehen hat"
dr_step_ml:
  en: "AI classifier (gradient boosting on {n_samples} drought-map labels from {n_sites} sites): {label} with {prob:.0f} % probability. On {where} it is within one category {acc:.0f} % of the time (rule-based blend: {rules_label})."
  es: "Clasificador de IA (gradient boosting con {n_samples} etiquetas de mapas de sequía de {n_sites} sitios): {label} con {prob:.0f} % de probabilidad. En {where} acierta con un margen de una categoría el {acc:.0f} % de las veces (combinación por reglas: {rules_label})."
  fr: "Classificateur IA (gradient boosting sur {n_samples} étiquettes de cartes de sécheresse de {n_sites} sites) : {label} avec {prob:.0f} % de probabilité. Sur des {where}, il est à une catégorie près dans {acc:.0f} % des cas (combinaison par règles : {rules_label})."
  sw: "Kiainishi cha AI (gradient boosting kwa lebo {n_samples} za ramani za ukame kutoka maeneo {n_sites}): {label} kwa uwezekano wa {prob:.0f} %. Katika {where} kiko ndani ya kundi moja mara {acc:.0f} % (mchanganyiko wa kanuni: {rules_label})."
  hi: "AI वर्गीकरणकर्ता ({n_sites} स्थलों के {n_samples} सूखा-मानचित्र लेबल पर ग्रेडिएंट बूस्टिंग): {label}, {prob:.0f} % संभावना। {where} पर यह {acc:.0f} % बार एक श्रेणी के भीतर सही रहता है (नियम-आधारित मिश्रण: {rules_label})।"
  de: "KI-Klassifikator (Gradient Boosting auf {n_samples} Dürrekarten-Labels von {n_sites} Orten): {label} mit {prob:.0f} % Wahrscheinlichkeit. Bei {where} liegt er in {acc:.0f} % der Fälle höchstens eine Stufe daneben (regelbasierte Kombination: {rules_label})."
dr_sum:
  en: "{label} based on {n} indicators."
  es: "{label} según {n} indicadores."
  fr: "{label} d'après {n} indicateurs."
  sw: "{label} kwa msingi wa viashiria {n}."
  hi: "{n} संकेतकों के आधार पर {label}।"
  de: "{label} auf Basis von {n} Indikatoren."
dr_note:
  en: "Agreement between independent indicators raises confidence."
  es: "La coincidencia entre indicadores independientes aumenta la confianza."
  fr: "L'accord entre indicateurs indépendants renforce la confiance."
  sw: "Kukubaliana kwa viashiria huru huongeza uhakika."
  hi: "स्वतंत्र संकेतकों की सहमति से भरोसा बढ़ता है।"
  de: "Übereinstimmung unabhängiger Indikatoren erhöht die Zuverlässigkeit."
dr_caveat_spi:
  en: "SPI uses ~50 km NASA POWER rain; local storms can be missed."
  es: "El SPI usa lluvia NASA POWER de ~50 km; puede no captar tormentas locales."
  fr: "Le SPI utilise la pluie NASA POWER à ~50 km ; les orages locaux peuvent échapper."
  sw: "SPI hutumia mvua ya NASA POWER ya ~km 50; dhoruba za eneo dogo zinaweza kukosekana."
  hi: "SPI ~50 किमी की NASA POWER वर्षा का उपयोग करता है; स्थानीय तूफ़ान छूट सकते हैं।"
  de: "Der SPI nutzt NASA-POWER-Regen im ~50-km-Raster; lokale Gewitter können fehlen."
dr_caveat_smap:
  en: "SMAP soil moisture is a 9 km footprint and only the top ~5 cm."
  es: "La humedad SMAP cubre 9 km y solo los ~5 cm superiores."
  fr: "L'humidité SMAP couvre 9 km et seulement les ~5 cm supérieurs."
  sw: "Unyevu wa SMAP ni wa eneo la km 9 na sm ~5 za juu tu."
  hi: "SMAP मिट्टी नमी 9 किमी क्षेत्र की है और केवल ऊपरी ~5 सेमी की।"
  de: "SMAP-Bodenfeuchte gilt für 9 km und nur die oberen ~5 cm."
ndvi_sum:
  en: "The latest MODIS NDVI ({v:.2f}) is {z:.1f} standard deviations below the {y0}–{y1} average for this time of year ({mu:.2f})."
  es: "El último NDVI de MODIS ({v:.2f}) está {z:.1f} desviaciones estándar por debajo del promedio {y0}–{y1} para esta época ({mu:.2f})."
  fr: "Le dernier NDVI MODIS ({v:.2f}) est {z:.1f} écarts-types sous la moyenne {y0}–{y1} pour cette période ({mu:.2f})."
  sw: "NDVI ya karibuni ya MODIS ({v:.2f}) iko mikengeuko sanifu {z:.1f} chini ya wastani wa {y0}–{y1} kwa wakati huu wa mwaka ({mu:.2f})."
  hi: "नवीनतम MODIS NDVI ({v:.2f}) साल के इस समय के {y0}–{y1} औसत ({mu:.2f}) से {z:.1f} मानक विचलन कम है।"
  de: "Der jüngste MODIS-NDVI ({v:.2f}) liegt {z:.1f} Standardabweichungen unter dem Mittel {y0}–{y1} für diese Jahreszeit ({mu:.2f})."
ndvi_step_latest:
  en: "MODIS 16-day composite of {date}: NDVI {v:.2f}."
  es: "Compuesto MODIS de 16 días del {date}: NDVI {v:.2f}."
  fr: "Composite MODIS 16 jours du {date} : NDVI {v:.2f}."
  sw: "Mchanganyiko wa siku 16 wa MODIS wa {date}: NDVI {v:.2f}."
  hi: "{date} का MODIS 16-दिवसीय संयोजन: NDVI {v:.2f}।"
  de: "MODIS-16-Tage-Komposit vom {date}: NDVI {v:.2f}."
ndvi_step_clim:
  en: "Same period in {n} earlier years: mean {mu:.2f}, standard deviation {sd:.2f}."
  es: "Mismo periodo en {n} años anteriores: media {mu:.2f}, desviación estándar {sd:.2f}."
  fr: "Même période sur {n} années antérieures : moyenne {mu:.2f}, écart-type {sd:.2f}."
  sw: "Kipindi hicho hicho katika miaka {n} iliyopita: wastani {mu:.2f}, mkengeuko sanifu {sd:.2f}."
  hi: "पिछले {n} वर्षों में यही अवधि: औसत {mu:.2f}, मानक विचलन {sd:.2f}।"
  de: "Gleicher Zeitraum in {n} früheren Jahren: Mittel {mu:.2f}, Standardabweichung {sd:.2f}."
ndvi_step_meaning:
  en: "A strong negative anomaly can mean water stress, pest damage, hail, late planting or a different crop than in past years."
  es: "Una anomalía negativa fuerte puede indicar estrés hídrico, daño por plagas, granizo, siembra tardía o un cultivo distinto al de años anteriores."
  fr: "Une forte anomalie négative peut signifier stress hydrique, ravageurs, grêle, semis tardif ou une autre culture que les années passées."
  sw: "Hitilafu kubwa hasi inaweza kumaanisha msongo wa maji, uharibifu wa wadudu, mvua ya mawe, kupanda kwa kuchelewa au zao tofauti na miaka iliyopita."
  hi: "बड़ी नकारात्मक विसंगति का अर्थ पानी की कमी, कीट नुकसान, ओले, देर से बुवाई या पिछले वर्षों से अलग फसल हो सकता है।"
  de: "Eine starke negative Abweichung kann Wasserstress, Schädlingsschäden, Hagel, späte Saat oder eine andere Kultur als in den Vorjahren bedeuten."
model_ndvi:
  en: "NDVI anomaly (z-score vs. same-period climatology)"
  es: "Anomalía de NDVI (puntuación z frente a la climatología del mismo periodo)"
  fr: "Anomalie de NDVI (score z par rapport à la climatologie de la même période)"
  sw: "Hitilafu ya NDVI (alama z dhidi ya hali ya kawaida ya kipindi hicho)"
  hi: "NDVI विसंगति (उसी अवधि की जलवायु के सापेक्ष z-स्कोर)"
  de: "NDVI-Anomalie (z-Wert gegenüber der Klimatologie desselben Zeitraums)"
ndvi_note:
  en: "250 m pixels mix your field with neighbours; a different crop than in past years also changes NDVI."
  es: "Los píxeles de 250 m mezclan su campo con los vecinos; un cultivo distinto al de otros años también cambia el NDVI."
  fr: "Les pixels de 250 m mélangent votre parcelle avec ses voisines ; une autre culture que les années passées change aussi le NDVI."
  sw: "Pikseli za m 250 huchanganya shamba lako na majirani; zao tofauti na miaka iliyopita pia hubadilisha NDVI."
  hi: "250 मी पिक्सेल आपके खेत को पड़ोसी खेतों से मिलाते हैं; पिछले वर्षों से अलग फसल भी NDVI बदलती है।"
  de: "250-m-Pixel mischen Ihr Feld mit Nachbarflächen; eine andere Kultur als in Vorjahren verändert den NDVI ebenfalls."
ndvi_caveat_pixel:
  en: "MODIS pixel is 250 m (~6 ha): small fields are mixed with neighbouring land."
  es: "El píxel MODIS mide 250 m (~6 ha): los campos pequeños se mezclan con terrenos vecinos."
  fr: "Le pixel MODIS fait 250 m (~6 ha) : les petites parcelles sont mélangées aux terres voisines."
  sw: "Pikseli ya MODIS ni m 250 (~ha 6): mashamba madogo yanachanganyika na ardhi jirani."
  hi: "MODIS पिक्सेल 250 मी (~6 हेक्टेयर) का है: छोटे खेत पड़ोसी ज़मीन से मिल जाते हैं।"
  de: "Ein MODIS-Pixel misst 250 m (~6 ha): kleine Felder werden mit Nachbarflächen gemischt."
caveat_clouds:
  en: "Cloudy periods reduce data quality."
  es: "Los periodos nublados reducen la calidad de los datos."
  fr: "Les périodes nuageuses réduisent la qualité des données."
  sw: "Vipindi vya mawingu hupunguza ubora wa data."
  hi: "बादल वाले समय में डेटा की गुणवत्ता घटती है।"
  de: "Bewölkte Phasen mindern die Datenqualität."
dis_sum:
  en: "Forecast hourly humidity and temperature favour {name} infection, peaking on {date}."
  es: "La humedad y la temperatura horarias previstas favorecen la infección de {name}, con un máximo el {date}."
  fr: "L'humidité et la température horaires prévues favorisent l'infection ({name}), avec un pic le {date}."
  sw: "Unyevu na joto la kila saa linalotabiriwa vinachochea maambukizi ya {name}, kilele tarehe {date}."
  hi: "पूर्वानुमानित घंटेवार नमी और तापमान {name} संक्रमण के अनुकूल हैं, चरम {date} को।"
  de: "Vorhergesagte stündliche Feuchte und Temperatur begünstigen eine Infektion mit {name}, Höhepunkt am {date}."
dis_step_model: {en: "Model: {ref}.", es: "Modelo: {ref}.", fr: "Modèle : {ref}.", sw: "Modeli: {ref}.", hi: "मॉडल: {ref}।", de: "Modell: {ref}."}
dis_step_day:
  en: "On {date}: {hours} hours with relative humidity ≥ 90 %, minimum temperature {tmin:.0f} °C."
  es: "El {date}: {hours} horas con humedad relativa ≥ 90 %, temperatura mínima {tmin:.0f} °C."
  fr: "Le {date} : {hours} heures avec humidité relative ≥ 90 %, température minimale {tmin:.0f} °C."
  sw: "Tarehe {date}: saa {hours} zenye unyevu ≥ 90 %, joto la chini {tmin:.0f} °C."
  hi: "{date} को: {hours} घंटे सापेक्ष आर्द्रता ≥ 90 %, न्यूनतम तापमान {tmin:.0f} °C।"
  de: "Am {date}: {hours} Stunden mit relativer Luftfeuchte ≥ 90 %, Tiefsttemperatur {tmin:.0f} °C."
dis_step_score:
  en: "Risk score {score:.2f} (0 = unfavourable, 1 = fully favourable)."
  es: "Puntuación de riesgo {score:.2f} (0 = desfavorable, 1 = totalmente favorable)."
  fr: "Score de risque {score:.2f} (0 = défavorable, 1 = pleinement favorable)."
  sw: "Alama ya hatari {score:.2f} (0 = haifai, 1 = inafaa kabisa)."
  hi: "जोखिम स्कोर {score:.2f} (0 = प्रतिकूल, 1 = पूरी तरह अनुकूल)।"
  de: "Risikowert {score:.2f} (0 = ungünstig, 1 = voll günstig)."
dis_step_scout:
  en: "Risk means the weather suits infection — it does not mean the disease is present. Scout before you spray."
  es: "Riesgo significa que el tiempo favorece la infección, no que la enfermedad esté presente. Revise el campo antes de aplicar."
  fr: "Le risque signifie que la météo favorise l'infection, pas que la maladie est présente. Observez avant de traiter."
  sw: "Hatari inamaanisha hali ya hewa inafaa maambukizi — si kwamba ugonjwa upo. Kagua kabla ya kunyunyiza."
  hi: "जोखिम का अर्थ है कि मौसम संक्रमण के अनुकूल है — यह नहीं कि रोग मौजूद है। छिड़काव से पहले खेत जाँचें।"
  de: "Risiko heißt: Das Wetter begünstigt eine Infektion – nicht, dass die Krankheit da ist. Erst kontrollieren, dann spritzen."
dis_note:
  en: "Leaf wetness is estimated from humidity; forecast skill drops after ~3 days."
  es: "El mojado foliar se estima a partir de la humedad; la fiabilidad del pronóstico baja tras ~3 días."
  fr: "L'humectation foliaire est estimée à partir de l'humidité ; la fiabilité de la prévision baisse après ~3 jours."
  sw: "Unyevu wa majani unakadiriwa kutoka kwa unyevu wa hewa; usahihi wa utabiri hupungua baada ya ~siku 3."
  hi: "पत्ती का गीलापन नमी से अनुमानित है; ~3 दिन बाद पूर्वानुमान की सटीकता घटती है।"
  de: "Die Blattnässe wird aus der Luftfeuchte geschätzt; die Vorhersagegüte sinkt nach ~3 Tagen."
dis_caveat_grid:
  en: "Forecast grid ~10–25 km; humid hollows and irrigated canopies are wetter than the grid."
  es: "Cuadrícula del pronóstico ~10–25 km; las hondonadas húmedas y los cultivos regados son más húmedos que la cuadrícula."
  fr: "Maille de prévision ~10–25 km ; les creux humides et les couverts irrigués sont plus humides que la maille."
  sw: "Gridi ya utabiri ~km 10–25; mabonde yenye unyevu na mimea inayomwagiliwa huwa na unyevu zaidi kuliko gridi."
  hi: "पूर्वानुमान ग्रिड ~10–25 किमी; नम निचले हिस्से और सिंचित फसलें ग्रिड से अधिक गीली होती हैं।"
  de: "Vorhersageraster ~10–25 km; feuchte Senken und bewässerte Bestände sind nasser als das Raster."
dis_caveat_rh:
  en: "Relative humidity ≥ 90 % is a proxy for leaf wetness."
  es: "Una humedad relativa ≥ 90 % se usa como indicador de mojado foliar."
  fr: "Une humidité relative ≥ 90 % sert d'indicateur d'humectation foliaire."
  sw: "Unyevu ≥ 90 % unatumika kama kiashiria cha unyevu wa majani."
  hi: "सापेक्ष आर्द्रता ≥ 90 % को पत्ती के गीलेपन का संकेतक माना गया है।"
  de: "Relative Luftfeuchte ≥ 90 % dient als Ersatzgröße für Blattnässe."
frost_sum:
  en: "Forecast minimum {tmin:.1f} °C on {date} vs. damage threshold {kill} °C for {crop}."
  es: "Mínima prevista {tmin:.1f} °C el {date} frente al umbral de daño de {kill} °C para {crop}."
  fr: "Minimale prévue {tmin:.1f} °C le {date}, pour un seuil de dégâts de {kill} °C ({crop})."
  sw: "Joto la chini linalotabiriwa {tmin:.1f} °C tarehe {date} dhidi ya kiwango cha madhara {kill} °C kwa {crop}."
  hi: "{date} को अनुमानित न्यूनतम {tmin:.1f} °C, जबकि {crop} की क्षति सीमा {kill} °C है।"
  de: "Vorhergesagtes Minimum {tmin:.1f} °C am {date}, Schadschwelle für {crop}: {kill} °C."
frost_step_tmin: {en: "Forecast Tmin {tmin:.1f} °C.", es: "Mínima prevista {tmin:.1f} °C.", fr: "Minimale prévue {tmin:.1f} °C.", sw: "Joto la chini linalotabiriwa {tmin:.1f} °C.", hi: "अनुमानित न्यूनतम {tmin:.1f} °C।", de: "Vorhergesagtes Minimum {tmin:.1f} °C."}
frost_step_thr:
  en: "Damage threshold for {crop}: {kill} °C (literature)."
  es: "Umbral de daño para {crop}: {kill} °C (literatura)."
  fr: "Seuil de dégâts pour {crop} : {kill} °C (littérature)."
  sw: "Kiwango cha madhara kwa {crop}: {kill} °C (machapisho)."
  hi: "{crop} की क्षति सीमा: {kill} °C (शोध साहित्य)।"
  de: "Schadschwelle für {crop}: {kill} °C (Literatur)."
model_frost:
  en: "Threshold rule on forecast minimum temperature"
  es: "Regla de umbral sobre la temperatura mínima prevista"
  fr: "Règle de seuil sur la température minimale prévue"
  sw: "Kanuni ya kiwango kwa joto la chini linalotabiriwa"
  hi: "अनुमानित न्यूनतम तापमान पर सीमा नियम"
  de: "Schwellenregel für die vorhergesagte Tiefsttemperatur"
frost_note:
  en: "Frost is very local; low spots can be 2–4 °C colder."
  es: "La helada es muy local; las zonas bajas pueden estar 2–4 °C más frías."
  fr: "Le gel est très local ; les points bas peuvent être 2–4 °C plus froids."
  sw: "Baridi kali ni ya eneo dogo sana; maeneo ya chini yanaweza kuwa baridi zaidi kwa 2–4 °C."
  hi: "पाला बहुत स्थानीय होता है; निचले हिस्से 2–4 °C अधिक ठंडे हो सकते हैं।"
  de: "Frost ist sehr lokal; Senken können 2–4 °C kälter sein."
frost_caveat:
  en: "Forecast is for 2 m air temperature; ground frost can occur at higher air temperatures."
  es: "El pronóstico es de temperatura del aire a 2 m; puede helar a ras de suelo con temperaturas del aire más altas."
  fr: "La prévision concerne l'air à 2 m ; une gelée au sol peut survenir avec une température de l'air plus élevée."
  sw: "Utabiri ni wa joto la hewa la m 2; baridi kali ya ardhini inaweza kutokea hata hewa ikiwa na joto zaidi."
  hi: "पूर्वानुमान 2 मी हवा के तापमान का है; ज़मीनी पाला अधिक हवा तापमान पर भी पड़ सकता है।"
  de: "Die Vorhersage gilt für 2 m Lufttemperatur; Bodenfrost ist auch bei höheren Lufttemperaturen möglich."
heat_sum:
  en: "Forecast maximum {tmax:.1f} °C exceeds the heat-stress threshold of {thr} °C."
  es: "La máxima prevista de {tmax:.1f} °C supera el umbral de estrés por calor de {thr} °C."
  fr: "La maximale prévue de {tmax:.1f} °C dépasse le seuil de stress thermique de {thr} °C."
  sw: "Joto la juu linalotabiriwa {tmax:.1f} °C linazidi kiwango cha msongo wa joto cha {thr} °C."
  hi: "अनुमानित अधिकतम {tmax:.1f} °C, ताप-तनाव सीमा {thr} °C से अधिक है।"
  de: "Das vorhergesagte Maximum von {tmax:.1f} °C übersteigt die Hitzestressschwelle von {thr} °C."
heat_step_tmax:
  en: "Forecast Tmax {tmax:.1f} °C on {date}."
  es: "Máxima prevista {tmax:.1f} °C el {date}."
  fr: "Maximale prévue {tmax:.1f} °C le {date}."
  sw: "Joto la juu linalotabiriwa {tmax:.1f} °C tarehe {date}."
  hi: "{date} को अनुमानित अधिकतम {tmax:.1f} °C।"
  de: "Vorhergesagtes Maximum {tmax:.1f} °C am {date}."
heat_step_thr:
  en: "Heat threshold for {crop}: {thr} °C."
  es: "Umbral de calor para {crop}: {thr} °C."
  fr: "Seuil de chaleur pour {crop} : {thr} °C."
  sw: "Kiwango cha joto kwa {crop}: {thr} °C."
  hi: "{crop} की ताप सीमा: {thr} °C।"
  de: "Hitzeschwelle für {crop}: {thr} °C."
model_heat:
  en: "Threshold rule on forecast maximum temperature"
  es: "Regla de umbral sobre la temperatura máxima prevista"
  fr: "Règle de seuil sur la température maximale prévue"
  sw: "Kanuni ya kiwango kwa joto la juu linalotabiriwa"
  hi: "अनुमानित अधिकतम तापमान पर सीमा नियम"
  de: "Schwellenregel für die vorhergesagte Höchsttemperatur"
heat_note:
  en: "Short heat spikes matter most at flowering."
  es: "Los picos cortos de calor importan sobre todo en la floración."
  fr: "Les pics de chaleur brefs comptent surtout à la floraison."
  sw: "Joto kali la muda mfupi lina madhara zaidi wakati wa kuchanua maua."
  hi: "छोटी अवधि की गर्मी फूल आने के समय सबसे अधिक मायने रखती है।"
  de: "Kurze Hitzespitzen zählen vor allem zur Blüte."
sow_sum:
  en: "Sowing dates were simulated with the IA season model over past seasons of NASA POWER weather."
  es: "Las fechas de siembra se simularon con el modelo de temporada de IA sobre temporadas pasadas de clima NASA POWER."
  fr: "Les dates de semis ont été simulées avec le modèle de saison IA sur les saisons passées de météo NASA POWER."
  sw: "Tarehe za kupanda ziliigwa kwa modeli ya msimu ya IA kwa misimu iliyopita ya hali ya hewa ya NASA POWER."
  hi: "बुवाई की तारीखों का IA मौसम मॉडल से पिछले मौसमों के NASA POWER मौसम पर अनुकरण किया गया।"
  de: "Saattermine wurden mit dem IA-Saisonmodell über vergangene Jahre NASA-POWER-Wetter simuliert."
sow_step:
  en: "{date}: median {m:.1f} t/ha, bad-year (p10) {p10:.1f} t/ha"
  es: "{date}: mediana {m:.1f} t/ha, año malo (p10) {p10:.1f} t/ha"
  fr: "{date} : médiane {m:.1f} t/ha, mauvaise année (p10) {p10:.1f} t/ha"
  sw: "{date}: wastani wa kati t/ha {m:.1f}, mwaka mbaya (p10) t/ha {p10:.1f}"
  hi: "{date}: माध्यिका {m:.1f} t/ha, खराब वर्ष (p10) {p10:.1f} t/ha"
  de: "{date}: Median {m:.1f} t/ha, schlechtes Jahr (p10) {p10:.1f} t/ha"
model_sowing:
  en: "Planting-window optimisation (season model × 15 years)"
  es: "Optimización de la ventana de siembra (modelo de temporada × 15 años)"
  fr: "Optimisation de la fenêtre de semis (modèle de saison × 15 ans)"
  sw: "Kuboresha kipindi cha kupanda (modeli ya msimu × miaka 15)"
  hi: "बुवाई-अवधि अनुकूलन (मौसम मॉडल × 15 वर्ष)"
  de: "Optimierung des Saatfensters (Saisonmodell × 15 Jahre)"
sow_note:
  en: "Past weather is a guide, not a forecast; variety choice changes the result."
  es: "El clima pasado orienta, no pronostica; la variedad elegida cambia el resultado."
  fr: "La météo passée guide, elle ne prévoit pas ; le choix variétal change le résultat."
  sw: "Hali ya hewa iliyopita ni mwongozo, si utabiri; aina ya mbegu hubadilisha matokeo."
  hi: "पिछला मौसम मार्गदर्शन है, पूर्वानुमान नहीं; किस्म का चुनाव परिणाम बदलता है।"
  de: "Vergangenes Wetter ist ein Anhaltspunkt, keine Vorhersage; die Sortenwahl ändert das Ergebnis."
dis_ref_late_blight: {en: "Hutton criteria (AHDB 2017)", es: "Criterios de Hutton (AHDB 2017)", fr: "Critères de Hutton (AHDB 2017)", sw: "Vigezo vya Hutton (AHDB 2017)", hi: "Hutton मानदंड (AHDB 2017)", de: "Hutton-Kriterien (AHDB 2017)"}
dis_ref_stripe_rust: {en: "de Vallavieille-Pope et al. 1995", es: "de Vallavieille-Pope et al. 1995", fr: "de Vallavieille-Pope et al. 1995", sw: "de Vallavieille-Pope et al. 1995", hi: "de Vallavieille-Pope et al. 1995", de: "de Vallavieille-Pope et al. 1995"}
dis_ref_powdery_mildew: {en: "Gubler et al. 1999 (simplified)", es: "Gubler et al. 1999 (simplificado)", fr: "Gubler et al. 1999 (simplifié)", sw: "Gubler et al. 1999 (kilichorahisishwa)", hi: "Gubler et al. 1999 (सरलीकृत)", de: "Gubler et al. 1999 (vereinfacht)"}
dis_ref_legume_leaf_disease: {en: "Leaf-wetness proxy (Sentelhas et al. 2008)", es: "Indicador de mojado foliar (Sentelhas et al. 2008)", fr: "Indicateur d'humectation foliaire (Sentelhas et al. 2008)", sw: "Kiashiria cha unyevu wa majani (Sentelhas et al. 2008)", hi: "पत्ती-गीलापन संकेतक (Sentelhas et al. 2008)", de: "Blattnässe-Ersatzgröße (Sentelhas et al. 2008)"}
dis_ref_white_mould: {en: "Wet-hours × temperature window", es: "Horas húmedas × rango de temperatura", fr: "Heures humides × plage de température", sw: "Saa za unyevu × kiwango cha joto", hi: "गीले घंटे × तापमान दायरा", de: "Nassstunden × Temperaturfenster"}
dis_ref_downy_mildew_millet: {en: "Wet-hours × temperature window", es: "Horas húmedas × rango de temperatura", fr: "Heures humides × plage de température", sw: "Saa za unyevu × kiwango cha joto", hi: "गीले घंटे × तापमान दायरा", de: "Nassstunden × Temperaturfenster"}
