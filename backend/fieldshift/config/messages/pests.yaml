# Degree-day pest cards (science/pests.py PESTS, engine/service.py _pest_cards). Actions follow IPM: scout first.
# Keys pest_action_<pest id>_<event index>; English must match the action in pests.py.
pest_action_alfalfa_weevil_0:
  en: "Start weekly sweep-net sampling"
  es: "Empiece el muestreo semanal con red entomológica"
  fr: "Commencez l'échantillonnage hebdomadaire au filet fauchoir"
  sw: "Anza kuchukua sampuli kila wiki kwa wavu wa kufagia"
  hi: "हर सप्ताह स्वीप-नेट से नमूना लेना शुरू करें"
  de: "Wöchentliche Kescherproben beginnen"
pest_action_alfalfa_weevil_1:
  en: "Scout tips for feeding; check economic threshold (UC IPM: 20 larvae / sweep)"
  es: "Revise las puntas por daños de alimentación; compare con el umbral económico (UC IPM: 20 larvas por pase)"
  fr: "Inspectez les extrémités (morsures) ; comparez au seuil économique (UC IPM : 20 larves par coup de filet)"
  sw: "Kagua ncha za mimea kwa dalili za kuliwa; linganisha na kiwango cha kiuchumi (UC IPM: viwavi 20 kwa ufagiaji)"
  hi: "सिरों पर खाने के निशान देखें; आर्थिक सीमा जाँचें (UC IPM: प्रति स्वीप 20 लार्वा)"
  de: "Triebspitzen auf Fraß prüfen; Schadschwelle beachten (UC IPM: 20 Larven je Kescherschlag)"
pest_action_alfalfa_weevil_2:
  en: "Consider early cutting instead of spraying if near harvest"
  es: "Si la cosecha está cerca, considere un corte anticipado en vez de aplicar"
  fr: "Si la récolte est proche, préférez une coupe anticipée à un traitement"
  sw: "Kama mavuno yamekaribia, fikiria kukata mapema badala ya kunyunyiza"
  hi: "कटाई नज़दीक हो तो छिड़काव के बजाय जल्दी कटाई पर विचार करें"
  de: "Kurz vor der Ernte lieber früher mähen als spritzen"
pest_action_western_corn_rootworm_0:
  en: "Larval feeding on roots starts — continuous corn at highest risk"
  es: "Empieza la alimentación de larvas en las raíces: el maíz tras maíz corre el mayor riesgo"
  fr: "Les larves commencent à attaquer les racines — le maïs sur maïs est le plus exposé"
  sw: "Funza wanaanza kula mizizi — mahindi baada ya mahindi yako hatarini zaidi"
  hi: "जड़ों पर लार्वा का खाना शुरू — लगातार मक्का वाले खेत सबसे अधिक जोखिम में"
  de: "Larvenfraß an den Wurzeln beginnt – Mais nach Mais ist am stärksten gefährdet"
pest_action_western_corn_rootworm_1:
  en: "Dig roots to rate injury"
  es: "Desentierre raíces para evaluar el daño"
  fr: "Déterrez des racines pour noter les dégâts"
  sw: "Chimbua mizizi kupima uharibifu"
  hi: "नुकसान आँकने के लिए जड़ें खोदकर देखें"
  de: "Wurzeln ausgraben und Schaden bonitieren"
pest_action_western_corn_rootworm_2:
  en: "Scout silks for adult beetles"
  es: "Revise los estigmas en busca de escarabajos adultos"
  fr: "Inspectez les soies à la recherche de chrysomèles adultes"
  sw: "Kagua nywele za gunzi kwa mbawakavu wakubwa"
  hi: "भुट्टे के रेशों पर वयस्क भृंग देखें"
  de: "Narbenfäden auf Käfer kontrollieren"
pest_action_european_corn_borer_0:
  en: "Scout for egg masses"
  es: "Busque masas de huevos"
  fr: "Recherchez les pontes"
  sw: "Tafuta makundi ya mayai"
  hi: "अंडों के समूह खोजें"
  de: "Nach Eigelegen suchen"
pest_action_european_corn_borer_1:
  en: "Scout ears/stalks"
  es: "Revise mazorcas y tallos"
  fr: "Inspectez épis et tiges"
  sw: "Kagua magunzi na mabua"
  hi: "भुट्टे और तने जाँचें"
  de: "Kolben und Stängel kontrollieren"
pest_action_corn_earworm_0:
  en: "Scout silks or fruit"
  es: "Revise estigmas o frutos"
  fr: "Inspectez soies ou fruits"
  sw: "Kagua nywele za gunzi au matunda"
  hi: "रेशे या फल जाँचें"
  de: "Narbenfäden oder Früchte kontrollieren"
pest_action_colorado_potato_beetle_0:
  en: "Scout field edges"
  es: "Revise los bordes del campo"
  fr: "Inspectez les bordures de la parcelle"
  sw: "Kagua kingo za shamba"
  hi: "खेत के किनारे जाँचें"
  de: "Feldränder kontrollieren"
pest_action_colorado_potato_beetle_1:
  en: "Scout for small larvae; threshold-based control"
  es: "Busque larvas pequeñas; controle solo si se supera el umbral"
  fr: "Recherchez les jeunes larves ; intervenez seulement au-delà du seuil"
  sw: "Tafuta viwavi wadogo; dhibiti tu wakizidi kiwango"
  hi: "छोटे लार्वा खोजें; सीमा पार होने पर ही नियंत्रण करें"
  de: "Auf junge Larven kontrollieren; Bekämpfung nur nach Schadschwelle"
pest_action_cereal_aphids_0:
  en: "Check 100 tillers for rolled leaves"
  es: "Revise 100 macollos en busca de hojas enrolladas"
  fr: "Contrôlez 100 talles pour repérer les feuilles enroulées"
  sw: "Kagua machipukizi 100 kwa majani yaliyojikunja"
  hi: "100 कल्लों में मुड़ी हुई पत्तियाँ जाँचें"
  de: "100 Triebe auf eingerollte Blätter prüfen"
pest_action_fall_armyworm_0:
  en: "Scout whorls for egg masses, windowpane damage and fresh frass"
  es: "Revise los cogollos: masas de huevos, daño en ventana y excremento fresco"
  fr: "Inspectez les cornets : pontes, dégâts en fenêtre et déjections fraîches"
  sw: "Kagua kilele cha mmea: makundi ya mayai, matundu madogo kwenye majani na kinyesi kibichi"
  hi: "पौधे की गोभ जाँचें: अंडों के समूह, खिड़की जैसे छेद और ताज़ा मल"
  de: "Herz der Pflanzen kontrollieren: Eigelege, Fensterfraß und frischer Kot"
pest_scout_title:
  en: "{pest}: scout weekly (generation {gen})"
  es: "{pest}: revise cada semana (generación {gen})"
  fr: "{pest} : inspectez chaque semaine (génération {gen})"
  sw: "{pest}: kagua kila wiki (kizazi {gen})"
  hi: "{pest}: हर सप्ताह जाँचें (पीढ़ी {gen})"
  de: "{pest}: wöchentlich kontrollieren ({gen}. Generation)"
pest_faw_action:
  en: "Young plants are most vulnerable in the whorl stage; scout 20 plants in 5 spots weekly (FAO FAW guidance)."
  es: "Las plantas jóvenes son más vulnerables en la etapa de cogollo; revise 20 plantas en 5 puntos cada semana (guía FAO sobre el gusano cogollero)."
  fr: "Les jeunes plants sont les plus vulnérables au stade cornet ; inspectez 20 plants en 5 endroits chaque semaine (guide FAO chenille légionnaire)."
  sw: "Mimea michanga iko hatarini zaidi katika hatua ya kilele; kagua mimea 20 katika maeneo 5 kila wiki (mwongozo wa FAO kuhusu viwavijeshi vamizi)."
  hi: "छोटे पौधे गोभ अवस्था में सबसे कमज़ोर होते हैं; हर सप्ताह 5 जगहों पर 20 पौधे जाँचें (FAO फ़ॉल आर्मीवर्म मार्गदर्शन)।"
  de: "Junge Pflanzen sind im Herzblattstadium am anfälligsten; wöchentlich 20 Pflanzen an 5 Stellen kontrollieren (FAO-Leitfaden Heerwurm)."
pest_sum:
  en: "Insects develop with heat. Since {biofix}, {dd} degree-days (base {tlow} °C) have accumulated."
  es: "Los insectos se desarrollan con el calor. Desde el {biofix} se han acumulado {dd} grados-día (base {tlow} °C)."
  fr: "Les insectes se développent avec la chaleur. Depuis le {biofix}, {dd} degrés-jours (base {tlow} °C) se sont accumulés."
  sw: "Wadudu hukua kwa joto. Tangu {biofix}, nyuzi-siku {dd} (msingi {tlow} °C) zimekusanyika."
  hi: "कीट गर्मी से बढ़ते हैं। {biofix} से अब तक {dd} डिग्री-दिन (आधार {tlow} °C) जमा हुए हैं।"
  de: "Insekten entwickeln sich mit Wärme. Seit dem {biofix} haben sich {dd} Gradtage (Basis {tlow} °C) angesammelt."
pest_step_dd:
  en: "Degree-days to date: {dd} °C·d; in 7 days: {dd7} °C·d (NASA POWER + forecast)."
  es: "Grados-día hasta hoy: {dd} °C·d; en 7 días: {dd7} °C·d (NASA POWER + pronóstico)."
  fr: "Degrés-jours à ce jour : {dd} °C·j ; dans 7 jours : {dd7} °C·j (NASA POWER + prévision)."
  sw: "Nyuzi-siku hadi leo: {dd} °C·siku; baada ya siku 7: {dd7} °C·siku (NASA POWER + utabiri)."
  hi: "आज तक डिग्री-दिन: {dd} °C·दिन; 7 दिन में: {dd7} °C·दिन (NASA POWER + पूर्वानुमान)।"
  de: "Gradtage bis heute: {dd} °C·d; in 7 Tagen: {dd7} °C·d (NASA POWER + Vorhersage)."
pest_step_next:
  en: "Next life stage '{stage}' at {dd} °C·d ({ref})."
  es: "Próxima etapa '{stage}' a los {dd} °C·d ({ref})."
  fr: "Prochain stade « {stage} » à {dd} °C·j ({ref})."
  sw: "Hatua inayofuata '{stage}' kwa {dd} °C·siku ({ref})."
  hi: "अगली अवस्था '{stage}' {dd} °C·दिन पर ({ref})।"
  de: "Nächstes Stadium „{stage}“ bei {dd} °C·d ({ref})."
pest_step_when:
  en: "Degree-day models predict *when* to scout, not *how many* insects there are."
  es: "Los modelos de grados-día indican *cuándo* revisar, no *cuántos* insectos hay."
  fr: "Les modèles degrés-jours disent *quand* observer, pas *combien* d'insectes il y a."
  sw: "Modeli za nyuzi-siku hutabiri *lini* kukagua, si *wadudu wangapi* wapo."
  hi: "डिग्री-दिन मॉडल बताते हैं कि *कब* जाँचना है, यह नहीं कि *कितने* कीट हैं।"
  de: "Gradtagmodelle sagen, *wann* kontrolliert werden sollte, nicht *wie viele* Insekten da sind."
model_pest_dd:
  en: "Degree-day phenology ({ref})"
  es: "Fenología por grados-día ({ref})"
  fr: "Phénologie par degrés-jours ({ref})"
  sw: "Fenolojia ya nyuzi-siku ({ref})"
  hi: "डिग्री-दिन फ़ीनोलॉजी ({ref})"
  de: "Gradtag-Phänologie ({ref})"
pest_note:
  en: "Thresholds are regional literature values; local biofix observations improve timing."
  es: "Los umbrales son valores regionales de la literatura; las observaciones locales del inicio (biofix) mejoran el calendario."
  fr: "Les seuils sont des valeurs régionales publiées ; des observations locales du biofix améliorent le calendrier."
  sw: "Viwango ni thamani za kikanda kutoka kwa machapisho; uchunguzi wa eneo lako wa mwanzo (biofix) huboresha muda."
  hi: "सीमाएँ क्षेत्रीय शोध-मान हैं; स्थानीय बायोफ़िक्स अवलोकन समय को बेहतर बनाते हैं।"
  de: "Schwellen sind regionale Literaturwerte; lokale Biofix-Beobachtungen verbessern das Timing."
pest_caveat_grid:
  en: "Air temperature from a ~50 km grid; field microclimate differs."
  es: "Temperatura del aire de una cuadrícula de ~50 km; el microclima del campo es distinto."
  fr: "Température de l'air sur une maille de ~50 km ; le microclimat de la parcelle diffère."
  sw: "Joto la hewa kutoka gridi ya ~km 50; hali ndogo ya hewa shambani ni tofauti."
  hi: "हवा का तापमान ~50 किमी ग्रिड से; खेत का सूक्ष्म जलवायु अलग होता है।"
  de: "Lufttemperatur aus einem ~50-km-Raster; das Mikroklima am Feld weicht ab."
pest_caveat_biofix:
  en: "Uses 1 Jan (N) / 1 Jul (S) biofix unless a trap catch is entered."
  es: "Usa como inicio el 1 de enero (N) / 1 de julio (S) salvo que se registre una captura en trampa."
  fr: "Biofix au 1er janvier (N) / 1er juillet (S), sauf si une capture au piège est saisie."
  sw: "Hutumia mwanzo wa 1 Jan (Kaskazini) / 1 Jul (Kusini) isipokuwa ukiweka idadi ya mtego."
  hi: "जब तक ट्रैप पकड़ दर्ज न हो, 1 जनवरी (उत्तर) / 1 जुलाई (दक्षिण) बायोफ़िक्स मानता है।"
  de: "Biofix 1. Jan. (N) / 1. Juli (S), solange kein Fallenfang eingetragen ist."
