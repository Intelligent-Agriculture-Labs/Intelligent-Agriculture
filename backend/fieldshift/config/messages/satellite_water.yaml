  es: " Humedad del suelo superficial: percentil {pct:.0f}."
  fr: " Humidité du sol en surface : {pct:.0f}e centile."
  sw: " Unyevu wa udongo wa juu: asilimia-nafasi ya {pct:.0f}."
  hi: " सतही मिट्टी की नमी: {pct:.0f}वाँ पर्सेंटाइल।"
  de: " Bodenfeuchte an der Oberfläche: {pct:.0f}. Perzentil."
sw_gda_latency:
  en: "Latency: the latest week is {days} days old."
  es: "Retraso: la semana más reciente tiene {days} días."
  fr: "Délai : la semaine la plus récente date de {days} jours."
  sw: "Ucheleweshaji: wiki ya karibuni zaidi ina umri wa siku {days}."
  hi: "विलंब: नवीनतम सप्ताह {days} दिन पुराना है।"
  de: "Verzögerung: Die neueste Woche ist {days} Tage alt."
sw_gda_usdm:
  en: "These are the maps behind the U.S. Drought Monitor's groundwater input, now worldwide (GRACEDADM_CLSM025GL_7D)."
  es: "Son los mapas detrás del dato de agua subterránea del U.S. Drought Monitor, ahora a escala mundial (GRACEDADM_CLSM025GL_7D)."
  fr: "Ce sont les cartes derrière l'indicateur eaux souterraines du U.S. Drought Monitor, désormais mondiales (GRACEDADM_CLSM025GL_7D)."
  sw: "Hizi ndizo ramani zinazotumika kwa takwimu za maji ya ardhini za U.S. Drought Monitor, sasa kwa dunia nzima (GRACEDADM_CLSM025GL_7D)."
  hi: "ये वही नक्शे हैं जिनसे U.S. Drought Monitor का भूजल इनपुट बनता है, अब पूरी दुनिया के लिए (GRACEDADM_CLSM025GL_7D)।"
  de: "Das sind die Karten hinter dem Grundwasser-Input des U.S. Drought Monitor, jetzt weltweit (GRACEDADM_CLSM025GL_7D)."
sw_gda_step_low:
  en: "On an irrigated farm, severely low groundwater means wells may yield less and pumping costs rise; plan water use for the season and check your well level."
  es: "En una finca regada, un nivel de agua subterránea muy bajo significa que los pozos pueden dar menos y que el bombeo cuesta más; planifique el uso del agua para la temporada y revise el nivel de su pozo."
  fr: "Sur une exploitation irriguée, des eaux souterraines très basses signifient que les puits peuvent moins débiter et que le pompage coûte plus ; planifiez l'eau de la saison et vérifiez le niveau de votre puits."
  sw: "Kwenye shamba linalomwagiliwa, maji ya ardhini yaliyopungua sana yanamaanisha visima vinaweza kutoa kidogo na gharama za kusukuma kupanda; panga matumizi ya maji kwa msimu na ukague kina cha kisima chako."
  hi: "सिंचित खेत पर बहुत कम भूजल का मतलब है कि कुएँ कम पानी दे सकते हैं और पंपिंग महँगी होती है; मौसम के लिए पानी की योजना बनाएँ और अपने कुएँ का स्तर जाँचें।"
  de: "Auf einem bewässerten Betrieb heißt sehr niedriges Grundwasser: Brunnen können weniger liefern und das Pumpen wird teurer; planen Sie den Wasserverbrauch der Saison und prüfen Sie Ihren Brunnenpegel."
sw_gda_summary:
  en: "Groundwater here is at the {pct:.0f}th percentile for the time of year (GRACE-DA, week of {date})."
  es: "El agua subterránea aquí está en el percentil {pct:.0f} para esta época del año (GRACE-DA, semana del {date})."
  fr: "Les eaux souterraines sont ici au {pct:.0f}e centile pour la saison (GRACE-DA, semaine du {date})."
  sw: "Maji ya ardhini hapa yako kwenye asilimia-nafasi ya {pct:.0f} kwa wakati huu wa mwaka (GRACE-DA, wiki ya {date})."
  hi: "यहाँ भूजल साल के इस समय के लिए {pct:.0f}वें पर्सेंटाइल पर है (GRACE-DA, {date} का सप्ताह)।"
  de: "Das Grundwasser liegt hier für die Jahreszeit beim {pct:.0f}. Perzentil (GRACE-DA, Woche ab {date})."
sw_gda_model_name:
  en: "GRACE/GRACE-FO data assimilation into the Catchment land model (NASA GSFC)"
  es: "Asimilación de datos GRACE/GRACE-FO en el modelo de suelo Catchment (NASA GSFC)"
  fr: "Assimilation des données GRACE/GRACE-FO dans le modèle de surface Catchment (NASA GSFC)"
  sw: "Uingizaji wa data za GRACE/GRACE-FO kwenye modeli ya ardhi ya Catchment (NASA GSFC)"
  hi: "Catchment भूमि मॉडल में GRACE/GRACE-FO डेटा समावेशन (NASA GSFC)"
  de: "GRACE/GRACE-FO-Datenassimilation in das Landoberflächenmodell Catchment (NASA GSFC)"
sw_gda_note:
  en: "Model + satellite gravity; regional, and 2–3 months late."
  es: "Modelo + gravimetría satelital; regional y con 2–3 meses de retraso."
  fr: "Modèle + gravimétrie satellite ; régional, et avec 2–3 mois de retard."
  sw: "Modeli + mvutano wa setilaiti; ya kikanda, na huchelewa miezi 2–3."
  hi: "मॉडल + उपग्रह गुरुत्व; क्षेत्रीय, और 2–3 महीने देर से।"
  de: "Modell + Satelliten-Schwerefeld; regional und 2–3 Monate verspätet."

