# Translations of the rotation knowledge base (config/rotation_knowledge.yaml) shown in the multi-year plan check.
# Keys: rk_path_<pathogen>_name/_note, rk_crop_<crop>_note/_allelopathy, rk_rule_<rule>_text.
# English must equal the knowledge base text (scripts/check_i18n.py verifies). Latin names stay Latin.
rk_path_take_all_name: {en: "Gaeumannomyces tritici (take-all)", es: "Gaeumannomyces tritici (mal del pie)", fr: "Gaeumannomyces tritici (piétin-échaudage)", sw: "Gaeumannomyces tritici (kuoza mizizi ya nafaka)", hi: "Gaeumannomyces tritici (टेक-ऑल जड़ सड़न)", de: "Gaeumannomyces tritici (Schwarzbeinigkeit)"}
rk_path_take_all_note:
  en: "Root-rot fungus that lives on cereal and grass roots/stubble; one non-grass year starves it (two years is safer). Oats are immune; rye is tolerant. Continuous wheat can show 'take-all decline' after the 3rd–5th crop."
  es: "Hongo de pudrición de raíces que vive en raíces y rastrojo de cereales y pastos; un año sin gramíneas lo debilita (dos años es más seguro). La avena es inmune y el centeno tolerante. El trigo continuo puede mostrar 'declinación del mal del pie' tras el 3.er–5.º cultivo."
  fr: "Champignon des racines vivant sur les racines et chaumes de céréales et graminées ; une année sans graminées l'affame (deux ans, c'est plus sûr). L'avoine est immune, le seigle tolérant. Le blé sur blé peut montrer un « déclin du piétin » après la 3e–5e culture."
  sw: "Kuvu wa kuoza mizizi anayeishi kwenye mizizi na makapi ya nafaka na nyasi; mwaka mmoja bila nyasi humdhoofisha (miaka miwili ni salama zaidi). Shayiri ya oti haiathiriki; raye huvumilia. Ngano mfululizo inaweza kuonyesha 'kupungua kwa take-all' baada ya zao la 3–5."
  hi: "अनाज और घास की जड़ों/ठूँठ पर रहने वाला जड़-सड़न कवक; घास-रहित एक वर्ष इसे भूखा कर देता है (दो वर्ष अधिक सुरक्षित)। जई प्रतिरक्षित है, राई सहनशील। लगातार गेहूं में तीसरी–पाँचवीं फसल के बाद 'टेक-ऑल गिरावट' दिख सकती है।"
  de: "Wurzelpilz an Wurzeln und Stoppeln von Getreide und Gräsern; ein Jahr ohne Gräser hungert ihn aus (zwei Jahre sind sicherer). Hafer ist immun, Roggen tolerant. Bei Weizen nach Weizen kann nach der 3.–5. Folge ein „Take-all-Decline“ auftreten."
rk_path_fusarium_head_blight_name: {en: "Fusarium graminearum / F. culmorum (head blight, stalk & ear rot; DON mycotoxin)", es: "Fusarium graminearum / F. culmorum (fusariosis de la espiga, pudrición de tallo y mazorca; micotoxina DON)", fr: "Fusarium graminearum / F. culmorum (fusariose de l'épi, pourriture de tige et d'épi ; mycotoxine DON)", sw: "Fusarium graminearum / F. culmorum (ukungu wa suke, kuoza kwa shina na gunzi; sumu ya DON)", hi: "Fusarium graminearum / F. culmorum (बाली झुलसा, तना व भुट्टा सड़न; DON विष)", de: "Fusarium graminearum / F. culmorum (Ährenfusariose, Stängel- und Kolbenfäule; Mykotoxin DON)"}
rk_path_fusarium_head_blight_note:
  en: "Survives on maize and cereal residue on the soil surface for about 2 years; wheat right after maize (especially no-till) has the highest head-blight and DON risk."
  es: "Sobrevive unos 2 años en rastrojo de maíz y cereales sobre el suelo; el trigo justo después del maíz (sobre todo en siembra directa) tiene el mayor riesgo de fusariosis y DON."
  fr: "Survit environ 2 ans sur les résidus de maïs et de céréales en surface ; le blé juste après maïs (surtout en semis direct) présente le risque de fusariose et de DON le plus élevé."
  sw: "Huishi takriban miaka 2 kwenye masalia ya mahindi na nafaka juu ya udongo; ngano mara baada ya mahindi (hasa bila kulima) ina hatari kubwa zaidi ya ukungu wa suke na DON."
  hi: "मिट्टी की सतह पर मक्का और अनाज के अवशेषों पर लगभग 2 वर्ष जीवित रहता है; मक्का के ठीक बाद गेहूं (खासकर बिना जुताई) में बाली झुलसा और DON का खतरा सबसे अधिक।"
  de: "Überlebt etwa 2 Jahre auf Mais- und Getreiderückständen an der Bodenoberfläche; Weizen direkt nach Mais (besonders in Direktsaat) hat das höchste Fusarium- und DON-Risiko."
rk_path_eyespot_name: {en: "Oculimacula yallundae / O. acuformis (eyespot)", es: "Oculimacula yallundae / O. acuformis (mancha ocular)", fr: "Oculimacula yallundae / O. acuformis (piétin-verse)", sw: "Oculimacula yallundae / O. acuformis (madoa ya jicho)", hi: "Oculimacula yallundae / O. acuformis (आई-स्पॉट)", de: "Oculimacula yallundae / O. acuformis (Halmbruchkrankheit)"}
rk_path_eyespot_note:
  en: "Stem-base fungus carried on cereal stubble; a 1–2-year non-cereal break lowers but does not remove risk (air-borne spores). Wheat as previous crop is riskiest; early sowing raises risk."
  es: "Hongo de la base del tallo que se mantiene en el rastrojo de cereales; una pausa de 1–2 años sin cereales baja el riesgo pero no lo elimina (esporas por el aire). El trigo como cultivo anterior es lo más riesgoso; la siembra temprana aumenta el riesgo."
  fr: "Champignon du pied porté par les chaumes de céréales ; une pause de 1–2 ans sans céréales réduit le risque sans le supprimer (spores aériennes). Le blé en précédent est le plus risqué ; le semis précoce augmente le risque."
  sw: "Kuvu wa sehemu ya chini ya shina anayebebwa na makapi ya nafaka; mapumziko ya miaka 1–2 bila nafaka hupunguza hatari lakini hayaiondoi (vijidudu vya hewani). Ngano kama zao lililotangulia ni hatari zaidi; kupanda mapema huongeza hatari."
  hi: "अनाज के ठूँठ से फैलने वाला तना-आधार कवक; 1–2 वर्ष अनाज न लगाने से जोखिम घटता है पर खत्म नहीं होता (हवा से बीजाणु)। पिछली फसल गेहूं हो तो सबसे अधिक खतरा; जल्दी बुवाई जोखिम बढ़ाती है।"
  de: "Halmbasispilz, der an Getreidestoppeln überdauert; eine 1–2-jährige Getreidepause senkt das Risiko, beseitigt es aber nicht (luftbürtige Sporen). Weizen als Vorfrucht ist am riskantesten; Frühsaat erhöht das Risiko."
rk_path_cereal_cyst_nematode_name: {en: "Heterodera avenae / H. filipjevi (cereal cyst nematode)", es: "Heterodera avenae / H. filipjevi (nematodo del quiste de los cereales)", fr: "Heterodera avenae / H. filipjevi (nématode à kyste des céréales)", sw: "Heterodera avenae / H. filipjevi (minyoo fundo ya nafaka)", hi: "Heterodera avenae / H. filipjevi (अनाज सिस्ट सूत्रकृमि)", de: "Heterodera avenae / H. filipjevi (Getreidezystennematode)"}
rk_path_cereal_cyst_nematode_note:
  en: "Cysts persist a few years; populations fall quickly under broadleaf crops. Oats are the most damaged host; resistant cereal cultivars also reduce numbers."
  es: "Los quistes persisten unos años; las poblaciones bajan rápido bajo cultivos de hoja ancha. La avena es el hospedero más dañado; las variedades de cereal resistentes también reducen su número."
  fr: "Les kystes persistent quelques années ; les populations chutent vite sous cultures à feuilles larges. L'avoine est l'hôte le plus touché ; les variétés de céréales résistantes réduisent aussi les effectifs."
  sw: "Vifuko hudumu miaka michache; idadi hupungua haraka chini ya mazao yenye majani mapana. Shayiri ya oti ndiyo huathirika zaidi; aina za nafaka zinazostahimili pia hupunguza idadi."
  hi: "सिस्ट कुछ वर्ष रहते हैं; चौड़ी पत्ती वाली फसलों में संख्या तेज़ी से घटती है। जई सबसे अधिक प्रभावित मेज़बान है; प्रतिरोधी अनाज किस्में भी संख्या घटाती हैं।"
  de: "Zysten überdauern einige Jahre; unter Blattfrüchten sinken die Populationen rasch. Hafer wird am stärksten geschädigt; resistente Getreidesorten senken die Zahl ebenfalls."
rk_path_root_lesion_nematode_name: {en: "Pratylenchus thornei / P. neglectus (root-lesion nematodes)", es: "Pratylenchus thornei / P. neglectus (nematodos lesionadores de raíces)", fr: "Pratylenchus thornei / P. neglectus (nématodes des lésions racinaires)", sw: "Pratylenchus thornei / P. neglectus (minyoo wa vidonda vya mizizi)", hi: "Pratylenchus thornei / P. neglectus (जड़-घाव सूत्रकृमि)", de: "Pratylenchus thornei / P. neglectus (Wurzelläsionsnematoden)"}
rk_path_root_lesion_nematode_note:
  en: "Survive dry soil for years; wheat, chickpea and mung bean multiply P. thornei, canola multiplies P. neglectus. Sorghum, sunflower, cotton and most cover grasses are poor hosts."
  es: "Sobreviven años en suelo seco; trigo, garbanzo y frijol mungo multiplican P. thornei y la canola multiplica P. neglectus. Sorgo, girasol, algodón y la mayoría de los pastos de cobertura son malos hospederos."
  fr: "Survivent des années en sol sec ; blé, pois chiche et haricot mungo multiplient P. thornei, le colza multiplie P. neglectus. Sorgho, tournesol, coton et la plupart des graminées de couvert sont de mauvais hôtes."
  sw: "Huishi miaka mingi kwenye udongo mkavu; ngano, dengu na choroko huzidisha P. thornei, kanola huzidisha P. neglectus. Mtama, alizeti, pamba na nyasi nyingi za kufunika ni wenyeji duni."
  hi: "सूखी मिट्टी में वर्षों जीवित रहते हैं; गेहूं, चना और मूंग P. thornei बढ़ाते हैं, कैनोला P. neglectus बढ़ाता है। ज्वार, सूरजमुखी, कपास और अधिकांश आवरण घासें कमज़ोर मेज़बान हैं।"
  de: "Überleben jahrelang in trockenem Boden; Weizen, Kichererbse und Mungbohne vermehren P. thornei, Raps vermehrt P. neglectus. Sorghum, Sonnenblume, Baumwolle und die meisten Zwischenfruchtgräser sind schlechte Wirte."
rk_path_sclerotinia_name: {en: "Sclerotinia sclerotiorum (white mould / stem rot)", es: "Sclerotinia sclerotiorum (moho blanco / pudrición del tallo)", fr: "Sclerotinia sclerotiorum (pourriture blanche / sclérotiniose)", sw: "Sclerotinia sclerotiorum (ukungu mweupe / kuoza kwa shina)", hi: "Sclerotinia sclerotiorum (सफेद फफूंद / तना सड़न)", de: "Sclerotinia sclerotiorum (Weißstängeligkeit / Stängelfäule)"}
rk_path_sclerotinia_note:
  en: "Over 400 broadleaf hosts; hard sclerotia survive in soil for about 5 years (up to 8). Never stack two Sclerotinia hosts in consecutive years; grasses and cereals are non-hosts."
  es: "Más de 400 hospederos de hoja ancha; los esclerocios duros sobreviven en el suelo unos 5 años (hasta 8). Nunca ponga dos hospederos de Sclerotinia en años seguidos; los pastos y cereales no son hospederos."
  fr: "Plus de 400 hôtes à feuilles larges ; les sclérotes durs survivent environ 5 ans dans le sol (jusqu'à 8). N'enchaînez jamais deux hôtes du Sclerotinia ; graminées et céréales ne sont pas hôtes."
  sw: "Wenyeji zaidi ya 400 wenye majani mapana; sklerotia ngumu huishi udongoni takriban miaka 5 (hadi 8). Usipande wenyeji wawili wa Sclerotinia miaka inayofuatana; nyasi na nafaka si wenyeji."
  hi: "400 से अधिक चौड़ी पत्ती वाले मेज़बान; कठोर स्क्लेरोशिया मिट्टी में लगभग 5 वर्ष (8 तक) जीवित रहते हैं। लगातार दो वर्ष Sclerotinia के मेज़बान न लगाएँ; घास और अनाज मेज़बान नहीं हैं।"
  de: "Über 400 zweikeimblättrige Wirte; harte Sklerotien überleben etwa 5 Jahre (bis 8) im Boden. Nie zwei Sclerotinia-Wirte direkt nacheinander anbauen; Gräser und Getreide sind keine Wirte."
rk_path_clubroot_name: {en: "Plasmodiophora brassicae (clubroot)", es: "Plasmodiophora brassicae (hernia de las crucíferas)", fr: "Plasmodiophora brassicae (hernie des crucifères)", sw: "Plasmodiophora brassicae (uvimbe wa mizizi ya kabichi)", hi: "Plasmodiophora brassicae (क्लबरूट)", de: "Plasmodiophora brassicae (Kohlhernie)"}
rk_path_clubroot_note:
  en: "Resting spores survive 15–20 years (midpoint used) but most lose viability within two host-free years; keep at least two years between brassicas and control cruciferous weeds/volunteers."
  es: "Las esporas de resistencia sobreviven 15–20 años (se usa el punto medio), pero la mayoría pierde viabilidad en dos años sin hospedero; deje al menos dos años entre crucíferas y controle malezas crucíferas y plantas espontáneas."
  fr: "Les spores de conservation survivent 15–20 ans (valeur médiane utilisée) mais la plupart perdent leur viabilité en deux ans sans hôte ; laissez au moins deux ans entre crucifères et maîtrisez les adventices crucifères et repousses."
  sw: "Vijidudu vya kupumzika huishi miaka 15–20 (wastani umetumika) lakini vingi hupoteza uhai ndani ya miaka miwili bila mwenyeji; acha angalau miaka miwili kati ya mazao ya jamii ya kabichi na dhibiti magugu ya jamii hiyo na mimea inayoota yenyewe."
  hi: "विश्राम बीजाणु 15–20 वर्ष जीवित रहते हैं (मध्य मान लिया), पर अधिकांश मेज़बान-रहित दो वर्षों में निष्क्रिय हो जाते हैं; सरसों-कुल की फसलों के बीच कम से कम दो वर्ष रखें और सरसों-कुल के खरपतवार/स्वयं उगे पौधे नियंत्रित करें।"
  de: "Dauersporen überleben 15–20 Jahre (Mittelwert verwendet), die meisten verlieren aber binnen zwei wirtsfreier Jahre ihre Keimfähigkeit; mindestens zwei Jahre zwischen Kreuzblütlern lassen und kreuzblütige Unkräuter/Ausfallpflanzen bekämpfen."
rk_path_blackleg_name: {en: "Leptosphaeria maculans (blackleg / phoma stem canker)", es: "Leptosphaeria maculans (pie negro / cancro del tallo por phoma)", fr: "Leptosphaeria maculans (nécrose du collet / phoma)", sw: "Leptosphaeria maculans (mguu mweusi / donda la shina)", hi: "Leptosphaeria maculans (ब्लैकलेग / फोमा तना कैंकर)", de: "Leptosphaeria maculans (Wurzelhals- und Stängelfäule / Phoma)"}
rk_path_blackleg_note:
  en: "Survives on canola stubble until it decomposes (≈3–4 years); airborne spores from old stubble infect new crops, so rotate and keep new canola away from last year's stubble."
  es: "Sobrevive en el rastrojo de canola hasta que se descompone (≈3–4 años); las esporas del rastrojo viejo infectan los cultivos nuevos por el aire, así que rote y siembre la canola nueva lejos del rastrojo del año anterior."
  fr: "Survit sur les chaumes de colza jusqu'à leur décomposition (≈3–4 ans) ; les spores aériennes des vieux chaumes infectent les nouvelles cultures, donc faites tourner et éloignez le nouveau colza des chaumes de l'an passé."
  sw: "Huishi kwenye makapi ya kanola hadi yaoze (≈miaka 3–4); vijidudu vya hewani kutoka makapi ya zamani huambukiza mazao mapya, hivyo zungusha mazao na weka kanola mpya mbali na makapi ya mwaka jana."
  hi: "कैनोला के ठूँठ पर उसके सड़ने तक (≈3–4 वर्ष) जीवित रहता है; पुराने ठूँठ से हवा में बीजाणु नई फसल को संक्रमित करते हैं, इसलिए फसल-चक्र अपनाएँ और नई कैनोला को पिछले साल के ठूँठ से दूर रखें।"
  de: "Überlebt auf Rapsstoppeln, bis diese verrottet sind (≈3–4 Jahre); luftbürtige Sporen alter Stoppeln infizieren neue Bestände – daher Fruchtwechsel und neuen Raps fern von den Vorjahresstoppeln anbauen."
rk_path_verticillium_wilt_name: {en: "Verticillium dahliae / V. longisporum (Verticillium wilt)", es: "Verticillium dahliae / V. longisporum (marchitez por Verticillium)", fr: "Verticillium dahliae / V. longisporum (verticilliose)", sw: "Verticillium dahliae / V. longisporum (mnyauko wa Verticillium)", hi: "Verticillium dahliae / V. longisporum (वर्टिसिलियम उकठा)", de: "Verticillium dahliae / V. longisporum (Verticillium-Welke)"}
rk_path_verticillium_wilt_note:
  en: "Microsclerotia survive up to ~14 years, so rotation only slowly reduces inoculum; cereals, maize and grasses are non-hosts and the best break."
  es: "Los microesclerocios sobreviven hasta ~14 años, así que la rotación reduce el inóculo solo lentamente; cereales, maíz y pastos no son hospederos y son la mejor pausa."
  fr: "Les microsclérotes survivent jusqu'à ~14 ans, la rotation ne réduit donc l'inoculum que lentement ; céréales, maïs et graminées ne sont pas hôtes et constituent la meilleure coupure."
  sw: "Mikrosklerotia huishi hadi ~miaka 14, hivyo mzunguko hupunguza vimelea polepole tu; nafaka, mahindi na nyasi si wenyeji na ndiyo mapumziko bora."
  hi: "माइक्रोस्क्लेरोशिया ~14 वर्ष तक जीवित रहते हैं, इसलिए फसल-चक्र रोगाणु धीरे-धीरे ही घटाता है; अनाज, मक्का और घास मेज़बान नहीं हैं और सबसे अच्छा विराम हैं।"
  de: "Mikrosklerotien überleben bis ~14 Jahre, daher senkt Fruchtwechsel das Inokulum nur langsam; Getreide, Mais und Gräser sind keine Wirte und die beste Pause."
rk_path_aphanomyces_root_rot_name: {en: "Aphanomyces euteiches (pea & lentil root rot)", es: "Aphanomyces euteiches (pudrición de raíz de arveja y lenteja)", fr: "Aphanomyces euteiches (pourriture racinaire du pois et de la lentille)", sw: "Aphanomyces euteiches (kuoza mizizi ya njegere na adesi)", hi: "Aphanomyces euteiches (मटर और मसूर जड़ सड़न)", de: "Aphanomyces euteiches (Wurzelfäule an Erbse und Linse)"}
rk_path_aphanomyces_root_rot_note:
  en: "Oospores persist 10+ years; once a field is infested, peas and lentils fail for many years. Keep ≥5–6 years between peas and test soil before sowing."
  es: "Las oosporas persisten más de 10 años; una vez infestado el campo, arvejas y lentejas fracasan durante muchos años. Deje ≥5–6 años entre arvejas y analice el suelo antes de sembrar."
  fr: "Les oospores persistent plus de 10 ans ; une fois la parcelle infestée, pois et lentilles échouent pendant des années. Laissez ≥5–6 ans entre deux pois et faites analyser le sol avant de semer."
  sw: "Oospora hudumu zaidi ya miaka 10; shamba likishaambukizwa, njegere na adesi hushindwa kwa miaka mingi. Acha ≥miaka 5–6 kati ya njegere na pima udongo kabla ya kupanda."
  hi: "ऊस्पोर 10+ वर्ष रहते हैं; खेत संक्रमित हो जाए तो मटर और मसूर कई वर्षों तक विफल रहते हैं। मटर के बीच ≥5–6 वर्ष रखें और बुवाई से पहले मिट्टी जाँचें।"
  de: "Oosporen überdauern über 10 Jahre; ist ein Feld verseucht, fallen Erbsen und Linsen viele Jahre aus. Mindestens 5–6 Jahre zwischen Erbsen einhalten und den Boden vor der Saat testen."
rk_path_ascochyta_blight_name: {en: "Ascochyta / Didymella spp. (ascochyta blights of pulses)", es: "Ascochyta / Didymella spp. (rabia o antracnosis de las leguminosas)", fr: "Ascochyta / Didymella spp. (anthracnoses des légumineuses)", sw: "Ascochyta / Didymella spp. (ukungu wa ascochyta wa jamii ya kunde)", hi: "Ascochyta / Didymella spp. (दलहन का एस्कोकाइटा झुलसा)", de: "Ascochyta / Didymella spp. (Brennfleckenkrankheiten der Hülsenfrüchte)"}
rk_path_ascochyta_blight_note:
  en: "Host-specific species survive on pulse stubble and seed for ~2–4 years (midpoint used); sow clean seed far from last year's stubble and keep ≥3 years between the same pulse."
  es: "Especies específicas de cada hospedero sobreviven en rastrojo y semilla de leguminosas ~2–4 años (se usa el punto medio); siembre semilla sana lejos del rastrojo del año anterior y deje ≥3 años entre la misma leguminosa."
  fr: "Des espèces spécifiques de l'hôte survivent ~2–4 ans sur les chaumes et semences de légumineuses (valeur médiane utilisée) ; semez des graines saines loin des chaumes de l'an passé et laissez ≥3 ans entre deux mêmes légumineuses."
  sw: "Aina maalum kwa kila mwenyeji huishi kwenye makapi na mbegu za kunde ~miaka 2–4 (wastani umetumika); panda mbegu safi mbali na makapi ya mwaka jana na acha ≥miaka 3 kati ya zao lile lile la kunde."
  hi: "मेज़बान-विशिष्ट प्रजातियाँ दलहन के ठूँठ और बीज पर ~2–4 वर्ष जीवित रहती हैं (मध्य मान लिया); पिछले साल के ठूँठ से दूर स्वस्थ बीज बोएँ और एक ही दलहन के बीच ≥3 वर्ष रखें।"
  de: "Wirtsspezifische Arten überleben ~2–4 Jahre auf Stoppeln und Saatgut von Hülsenfrüchten (Mittelwert verwendet); gesundes Saatgut fern der Vorjahresstoppeln säen und ≥3 Jahre zwischen derselben Hülsenfrucht lassen."
rk_path_phytophthora_capsici_name: {en: "Phytophthora capsici (Phytophthora blight of vegetables)", es: "Phytophthora capsici (tizón por Phytophthora de hortalizas)", fr: "Phytophthora capsici (mildiou à Phytophthora des légumes)", sw: "Phytophthora capsici (baka la Phytophthora la mboga)", hi: "Phytophthora capsici (सब्ज़ियों का फाइटोफ्थोरा झुलसा)", de: "Phytophthora capsici (Phytophthora-Fäule an Gemüse)"}
rk_path_phytophthora_capsici_note:
  en: "Oospores survive several years in wet soils; rotate away from peppers, cucurbits and tomato for ≥3 years and avoid waterlogged fields."
  es: "Las oosporas sobreviven varios años en suelos húmedos; rote sin pimientos, cucurbitáceas ni tomate durante ≥3 años y evite campos encharcados."
  fr: "Les oospores survivent plusieurs années en sols humides ; écartez poivrons, cucurbitacées et tomate pendant ≥3 ans et évitez les parcelles engorgées."
  sw: "Oospora huishi miaka kadhaa kwenye udongo wenye unyevu; usipande pilipili, maboga wala nyanya kwa ≥miaka 3 na epuka mashamba yanayotuamisha maji."
  hi: "ऊस्पोर गीली मिट्टी में कई वर्ष जीवित रहते हैं; ≥3 वर्ष तक मिर्च, कद्दू-वर्गीय और टमाटर न लगाएँ और जलभराव वाले खेतों से बचें।"
  de: "Oosporen überleben mehrere Jahre in nassen Böden; ≥3 Jahre keine Paprika, Kürbisgewächse und Tomaten anbauen und staunasse Felder meiden."
rk_path_phytophthora_sojae_name: {en: "Phytophthora sojae (Phytophthora root and stem rot of soybean)", es: "Phytophthora sojae (pudrición de raíz y tallo de la soja)", fr: "Phytophthora sojae (pourriture des racines et de la tige du soja)", sw: "Phytophthora sojae (kuoza mizizi na shina la soya)", hi: "Phytophthora sojae (सोयाबीन की जड़ और तना सड़न)", de: "Phytophthora sojae (Wurzel- und Stängelfäule der Soja)"}
rk_path_phytophthora_sojae_note:
  en: "Oospores persist many years; rotation helps only partly — resistant varieties and drainage matter more."
  es: "Las oosporas persisten muchos años; la rotación ayuda solo en parte: importan más las variedades resistentes y el drenaje."
  fr: "Les oospores persistent de nombreuses années ; la rotation n'aide qu'en partie — variétés résistantes et drainage comptent davantage."
  sw: "Oospora hudumu miaka mingi; mzunguko husaidia kwa sehemu tu — aina zinazostahimili na mifereji ni muhimu zaidi."
  hi: "ऊस्पोर कई वर्ष रहते हैं; फसल-चक्र आंशिक ही मदद करता है — प्रतिरोधी किस्में और जल निकासी अधिक मायने रखती हैं।"
  de: "Oosporen überdauern viele Jahre; Fruchtwechsel hilft nur teilweise – resistente Sorten und Drainage sind wichtiger."
rk_path_rhizoctonia_name: {en: "Rhizoctonia solani (root & crown rot, black scurf, sheath blight)", es: "Rhizoctonia solani (pudrición de raíz y corona, costra negra, tizón de la vaina)", fr: "Rhizoctonia solani (pourriture des racines et du collet, rhizoctone brun, rhizoctone de la gaine)", sw: "Rhizoctonia solani (kuoza mizizi na shingo, ukoko mweusi, baka la ala)", hi: "Rhizoctonia solani (जड़ व शीर्ष सड़न, काली पपड़ी, आवरण झुलसा)", de: "Rhizoctonia solani (Wurzel- und Rübenfäule, Pockenkrankheit, Blattscheidenfäule)"}
rk_path_rhizoctonia_note:
  en: "Very wide host range and long saprophytic survival; maize before sugar beet raises crown-rot risk (AG 2-2). Cereals and grasses reduce but do not eliminate it."
  es: "Rango de hospederos muy amplio y larga supervivencia saprofítica; el maíz antes de la remolacha azucarera aumenta el riesgo de pudrición de la corona (AG 2-2). Cereales y pastos lo reducen pero no lo eliminan."
  fr: "Gamme d'hôtes très large et longue survie saprophyte ; le maïs avant betterave augmente le risque de pourriture du collet (AG 2-2). Céréales et graminées le réduisent sans l'éliminer."
  sw: "Wenyeji wengi sana na huishi muda mrefu kwenye mabaki; mahindi kabla ya kiazi sukari huongeza hatari ya kuoza shingo (AG 2-2). Nafaka na nyasi hupunguza lakini haziondoi."
  hi: "बहुत व्यापक मेज़बान और लंबे समय तक मृतजीवी जीवित रहना; चुकंदर से पहले मक्का शीर्ष-सड़न का खतरा बढ़ाता है (AG 2-2)। अनाज और घास इसे घटाते हैं पर खत्म नहीं करते।"
  de: "Sehr breiter Wirtskreis und lange saprophytische Überdauerung; Mais vor Zuckerrübe erhöht das Risiko der Späten Rübenfäule (AG 2-2). Getreide und Gräser senken es, beseitigen es aber nicht."
rk_path_pythium_name: {en: "Pythium spp. (damping-off, root rot, cavity spot)", es: "Pythium spp. (damping-off o caída de plántulas, pudrición de raíz, mancha cavitada)", fr: "Pythium spp. (fonte des semis, pourriture racinaire, maladie de la tache)", sw: "Pythium spp. (kunyauka kwa miche, kuoza mizizi, madoa ya mashimo)", hi: "Pythium spp. (आर्द्र गलन, जड़ सड़न, कैविटी स्पॉट)", de: "Pythium spp. (Umfallkrankheit, Wurzelfäule, Cavity Spot)"}
rk_path_pythium_note:
  en: "Generalist soil oomycete with long-lived oospores; rotation has little effect — use drainage, seed treatment and avoid cold wet sowing."
  es: "Oomiceto generalista del suelo con oosporas longevas; la rotación tiene poco efecto: use drenaje, tratamiento de semillas y evite sembrar en frío y humedad."
  fr: "Oomycète du sol généraliste aux oospores durables ; la rotation a peu d'effet — misez sur le drainage, le traitement des semences et évitez les semis en sol froid et humide."
  sw: "Kiumbe wa udongo anayeshambulia mimea mingi chenye oospora zinazodumu; mzunguko una athari ndogo — tumia mifereji, tibu mbegu na epuka kupanda kwenye baridi na unyevu."
  hi: "दीर्घजीवी ऊस्पोर वाला सामान्य मिट्टी ऊमाइसीट; फसल-चक्र का कम असर — जल निकासी, बीज उपचार अपनाएँ और ठंडी गीली मिट्टी में बुवाई से बचें।"
  de: "Generalistischer Bodenoomycet mit langlebigen Oosporen; Fruchtwechsel wirkt kaum – Drainage, Saatgutbehandlung und keine Saat in kalten, nassen Boden."
rk_path_soybean_cyst_nematode_name: {en: "Heterodera glycines (soybean cyst nematode, SCN)", es: "Heterodera glycines (nematodo del quiste de la soja, SCN)", fr: "Heterodera glycines (nématode à kyste du soja, SCN)", sw: "Heterodera glycines (minyoo fundo ya soya, SCN)", hi: "Heterodera glycines (सोयाबीन सिस्ट सूत्रकृमि, SCN)", de: "Heterodera glycines (Sojabohnen-Zystennematode, SCN)"}
rk_path_soybean_cyst_nematode_note:
  en: "Eggs in cysts survive about 10 years; each non-host year lowers numbers. Rotate soybean with maize/cereals and switch resistance sources."
  es: "Los huevos dentro de los quistes sobreviven unos 10 años; cada año sin hospedero baja su número. Rote la soja con maíz o cereales y cambie de fuente de resistencia."
  fr: "Les œufs dans les kystes survivent environ 10 ans ; chaque année sans hôte réduit les effectifs. Alternez le soja avec maïs/céréales et changez de source de résistance."
  sw: "Mayai ndani ya vifuko huishi takriban miaka 10; kila mwaka bila mwenyeji hupunguza idadi. Zungusha soya na mahindi/nafaka na badilisha vyanzo vya ustahimilivu."
  hi: "सिस्ट में अंडे लगभग 10 वर्ष जीवित रहते हैं; हर गैर-मेज़बान वर्ष संख्या घटाता है। सोयाबीन को मक्का/अनाज के साथ बदलें और प्रतिरोध के स्रोत बदलते रहें।"
  de: "Eier in Zysten überleben etwa 10 Jahre; jedes Nichtwirtsjahr senkt die Zahl. Soja mit Mais/Getreide wechseln und Resistenzquellen wechseln."
rk_path_beet_cyst_nematode_name: {en: "Heterodera schachtii (beet cyst nematode, BCN)", es: "Heterodera schachtii (nematodo del quiste de la remolacha, BCN)", fr: "Heterodera schachtii (nématode à kyste de la betterave)", sw: "Heterodera schachtii (minyoo fundo ya kiazi sukari, BCN)", hi: "Heterodera schachtii (चुकंदर सिस्ट सूत्रकृमि, BCN)", de: "Heterodera schachtii (Rübenzystennematode)"}
rk_path_beet_cyst_nematode_note:
  en: "Cysts persist several years; brassicas (oilseed rape, cabbage, non-resistant mustard) and chenopods also multiply it, so count them as 'beet years'. Resistant mustard / oil-radish catch crops reduce it."
  es: "Los quistes persisten varios años; las crucíferas (colza, repollo, mostaza no resistente) y las quenopodiáceas también lo multiplican, así que cuéntelas como 'años de remolacha'. Los cultivos trampa de mostaza o rábano oleaginoso resistentes lo reducen."
  fr: "Les kystes persistent plusieurs années ; les crucifères (colza, chou, moutarde non résistante) et chénopodes le multiplient aussi, comptez-les donc comme « années betterave ». Les couverts pièges de moutarde ou radis résistants le réduisent."
  sw: "Vifuko hudumu miaka kadhaa; mazao ya jamii ya kabichi (kanola, kabichi, haradali isiyostahimili) na jamii ya mchicha pia huuzidisha, hivyo yahesabu kama 'miaka ya kiazi sukari'. Mazao ya kunasa ya haradali / figili ya mafuta yanayostahimili huupunguza."
  hi: "सिस्ट कई वर्ष रहते हैं; सरसों-कुल (रेपसीड, पत्तागोभी, गैर-प्रतिरोधी सरसों) और बथुआ-कुल भी इसे बढ़ाते हैं, इसलिए इन्हें 'चुकंदर वर्ष' गिनें। प्रतिरोधी सरसों / तेल-मूली फंदा फसलें इसे घटाती हैं।"
  de: "Zysten überdauern mehrere Jahre; Kreuzblütler (Raps, Kohl, nicht resistenter Senf) und Gänsefußgewächse vermehren ihn ebenfalls – sie zählen als „Rübenjahre“. Resistente Senf-/Ölrettich-Zwischenfrüchte senken ihn."
rk_path_potato_cyst_nematode_name: {en: "Globodera rostochiensis / G. pallida (potato cyst nematode)", es: "Globodera rostochiensis / G. pallida (nematodo dorado de la papa)", fr: "Globodera rostochiensis / G. pallida (nématode à kyste de la pomme de terre)", sw: "Globodera rostochiensis / G. pallida (minyoo fundo ya viazi)", hi: "Globodera rostochiensis / G. pallida (आलू सिस्ट सूत्रकृमि)", de: "Globodera rostochiensis / G. pallida (Kartoffelzystennematode)"}
rk_path_potato_cyst_nematode_note:
  en: "Cysts survive 20+ years; eggs decline only ~20–33 % per year without potatoes, so ≥6-year breaks are needed in infested fields (plus resistant varieties)."
  es: "Los quistes sobreviven más de 20 años; los huevos disminuyen solo ~20–33 % por año sin papa, por lo que en campos infestados se necesitan pausas de ≥6 años (además de variedades resistentes)."
  fr: "Les kystes survivent plus de 20 ans ; les œufs ne diminuent que de ~20–33 % par an sans pomme de terre, il faut donc des pauses de ≥6 ans dans les parcelles infestées (plus des variétés résistantes)."
  sw: "Vifuko huishi zaidi ya miaka 20; mayai hupungua ~20–33 % tu kwa mwaka bila viazi, hivyo mapumziko ya ≥miaka 6 yanahitajika katika mashamba yaliyoambukizwa (pamoja na aina zinazostahimili)."
  hi: "सिस्ट 20+ वर्ष जीवित रहते हैं; बिना आलू के अंडे हर साल केवल ~20–33 % घटते हैं, इसलिए संक्रमित खेतों में ≥6 वर्ष का विराम चाहिए (साथ में प्रतिरोधी किस्में)।"
  de: "Zysten überleben über 20 Jahre; ohne Kartoffeln nehmen die Eier nur um ~20–33 % pro Jahr ab, daher sind auf befallenen Flächen ≥6 Jahre Pause nötig (plus resistente Sorten)."
rk_path_root_knot_nematode_name: {en: "Meloidogyne spp. (root-knot nematodes)", es: "Meloidogyne spp. (nematodos agalladores)", fr: "Meloidogyne spp. (nématodes à galles)", sw: "Meloidogyne spp. (minyoo vifundo vya mizizi)", hi: "Meloidogyne spp. (जड़-गाँठ सूत्रकृमि)", de: "Meloidogyne spp. (Wurzelgallennematoden)"}
rk_path_root_knot_nematode_note:
  en: "Thousands of hosts (most vegetables and tropical crops); eggs survive ~1–2 years but weeds keep populations alive. Use poor hosts (resistant sorghum-sudangrass, some cereals, groundnut against M. incognita) and biofumigant covers."
  es: "Miles de hospederos (la mayoría de hortalizas y cultivos tropicales); los huevos sobreviven ~1–2 años, pero las malezas mantienen las poblaciones. Use malos hospederos (sorgo-sudán resistente, algunos cereales, maní contra M. incognita) y coberturas biofumigantes."
  fr: "Des milliers d'hôtes (la plupart des légumes et cultures tropicales) ; les œufs survivent ~1–2 ans mais les adventices entretiennent les populations. Utilisez de mauvais hôtes (sorgho fourrager résistant, certaines céréales, arachide contre M. incognita) et des couverts biofumigants."
  sw: "Maelfu ya wenyeji (mboga nyingi na mazao ya tropiki); mayai huishi ~miaka 1–2 lakini magugu huwaweka hai. Tumia wenyeji duni (mtama-sudani unaostahimili, baadhi ya nafaka, karanga dhidi ya M. incognita) na mazao funika ya kufukiza kibiolojia."
  hi: "हज़ारों मेज़बान (अधिकांश सब्ज़ियाँ और उष्णकटिबंधीय फसलें); अंडे ~1–2 वर्ष जीवित रहते हैं पर खरपतवार संख्या बनाए रखते हैं। कमज़ोर मेज़बान (प्रतिरोधी सूडान ज्वार, कुछ अनाज, M. incognita के विरुद्ध मूंगफली) और जैव-धूमक आवरण फसलें अपनाएँ।"
  de: "Tausende Wirte (die meisten Gemüse- und Tropenkulturen); Eier überleben ~1–2 Jahre, doch Unkräuter erhalten die Populationen. Schlechte Wirte (resistentes Sudangras-Hybrid, manche Getreide, Erdnuss gegen M. incognita) und biofumigierende Zwischenfrüchte nutzen."
rk_path_corn_rootworm_name: {en: "Diabrotica virgifera / D. barberi (corn rootworm)", es: "Diabrotica virgifera / D. barberi (gusano de la raíz del maíz)", fr: "Diabrotica virgifera / D. barberi (chrysomèle des racines du maïs)", sw: "Diabrotica virgifera / D. barberi (funza wa mizizi ya mahindi)", hi: "Diabrotica virgifera / D. barberi (मक्का जड़ कीट)", de: "Diabrotica virgifera / D. barberi (Maiswurzelbohrer)"}
rk_path_corn_rootworm_note:
  en: "Eggs laid in maize hatch next year and larvae can only feed on maize roots, so one year without maize breaks the cycle — except where rotation-resistant or extended-diapause variants occur."
  es: "Los huevos puestos en el maíz eclosionan al año siguiente y las larvas solo se alimentan de raíces de maíz, así que un año sin maíz rompe el ciclo, salvo donde existen variantes resistentes a la rotación o con diapausa prolongada."
  fr: "Les œufs pondus dans le maïs éclosent l'année suivante et les larves ne se nourrissent que de racines de maïs : une année sans maïs coupe le cycle — sauf là où existent des variants résistants à la rotation ou à diapause prolongée."
  sw: "Mayai yanayotagwa kwenye mahindi huanguliwa mwaka unaofuata na funza hula mizizi ya mahindi tu, hivyo mwaka mmoja bila mahindi huvunja mzunguko — isipokuwa pale palipo na aina zinazostahimili mzunguko au zenye mapumziko marefu."
  hi: "मक्का में दिए अंडे अगले वर्ष फूटते हैं और लार्वा केवल मक्का की जड़ें खाते हैं, इसलिए मक्का-रहित एक वर्ष चक्र तोड़ देता है — सिवाय वहाँ जहाँ फसल-चक्र प्रतिरोधी या लंबी सुप्तावस्था वाले प्रकार हों।"
  de: "Im Mais abgelegte Eier schlüpfen im Folgejahr und die Larven fressen nur Maiswurzeln – ein Jahr ohne Mais unterbricht den Zyklus, außer wo fruchtwechselresistente Varianten oder solche mit verlängerter Diapause vorkommen."
rk_path_wireworms_name: {en: "Agriotes spp. (wireworms, click-beetle larvae)", es: "Agriotes spp. (gusanos alambre, larvas de elatéridos)", fr: "Agriotes spp. (taupins, larves d'élatérides)", sw: "Agriotes spp. (minyoo waya, viwavi wa mbawakavu wa kubofya)", hi: "Agriotes spp. (वायरवर्म, क्लिक-बीटल लार्वा)", de: "Agriotes spp. (Drahtwürmer, Schnellkäferlarven)"}
rk_path_wireworms_note:
  en: "Larvae live 4–5 years and build up under grass and leys; for 2–4 years after ploughing grassland, potatoes, maize, beet and root vegetables are at risk."
  es: "Las larvas viven 4–5 años y aumentan bajo pastos y praderas; durante 2–4 años después de romper una pradera, papas, maíz, remolacha y hortalizas de raíz están en riesgo."
  fr: "Les larves vivent 4–5 ans et prolifèrent sous prairies et graminées ; pendant 2–4 ans après le retournement d'une prairie, pommes de terre, maïs, betteraves et légumes-racines sont exposés."
  sw: "Viwavi huishi miaka 4–5 na huongezeka chini ya nyasi na malisho; kwa miaka 2–4 baada ya kulima malisho, viazi, mahindi, viazi sukari na mboga za mizizi viko hatarini."
  hi: "लार्वा 4–5 वर्ष जीते हैं और घास व चरागाह में बढ़ते हैं; चरागाह जोतने के बाद 2–4 वर्ष तक आलू, मक्का, चुकंदर और जड़ वाली सब्ज़ियाँ जोखिम में रहती हैं।"
  de: "Larven leben 4–5 Jahre und vermehren sich unter Grünland und Kleegras; 2–4 Jahre nach Grünlandumbruch sind Kartoffeln, Mais, Rüben und Wurzelgemüse gefährdet."
rk_path_striga_name: {en: "Striga hermonthica / S. asiatica (witchweed)", es: "Striga hermonthica / S. asiatica (hierba bruja)", fr: "Striga hermonthica / S. asiatica (herbe aux sorcières)", sw: "Striga hermonthica / S. asiatica (kiduha)", hi: "Striga hermonthica / S. asiatica (स्ट्राइगा / अगिया)", de: "Striga hermonthica / S. asiatica (Hexenkraut)"}
rk_path_striga_note:
  en: "Parasitic weed of cereals in Africa; seeds stay viable 10–20 years (midpoint used). Legume 'trap crops' trigger suicidal germination and add N that suppresses Striga."
  es: "Maleza parásita de cereales en África; las semillas siguen viables 10–20 años (se usa el punto medio). Las leguminosas 'trampa' provocan una germinación suicida y aportan N, que suprime la Striga."
  fr: "Plante parasite des céréales en Afrique ; les graines restent viables 10–20 ans (valeur médiane utilisée). Les légumineuses « pièges » provoquent une germination suicide et apportent de l'azote qui freine le Striga."
  sw: "Gugu vimelea la nafaka barani Afrika; mbegu hubaki hai miaka 10–20 (wastani umetumika). Mazao ya kunde ya 'kunasa' huchochea kuota kwa kujiua na huongeza naitrojeni inayozuia kiduha."
  hi: "अफ़्रीका में अनाज का परजीवी खरपतवार; बीज 10–20 वर्ष जीवित रहते हैं (मध्य मान लिया)। दलहनी 'फंदा फसलें' आत्मघाती अंकुरण कराती हैं और नाइट्रोजन जोड़ती हैं जो स्ट्राइगा को दबाती है।"
  de: "Parasitisches Unkraut des Getreides in Afrika; Samen bleiben 10–20 Jahre keimfähig (Mittelwert verwendet). Leguminosen als „Fangpflanzen“ lösen Selbstmordkeimung aus und liefern Stickstoff, der Striga unterdrückt."
rk_path_broomrape_name: {en: "Orobanche / Phelipanche spp. (broomrape)", es: "Orobanche / Phelipanche spp. (jopo)", fr: "Orobanche / Phelipanche spp. (orobanche)", sw: "Orobanche / Phelipanche spp. (gugu orobanki)", hi: "Orobanche / Phelipanche spp. (आग्या / ओरोबैंकी)", de: "Orobanche / Phelipanche spp. (Sommerwurz)"}
rk_path_broomrape_note:
  en: "Root-parasitic weed of pulses, sunflower and vegetables; seeds survive >10 years. Long breaks plus trap/catch crops (e.g. flax, cereals) are needed."
  es: "Maleza parásita de raíces de leguminosas, girasol y hortalizas; las semillas sobreviven más de 10 años. Se necesitan pausas largas y cultivos trampa (p. ej. lino, cereales)."
  fr: "Plante parasite des racines des légumineuses, du tournesol et des légumes ; les graines survivent plus de 10 ans. Il faut de longues pauses et des cultures pièges (p. ex. lin, céréales)."
  sw: "Gugu vimelea la mizizi ya kunde, alizeti na mboga; mbegu huishi zaidi ya miaka 10. Mapumziko marefu pamoja na mazao ya kunasa (mf. kitani, nafaka) yanahitajika."
  hi: "दलहन, सूरजमुखी और सब्ज़ियों की जड़ों का परजीवी खरपतवार; बीज 10 वर्ष से अधिक जीवित रहते हैं। लंबे विराम और फंदा फसलें (जैसे अलसी, अनाज) ज़रूरी हैं।"
  de: "Wurzelparasitisches Unkraut an Hülsenfrüchten, Sonnenblume und Gemüse; Samen überleben über 10 Jahre. Nötig sind lange Pausen plus Fang- und Lockpflanzen (z. B. Lein, Getreide)."
rk_path_cereal_stem_borers_name: {en: "Busseola fusca / Chilo partellus / Sesamia (cereal stem borers)", es: "Busseola fusca / Chilo partellus / Sesamia (barrenadores del tallo de cereales)", fr: "Busseola fusca / Chilo partellus / Sesamia (foreurs des tiges de céréales)", sw: "Busseola fusca / Chilo partellus / Sesamia (vipekecha shina vya nafaka)", hi: "Busseola fusca / Chilo partellus / Sesamia (अनाज तना छेदक)", de: "Busseola fusca / Chilo partellus / Sesamia (Getreidestängelbohrer)"}
rk_path_cereal_stem_borers_note:
  en: "Larvae survive the dry season inside cereal stalks; destroying stubble and rotating with legumes or cassava breaks the cycle."
  es: "Las larvas pasan la estación seca dentro de los tallos de cereales; destruir el rastrojo y rotar con leguminosas o yuca rompe el ciclo."
  fr: "Les larves passent la saison sèche dans les tiges de céréales ; détruire les chaumes et alterner avec légumineuses ou manioc coupe le cycle."
  sw: "Viwavi huishi kiangazi ndani ya mabua ya nafaka; kuharibu makapi na kuzungusha na mazao ya kunde au muhogo huvunja mzunguko."
  hi: "लार्वा सूखा मौसम अनाज के तनों के अंदर बिताते हैं; ठूँठ नष्ट करना और दलहन या कसावा के साथ फसल-चक्र चक्र तोड़ता है।"
  de: "Larven überdauern die Trockenzeit in Getreidestängeln; Stoppeln vernichten und Fruchtwechsel mit Leguminosen oder Maniok unterbrechen den Zyklus."
rk_path_fall_armyworm_name: {en: "Spodoptera frugiperda (fall armyworm)", es: "Spodoptera frugiperda (gusano cogollero)", fr: "Spodoptera frugiperda (chenille légionnaire d'automne)", sw: "Spodoptera frugiperda (viwavijeshi vamizi)", hi: "Spodoptera frugiperda (फ़ॉल आर्मीवर्म)", de: "Spodoptera frugiperda (Heerwurm)"}
rk_path_fall_armyworm_note:
  en: "Migratory moth with no soil-resting stage — crop rotation does NOT control it; scout, use intercropping/push-pull and natural enemies."
  es: "Polilla migratoria sin fase de reposo en el suelo: la rotación de cultivos NO la controla; revise el campo y use cultivos asociados, push-pull y enemigos naturales."
  fr: "Papillon migrateur sans stade de repos dans le sol — la rotation ne le contrôle PAS ; observez, utilisez cultures associées, push-pull et ennemis naturels."
  sw: "Nondo anayehama bila hatua ya kupumzika udongoni — mzunguko wa mazao HAUMDHIBITI; kagua shamba, tumia kilimo mseto/sukuma-vuta na maadui wa asili."
  hi: "प्रवासी पतंगा जिसकी मिट्टी में विश्राम अवस्था नहीं — फसल-चक्र इसे नियंत्रित नहीं करता; निगरानी करें, अंतर-फसल/पुश-पुल और प्राकृतिक शत्रु अपनाएँ।"
  de: "Wandernder Falter ohne Ruhestadium im Boden – Fruchtwechsel wirkt NICHT; kontrollieren, Mischkultur/Push-Pull und Nützlinge einsetzen."
rk_path_gray_leaf_spot_name: {en: "Cercospora zeae-maydis (gray leaf spot of maize)", es: "Cercospora zeae-maydis (mancha gris de la hoja del maíz)", fr: "Cercospora zeae-maydis (cercosporiose du maïs)", sw: "Cercospora zeae-maydis (madoa kijivu ya majani ya mahindi)", hi: "Cercospora zeae-maydis (मक्का का धूसर पत्ती धब्बा)", de: "Cercospora zeae-maydis (Blattfleckenkrankheit des Maises)"}
rk_path_gray_leaf_spot_note:
  en: "Survives on maize residue left on the surface; one year without maize (or burying residue) sharply reduces early infection."
  es: "Sobrevive en el rastrojo de maíz que queda en superficie; un año sin maíz (o enterrar el rastrojo) reduce mucho la infección temprana."
  fr: "Survit sur les résidus de maïs laissés en surface ; une année sans maïs (ou l'enfouissement des résidus) réduit fortement l'infection précoce."
  sw: "Huishi kwenye masalia ya mahindi yaliyoachwa juu ya udongo; mwaka mmoja bila mahindi (au kuzika masalia) hupunguza sana maambukizi ya mapema."
  hi: "सतह पर छोड़े गए मक्का अवशेषों पर जीवित रहता है; मक्का-रहित एक वर्ष (या अवशेष दबाना) शुरुआती संक्रमण को बहुत घटाता है।"
  de: "Überlebt auf Maisrückständen an der Oberfläche; ein Jahr ohne Mais (oder Einarbeiten der Rückstände) senkt die Frühinfektion stark."
rk_path_rhizomania_name: {en: "Beet necrotic yellow vein virus vectored by Polymyxa betae (rhizomania)", es: "Virus de las venas amarillas necróticas de la remolacha transmitido por Polymyxa betae (rizomanía)", fr: "Virus des nervures jaunes et nécrotiques de la betterave transmis par Polymyxa betae (rhizomanie)", sw: "Virusi vya mishipa ya njano ya kiazi sukari vinavyobebwa na Polymyxa betae (rizomania)", hi: "Polymyxa betae द्वारा फैलने वाला चुकंदर नेक्रोटिक पीली शिरा विषाणु (राइज़ोमेनिया)", de: "Nekrotisches Rübenvergilbungsvirus, übertragen durch Polymyxa betae (Rizomania)"}
rk_path_rhizomania_note:
  en: "The soil vector's resting spores carry the virus for 15+ years; rotation cannot clean a field — grow resistant varieties and avoid short beet rotations that intensify it."
  es: "Las esporas de resistencia del vector del suelo portan el virus más de 15 años; la rotación no puede limpiar un campo: siembre variedades resistentes y evite rotaciones cortas de remolacha que lo intensifican."
  fr: "Les spores de conservation du vecteur du sol portent le virus plus de 15 ans ; la rotation ne peut pas assainir une parcelle — semez des variétés résistantes et évitez les rotations betteravières courtes qui l'aggravent."
  sw: "Vijidudu vya kupumzika vya mbebaji wa udongoni hubeba virusi kwa zaidi ya miaka 15; mzunguko hauwezi kusafisha shamba — panda aina zinazostahimili na epuka mizunguko mifupi ya kiazi sukari inayouzidisha."
  hi: "मिट्टी के वाहक के विश्राम बीजाणु 15+ वर्ष तक विषाणु रखते हैं; फसल-चक्र खेत साफ़ नहीं कर सकता — प्रतिरोधी किस्में लगाएँ और चुकंदर के छोटे चक्रों से बचें जो इसे बढ़ाते हैं।"
  de: "Die Dauersporen des Bodenvektors tragen das Virus über 15 Jahre; Fruchtwechsel kann ein Feld nicht sanieren – resistente Sorten anbauen und enge Rübenfruchtfolgen meiden, die es verstärken."
rk_path_white_rot_name: {en: "Sclerotium cepivorum (white rot of onion & garlic)", es: "Sclerotium cepivorum (pudrición blanca de cebolla y ajo)", fr: "Sclerotium cepivorum (pourriture blanche de l'oignon et de l'ail)", sw: "Sclerotium cepivorum (kuoza mweupe wa kitunguu na kitunguu saumu)", hi: "Sclerotium cepivorum (प्याज़ और लहसुन का सफेद गलन)", de: "Sclerotium cepivorum (Mehlkrankheit an Zwiebel und Knoblauch)"}
rk_path_white_rot_note:
  en: "Sclerotia survive 20+ years; rotation alone will not clean a field — avoid moving infested soil and do not plant alliums there for many years."
  es: "Los esclerocios sobreviven más de 20 años; la rotación sola no limpia un campo: evite mover suelo infestado y no siembre aliáceas allí durante muchos años."
  fr: "Les sclérotes survivent plus de 20 ans ; la rotation seule n'assainit pas une parcelle — évitez de déplacer de la terre infestée et n'y plantez pas d'alliacées pendant de nombreuses années."
  sw: "Sklerotia huishi zaidi ya miaka 20; mzunguko peke yake hautasafisha shamba — epuka kuhamisha udongo ulioambukizwa na usipande jamii ya vitunguu hapo kwa miaka mingi."
  hi: "स्क्लेरोशिया 20+ वर्ष जीवित रहते हैं; अकेला फसल-चक्र खेत साफ़ नहीं करेगा — संक्रमित मिट्टी इधर-उधर न ले जाएँ और वहाँ कई वर्षों तक प्याज़-लहसुन न लगाएँ।"
  de: "Sklerotien überleben über 20 Jahre; Fruchtwechsel allein saniert kein Feld – keine befallene Erde verschleppen und dort viele Jahre keine Lauchgewächse pflanzen."
rk_path_common_scab_name: {en: "Streptomyces scabies (common scab)", es: "Streptomyces scabies (sarna común)", fr: "Streptomyces scabies (gale commune)", sw: "Streptomyces scabies (upele wa kawaida wa viazi)", hi: "Streptomyces scabies (सामान्य स्कैब)", de: "Streptomyces scabies (Gewöhnlicher Kartoffelschorf)"}
rk_path_common_scab_note:
  en: "Soil saprophyte that persists indefinitely; diverse rotations with disease-suppressive crops (mustard, sudangrass, rye) reduced scab 15–45 % vs continuous potato."
  es: "Saprófito del suelo que persiste indefinidamente; las rotaciones diversas con cultivos supresores (mostaza, pasto sudán, centeno) redujeron la sarna un 15–45 % frente a papa continua."
  fr: "Saprophyte du sol qui persiste indéfiniment ; des rotations diversifiées avec des cultures assainissantes (moutarde, sorgho fourrager, seigle) ont réduit la gale de 15–45 % par rapport à la pomme de terre continue."
  sw: "Kiumbe wa udongo anayedumu milele; mizunguko mbalimbali yenye mazao yanayozuia magonjwa (haradali, nyasi sudani, raye) ilipunguza upele kwa 15–45 % ukilinganisha na viazi mfululizo."
  hi: "मिट्टी का मृतजीवी जो अनिश्चित काल तक रहता है; रोग-दमनकारी फसलों (सरसों, सूडान घास, राई) वाले विविध फसल-चक्रों ने लगातार आलू की तुलना में स्कैब 15–45 % घटाया।"
  de: "Bodensaprophyt, der unbegrenzt überdauert; vielfältige Fruchtfolgen mit krankheitsunterdrückenden Kulturen (Senf, Sudangras, Roggen) senkten den Schorf um 15–45 % gegenüber Kartoffel nach Kartoffel."
rk_path_blackgrass_name: {en: "Alopecurus myosuroides (black-grass, herbicide-resistant grass weed)", es: "Alopecurus myosuroides (cola de zorra, gramínea resistente a herbicidas)", fr: "Alopecurus myosuroides (vulpin des champs, graminée résistante aux herbicides)", sw: "Alopecurus myosuroides (nyasi nyeusi, gugu linalostahimili dawa)", hi: "Alopecurus myosuroides (ब्लैक-ग्रास, खरपतवारनाशी-प्रतिरोधी घास)", de: "Alopecurus myosuroides (Ackerfuchsschwanz, herbizidresistentes Ungras)"}
rk_path_blackgrass_note:
  en: "Autumn-germinating grass weed favoured by winter crops; spring sowing cut plant densities by 88 % and ploughing by 69 % in UK trials; a 2-year spring-crop break depletes the short-lived seedbank."
  es: "Gramínea arvense que germina en otoño y se ve favorecida por cultivos de invierno; en ensayos del Reino Unido la siembra de primavera redujo su densidad un 88 % y la labranza con arado un 69 %; una pausa de 2 años con cultivos de primavera agota el banco de semillas de corta vida."
  fr: "Graminée adventice levant à l'automne, favorisée par les cultures d'hiver ; dans des essais britanniques, le semis de printemps a réduit les densités de 88 % et le labour de 69 % ; deux ans de cultures de printemps épuisent le stock semencier de courte durée."
  sw: "Gugu la nyasi linaloota vuli na kupendelewa na mazao ya baridi; katika majaribio ya Uingereza kupanda masika kulipunguza msongamano kwa 88 % na kulima kwa jembe kwa 69 %; mapumziko ya miaka 2 ya mazao ya masika humaliza hazina ya mbegu ya muda mfupi."
  hi: "शरद में उगने वाली घास-खरपतवार जिसे रबी फसलें बढ़ावा देती हैं; ब्रिटेन के परीक्षणों में बसंत बुवाई से संख्या 88 % और जुताई से 69 % घटी; बसंत फसलों का 2 वर्ष का विराम अल्पजीवी बीज-भंडार खत्म कर देता है।"
  de: "Im Herbst keimendes Ungras, gefördert durch Winterungen; in britischen Versuchen senkte Frühjahrssaat die Dichte um 88 % und Pflügen um 69 %; zwei Jahre Sommerungen erschöpfen den kurzlebigen Samenvorrat."
rk_rule_cereal_after_cereal_text:
  en: "Wheat after wheat (or another take-all/eyespot host cereal) yields less than after a break crop: Angus et al. found +0.5 t/ha (after oats) to +1.2 t/ha (after pulses) for the break. Typical loss 5–15 % (midpoint −10 %)."
  es: "Trigo tras trigo (u otro cereal hospedero de mal del pie o mancha ocular) rinde menos que tras un cultivo de pausa: Angus et al. hallaron +0,5 t/ha (tras avena) a +1,2 t/ha (tras leguminosas) con la pausa. Pérdida típica 5–15 % (punto medio −10 %)."
  fr: "Le blé sur blé (ou après une autre céréale hôte du piétin) rend moins qu'après une culture de rupture : Angus et al. ont trouvé +0,5 t/ha (après avoine) à +1,2 t/ha (après légumineuses) grâce à la rupture. Perte typique 5–15 % (médiane −10 %)."
  sw: "Ngano baada ya ngano (au nafaka nyingine mwenyeji wa take-all/madoa ya jicho) huzaa kidogo kuliko baada ya zao la mapumziko: Angus et al. walipata +0.5 t/ha (baada ya shayiri ya oti) hadi +1.2 t/ha (baada ya kunde) kwa mapumziko. Hasara ya kawaida 5–15 % (wastani −10 %)."
  hi: "गेहूं के बाद गेहूं (या टेक-ऑल/आई-स्पॉट का कोई अन्य मेज़बान अनाज) विराम-फसल के बाद की तुलना में कम उपज देता है: Angus et al. ने विराम से +0.5 t/ha (जई के बाद) से +1.2 t/ha (दलहन के बाद) पाया। सामान्य हानि 5–15 % (मध्य −10 %)।"
  de: "Weizen nach Weizen (oder einem anderen Wirtsgetreide für Schwarzbeinigkeit/Halmbruch) bringt weniger als nach einer Blattfrucht: Angus et al. fanden +0,5 t/ha (nach Hafer) bis +1,2 t/ha (nach Leguminosen). Typischer Verlust 5–15 % (Mitte −10 %)."
rk_rule_legume_before_cereal_text:
  en: "A grain legume before a cereal adds residual N and breaks cereal diseases; wheat yielded on average 1.2 t/ha more after pulses than after wheat (≈+20 % at 5–6 t/ha). Reduce N fertiliser by the crop's n_effect_kg_ha."
  es: "Una leguminosa de grano antes de un cereal deja N residual y corta enfermedades de cereales; el trigo rindió en promedio 1,2 t/ha más tras leguminosas que tras trigo (≈+20 % con 5–6 t/ha). Reduzca el fertilizante nitrogenado según el aporte de N del cultivo anterior."
  fr: "Une légumineuse à graines avant une céréale laisse de l'azote et coupe les maladies des céréales ; le blé a produit en moyenne 1,2 t/ha de plus après légumineuses qu'après blé (≈+20 % à 5–6 t/ha). Réduisez l'engrais azoté de l'arrière-effet azote du précédent."
  sw: "Zao la kunde la nafaka kabla ya nafaka huacha naitrojeni na kuvunja magonjwa ya nafaka; ngano ilizaa wastani wa t/ha 1.2 zaidi baada ya kunde kuliko baada ya ngano (≈+20 % kwa t/ha 5–6). Punguza mbolea ya naitrojeni kwa kiasi cha naitrojeni kilichoachwa na zao lililotangulia."
  hi: "अनाज से पहले दलहन बची हुई नाइट्रोजन जोड़ती है और अनाज के रोग-चक्र तोड़ती है; दलहन के बाद गेहूं की उपज गेहूं के बाद की तुलना में औसतन 1.2 t/ha अधिक रही (5–6 t/ha पर ≈+20 %)। पिछली फसल के नाइट्रोजन योगदान जितना उर्वरक घटाएँ।"
  de: "Eine Körnerleguminose vor Getreide hinterlässt Stickstoff und unterbricht Getreidekrankheiten; Weizen brachte nach Leguminosen im Mittel 1,2 t/ha mehr als nach Weizen (≈+20 % bei 5–6 t/ha). Die N-Düngung um die N-Nachlieferung der Vorfrucht senken."
rk_rule_oilseed_before_cereal_text:
  en: "Canola, mustard or flax before wheat breaks take-all and other cereal root diseases: about +0.8 t/ha (≈+15 %); the benefit carries ~20 % into a second wheat."
  es: "Canola, mostaza o lino antes del trigo cortan el mal del pie y otras enfermedades de raíz de cereales: alrededor de +0,8 t/ha (≈+15 %); el beneficio se mantiene ~20 % en un segundo trigo."
  fr: "Colza, moutarde ou lin avant blé coupent le piétin-échaudage et d'autres maladies racinaires des céréales : environ +0,8 t/ha (≈+15 %) ; le bénéfice se prolonge à ~20 % sur un second blé."
  sw: "Kanola, haradali au kitani kabla ya ngano huvunja take-all na magonjwa mengine ya mizizi ya nafaka: takriban +0.8 t/ha (≈+15 %); faida hubaki ~20 % kwa ngano ya pili."
  hi: "गेहूं से पहले कैनोला, सरसों या अलसी टेक-ऑल और अनाज के अन्य जड़ रोगों को तोड़ते हैं: लगभग +0.8 t/ha (≈+15 %); दूसरे गेहूं में भी ~20 % लाभ रहता है।"
  de: "Raps, Senf oder Lein vor Weizen unterbrechen Schwarzbeinigkeit und andere Getreidewurzelkrankheiten: etwa +0,8 t/ha (≈+15 %); im zweiten Weizen wirken noch ~20 % davon nach."
rk_rule_continuous_maize_text:
  en: "Maize after maize: continuous corn yielded 1.36 t/ha (−13 %) less than corn after soybean in Illinois and ~15 % less in Wisconsin; the penalty grows with years of continuous maize (N tie-up, residue, rootworm)."
  es: "Maíz tras maíz: el maíz continuo rindió 1,36 t/ha (−13 %) menos que el maíz tras soja en Illinois y ~15 % menos en Wisconsin; la pérdida crece con los años de maíz continuo (N inmovilizado, rastrojo, gusano de la raíz)."
  fr: "Maïs sur maïs : le maïs continu a produit 1,36 t/ha (−13 %) de moins que le maïs après soja dans l'Illinois et ~15 % de moins dans le Wisconsin ; la pénalité grandit avec les années de monoculture (azote immobilisé, résidus, chrysomèle)."
  sw: "Mahindi baada ya mahindi: mahindi mfululizo yalizaa t/ha 1.36 (−13 %) chini kuliko mahindi baada ya soya huko Illinois na ~15 % chini huko Wisconsin; hasara huongezeka kwa miaka ya mahindi mfululizo (naitrojeni kufungwa, masalia, funza wa mizizi)."
  hi: "मक्का के बाद मक्का: इलिनॉय में लगातार मक्का की उपज सोयाबीन के बाद वाली मक्का से 1.36 t/ha (−13 %) कम और विस्कॉन्सिन में ~15 % कम रही; लगातार मक्का के वर्षों के साथ नुकसान बढ़ता है (नाइट्रोजन रुकना, अवशेष, जड़ कीट)।"
  de: "Mais nach Mais: Daueranbau brachte in Illinois 1,36 t/ha (−13 %) weniger als Mais nach Soja und in Wisconsin ~15 % weniger; der Abschlag wächst mit den Jahren Mais nach Mais (N-Bindung, Rückstände, Maiswurzelbohrer)."
rk_rule_maize_before_wheat_fusarium_text:
  en: "Wheat, durum or barley directly after maize has the highest Fusarium head blight and DON risk, especially with surface residue (no-till). Plough/chop residue or choose a different predecessor."
  es: "Trigo, trigo duro o cebada justo después del maíz tienen el mayor riesgo de fusariosis de la espiga y DON, sobre todo con rastrojo en superficie (siembra directa). Are o pique el rastrojo, o elija otro antecesor."
  fr: "Blé, blé dur ou orge juste après maïs présentent le risque de fusariose et de DON le plus élevé, surtout avec des résidus en surface (semis direct). Labourez/broyez les résidus ou choisissez un autre précédent."
  sw: "Ngano, ngano ngumu au shayiri mara baada ya mahindi zina hatari kubwa zaidi ya ukungu wa suke wa Fusarium na DON, hasa masalia yakiwa juu (bila kulima). Lima/katakata masalia au chagua zao lingine la kutangulia."
  hi: "मक्का के तुरंत बाद गेहूं, कठिया गेहूं या जौ में फ्यूज़ेरियम बाली झुलसा और DON का खतरा सबसे अधिक है, खासकर सतह पर अवशेष होने पर (बिना जुताई)। अवशेष जोतें/काटें या दूसरी पूर्ववर्ती फसल चुनें।"
  de: "Weizen, Hartweizen oder Gerste direkt nach Mais haben das höchste Risiko für Ährenfusariosen und DON, besonders mit Rückständen an der Oberfläche (Direktsaat). Rückstände pflügen/häckseln oder eine andere Vorfrucht wählen."
rk_rule_soybean_after_soybean_text:
  en: "Soybean after soybean: first-year soybean yielded ~8 % more than soybean in longer soybean sequences; SCN, Phytophthora and white mould increase."
  es: "Soja tras soja: la soja de primer año rindió ~8 % más que la soja en secuencias más largas; aumentan el nematodo del quiste, Phytophthora y el moho blanco."
  fr: "Soja sur soja : un soja de première année a produit ~8 % de plus qu'un soja en succession plus longue ; nématode à kyste, Phytophthora et sclérotiniose augmentent."
  sw: "Soya baada ya soya: soya ya mwaka wa kwanza ilizaa ~8 % zaidi kuliko soya katika mfuatano mrefu wa soya; minyoo fundo, Phytophthora na ukungu mweupe huongezeka."
  hi: "सोयाबीन के बाद सोयाबीन: पहले वर्ष की सोयाबीन लंबे सोयाबीन क्रम की तुलना में ~8 % अधिक उपजी; SCN, फाइटोफ्थोरा और सफेद फफूंद बढ़ते हैं।"
  de: "Soja nach Soja: Soja im ersten Jahr brachte ~8 % mehr als Soja in längeren Sojafolgen; Zystennematoden, Phytophthora und Weißstängeligkeit nehmen zu."
rk_rule_alfalfa_autotoxicity_text:
  en: "Do not reseed alfalfa into (or right after) an old alfalfa stand: autotoxic compounds reduce seedling growth and the new stand's yield. Wait ≥1 year with another crop."
  es: "No resiembre alfalfa en (o justo después de) una alfalfa vieja: compuestos autotóxicos reducen el crecimiento de las plántulas y el rendimiento de la nueva pradera. Espere ≥1 año con otro cultivo."
  fr: "Ne ressemez pas de luzerne dans (ou juste après) une vieille luzernière : des composés autotoxiques freinent les plantules et le rendement du nouveau peuplement. Attendez ≥1 an avec une autre culture."
  sw: "Usipande alfalfa upya ndani ya (au mara baada ya) shamba la zamani la alfalfa: kemikali za kujisumu hupunguza ukuaji wa miche na mavuno ya shamba jipya. Subiri ≥mwaka 1 kwa zao lingine."
  hi: "पुराने रिजका खेत में (या तुरंत बाद) दोबारा रिजका न बोएँ: स्व-विषैले यौगिक पौध की बढ़वार और नई फसल की उपज घटाते हैं। दूसरी फसल के साथ ≥1 वर्ष रुकें।"
  de: "Luzerne nicht in (oder direkt nach) einen alten Luzernebestand säen: selbstunverträgliche Stoffe hemmen die Keimlinge und den Ertrag des neuen Bestands. ≥1 Jahr mit einer anderen Kultur warten."
rk_rule_brassica_return_text:
  en: "Brassicas (oilseed rape, mustard, cabbage) need ≥2 clear years between them: each additional crop between canola crops added 0.20–0.36 t/ha (midpoint 0.28 t/ha ≈ −11 % per missing break year) via less blackleg and root maggot."
  es: "Las crucíferas (colza, mostaza, repollo) necesitan ≥2 años libres entre ellas: cada cultivo adicional entre colzas sumó 0,20–0,36 t/ha (punto medio 0,28 t/ha ≈ −11 % por cada año de pausa faltante) gracias a menos pie negro y gusano de la raíz."
  fr: "Les crucifères (colza, moutarde, chou) demandent ≥2 années libres entre elles : chaque culture supplémentaire entre deux colzas a ajouté 0,20–0,36 t/ha (médiane 0,28 t/ha ≈ −11 % par année de rupture manquante) grâce à moins de phoma et de mouche du chou."
  sw: "Mazao ya jamii ya kabichi (kanola, haradali, kabichi) yanahitaji ≥miaka 2 bila mazao hayo kati yake: kila zao la ziada kati ya kanola liliongeza t/ha 0.20–0.36 (wastani t/ha 0.28 ≈ −11 % kwa kila mwaka wa mapumziko unaokosekana) kwa kupunguza mguu mweusi na funza wa mizizi."
  hi: "सरसों-कुल की फसलों (रेपसीड, सरसों, पत्तागोभी) के बीच ≥2 खाली वर्ष चाहिए: कैनोला फसलों के बीच हर अतिरिक्त फसल ने 0.20–0.36 t/ha जोड़ा (मध्य 0.28 t/ha ≈ हर छूटे विराम-वर्ष पर −11 %), ब्लैकलेग और जड़ मैगट कम होने से।"
  de: "Kreuzblütler (Raps, Senf, Kohl) brauchen ≥2 freie Jahre dazwischen: Jede zusätzliche Kultur zwischen zwei Raps-Jahren brachte 0,20–0,36 t/ha (Mitte 0,28 t/ha ≈ −11 % je fehlendem Pausenjahr) durch weniger Phoma und Kohlfliege."
rk_rule_pulse_return_text:
  en: "Peas and lentils within 4–5 years of another pea/lentil/faba/alfalfa crop risk Aphanomyces root rot and Ascochyta; once established, yield losses in infested fields can be severe."
  es: "Arvejas y lentejas a menos de 4–5 años de otra arveja, lenteja, haba o alfalfa arriesgan pudrición de raíz por Aphanomyces y Ascochyta; una vez establecidas, las pérdidas en campos infestados pueden ser graves."
  fr: "Pois et lentilles à moins de 4–5 ans d'un autre pois, lentille, féverole ou luzerne risquent l'aphanomyces et l'ascochytose ; une fois installées, les pertes dans les parcelles infestées peuvent être sévères."
  sw: "Njegere na adesi ndani ya miaka 4–5 baada ya njegere/adesi/maharagwe fava/alfalfa nyingine ziko hatarini kwa kuoza mizizi kwa Aphanomyces na Ascochyta; vikishaingia, hasara katika mashamba yaliyoambukizwa inaweza kuwa kubwa."
  hi: "दूसरी मटर/मसूर/बाकला/रिजका के 4–5 वर्ष के भीतर मटर और मसूर में अफ़ानोमाइसीज़ जड़ सड़न और एस्कोकाइटा का खतरा; एक बार स्थापित होने पर संक्रमित खेतों में उपज हानि गंभीर हो सकती है।"
  de: "Erbsen und Linsen innerhalb von 4–5 Jahren nach Erbse/Linse/Ackerbohne/Luzerne riskieren Aphanomyces-Wurzelfäule und Ascochyta; einmal etabliert, können die Verluste auf befallenen Flächen schwer sein."
rk_rule_solanaceae_short_rotation_text:
  en: "Potato/tomato/pepper less than 3 years after another Solanaceae: PCN, Verticillium, Rhizoctonia and scab build up; rotations reduced stem canker 10–50 %, black scurf 18–58 % and scab 15–45 % vs continuous potato."
  es: "Papa, tomate o pimiento a menos de 3 años de otra solanácea: se acumulan nematodo dorado, Verticillium, Rhizoctonia y sarna; las rotaciones redujeron el cancro del tallo 10–50 %, la costra negra 18–58 % y la sarna 15–45 % frente a papa continua."
  fr: "Pomme de terre/tomate/poivron moins de 3 ans après une autre solanacée : nématodes à kyste, verticilliose, rhizoctone et gale s'accumulent ; les rotations ont réduit le chancre de la tige de 10–50 %, le rhizoctone brun de 18–58 % et la gale de 15–45 % par rapport à la monoculture."
  sw: "Viazi/nyanya/pilipili chini ya miaka 3 baada ya zao lingine la jamii ya mnavu: minyoo fundo, Verticillium, Rhizoctonia na upele huongezeka; mizunguko ilipunguza donda la shina 10–50 %, ukoko mweusi 18–58 % na upele 15–45 % ukilinganisha na viazi mfululizo."
  hi: "दूसरी सोलेनेसी फसल के 3 वर्ष से कम में आलू/टमाटर/मिर्च: आलू सिस्ट सूत्रकृमि, वर्टिसिलियम, राइज़ोक्टोनिया और स्कैब बढ़ते हैं; फसल-चक्र ने लगातार आलू की तुलना में तना कैंकर 10–50 %, काली पपड़ी 18–58 % और स्कैब 15–45 % घटाया।"
  de: "Kartoffel/Tomate/Paprika weniger als 3 Jahre nach einem anderen Nachtschattengewächs: Nematoden, Verticillium, Rhizoctonia und Schorf reichern sich an; Fruchtfolgen senkten Stängelfäule um 10–50 %, Pockenkrankheit um 18–58 % und Schorf um 15–45 % gegenüber Kartoffel nach Kartoffel."
rk_rule_beet_short_rotation_text:
  en: "Sugar beet less than 4 years after beet or another BCN host (oilseed rape, cabbage, non-resistant mustard, quinoa): cyst nematode, rhizomania and Rhizoctonia increase."
  es: "Remolacha azucarera a menos de 4 años de remolacha u otro hospedero del nematodo del quiste (colza, repollo, mostaza no resistente, quinua): aumentan el nematodo, la rizomanía y Rhizoctonia."
  fr: "Betterave moins de 4 ans après une betterave ou un autre hôte du nématode à kyste (colza, chou, moutarde non résistante, quinoa) : nématode, rhizomanie et rhizoctone augmentent."
  sw: "Kiazi sukari chini ya miaka 4 baada ya kiazi sukari au mwenyeji mwingine wa minyoo fundo (kanola, kabichi, haradali isiyostahimili, kinoa): minyoo fundo, rizomania na Rhizoctonia huongezeka."
  hi: "चुकंदर या किसी अन्य BCN मेज़बान (रेपसीड, पत्तागोभी, गैर-प्रतिरोधी सरसों, क्विनोआ) के 4 वर्ष से कम में चुकंदर: सिस्ट सूत्रकृमि, राइज़ोमेनिया और राइज़ोक्टोनिया बढ़ते हैं।"
  de: "Zuckerrübe weniger als 4 Jahre nach Rübe oder einem anderen Wirt des Rübenzystennematoden (Raps, Kohl, nicht resistenter Senf, Quinoa): Nematoden, Rizomania und Rhizoctonia nehmen zu."
rk_rule_sclerotinia_host_sequence_text:
  en: "Two Sclerotinia hosts within 3 years (sunflower, canola, soybean, beans, pulses, carrot, potato …) let sclerotia (surviving ~5 years) build up; put a cereal or maize between them."
  es: "Dos hospederos de Sclerotinia en 3 años (girasol, canola, soja, frijoles, leguminosas, zanahoria, papa…) permiten que se acumulen esclerocios (que sobreviven ~5 años); ponga un cereal o maíz entre ellos."
  fr: "Deux hôtes du Sclerotinia en 3 ans (tournesol, colza, soja, haricots, légumineuses, carotte, pomme de terre…) font s'accumuler les sclérotes (qui survivent ~5 ans) ; intercalez une céréale ou du maïs."
  sw: "Wenyeji wawili wa Sclerotinia ndani ya miaka 3 (alizeti, kanola, soya, maharagwe, kunde, karoti, viazi …) huruhusu sklerotia (zinazoishi ~miaka 5) kuongezeka; weka nafaka au mahindi kati yao."
  hi: "3 वर्षों में Sclerotinia के दो मेज़बान (सूरजमुखी, कैनोला, सोयाबीन, सेम, दलहन, गाजर, आलू …) स्क्लेरोशिया (~5 वर्ष जीवित) को बढ़ने देते हैं; इनके बीच अनाज या मक्का लगाएँ।"
  de: "Zwei Sclerotinia-Wirte innerhalb von 3 Jahren (Sonnenblume, Raps, Soja, Bohnen, Leguminosen, Möhre, Kartoffel …) lassen Sklerotien (~5 Jahre lebensfähig) anwachsen; Getreide oder Mais dazwischen anbauen."
rk_rule_wireworm_after_grass_text:
  en: "Potatoes, maize, beet and root vegetables in the first 2–4 years after grassland or a ley face wireworm damage (larvae live 4–5 years); a cereal first lowers the risk."
  es: "Papas, maíz, remolacha y hortalizas de raíz en los primeros 2–4 años tras un pastizal o pradera sufren daños por gusano alambre (las larvas viven 4–5 años); un cereal primero reduce el riesgo."
  fr: "Pommes de terre, maïs, betteraves et légumes-racines dans les 2–4 premières années après une prairie subissent les taupins (larves vivant 4–5 ans) ; une céréale d'abord réduit le risque."
  sw: "Viazi, mahindi, viazi sukari na mboga za mizizi katika miaka 2–4 ya kwanza baada ya malisho hukumbwa na uharibifu wa minyoo waya (viwavi huishi miaka 4–5); kupanda nafaka kwanza hupunguza hatari."
  hi: "चरागाह के बाद पहले 2–4 वर्षों में आलू, मक्का, चुकंदर और जड़ वाली सब्ज़ियों को वायरवर्म नुकसान (लार्वा 4–5 वर्ष जीते हैं); पहले अनाज लगाने से खतरा घटता है।"
  de: "Kartoffeln, Mais, Rüben und Wurzelgemüse in den ersten 2–4 Jahren nach Grünland oder Kleegras leiden unter Drahtwurmfraß (Larven leben 4–5 Jahre); zuerst Getreide senkt das Risiko."
rk_rule_striga_trap_crop_text:
  en: "Where Striga occurs, cereal after cereal multiplies the seedbank; a legume or cotton 'trap crop' year triggers suicidal germination, adds N and lowers Striga in the next cereal."
  es: "Donde hay Striga, cereal tras cereal multiplica el banco de semillas; un año con leguminosa o algodón como 'cultivo trampa' provoca germinación suicida, aporta N y reduce la Striga en el cereal siguiente."
  fr: "Là où le Striga est présent, céréale sur céréale multiplie le stock de graines ; une année de légumineuse ou de coton « piège » provoque une germination suicide, apporte de l'azote et réduit le Striga dans la céréale suivante."
  sw: "Pale kiduha kipo, nafaka baada ya nafaka huzidisha hazina ya mbegu; mwaka wa zao la kunde au pamba la 'kunasa' huchochea kuota kwa kujiua, huongeza naitrojeni na kupunguza kiduha katika nafaka inayofuata."
  hi: "जहाँ स्ट्राइगा है, अनाज के बाद अनाज बीज-भंडार बढ़ाता है; दलहन या कपास का 'फंदा फसल' वर्ष आत्मघाती अंकुरण कराता है, नाइट्रोजन जोड़ता है और अगले अनाज में स्ट्राइगा घटाता है।"
  de: "Wo Striga vorkommt, vermehrt Getreide nach Getreide den Samenvorrat; ein Jahr Leguminose oder Baumwolle als „Fangpflanze“ löst Selbstmordkeimung aus, liefert Stickstoff und senkt Striga im folgenden Getreide."
rk_rule_rotation_diversity_text:
  en: "More diverse rotations (≥3 crops incl. a legume or perennial) raised maize yields 28.1 % on average across 11 long-term North American experiments (22.6 % in favourable years) and cut drought losses by 14–90 %."
  es: "Rotaciones más diversas (≥3 cultivos incluida una leguminosa o perenne) aumentaron el rendimiento del maíz un 28,1 % en promedio en 11 ensayos de largo plazo en Norteamérica (22,6 % en años favorables) y redujeron las pérdidas por sequía un 14–90 %."
  fr: "Des rotations plus diversifiées (≥3 cultures dont une légumineuse ou une pérenne) ont augmenté le rendement du maïs de 28,1 % en moyenne sur 11 essais de longue durée en Amérique du Nord (22,6 % les années favorables) et réduit les pertes dues à la sécheresse de 14–90 %."
  sw: "Mizunguko yenye aina nyingi zaidi (≥mazao 3 ikiwemo la kunde au la kudumu) iliongeza mavuno ya mahindi kwa wastani wa 28.1 % katika majaribio 11 ya muda mrefu Amerika Kaskazini (22.6 % miaka mizuri) na kupunguza hasara za ukame kwa 14–90 %."
  hi: "अधिक विविध फसल-चक्रों (≥3 फसलें, जिनमें एक दलहन या बहुवर्षीय) ने उत्तर अमेरिका के 11 दीर्घकालिक प्रयोगों में मक्का की उपज औसतन 28.1 % बढ़ाई (अच्छे वर्षों में 22.6 %) और सूखे के नुकसान 14–90 % घटाए।"
  de: "Vielfältigere Fruchtfolgen (≥3 Kulturen inkl. Leguminose oder Dauerkultur) steigerten den Maisertrag in 11 nordamerikanischen Langzeitversuchen im Mittel um 28,1 % (22,6 % in günstigen Jahren) und senkten Dürreverluste um 14–90 %."
rk_rule_predecessor_value_scale_text:
  en: "German predecessor-suitability classes: very favourable predecessor = 110–120 % relative yield, favourable 100–110 %, unfavourable 90–100 %, very unfavourable 80–90 %. Used to translate preceding_crop_value high/medium/low into +15/+5/−5 % (class midpoints)."
  es: "Clases alemanas de idoneidad del antecesor: antecesor muy favorable = 110–120 % de rendimiento relativo, favorable 100–110 %, desfavorable 90–100 %, muy desfavorable 80–90 %. Se usan para convertir el valor del antecesor alto/medio/bajo en +15/+5/−5 % (puntos medios de clase)."
  fr: "Classes allemandes de valeur du précédent : précédent très favorable = 110–120 % de rendement relatif, favorable 100–110 %, défavorable 90–100 %, très défavorable 80–90 %. Servent à traduire la valeur du précédent élevée/moyenne/faible en +15/+5/−5 % (milieux de classe)."
  sw: "Madaraja ya Ujerumani ya kufaa kwa zao lililotangulia: linalofaa sana = 110–120 % ya mavuno linganishi, linalofaa 100–110 %, lisilofaa 90–100 %, lisilofaa kabisa 80–90 %. Hutumika kubadilisha thamani ya zao lililotangulia juu/wastani/chini kuwa +15/+5/−5 % (katikati ya daraja)."
  hi: "जर्मन पूर्ववर्ती-उपयुक्तता वर्ग: बहुत अनुकूल पूर्ववर्ती = 110–120 % सापेक्ष उपज, अनुकूल 100–110 %, प्रतिकूल 90–100 %, बहुत प्रतिकूल 80–90 %। पूर्ववर्ती फसल मूल्य उच्च/मध्यम/कम को +15/+5/−5 % (वर्ग मध्य) में बदलने के लिए उपयोग।"
  de: "Vorfruchtwert-Klassen (Deutschland): sehr gute Vorfrucht = 110–120 % Relativertrag, gut 100–110 %, ungünstig 90–100 %, sehr ungünstig 80–90 %. Daraus wird der Vorfruchtwert hoch/mittel/gering als +15/+5/−5 % (Klassenmitte) abgeleitet."
rk_rule_cover_crop_fallow_text:
  en: "Replacing bare winter fallow with a cover crop cuts nitrate leaching and erosion; non-legume covers had no significant yield penalty and legume covers can replace part of the N fertiliser."
  es: "Sustituir el barbecho invernal desnudo por un cultivo de cobertura reduce la lixiviación de nitratos y la erosión; las coberturas no leguminosas no causaron pérdida de rendimiento significativa y las leguminosas pueden reemplazar parte del fertilizante nitrogenado."
  fr: "Remplacer la jachère hivernale nue par un couvert réduit le lessivage des nitrates et l'érosion ; les couverts non légumineux n'ont pas pénalisé le rendement et les couverts de légumineuses peuvent remplacer une partie de l'engrais azoté."
  sw: "Kubadilisha shamba tupu la majira ya baridi kwa zao funika hupunguza nitrati kuoshwa na mmomonyoko; mazao funika yasiyo ya kunde hayakupunguza mavuno kwa kiasi kikubwa na ya kunde yanaweza kuchukua nafasi ya sehemu ya mbolea ya naitrojeni."
  hi: "सर्दियों में खाली परती की जगह आवरण फसल नाइट्रेट रिसाव और कटाव घटाती है; गैर-दलहनी आवरण से उपज में खास कमी नहीं हुई और दलहनी आवरण नाइट्रोजन उर्वरक का कुछ हिस्सा बदल सकते हैं।"
  de: "Zwischenfrüchte statt offener Winterbrache senken Nitratauswaschung und Erosion; Nichtleguminosen kosteten keinen signifikanten Ertrag, Leguminosen können einen Teil der N-Düngung ersetzen."
rk_rule_mycorrhiza_long_fallow_text:
  en: "Strongly mycorrhizal crops (sunflower, flax, maize, chickpea, pigeon pea, cotton, cassava, faba bean) grow poorly and show P deficiency after long bare fallow or non-mycorrhizal crops (brassicas, beet, quinoa); inoculation with cropped soil more than doubled sunflower growth."
  es: "Los cultivos muy micorrícicos (girasol, lino, maíz, garbanzo, gandul, algodón, yuca, haba) crecen mal y muestran falta de P tras un barbecho desnudo largo o tras cultivos no micorrícicos (crucíferas, remolacha, quinua); inocular con suelo cultivado más que duplicó el crecimiento del girasol."
  fr: "Les cultures très mycorhizées (tournesol, lin, maïs, pois chiche, pois d'Angole, coton, manioc, féverole) poussent mal et manquent de P après une longue jachère nue ou des cultures non mycorhizées (crucifères, betterave, quinoa) ; l'inoculation avec de la terre cultivée a plus que doublé la croissance du tournesol."
  sw: "Mazao yanayotegemea sana mikoriza (alizeti, kitani, mahindi, dengu, mbaazi, pamba, muhogo, maharagwe fava) hukua vibaya na kuonyesha upungufu wa P baada ya shamba tupu kwa muda mrefu au mazao yasiyo na mikoriza (jamii ya kabichi, kiazi sukari, kinoa); kuongeza udongo uliolimwa kulizidisha ukuaji wa alizeti zaidi ya mara mbili."
  hi: "अत्यधिक माइकोराइज़ल फसलें (सूरजमुखी, अलसी, मक्का, चना, अरहर, कपास, कसावा, बाकला) लंबी खाली परती या गैर-माइकोराइज़ल फसलों (सरसों-कुल, चुकंदर, क्विनोआ) के बाद कमज़ोर बढ़ती हैं और फॉस्फोरस की कमी दिखाती हैं; खेती वाली मिट्टी से टीकाकरण ने सूरजमुखी की बढ़वार दोगुनी से अधिक की।"
  de: "Stark mykorrhizierte Kulturen (Sonnenblume, Lein, Mais, Kichererbse, Straucherbse, Baumwolle, Maniok, Ackerbohne) wachsen nach langer Schwarzbrache oder nach nicht mykorrhizierten Kulturen (Kreuzblütler, Rübe, Quinoa) schlecht und zeigen P-Mangel; Impfen mit Ackerboden verdoppelte das Sonnenblumenwachstum mehr als."
rk_rule_allelopathic_residue_text:
  en: "Small-seeded crops sown soon after sorghum, sorghum-sudangrass, sunflower or cereal-rye residues can suffer reduced emergence (sorgoleone, phenolics, benzoxazinoids); leave 2–4 weeks or incorporate residues."
  es: "Los cultivos de semilla pequeña sembrados poco después de rastrojos de sorgo, sorgo-sudán, girasol o centeno pueden emerger peor (sorgoleona, fenoles, benzoxazinoides); deje pasar 2–4 semanas o incorpore los rastrojos."
  fr: "Les cultures à petites graines semées peu après des résidus de sorgho, sorgho fourrager, tournesol ou seigle peuvent mal lever (sorgoléone, composés phénoliques, benzoxazinoïdes) ; attendez 2–4 semaines ou enfouissez les résidus."
  sw: "Mazao ya mbegu ndogo yanayopandwa muda mfupi baada ya masalia ya mtama, mtama-sudani, alizeti au raye yanaweza kuota vibaya (sorgoleone, fenoli, benzoksazinoidi); subiri wiki 2–4 au changanya masalia na udongo."
  hi: "ज्वार, सूडान ज्वार, सूरजमुखी या राई के अवशेषों के तुरंत बाद बोई गई छोटे बीज वाली फसलों का अंकुरण कम हो सकता है (सोर्गोलियोन, फ़ीनोलिक, बेंज़ोक्साज़िनॉइड); 2–4 सप्ताह रुकें या अवशेष मिट्टी में मिलाएँ।"
  de: "Kleinsamige Kulturen, die kurz nach Rückständen von Sorghum, Sudangras-Hybriden, Sonnenblume oder Roggen gesät werden, laufen schlechter auf (Sorgoleon, Phenole, Benzoxazinoide); 2–4 Wochen warten oder Rückstände einarbeiten."
rk_rule_spring_crop_grass_weeds_text:
  en: "Alternating winter and spring crops controls autumn-germinating grass weeds: spring-sown wheat had 88 % fewer black-grass plants than autumn-sown wheat; ploughing −69 %, delayed drilling −50 %."
  es: "Alternar cultivos de invierno y de primavera controla las gramíneas arvenses que germinan en otoño: el trigo de primavera tuvo 88 % menos plantas de cola de zorra que el de otoño; arado −69 %, siembra retrasada −50 %."
  fr: "Alterner cultures d'hiver et de printemps maîtrise les graminées levant à l'automne : le blé semé au printemps avait 88 % de vulpins en moins que le blé d'automne ; labour −69 %, semis retardé −50 %."
  sw: "Kubadilishana mazao ya baridi na ya masika hudhibiti magugu ya nyasi yanayoota vuli: ngano iliyopandwa masika ilikuwa na mimea 88 % michache ya nyasi nyeusi kuliko ngano ya vuli; kulima kwa jembe −69 %, kuchelewesha kupanda −50 %."
  hi: "रबी और बसंत फसलें बदलते रहने से शरद में उगने वाली घास-खरपतवार नियंत्रित होती है: बसंत में बोए गेहूं में शरद गेहूं से 88 % कम ब्लैक-ग्रास पौधे; जुताई −69 %, देर से बुवाई −50 %।"
  de: "Der Wechsel von Winterungen und Sommerungen hält im Herbst keimende Ungräser in Schach: Sommerweizen hatte 88 % weniger Ackerfuchsschwanz als Winterweizen; Pflügen −69 %, Spätsaat −50 %."
rk_rule_legume_share_text:
  en: "Aim for ≥25 % (better 33 %) legumes in the rotation, but respect pulse/clover self-intolerance (pea and vetch especially) and at least one soil-building year (ley, legume) per 5–6 years."
  es: "Apunte a ≥25 % (mejor 33 %) de leguminosas en la rotación, pero respete la autointolerancia de leguminosas y tréboles (sobre todo arveja y veza) y al menos un año de mejora del suelo (pradera, leguminosa) cada 5–6 años."
  fr: "Visez ≥25 % (mieux 33 %) de légumineuses dans la rotation, en respectant l'auto-intolérance des légumineuses et trèfles (surtout pois et vesce) et au moins une année d'amélioration du sol (prairie, légumineuse) tous les 5–6 ans."
  sw: "Lenga ≥25 % (bora 33 %) ya mazao ya kunde katika mzunguko, lakini heshimu kutovumiliana kwa kunde/karafuu (hasa njegere na vechi) na angalau mwaka mmoja wa kujenga udongo (malisho, kunde) kila miaka 5–6."
  hi: "फसल-चक्र में ≥25 % (बेहतर 33 %) दलहन रखें, पर दलहन/तिपतिया की स्व-असहिष्णुता (खासकर मटर और वेच) का ध्यान रखें और हर 5–6 वर्ष में कम से कम एक मिट्टी-निर्माण वर्ष (चरागाह, दलहन) रखें।"
  de: "≥25 % (besser 33 %) Leguminosen in der Fruchtfolge anstreben, dabei die Selbstunverträglichkeit von Körnerleguminosen und Klee (vor allem Erbse und Wicke) beachten und alle 5–6 Jahre mindestens ein bodenaufbauendes Jahr (Kleegras, Leguminose) einplanen."
rk_rule_rice_wheat_puddling_text:
  en: "Upland crops after puddled paddy rice face poor soil structure and late sowing; zero-till sowing or a short legume (mung bean) between rice and wheat reduces the penalty."
  es: "Los cultivos de secano tras arroz fangueado sufren mala estructura del suelo y siembra tardía; la siembra directa o una leguminosa corta (frijol mungo) entre arroz y trigo reduce la pérdida."
  fr: "Les cultures pluviales après un riz repiqué en boue subissent une mauvaise structure du sol et un semis tardif ; le semis direct ou une légumineuse courte (haricot mungo) entre riz et blé réduit la pénalité."
  sw: "Mazao ya nchi kavu baada ya mpunga wa tope hukumbwa na muundo mbaya wa udongo na kupanda kwa kuchelewa; kupanda bila kulima au zao fupi la kunde (choroko) kati ya mpunga na ngano hupunguza hasara."
  hi: "पडलिंग वाले धान के बाद ऊपरी भूमि फसलों को खराब मिट्टी संरचना और देर से बुवाई झेलनी पड़ती है; शून्य-जुताई बुवाई या धान और गेहूं के बीच छोटी दलहन (मूंग) नुकसान घटाती है।"
  de: "Trockenkulturen nach gepuddeltem Nassreis leiden unter schlechter Bodenstruktur und später Saat; Direktsaat oder eine kurze Leguminose (Mungbohne) zwischen Reis und Weizen mindert den Nachteil."
rk_crop_alfalfa_note:
  en: "Deep-rooted perennial legume: leaves a large N credit and better soil structure, but cannot follow itself (autotoxicity) or other legumes (root rots)."
  es: "Leguminosa perenne de raíz profunda: deja mucho N y mejor estructura del suelo, pero no puede seguirse a sí misma (autotoxicidad) ni a otras leguminosas (pudriciones de raíz)."
  fr: "Légumineuse pérenne à enracinement profond : laisse beaucoup d'azote et une meilleure structure du sol, mais ne peut pas se succéder à elle-même (autotoxicité) ni suivre d'autres légumineuses (pourritures racinaires)."
  sw: "Zao la kunde la kudumu lenye mizizi mirefu: huacha naitrojeni nyingi na muundo bora wa udongo, lakini haliwezi kujifuata lenyewe (kujisumu) wala kufuata kunde nyingine (kuoza mizizi)."
  hi: "गहरी जड़ वाली बहुवर्षीय दलहन: बहुत नाइट्रोजन और बेहतर मिट्टी संरचना छोड़ती है, पर खुद के बाद (स्व-विषाक्तता) या अन्य दलहनों के बाद (जड़ सड़न) नहीं लगती।"
  de: "Tiefwurzelnde mehrjährige Leguminose: hinterlässt viel Stickstoff und bessere Bodenstruktur, verträgt sich aber nicht mit sich selbst (Selbstunverträglichkeit) oder anderen Leguminosen (Wurzelfäulen)."
rk_crop_alfalfa_allelopathy:
  en: "Autotoxic: medicarpin and other compounds from old stands inhibit new alfalfa seedlings — wait ≥1 year (or 2–3 weeks for very young stands) before reseeding."
  es: "Autotóxica: la medicarpina y otros compuestos de praderas viejas inhiben las nuevas plántulas de alfalfa; espere ≥1 año (o 2–3 semanas si la pradera es muy joven) antes de resembrar."
  fr: "Autotoxique : la médicarpine et d'autres composés des vieilles luzernières inhibent les jeunes plants de luzerne — attendez ≥1 an (ou 2–3 semaines pour un peuplement très jeune) avant de ressemer."
  sw: "Hujisumu: medicarpin na kemikali nyingine za shamba la zamani huzuia miche mipya ya alfalfa — subiri ≥mwaka 1 (au wiki 2–3 kwa shamba changa sana) kabla ya kupanda upya."
  hi: "स्व-विषाक्त: पुरानी फसल का मेडिकार्पिन और अन्य यौगिक नए रिजका पौधों को रोकते हैं — दोबारा बोने से पहले ≥1 वर्ष (बहुत नई फसल हो तो 2–3 सप्ताह) रुकें।"
  de: "Selbstunverträglich: Medicarpin und andere Stoffe alter Bestände hemmen neue Luzernekeimlinge – vor der Neuansaat ≥1 Jahr (bei sehr jungen Beständen 2–3 Wochen) warten."
rk_crop_maize_note:
  en: "Tolerates itself better than most crops, but continuous maize yielded 13–15 % less than maize after soybean; one year without maize breaks rootworm. Heavy residue ties up N and carries Fusarium into a following wheat."
  es: "Se tolera a sí mismo mejor que la mayoría, pero el maíz continuo rindió 13–15 % menos que el maíz tras soja; un año sin maíz corta el gusano de la raíz. El abundante rastrojo inmoviliza N y lleva Fusarium al trigo siguiente."
  fr: "Se tolère mieux que la plupart des cultures, mais le maïs continu a produit 13–15 % de moins que le maïs après soja ; une année sans maïs coupe la chrysomèle. Ses résidus abondants immobilisent l'azote et transmettent le Fusarium au blé suivant."
  sw: "Hujivumilia kuliko mazao mengi, lakini mahindi mfululizo yalizaa 13–15 % chini kuliko mahindi baada ya soya; mwaka mmoja bila mahindi huvunja funza wa mizizi. Masalia mengi hufunga naitrojeni na kubeba Fusarium kwenda kwenye ngano inayofuata."
  hi: "अधिकांश फसलों से बेहतर खुद को सहती है, पर लगातार मक्का की उपज सोयाबीन के बाद वाली मक्का से 13–15 % कम रही; मक्का-रहित एक वर्ष जड़ कीट तोड़ता है। भारी अवशेष नाइट्रोजन बाँधते हैं और अगले गेहूं में फ्यूज़ेरियम ले जाते हैं।"
  de: "Verträgt sich selbst besser als die meisten Kulturen, doch Mais nach Mais brachte 13–15 % weniger als Mais nach Soja; ein Jahr ohne Mais unterbricht den Maiswurzelbohrer. Viel Stroh bindet Stickstoff und überträgt Fusarium auf folgenden Weizen."
rk_crop_maize_silage_note:
  en: "Whole plant is removed, so little residue returns and late-autumn harvest traffic compacts soil — follow with a cover or winter cereal."
  es: "Se retira la planta entera, así que vuelve poco rastrojo y el tránsito de cosecha a fines de otoño compacta el suelo; siga con una cobertura o un cereal de invierno."
  fr: "La plante entière est exportée : peu de résidus restent et les passages de récolte en fin d'automne tassent le sol — enchaînez avec un couvert ou une céréale d'hiver."
  sw: "Mmea mzima huondolewa, hivyo masalia machache hurudi na mashine za kuvuna mwishoni mwa vuli hugandamiza udongo — fuatisha zao funika au nafaka ya baridi."
  hi: "पूरा पौधा हटा लिया जाता है, इसलिए कम अवशेष लौटते हैं और देर शरद की कटाई में मशीनें मिट्टी दबाती हैं — बाद में आवरण फसल या रबी अनाज लगाएँ।"
  de: "Die ganze Pflanze wird abgefahren: Es bleibt wenig Rückstand und die späte Herbsternte verdichtet den Boden – danach eine Zwischenfrucht oder Wintergetreide anbauen."
rk_crop_winter_wheat_note:
  en: "Yields 0.5–1.2 t/ha more after a break crop than after wheat (largest after pulses); after maize, head-blight/DON risk rises."
  es: "Rinde 0,5–1,2 t/ha más tras un cultivo de pausa que tras trigo (más tras leguminosas); tras maíz sube el riesgo de fusariosis/DON."
  fr: "Rend 0,5–1,2 t/ha de plus après une culture de rupture qu'après blé (surtout après légumineuses) ; après maïs, le risque de fusariose/DON augmente."
  sw: "Huzaa t/ha 0.5–1.2 zaidi baada ya zao la mapumziko kuliko baada ya ngano (zaidi baada ya kunde); baada ya mahindi, hatari ya ukungu wa suke/DON hupanda."
  hi: "गेहूं के बाद की तुलना में विराम-फसल के बाद 0.5–1.2 t/ha अधिक उपज (दलहन के बाद सबसे अधिक); मक्का के बाद बाली झुलसा/DON का खतरा बढ़ता है।"
  de: "Bringt nach einer Blattfrucht 0,5–1,2 t/ha mehr als nach Weizen (am meisten nach Leguminosen); nach Mais steigt das Fusarium-/DON-Risiko."
rk_crop_barley_note:
  en: "Undemanding cereal; tolerates a cereal predecessor better than wheat, but cereal cyst nematode and net blotch build up in short barley sequences."
  es: "Cereal poco exigente; tolera un cereal antecesor mejor que el trigo, pero en secuencias cortas de cebada se acumulan el nematodo del quiste y la mancha en red."
  fr: "Céréale peu exigeante ; tolère mieux qu'un blé un précédent céréale, mais nématode à kyste et helminthosporiose s'accumulent dans les successions courtes d'orge."
  sw: "Nafaka isiyohitaji mengi; huvumilia nafaka iliyotangulia kuliko ngano, lakini minyoo fundo na madoa ya wavu huongezeka katika mfuatano mfupi wa shayiri."
  hi: "कम माँग वाला अनाज; गेहूं से बेहतर अनाज-पूर्ववर्ती सहता है, पर जौ के छोटे क्रम में अनाज सिस्ट सूत्रकृमि और जाल धब्बा बढ़ते हैं।"
  de: "Anspruchsloses Getreide; verträgt eine Getreidevorfrucht besser als Weizen, doch Zystennematoden und Netzflecken nehmen in engen Gerstenfolgen zu."
rk_crop_triticale_forage_note:
  en: "Winter forage cereal that protects the soil over winter; removed as forage so little residue returns. Shares take-all and eyespot with wheat."
  es: "Cereal forrajero de invierno que protege el suelo en invierno; se retira como forraje, así que vuelve poco rastrojo. Comparte mal del pie y mancha ocular con el trigo."
  fr: "Céréale fourragère d'hiver qui protège le sol l'hiver ; exportée en fourrage, elle laisse peu de résidus. Partage piétin-échaudage et piétin-verse avec le blé."
  sw: "Nafaka ya lishe ya baridi inayolinda udongo wakati wa baridi; huondolewa kama lishe hivyo masalia machache hurudi. Inashiriki take-all na madoa ya jicho na ngano."
  hi: "रबी चारा अनाज जो सर्दियों में मिट्टी बचाता है; चारे के रूप में हटाया जाता है इसलिए कम अवशेष लौटते हैं। गेहूं के साथ टेक-ऑल और आई-स्पॉट साझा करता है।"
  de: "Winterfuttergetreide, das den Boden über Winter schützt; als Futter abgefahren, bleibt wenig Rückstand. Teilt Schwarzbeinigkeit und Halmbruch mit Weizen."
rk_crop_sorghum_note:
  en: "Drought-hardy cereal; residues are allelopathic and dry the profile, so the next crop may start short of water. Shares Striga and stem borers with maize and millet."
  es: "Cereal resistente a la sequía; sus rastrojos son alelopáticos y secan el perfil, así que el siguiente cultivo puede empezar con poca agua. Comparte Striga y barrenadores con el maíz y el mijo."
  fr: "Céréale résistante à la sécheresse ; ses résidus sont allélopathiques et assèchent le profil, la culture suivante peut donc manquer d'eau au départ. Partage Striga et foreurs avec maïs et mil."
  sw: "Nafaka inayostahimili ukame; masalia yake yana sumu kwa mimea mingine na hukausha udongo, hivyo zao linalofuata linaweza kuanza na maji kidogo. Inashiriki kiduha na vipekecha na mahindi na uwele."
  hi: "सूखा सहने वाला अनाज; इसके अवशेष एलेलोपैथिक हैं और मिट्टी सुखाते हैं, इसलिए अगली फसल को शुरुआत में पानी कम मिल सकता है। मक्का और बाजरे के साथ स्ट्राइगा और तना छेदक साझा करता है।"
  de: "Dürrefestes Getreide; die Rückstände wirken allelopathisch und trocknen das Profil aus, die Folgekultur startet daher evtl. mit wenig Wasser. Teilt Striga und Stängelbohrer mit Mais und Hirse."
rk_crop_sorghum_allelopathy:
  en: "Sorghum roots/residues exude sorgoleone and phenolics that suppress weeds and can reduce stands/growth of small-seeded following crops (wheat, vegetables) for weeks."
  es: "Las raíces y rastrojos de sorgo liberan sorgoleona y fenoles que suprimen malezas y pueden reducir durante semanas la emergencia y el crecimiento de cultivos de semilla pequeña que siguen (trigo, hortalizas)."
  fr: "Racines et résidus de sorgho libèrent sorgoléone et composés phénoliques qui freinent les adventices et peuvent réduire pendant des semaines la levée et la croissance des cultures à petites graines suivantes (blé, légumes)."
  sw: "Mizizi na masalia ya mtama hutoa sorgoleone na fenoli zinazozuia magugu na zinaweza kupunguza kuota/ukuaji wa mazao ya mbegu ndogo yanayofuata (ngano, mboga) kwa wiki kadhaa."
  hi: "ज्वार की जड़ें/अवशेष सोर्गोलियोन और फ़ीनोलिक छोड़ते हैं जो खरपतवार दबाते हैं और कई सप्ताह तक बाद की छोटे बीज वाली फसलों (गेहूं, सब्ज़ियाँ) का अंकुरण/बढ़वार घटा सकते हैं।"
  de: "Sorghumwurzeln und -rückstände geben Sorgoleon und Phenole ab, die Unkraut unterdrücken und Aufgang/Wachstum kleinsamiger Folgekulturen (Weizen, Gemüse) wochenlang mindern können."
rk_crop_teff_note:
  en: "Short summer grass forage with few pests of its own; a gentle way to break an alfalfa stand."
  es: "Forraje de gramínea de verano y ciclo corto con pocas plagas propias; una forma suave de romper una alfalfa."
  fr: "Graminée fourragère d'été à cycle court, avec peu de ravageurs propres ; une façon douce de casser une luzernière."
  sw: "Nyasi fupi ya lishe ya kiangazi yenye wadudu wachache wake; njia laini ya kuvunja shamba la alfalfa."
  hi: "कम कीटों वाली छोटी गर्मी की चारा घास; रिजका खेत तोड़ने का आसान तरीका।"
  de: "Kurzes Sommerfuttergras mit wenigen eigenen Schädlingen; ein schonender Weg, einen Luzernebestand umzubrechen."
rk_crop_soybean_note:
  en: "Rotated soybean yielded ~8 % more than soybean after soybean; SCN, Phytophthora and white mould build up in short rotations. Maize after soybean yields ~15 % more than continuous maize."
  es: "La soja en rotación rindió ~8 % más que soja tras soja; en rotaciones cortas se acumulan nematodo del quiste, Phytophthora y moho blanco. El maíz tras soja rinde ~15 % más que el maíz continuo."
  fr: "Le soja en rotation a produit ~8 % de plus que soja sur soja ; nématode à kyste, Phytophthora et sclérotiniose s'accumulent dans les rotations courtes. Le maïs après soja rend ~15 % de plus que le maïs continu."
  sw: "Soya katika mzunguko ilizaa ~8 % zaidi kuliko soya baada ya soya; minyoo fundo, Phytophthora na ukungu mweupe huongezeka katika mizunguko mifupi. Mahindi baada ya soya huzaa ~15 % zaidi kuliko mahindi mfululizo."
  hi: "फसल-चक्र में सोयाबीन की उपज सोयाबीन के बाद सोयाबीन से ~8 % अधिक रही; छोटे चक्रों में SCN, फाइटोफ्थोरा और सफेद फफूंद बढ़ते हैं। सोयाबीन के बाद मक्का लगातार मक्का से ~15 % अधिक उपजती है।"
  de: "Soja in Fruchtfolge brachte ~8 % mehr als Soja nach Soja; in engen Folgen nehmen Zystennematoden, Phytophthora und Weißstängeligkeit zu. Mais nach Soja bringt ~15 % mehr als Mais nach Mais."
rk_crop_dry_bean_note:
  en: "Sensitive to white mould, root rots and bean rust — keep 3+ years between beans and away from other Sclerotinia hosts."
  es: "Sensible al moho blanco, pudriciones de raíz y roya del frijol: deje 3+ años entre frijoles y aléjelo de otros hospederos de Sclerotinia."
  fr: "Sensible à la sclérotiniose, aux pourritures racinaires et à la rouille — laissez 3 ans et plus entre deux haricots et à distance des autres hôtes du Sclerotinia."
  sw: "Huathiriwa na ukungu mweupe, kuoza mizizi na kutu ya maharagwe — acha miaka 3+ kati ya maharagwe na mbali na wenyeji wengine wa Sclerotinia."
  hi: "सफेद फफूंद, जड़ सड़न और सेम रतुआ के प्रति संवेदनशील — सेम के बीच 3+ वर्ष रखें और अन्य Sclerotinia मेज़बानों से दूर रखें।"
  de: "Anfällig für Weißstängeligkeit, Wurzelfäulen und Bohnenrost – 3+ Jahre zwischen Bohnen und Abstand zu anderen Sclerotinia-Wirten halten."
rk_crop_potato_note:
  en: "Needs 3–4 years between potatoes (≥6 where cyst nematodes are present). Avoid planting right after grass/ley (wireworm). Leaves a loose, weed-free seedbed but intensive tillage and harvest degrade structure."
  es: "Necesita 3–4 años entre papas (≥6 donde hay nematodos del quiste). Evite sembrarla justo después de pasto o pradera (gusano alambre). Deja una cama suelta y sin malezas, pero la labranza intensiva y la cosecha dañan la estructura."
  fr: "Demande 3–4 ans entre deux pommes de terre (≥6 en présence de nématodes à kyste). Évitez de la planter juste après prairie (taupins). Laisse un lit de semences meuble et propre, mais le travail intensif et la récolte dégradent la structure."
  sw: "Inahitaji miaka 3–4 kati ya viazi (≥6 palipo na minyoo fundo). Epuka kupanda mara baada ya nyasi/malisho (minyoo waya). Huacha kitalu laini kisicho na magugu lakini kulima kwingi na kuvuna huharibu muundo."
  hi: "आलू के बीच 3–4 वर्ष चाहिए (सिस्ट सूत्रकृमि हों तो ≥6)। घास/चरागाह के तुरंत बाद न लगाएँ (वायरवर्म)। ढीली, खरपतवार-रहित बीज-शय्या छोड़ता है पर गहन जुताई और कटाई संरचना बिगाड़ती है।"
  de: "Braucht 3–4 Jahre zwischen Kartoffeln (≥6 bei Zystennematoden). Nicht direkt nach Grünland/Kleegras pflanzen (Drahtwurm). Hinterlässt ein lockeres, unkrautfreies Saatbett, doch intensive Bodenbearbeitung und Ernte schädigen die Struktur."
rk_crop_tomato_note:
  en: "Shares Verticillium, root-knot nematodes, potato cyst nematode and Phytophthora with other Solanaceae and cucurbits — rotate with grass crops."
  es: "Comparte Verticillium, nematodos agalladores, nematodo dorado y Phytophthora con otras solanáceas y cucurbitáceas: rote con gramíneas."
  fr: "Partage verticilliose, nématodes à galles, nématode à kyste et Phytophthora avec les autres solanacées et cucurbitacées — alternez avec des graminées."
  sw: "Inashiriki Verticillium, minyoo vifundo, minyoo fundo ya viazi na Phytophthora na mazao mengine ya jamii ya mnavu na maboga — zungusha na mazao ya nyasi."
  hi: "अन्य सोलेनेसी और कद्दू-वर्गीय फसलों के साथ वर्टिसिलियम, जड़-गाँठ सूत्रकृमि, आलू सिस्ट सूत्रकृमि और फाइटोफ्थोरा साझा करता है — घास-फसलों के साथ फसल-चक्र अपनाएँ।"
  de: "Teilt Verticillium, Wurzelgallennematoden, Kartoffelzystennematoden und Phytophthora mit anderen Nachtschatten- und Kürbisgewächsen – mit Gräsern abwechseln."
rk_crop_safflower_note:
  en: "Deep taproot dries the subsoil (low water for the next crop) but leaves biopores; shares Sclerotinia and Verticillium with sunflower."
  es: "Su raíz pivotante profunda seca el subsuelo (poca agua para el siguiente cultivo) pero deja bioporos; comparte Sclerotinia y Verticillium con el girasol."
  fr: "Sa racine pivotante profonde assèche le sous-sol (peu d'eau pour la culture suivante) mais laisse des biopores ; partage Sclerotinia et verticilliose avec le tournesol."
  sw: "Mzizi mkuu mrefu hukausha udongo wa chini (maji kidogo kwa zao linalofuata) lakini huacha njia za mizizi; inashiriki Sclerotinia na Verticillium na alizeti."
  hi: "गहरी मूसला जड़ निचली मिट्टी सुखाती है (अगली फसल को कम पानी) पर जैव-छिद्र छोड़ती है; सूरजमुखी के साथ Sclerotinia और वर्टिसिलियम साझा करती है।"
  de: "Die tiefe Pfahlwurzel trocknet den Unterboden aus (wenig Wasser für die Folgekultur), hinterlässt aber Bioporen; teilt Sclerotinia und Verticillium mit der Sonnenblume."
rk_crop_sunflower_note:
  en: "Keep 5–6 years between sunflowers (NRW recommends 6) because of Sclerotinia, Verticillium, Phomopsis and broomrape; deep roots leave a dry subsoil."
  es: "Deje 5–6 años entre girasoles (NRW recomienda 6) por Sclerotinia, Verticillium, Phomopsis y jopo; sus raíces profundas dejan el subsuelo seco."
  fr: "Laissez 5–6 ans entre deux tournesols (NRW recommande 6) à cause du Sclerotinia, de la verticilliose, du phomopsis et de l'orobanche ; ses racines profondes laissent un sous-sol sec."
  sw: "Acha miaka 5–6 kati ya alizeti (NRW inashauri 6) kwa sababu ya Sclerotinia, Verticillium, Phomopsis na orobanki; mizizi mirefu huacha udongo wa chini mkavu."
  hi: "Sclerotinia, वर्टिसिलियम, फोमोप्सिस और आग्या के कारण सूरजमुखी के बीच 5–6 वर्ष रखें (NRW 6 की सलाह देता है); गहरी जड़ें निचली मिट्टी सूखी छोड़ती हैं।"
  de: "5–6 Jahre zwischen Sonnenblumen einhalten (NRW empfiehlt 6) wegen Sclerotinia, Verticillium, Phomopsis und Sommerwurz; die tiefen Wurzeln hinterlassen trockenen Unterboden."
rk_crop_sunflower_allelopathy:
  en: "Sunflower residues contain phenolics/sesquiterpene lactones that can suppress small-seeded following crops and weeds."
  es: "Los rastrojos de girasol contienen fenoles y lactonas sesquiterpénicas que pueden suprimir cultivos de semilla pequeña siguientes y malezas."
  fr: "Les résidus de tournesol contiennent des composés phénoliques et des lactones sesquiterpéniques qui peuvent freiner les cultures à petites graines suivantes et les adventices."
  sw: "Masalia ya alizeti yana fenoli/laktoni za seskuiterpeni zinazoweza kuzuia mazao ya mbegu ndogo yanayofuata na magugu."
  hi: "सूरजमुखी के अवशेषों में फ़ीनोलिक/सेस्क्विटरपीन लैक्टोन होते हैं जो बाद की छोटे बीज वाली फसलों और खरपतवारों को दबा सकते हैं।"
  de: "Sonnenblumenrückstände enthalten Phenole/Sesquiterpenlactone, die kleinsamige Folgekulturen und Unkräuter unterdrücken können."
rk_crop_pearl_millet_note:
  en: "Hardy cereal of the Sahel; after cowpea or groundnut it benefits from N and less Striga. Downy mildew and stem borers build up in continuous millet."
  es: "Cereal resistente del Sahel; tras caupí o maní aprovecha el N y sufre menos Striga. En mijo continuo se acumulan el mildiu velloso y los barrenadores."
  fr: "Céréale rustique du Sahel ; après niébé ou arachide, il profite de l'azote et de moins de Striga. Mildiou et foreurs s'accumulent en mil continu."
  sw: "Nafaka imara ya Sahel; baada ya kunde au karanga hufaidika na naitrojeni na kiduha kidogo. Ubwiri vinyoya na vipekecha huongezeka katika uwele mfululizo."
  hi: "साहेल का मज़बूत अनाज; लोबिया या मूंगफली के बाद नाइट्रोजन और कम स्ट्राइगा का लाभ मिलता है। लगातार बाजरे में मृदुरोमिल आसिता और तना छेदक बढ़ते हैं।"
  de: "Robustes Getreide des Sahel; nach Augenbohne oder Erdnuss profitiert es von Stickstoff und weniger Striga. Falscher Mehltau und Stängelbohrer nehmen bei Hirse nach Hirse zu."
rk_crop_cowpea_note:
  en: "Fixes N and acts as a Striga trap crop for the next cereal; shares root-knot nematodes, pod borers and viruses with other grain legumes."
  es: "Fija N y actúa como cultivo trampa de Striga para el cereal siguiente; comparte nematodos agalladores, barrenadores de vainas y virus con otras leguminosas de grano."
  fr: "Fixe l'azote et sert de culture piège à Striga pour la céréale suivante ; partage nématodes à galles, foreurs des gousses et virus avec les autres légumineuses à graines."
  sw: "Huweka naitrojeni na hufanya kazi ya zao la kunasa kiduha kwa nafaka inayofuata; inashiriki minyoo vifundo, vipekecha maganda na virusi na kunde nyingine."
  hi: "नाइट्रोजन जोड़ता है और अगले अनाज के लिए स्ट्राइगा फंदा फसल का काम करता है; अन्य दलहनों के साथ जड़-गाँठ सूत्रकृमि, फली छेदक और विषाणु साझा करता है।"
  de: "Bindet Stickstoff und wirkt als Striga-Fangpflanze für das folgende Getreide; teilt Wurzelgallennematoden, Hülsenbohrer und Viren mit anderen Körnerleguminosen."
rk_crop_sweet_potato_note:
  en: "Weevils and root-knot nematodes carry over on volunteer roots — rotate with cereals and remove crop debris."
  es: "Los gorgojos y nematodos agalladores persisten en raíces espontáneas: rote con cereales y retire los restos del cultivo."
  fr: "Charançons et nématodes à galles se maintiennent sur les racines de repousse — alternez avec des céréales et retirez les débris de culture."
  sw: "Fukusi na minyoo vifundo hubaki kwenye mizizi inayoota yenyewe — zungusha na nafaka na ondoa mabaki ya zao."
  hi: "घुन और जड़-गाँठ सूत्रकृमि स्वयं उगी जड़ों पर बने रहते हैं — अनाज के साथ फसल-चक्र अपनाएँ और फसल के अवशेष हटाएँ।"
  de: "Rüsselkäfer und Wurzelgallennematoden überdauern an Durchwuchsknollen – mit Getreide abwechseln und Pflanzenreste entfernen."
rk_crop_cover_rye_vetch_note:
  en: "Winter cover: rye scavenges leftover nitrate and protects soil, vetch fixes N. Terminate 2–3 weeks before planting small-seeded crops."
  es: "Cobertura de invierno: el centeno capta el nitrato sobrante y protege el suelo, la veza fija N. Termínela 2–3 semanas antes de sembrar cultivos de semilla pequeña."
  fr: "Couvert d'hiver : le seigle capte les nitrates résiduels et protège le sol, la vesce fixe l'azote. Détruisez-le 2–3 semaines avant de semer des cultures à petites graines."
  sw: "Zao funika la baridi: raye hukusanya nitrati iliyobaki na kulinda udongo, vechi huweka naitrojeni. Liondoe wiki 2–3 kabla ya kupanda mazao ya mbegu ndogo."
  hi: "सर्दियों की आवरण फसल: राई बचा नाइट्रेट समेटती है और मिट्टी बचाती है, वेच नाइट्रोजन जोड़ती है। छोटे बीज वाली फसलें बोने से 2–3 सप्ताह पहले खत्म करें।"
  de: "Winterzwischenfrucht: Roggen nimmt Reststickstoff auf und schützt den Boden, Wicke bindet Stickstoff. 2–3 Wochen vor der Saat kleinsamiger Kulturen beenden."
rk_crop_cover_rye_vetch_allelopathy:
  en: "Cereal rye residues release benzoxazinoids (DIBOA/BOA) that can suppress small-seeded crops and weeds for 2–4 weeks."
  es: "Los rastrojos de centeno liberan benzoxazinoides (DIBOA/BOA) que pueden suprimir cultivos de semilla pequeña y malezas durante 2–4 semanas."
  fr: "Les résidus de seigle libèrent des benzoxazinoïdes (DIBOA/BOA) qui peuvent freiner les cultures à petites graines et les adventices pendant 2–4 semaines."
  sw: "Masalia ya raye hutoa benzoksazinoidi (DIBOA/BOA) zinazoweza kuzuia mazao ya mbegu ndogo na magugu kwa wiki 2–4."
  hi: "राई के अवशेष बेंज़ोक्साज़िनॉइड (DIBOA/BOA) छोड़ते हैं जो 2–4 सप्ताह तक छोटे बीज वाली फसलों और खरपतवारों को दबा सकते हैं।"
  de: "Roggenrückstände setzen Benzoxazinoide (DIBOA/BOA) frei, die kleinsamige Kulturen und Unkräuter 2–4 Wochen hemmen können."
rk_crop_oats_note:
  en: "A 'health crop' among cereals: not a host of wheat take-all, but the main host of cereal cyst nematode — keep 3–5 years between oats."
  es: "Un 'cultivo sanitario' entre los cereales: no es hospedero del mal del pie del trigo, pero sí el principal hospedero del nematodo del quiste: deje 3–5 años entre avenas."
  fr: "Une « culture assainissante » parmi les céréales : non hôte du piétin-échaudage du blé, mais principal hôte du nématode à kyste — laissez 3–5 ans entre deux avoines."
  sw: "'Zao la afya' miongoni mwa nafaka: si mwenyeji wa take-all ya ngano, lakini ndiye mwenyeji mkuu wa minyoo fundo ya nafaka — acha miaka 3–5 kati ya shayiri ya oti."
  hi: "अनाजों में 'स्वास्थ्य फसल': गेहूं के टेक-ऑल का मेज़बान नहीं, पर अनाज सिस्ट सूत्रकृमि का मुख्य मेज़बान — जई के बीच 3–5 वर्ष रखें।"
  de: "Eine „Gesundungsfrucht“ unter den Getreiden: kein Wirt der Schwarzbeinigkeit, aber Hauptwirt des Getreidezystennematoden – 3–5 Jahre zwischen Hafer einhalten."
rk_crop_winter_rye_note:
  en: "The most self-tolerant cereal (1–2 year break) and very winter-hardy; good on poor sandy soils. Avoid after maize (Fusarium)."
  es: "El cereal más autotolerante (pausa de 1–2 años) y muy resistente al invierno; va bien en suelos arenosos pobres. Evítelo tras maíz (Fusarium)."
  fr: "La céréale la plus autotolérante (pause de 1–2 ans) et très résistante à l'hiver ; adaptée aux sols sableux pauvres. À éviter après maïs (Fusarium)."
  sw: "Nafaka inayojivumilia zaidi (mapumziko ya miaka 1–2) na inastahimili baridi sana; nzuri kwenye udongo duni wa mchanga. Epuka baada ya mahindi (Fusarium)."
  hi: "सबसे स्व-सहिष्णु अनाज (1–2 वर्ष विराम) और बहुत ठंड सहने वाला; कमज़ोर रेतीली मिट्टी में अच्छा। मक्का के बाद न लगाएँ (फ्यूज़ेरियम)।"
  de: "Das selbstverträglichste Getreide (1–2 Jahre Pause) und sehr winterhart; gut auf armen Sandböden. Nicht nach Mais (Fusarium)."
rk_crop_winter_rye_allelopathy:
  en: "Cereal rye residues release benzoxazinoids (DIBOA/BOA) that can suppress small-seeded crops and weeds for 2–4 weeks."
  es: "Los rastrojos de centeno liberan benzoxazinoides (DIBOA/BOA) que pueden suprimir cultivos de semilla pequeña y malezas durante 2–4 semanas."
  fr: "Les résidus de seigle libèrent des benzoxazinoïdes (DIBOA/BOA) qui peuvent freiner les cultures à petites graines et les adventices pendant 2–4 semaines."
  sw: "Masalia ya raye hutoa benzoksazinoidi (DIBOA/BOA) zinazoweza kuzuia mazao ya mbegu ndogo na magugu kwa wiki 2–4."
  hi: "राई के अवशेष बेंज़ोक्साज़िनॉइड (DIBOA/BOA) छोड़ते हैं जो 2–4 सप्ताह तक छोटे बीज वाली फसलों और खरपतवारों को दबा सकते हैं।"
  de: "Roggenrückstände setzen Benzoxazinoide (DIBOA/BOA) frei, die kleinsamige Kulturen und Unkräuter 2–4 Wochen hemmen können."
rk_crop_durum_wheat_note:
  en: "Most Fusarium/DON-sensitive wheat — never after maize; benefits strongly from a pulse predecessor (N and crown-rot break)."
  es: "El trigo más sensible a Fusarium/DON: nunca tras maíz; se beneficia mucho de una leguminosa como antecesor (N y corte de la pudrición de la corona)."
  fr: "Le blé le plus sensible au Fusarium/DON — jamais après maïs ; profite fortement d'un précédent légumineuse (azote et rupture de la pourriture du collet)."
  sw: "Ngano inayoathiriwa zaidi na Fusarium/DON — kamwe baada ya mahindi; hufaidika sana na zao la kunde kabla yake (naitrojeni na kuvunja kuoza kwa shingo)."
  hi: "फ्यूज़ेरियम/DON के प्रति सबसे संवेदनशील गेहूं — मक्का के बाद कभी नहीं; पहले दलहन होने से बहुत लाभ (नाइट्रोजन और शीर्ष-सड़न विराम)।"
  de: "Der Fusarium-/DON-empfindlichste Weizen – nie nach Mais; profitiert stark von einer Leguminosen-Vorfrucht (Stickstoff und Unterbrechung der Fußkrankheiten)."
rk_crop_spring_wheat_note:
  en: "Same disease logic as winter wheat: follow a broadleaf break crop; avoid after maize or another wheat."
  es: "La misma lógica sanitaria que el trigo de invierno: siga un cultivo de pausa de hoja ancha; evítelo tras maíz u otro trigo."
  fr: "Même logique sanitaire que le blé d'hiver : après une culture de rupture à feuilles larges ; à éviter après maïs ou un autre blé."
  sw: "Mantiki ileile ya magonjwa kama ngano ya baridi: fuata zao la mapumziko lenye majani mapana; epuka baada ya mahindi au ngano nyingine."
  hi: "रबी गेहूं जैसा ही रोग-तर्क: चौड़ी पत्ती वाली विराम-फसल के बाद लगाएँ; मक्का या दूसरे गेहूं के बाद नहीं।"
  de: "Gleiche Krankheitslogik wie Winterweizen: nach einer Blattfrucht anbauen; nicht nach Mais oder anderem Weizen."
rk_crop_winter_barley_note:
  en: "Early harvest leaves a window for oilseed rape or a cover crop; needs 2–3 years between barleys (foot rots, cyst nematode, mildew)."
  es: "La cosecha temprana deja espacio para colza o un cultivo de cobertura; necesita 2–3 años entre cebadas (pudriciones del pie, nematodo del quiste, oídio)."
  fr: "La récolte précoce laisse une fenêtre pour un colza ou un couvert ; il faut 2–3 ans entre deux orges (piétins, nématode à kyste, oïdium)."
  sw: "Kuvuna mapema huacha nafasi ya kanola au zao funika; inahitaji miaka 2–3 kati ya shayiri (kuoza kwa shina, minyoo fundo, ukungu mweupe)."
  hi: "जल्दी कटाई से रेपसीड या आवरण फसल के लिए समय मिलता है; जौ के बीच 2–3 वर्ष चाहिए (पाद सड़न, सिस्ट सूत्रकृमि, चूर्णिल आसिता)।"
  de: "Die frühe Ernte lässt Zeit für Raps oder eine Zwischenfrucht; 2–3 Jahre zwischen Gerste nötig (Fußkrankheiten, Zystennematoden, Mehltau)."
rk_crop_spelt_note:
  en: "Hulled wheat for low-input systems; same take-all/eyespot logic as wheat with a 2–3 year break."
  es: "Trigo vestido para sistemas de pocos insumos; la misma lógica de mal del pie y mancha ocular que el trigo, con una pausa de 2–3 años."
  fr: "Blé vêtu pour systèmes à faibles intrants ; même logique piétin-échaudage/piétin-verse que le blé, avec une pause de 2–3 ans."
  sw: "Ngano yenye maganda kwa kilimo cha pembejeo chache; mantiki ileile ya take-all/madoa ya jicho kama ngano na mapumziko ya miaka 2–3."
  hi: "कम लागत वाली खेती के लिए छिलकेदार गेहूं; गेहूं जैसा ही टेक-ऑल/आई-स्पॉट तर्क, 2–3 वर्ष विराम के साथ।"
  de: "Spelzweizen für extensive Systeme; gleiche Logik bei Schwarzbeinigkeit/Halmbruch wie Weizen mit 2–3 Jahren Pause."
rk_crop_rice_note:
  en: "Flooded paddy rice tolerates itself well (anaerobic soil suppresses many soil-borne pests), but puddling destroys soil structure for the following upland crop and delays its sowing."
  es: "El arroz inundado se tolera bien a sí mismo (el suelo sin oxígeno suprime muchas plagas del suelo), pero el fangueo destruye la estructura del suelo para el cultivo de secano siguiente y retrasa su siembra."
  fr: "Le riz inondé se tolère bien (le sol anaérobie freine de nombreux bioagresseurs du sol), mais la mise en boue détruit la structure du sol pour la culture pluviale suivante et retarde son semis."
  sw: "Mpunga uliofurika hujivumilia vizuri (udongo usio na hewa huzuia wadudu wengi wa udongoni), lakini kutifua tope huharibu muundo wa udongo kwa zao la nchi kavu linalofuata na huchelewesha kupandwa kwake."
  hi: "पानी भरा धान खुद को अच्छी तरह सहता है (ऑक्सीजन-रहित मिट्टी कई मिट्टी कीट दबाती है), पर पडलिंग अगली ऊपरी भूमि फसल के लिए मिट्टी की संरचना बिगाड़ती है और उसकी बुवाई में देर करती है।"
  de: "Überfluteter Nassreis verträgt sich gut mit sich selbst (sauerstoffarmer Boden unterdrückt viele Bodenschädlinge), doch das Puddeln zerstört die Bodenstruktur für die folgende Trockenkultur und verzögert ihre Saat."
rk_crop_sugar_beet_note:
  en: "At least 4 years between beets because of beet cyst nematode, rhizomania and Rhizoctonia — and count oilseed rape/brassicas as host years. Leaf residue returns N, but wet autumn harvest compacts soil."
  es: "Al menos 4 años entre remolachas por el nematodo del quiste, la rizomanía y Rhizoctonia, y cuente la colza y otras crucíferas como años hospederos. Las hojas devuelven N, pero la cosecha en otoño húmedo compacta el suelo."
  fr: "Au moins 4 ans entre deux betteraves à cause du nématode à kyste, de la rhizomanie et du rhizoctone — comptez le colza et les crucifères comme années hôtes. Les feuilles restituent de l'azote, mais la récolte en automne humide tasse le sol."
  sw: "Angalau miaka 4 kati ya viazi sukari kwa sababu ya minyoo fundo, rizomania na Rhizoctonia — na hesabu kanola/jamii ya kabichi kama miaka ya mwenyeji. Majani hurudisha naitrojeni, lakini kuvuna vuli yenye unyevu hugandamiza udongo."
  hi: "चुकंदर सिस्ट सूत्रकृमि, राइज़ोमेनिया और राइज़ोक्टोनिया के कारण चुकंदर के बीच कम से कम 4 वर्ष — और रेपसीड/सरसों-कुल को मेज़बान वर्ष गिनें। पत्ती अवशेष नाइट्रोजन लौटाते हैं, पर गीली शरद कटाई मिट्टी दबाती है।"
  de: "Mindestens 4 Jahre zwischen Rüben wegen Rübenzystennematoden, Rizomania und Rhizoctonia – Raps/Kreuzblütler zählen als Wirtsjahre. Das Rübenblatt liefert Stickstoff, doch nasse Herbsternte verdichtet den Boden."
rk_crop_winter_rapeseed_note:
  en: "Excellent wheat break (+~0.8 t/ha), but needs ≥2 clear years between brassicas: each extra crop between canola crops added 0.20–0.36 t/ha canola yield (blackleg, clubroot, Sclerotinia)."
  es: "Excelente pausa para el trigo (+~0,8 t/ha), pero necesita ≥2 años libres entre crucíferas: cada cultivo extra entre colzas sumó 0,20–0,36 t/ha de colza (pie negro, hernia, Sclerotinia)."
  fr: "Excellente rupture pour le blé (+~0,8 t/ha), mais il faut ≥2 années libres entre crucifères : chaque culture supplémentaire entre deux colzas a ajouté 0,20–0,36 t/ha de colza (phoma, hernie, Sclerotinia)."
  sw: "Mapumziko bora kwa ngano (+~0.8 t/ha), lakini inahitaji ≥miaka 2 bila jamii ya kabichi kati yake: kila zao la ziada kati ya kanola liliongeza t/ha 0.20–0.36 ya kanola (mguu mweusi, uvimbe wa mizizi, Sclerotinia)."
  hi: "गेहूं के लिए उत्कृष्ट विराम (+~0.8 t/ha), पर सरसों-कुल के बीच ≥2 खाली वर्ष चाहिए: कैनोला फसलों के बीच हर अतिरिक्त फसल ने कैनोला उपज 0.20–0.36 t/ha बढ़ाई (ब्लैकलेग, क्लबरूट, Sclerotinia)।"
  de: "Hervorragende Weizenvorfrucht (+~0,8 t/ha), braucht aber ≥2 freie Jahre zwischen Kreuzblütlern: Jede zusätzliche Kultur zwischen Raps brachte 0,20–0,36 t/ha mehr Rapsertrag (Phoma, Kohlhernie, Sclerotinia)."
rk_crop_mustard_cover_note:
  en: "Fast catch crop that holds leftover N and can biofumigate, but it is a brassica: counts as a clubroot/blackleg/BCN host year unless a resistant variety is used."
  es: "Cultivo trampa rápido que retiene el N sobrante y puede biofumigar, pero es una crucífera: cuenta como año hospedero de hernia, pie negro y nematodo de la remolacha salvo que se use una variedad resistente."
  fr: "Culture intermédiaire rapide qui retient l'azote résiduel et peut biofumiger, mais c'est une crucifère : elle compte comme année hôte de la hernie, du phoma et du nématode de la betterave, sauf variété résistante."
  sw: "Zao la kunasa la haraka linaloshika naitrojeni iliyobaki na linaweza kufukiza kibiolojia, lakini ni la jamii ya kabichi: huhesabiwa mwaka wa mwenyeji wa uvimbe wa mizizi/mguu mweusi/minyoo ya kiazi sukari isipokuwa aina inayostahimili itumike."
  hi: "तेज़ फंदा फसल जो बचा नाइट्रोजन रोकती है और जैव-धूमन कर सकती है, पर यह सरसों-कुल की है: प्रतिरोधी किस्म न हो तो क्लबरूट/ब्लैकलेग/BCN मेज़बान वर्ष गिनी जाती है।"
  de: "Schnelle Zwischenfrucht, die Reststickstoff bindet und biofumigieren kann – aber ein Kreuzblütler: zählt als Wirtsjahr für Kohlhernie/Phoma/Rübenzystennematoden, außer bei resistenter Sorte."
rk_crop_mustard_cover_allelopathy:
  en: "Glucosinolates break down to isothiocyanates (biofumigation) that can suppress some soil-borne fungi, nematodes and small-seeded weeds."
  es: "Los glucosinolatos se descomponen en isotiocianatos (biofumigación) que pueden suprimir algunos hongos y nematodos del suelo y malezas de semilla pequeña."
  fr: "Les glucosinolates se décomposent en isothiocyanates (biofumigation) qui peuvent freiner certains champignons et nématodes du sol et des adventices à petites graines."
  sw: "Glukosinoleti huvunjika kuwa isothiosianeti (ufukizaji wa kibiolojia) zinazoweza kuzuia baadhi ya kuvu na minyoo wa udongoni na magugu ya mbegu ndogo."
  hi: "ग्लूकोसिनोलेट टूटकर आइसोथायोसाइनेट बनते हैं (जैव-धूमन) जो कुछ मिट्टी कवक, सूत्रकृमि और छोटे बीज वाले खरपतवार दबा सकते हैं।"
  de: "Glucosinolate zerfallen zu Isothiocyanaten (Biofumigation), die manche bodenbürtigen Pilze, Nematoden und kleinsamige Unkräuter unterdrücken können."
rk_crop_flax_note:
  en: "Needs about 6 years between flax crops ('flax sickness', Fusarium wilt). Strongly mycorrhiza-dependent: grows poorly after non-mycorrhizal brassicas, beet or long bare fallow."
  es: "Necesita unos 6 años entre linos ('cansancio del lino', marchitez por Fusarium). Muy dependiente de micorrizas: crece mal tras crucíferas, remolacha o barbecho desnudo largo."
  fr: "Demande environ 6 ans entre deux lins (« fatigue du lin », fusariose). Très dépendant des mycorhizes : pousse mal après crucifères, betterave ou longue jachère nue."
  sw: "Inahitaji takriban miaka 6 kati ya kitani ('ugonjwa wa kitani', mnyauko wa Fusarium). Hutegemea sana mikoriza: hukua vibaya baada ya jamii ya kabichi, kiazi sukari au shamba tupu kwa muda mrefu."
  hi: "अलसी के बीच लगभग 6 वर्ष चाहिए ('अलसी थकान', फ्यूज़ेरियम उकठा)। माइकोराइज़ा पर बहुत निर्भर: सरसों-कुल, चुकंदर या लंबी खाली परती के बाद कमज़ोर बढ़ती है।"
  de: "Braucht etwa 6 Jahre zwischen Lein („Leinmüdigkeit“, Fusarium-Welke). Stark mykorrhizaabhängig: wächst schlecht nach Kreuzblütlern, Rübe oder langer Schwarzbrache."
rk_crop_field_pea_note:
  en: "Best wheat predecessor (+~1.2 t/ha), but peas themselves need 4–8 years between crops (5 used) because Aphanomyces and Ascochyta persist in soil."
  es: "El mejor antecesor del trigo (+~1,2 t/ha), pero la arveja necesita 4–8 años entre cultivos (se usan 5) porque Aphanomyces y Ascochyta persisten en el suelo."
  fr: "Meilleur précédent du blé (+~1,2 t/ha), mais le pois lui-même demande 4–8 ans entre deux cultures (5 retenus) car Aphanomyces et Ascochyta persistent dans le sol."
  sw: "Zao bora kabla ya ngano (+~1.2 t/ha), lakini njegere zenyewe zinahitaji miaka 4–8 kati yake (5 imetumika) kwa sababu Aphanomyces na Ascochyta hudumu udongoni."
  hi: "गेहूं की सबसे अच्छी पूर्ववर्ती (+~1.2 t/ha), पर मटर को खुद फसलों के बीच 4–8 वर्ष चाहिए (5 लिया गया) क्योंकि अफ़ानोमाइसीज़ और एस्कोकाइटा मिट्टी में रहते हैं।"
  de: "Beste Weizenvorfrucht (+~1,2 t/ha), doch Erbsen selbst brauchen 4–8 Jahre Pause (5 angesetzt), weil Aphanomyces und Ascochyta im Boden überdauern."
rk_crop_lentil_note:
  en: "Keep 4–5 years between lentils and other pulses (NRW: 5) — Ascochyta, anthracnose and Aphanomyces."
  es: "Deje 4–5 años entre lentejas y otras leguminosas (NRW: 5) por Ascochyta, antracnosis y Aphanomyces."
  fr: "Laissez 4–5 ans entre lentilles et autres légumineuses (NRW : 5) — ascochytose, anthracnose et Aphanomyces."
  sw: "Acha miaka 4–5 kati ya adesi na kunde nyingine (NRW: 5) — Ascochyta, anthraknosi na Aphanomyces."
  hi: "मसूर और अन्य दलहनों के बीच 4–5 वर्ष रखें (NRW: 5) — एस्कोकाइटा, एन्थ्रेक्नोज़ और अफ़ानोमाइसीज़।"
  de: "4–5 Jahre zwischen Linsen und anderen Hülsenfrüchten (NRW: 5) – Ascochyta, Anthraknose und Aphanomyces."
rk_crop_chickpea_note:
  en: "Fixes N and breaks cereal crown rot, but multiplies root-lesion nematode (P. thornei) and Ascochyta; 1 in 4 years."
  es: "Fija N y corta la pudrición de la corona de los cereales, pero multiplica el nematodo lesionador (P. thornei) y Ascochyta; 1 de cada 4 años."
  fr: "Fixe l'azote et coupe la pourriture du collet des céréales, mais multiplie le nématode des lésions (P. thornei) et l'ascochytose ; 1 année sur 4."
  sw: "Huweka naitrojeni na kuvunja kuoza kwa shingo ya nafaka, lakini huzidisha minyoo wa vidonda (P. thornei) na Ascochyta; mwaka 1 kati ya 4."
  hi: "नाइट्रोजन जोड़ता है और अनाज की शीर्ष सड़न तोड़ता है, पर जड़-घाव सूत्रकृमि (P. thornei) और एस्कोकाइटा बढ़ाता है; 4 में से 1 वर्ष।"
  de: "Bindet Stickstoff und unterbricht Fußkrankheiten des Getreides, vermehrt aber Wurzelläsionsnematoden (P. thornei) und Ascochyta; 1 von 4 Jahren."
rk_crop_faba_bean_note:
  en: "High N fixer (residual N benefit to the next cereal); keep 3–5 years between faba beans (NRW) because of foot rots, stem nematode and broomrape."
  es: "Gran fijador de N (beneficio de N residual para el cereal siguiente); deje 3–5 años entre habas (NRW) por pudriciones del pie, nematodo del tallo y jopo."
  fr: "Forte fixatrice d'azote (arrière-effet pour la céréale suivante) ; laissez 3–5 ans entre deux féveroles (NRW) à cause des pourritures du pied, du nématode des tiges et de l'orobanche."
  sw: "Huweka naitrojeni nyingi (faida ya naitrojeni kwa nafaka inayofuata); acha miaka 3–5 kati ya maharagwe fava (NRW) kwa sababu ya kuoza kwa shina, minyoo wa shina na orobanki."
  hi: "अधिक नाइट्रोजन जोड़ने वाली (अगले अनाज को बचा नाइट्रोजन); पाद सड़न, तना सूत्रकृमि और आग्या के कारण बाकला के बीच 3–5 वर्ष रखें (NRW)।"
  de: "Starker Stickstoffbinder (Nachwirkung für das folgende Getreide); 3–5 Jahre zwischen Ackerbohnen (NRW) wegen Fußkrankheiten, Stängelälchen und Sommerwurz."
rk_crop_groundnut_note:
  en: "Rotate with grass crops for at least 2 years between groundnuts (leaf spots, white mould, root-knot nematode). Digging leaves bare soil; acts as a Striga trap crop for the next cereal."
  es: "Rote con gramíneas al menos 2 años entre manís (manchas foliares, moho blanco, nematodo agallador). La cosecha deja el suelo desnudo; actúa como cultivo trampa de Striga para el cereal siguiente."
  fr: "Alternez avec des graminées au moins 2 ans entre deux arachides (cercosporioses, pourriture blanche, nématodes à galles). L'arrachage laisse le sol nu ; sert de culture piège à Striga pour la céréale suivante."
  sw: "Zungusha na mazao ya nyasi kwa angalau miaka 2 kati ya karanga (madoa ya majani, ukungu mweupe, minyoo vifundo). Kuchimbua huacha udongo wazi; hufanya kazi ya kunasa kiduha kwa nafaka inayofuata."
  hi: "मूंगफली के बीच कम से कम 2 वर्ष घास-फसलें लगाएँ (पत्ती धब्बे, सफेद फफूंद, जड़-गाँठ सूत्रकृमि)। खुदाई से मिट्टी खाली रहती है; अगले अनाज के लिए स्ट्राइगा फंदा फसल का काम करती है।"
  de: "Mindestens 2 Jahre Gräser zwischen Erdnüssen (Blattflecken, Weißfäule, Wurzelgallennematoden). Die Rodung hinterlässt offenen Boden; wirkt als Striga-Fangpflanze für das folgende Getreide."
rk_crop_pigeon_pea_note:
  en: "Deep taproot reaches subsoil water and mobilises iron-bound phosphorus; leaf fall feeds the next cereal. Fusarium wilt builds up if grown repeatedly."
  es: "Su raíz pivotante profunda alcanza el agua del subsuelo y moviliza el fósforo ligado al hierro; la caída de hojas alimenta al cereal siguiente. La marchitez por Fusarium aumenta si se repite."
  fr: "Sa racine pivotante profonde atteint l'eau du sous-sol et mobilise le phosphore lié au fer ; la chute des feuilles nourrit la céréale suivante. La fusariose s'accumule en cas de répétition."
  sw: "Mzizi mkuu mrefu hufikia maji ya chini na kuachilia fosforasi iliyofungwa na chuma; majani yanayoanguka hulisha nafaka inayofuata. Mnyauko wa Fusarium huongezeka ikipandwa mara kwa mara."
  hi: "गहरी मूसला जड़ निचली मिट्टी का पानी पाती है और लोहे से बँधा फॉस्फोरस मुक्त करती है; झड़ी पत्तियाँ अगले अनाज को पोषण देती हैं। बार-बार लगाने पर फ्यूज़ेरियम उकठा बढ़ता है।"
  de: "Die tiefe Pfahlwurzel erreicht Unterbodenwasser und mobilisiert eisengebundenen Phosphor; der Laubfall ernährt das folgende Getreide. Bei wiederholtem Anbau nimmt die Fusarium-Welke zu."
rk_crop_mung_bean_note:
  en: "Short legume for the gap between rice and wheat; shares yellow mosaic virus/whitefly and root-lesion nematodes with other legumes."
  es: "Leguminosa corta para el hueco entre arroz y trigo; comparte el virus del mosaico amarillo, la mosca blanca y los nematodos lesionadores con otras leguminosas."
  fr: "Légumineuse courte pour l'intervalle entre riz et blé ; partage le virus de la mosaïque jaune, l'aleurode et les nématodes des lésions avec d'autres légumineuses."
  sw: "Zao fupi la kunde kwa nafasi kati ya mpunga na ngano; inashiriki virusi vya batobato njano/inzi weupe na minyoo wa vidonda vya mizizi na kunde nyingine."
  hi: "धान और गेहूं के बीच के समय के लिए छोटी दलहन; अन्य दलहनों के साथ पीला मोज़ेक विषाणु/सफ़ेद मक्खी और जड़-घाव सूत्रकृमि साझा करती है।"
  de: "Kurze Leguminose für die Lücke zwischen Reis und Weizen; teilt Gelbmosaikvirus/Weiße Fliege und Wurzelläsionsnematoden mit anderen Leguminosen."
rk_crop_cassava_note:
  en: "Removes large amounts of potassium and leaves soil exposed early; rotate or intercrop with legumes and return stems/leaves."
  es: "Extrae mucho potasio y deja el suelo descubierto al inicio; rote o asocie con leguminosas y devuelva tallos y hojas al campo."
  fr: "Exporte beaucoup de potassium et laisse le sol découvert au début ; alternez ou associez avec des légumineuses et restituez tiges et feuilles."
  sw: "Huondoa potasiamu nyingi na huacha udongo wazi mwanzoni; zungusha au changanya na mazao ya kunde na rudisha mashina/majani shambani."
  hi: "बहुत पोटैशियम निकालता है और शुरुआत में मिट्टी खुली छोड़ता है; दलहन के साथ फसल-चक्र या अंतर-फसल अपनाएँ और तने/पत्ते खेत में लौटाएँ।"
  de: "Entzieht viel Kalium und lässt den Boden anfangs offen; mit Leguminosen abwechseln oder mischen und Stängel/Blätter zurückführen."
rk_crop_sugarcane_note:
  en: "Multi-year crop: after the last ratoon, a legume break (soybean, groundnut) of ≥6–12 months counters 'yield decline' caused by soil-borne pests and compaction."
  es: "Cultivo plurianual: tras la última soca, una pausa con leguminosa (soja, maní) de ≥6–12 meses contrarresta la 'caída de rendimiento' por plagas del suelo y compactación."
  fr: "Culture pluriannuelle : après la dernière repousse, une pause légumineuse (soja, arachide) de ≥6–12 mois contre le « déclin de rendement » dû aux bioagresseurs du sol et au tassement."
  sw: "Zao la miaka mingi: baada ya machipukizi ya mwisho, mapumziko ya kunde (soya, karanga) ya ≥miezi 6–12 hupambana na 'kushuka kwa mavuno' kunakosababishwa na wadudu wa udongoni na kugandamizwa."
  hi: "बहुवर्षीय फसल: अंतिम पेड़ी के बाद ≥6–12 महीने का दलहन विराम (सोयाबीन, मूंगफली) मिट्टी कीटों और दबाव से होने वाली 'उपज गिरावट' रोकता है।"
  de: "Mehrjährige Kultur: Nach dem letzten Ratoon wirkt eine Leguminosenpause (Soja, Erdnuss) von ≥6–12 Monaten dem durch Bodenschädlinge und Verdichtung verursachten „Ertragsrückgang“ entgegen."
rk_crop_cotton_note:
  en: "Rotate with grass crops to reduce root-knot/reniform nematodes and Verticillium; cotton is also a Striga trap crop."
  es: "Rote con gramíneas para reducir los nematodos agalladores y reniformes y Verticillium; el algodón también es cultivo trampa de Striga."
  fr: "Alternez avec des graminées pour réduire nématodes à galles/réniformes et verticilliose ; le coton est aussi une culture piège à Striga."
  sw: "Zungusha na mazao ya nyasi kupunguza minyoo vifundo/figo na Verticillium; pamba pia ni zao la kunasa kiduha."
  hi: "जड़-गाँठ/वृक्काकार सूत्रकृमि और वर्टिसिलियम घटाने के लिए घास-फसलों के साथ फसल-चक्र अपनाएँ; कपास स्ट्राइगा फंदा फसल भी है।"
  de: "Mit Gräsern abwechseln, um Wurzelgallen-/Nierennematoden und Verticillium zu senken; Baumwolle ist auch eine Striga-Fangpflanze."
rk_crop_onion_note:
  en: "Keep 4+ years between alliums; in fields with white rot, onions should not return for decades. Poor weed competitor — follow a clean cereal."
  es: "Deje 4+ años entre aliáceas; en campos con pudrición blanca la cebolla no debe volver en décadas. Compite mal con las malezas: siémbrela tras un cereal limpio."
  fr: "Laissez 4 ans et plus entre alliacées ; dans les parcelles atteintes de pourriture blanche, l'oignon ne doit pas revenir avant des décennies. Faible concurrent des adventices — après une céréale propre."
  sw: "Acha miaka 4+ kati ya jamii ya vitunguu; mashamba yenye kuoza mweupe hayapaswi kupandwa vitunguu kwa miongo. Hushindana vibaya na magugu — fuatisha nafaka safi."
  hi: "प्याज़-कुल के बीच 4+ वर्ष रखें; सफेद गलन वाले खेतों में दशकों तक प्याज़ न लगाएँ। खरपतवार से कमज़ोर मुकाबला — साफ़ अनाज के बाद लगाएँ।"
  de: "4+ Jahre zwischen Lauchgewächsen; auf Feldern mit Mehlkrankheit Zwiebeln jahrzehntelang nicht wieder anbauen. Schwacher Unkrautkonkurrent – nach sauberem Getreide."
rk_crop_carrot_note:
  en: "Avoid after Sclerotinia hosts, after potato (scab, root-knot) and after grass (wireworm); 3–4 years between carrots."
  es: "Evítela tras hospederos de Sclerotinia, tras papa (sarna, nematodo agallador) y tras pasto (gusano alambre); 3–4 años entre zanahorias."
  fr: "À éviter après des hôtes du Sclerotinia, après pomme de terre (gale, nématodes à galles) et après prairie (taupins) ; 3–4 ans entre deux carottes."
  sw: "Epuka baada ya wenyeji wa Sclerotinia, baada ya viazi (upele, minyoo vifundo) na baada ya nyasi (minyoo waya); miaka 3–4 kati ya karoti."
  hi: "Sclerotinia मेज़बानों, आलू (स्कैब, जड़-गाँठ) और घास (वायरवर्म) के बाद न लगाएँ; गाजर के बीच 3–4 वर्ष।"
  de: "Nicht nach Sclerotinia-Wirten, nach Kartoffel (Schorf, Wurzelgallen) oder nach Grünland (Drahtwurm); 3–4 Jahre zwischen Möhren."
rk_crop_cabbage_note:
  en: "Clubroot can make a field unusable for brassicas for 15+ years — keep ≥4 years between any brassicas (including rapeseed and mustard covers)."
  es: "La hernia puede inutilizar un campo para crucíferas durante 15+ años: deje ≥4 años entre cualquier crucífera (incluidas colza y coberturas de mostaza)."
  fr: "La hernie peut rendre une parcelle inutilisable pour les crucifères pendant plus de 15 ans — laissez ≥4 ans entre toutes crucifères (colza et couverts de moutarde compris)."
  sw: "Uvimbe wa mizizi unaweza kufanya shamba lisifae kwa jamii ya kabichi kwa miaka 15+ — acha ≥miaka 4 kati ya zao lolote la jamii hiyo (pamoja na kanola na haradali ya kufunika)."
  hi: "क्लबरूट खेत को 15+ वर्षों तक सरसों-कुल के लिए बेकार कर सकता है — किसी भी सरसों-कुल फसल (रेपसीड और सरसों आवरण सहित) के बीच ≥4 वर्ष रखें।"
  de: "Kohlhernie kann ein Feld für 15+ Jahre für Kreuzblütler unbrauchbar machen – ≥4 Jahre zwischen allen Kreuzblütlern (auch Raps und Senf-Zwischenfrüchte)."
rk_crop_pepper_note:
  en: "Phytophthora blight, Verticillium and root-knot nematodes are shared with tomato and cucurbits — ≥3 years away from them."
  es: "Comparte el tizón por Phytophthora, Verticillium y nematodos agalladores con el tomate y las cucurbitáceas: ≥3 años lejos de ellos."
  fr: "Partage le Phytophthora, la verticilliose et les nématodes à galles avec la tomate et les cucurbitacées — ≥3 ans à l'écart."
  sw: "Baka la Phytophthora, Verticillium na minyoo vifundo hushirikiwa na nyanya na maboga — ≥miaka 3 mbali nayo."
  hi: "फाइटोफ्थोरा झुलसा, वर्टिसिलियम और जड़-गाँठ सूत्रकृमि टमाटर और कद्दू-वर्गीय के साथ साझा — इनसे ≥3 वर्ष दूर रखें।"
  de: "Phytophthora-Fäule, Verticillium und Wurzelgallennematoden teilt sie mit Tomate und Kürbisgewächsen – ≥3 Jahre Abstand."
rk_crop_watermelon_note:
  en: "Fusarium wilt and Phytophthora persist for years; rotate ≥4 years out of cucurbits and follow a grass crop."
  es: "La marchitez por Fusarium y Phytophthora persisten años; deje ≥4 años sin cucurbitáceas y siembre tras una gramínea."
  fr: "La fusariose et le Phytophthora persistent des années ; sortez des cucurbitacées ≥4 ans et cultivez après une graminée."
  sw: "Mnyauko wa Fusarium na Phytophthora hudumu miaka mingi; kaa ≥miaka 4 bila maboga na fuatisha zao la nyasi."
  hi: "फ्यूज़ेरियम उकठा और फाइटोफ्थोरा वर्षों रहते हैं; ≥4 वर्ष कद्दू-वर्गीय न लगाएँ और घास-फसल के बाद लगाएँ।"
  de: "Fusarium-Welke und Phytophthora überdauern Jahre; ≥4 Jahre ohne Kürbisgewächse und nach einem Gras anbauen."
rk_crop_squash_note:
  en: "Rotate ≥3 years out of cucurbits (Phytophthora, powdery mildew, cucumber beetles)."
  es: "Deje ≥3 años sin cucurbitáceas (Phytophthora, oídio, escarabajos del pepino)."
  fr: "Sortez des cucurbitacées pendant ≥3 ans (Phytophthora, oïdium, chrysomèles du concombre)."
  sw: "Kaa ≥miaka 3 bila maboga (Phytophthora, ukungu mweupe, mbawakavu wa matango)."
  hi: "≥3 वर्ष कद्दू-वर्गीय न लगाएँ (फाइटोफ्थोरा, चूर्णिल आसिता, खीरा भृंग)।"
  de: "≥3 Jahre ohne Kürbisgewächse (Phytophthora, Mehltau, Gurkenkäfer)."
rk_crop_sweet_corn_note:
  en: "Same rotation logic as grain maize: one year without maize breaks rootworm and residue diseases."
  es: "La misma lógica de rotación que el maíz de grano: un año sin maíz corta el gusano de la raíz y las enfermedades del rastrojo."
  fr: "Même logique de rotation que le maïs grain : une année sans maïs coupe la chrysomèle et les maladies des résidus."
  sw: "Mantiki ileile ya mzunguko kama mahindi ya nafaka: mwaka mmoja bila mahindi huvunja funza wa mizizi na magonjwa ya masalia."
  hi: "दाने वाली मक्का जैसा ही फसल-चक्र तर्क: मक्का-रहित एक वर्ष जड़ कीट और अवशेष रोग तोड़ता है।"
  de: "Gleiche Fruchtfolgelogik wie Körnermais: ein Jahr ohne Mais unterbricht Maiswurzelbohrer und Rückstandskrankheiten."
rk_crop_buckwheat_note:
  en: "Short, pest-light crop that smothers weeds and mobilises soil phosphorus; frost-sensitive."
  es: "Cultivo corto y con pocas plagas que ahoga las malezas y moviliza el fósforo del suelo; sensible a las heladas."
  fr: "Culture courte, peu sensible aux ravageurs, qui étouffe les adventices et mobilise le phosphore du sol ; sensible au gel."
  sw: "Zao fupi lenye wadudu wachache linalozima magugu na kuachilia fosforasi ya udongo; huathiriwa na baridi kali."
  hi: "कम कीटों वाली छोटी फसल जो खरपतवार दबाती है और मिट्टी का फॉस्फोरस मुक्त करती है; पाले के प्रति संवेदनशील।"
  de: "Kurze, schädlingsarme Kultur, die Unkraut unterdrückt und Bodenphosphor mobilisiert; frostempfindlich."
rk_crop_buckwheat_allelopathy:
  en: "Fast canopy and root exudates suppress weeds (smother crop); allelopathic effect is weak."
  es: "Su follaje rápido y los exudados de raíz suprimen malezas (cultivo asfixiante); el efecto alelopático es débil."
  fr: "Son couvert rapide et ses exsudats racinaires étouffent les adventices (culture étouffante) ; l'effet allélopathique est faible."
  sw: "Majani yanayoota haraka na majimaji ya mizizi huzuia magugu (zao la kuzima); athari ya sumu kwa mimea mingine ni ndogo."
  hi: "तेज़ छत्र और जड़ स्राव खरपतवार दबाते हैं (दमनकारी फसल); एलेलोपैथिक असर कमज़ोर है।"
  de: "Schneller Bestandesschluss und Wurzelausscheidungen unterdrücken Unkraut (Deckfrucht); die allelopathische Wirkung ist schwach."
rk_crop_quinoa_note:
  en: "Traditionally follows potato (better nutrient supply). Shares beet cyst nematode and downy mildew with beet/chenopods — 3 years apart."
  es: "Tradicionalmente sigue a la papa (mejor oferta de nutrientes). Comparte el nematodo de la remolacha y el mildiu con remolacha y quenopodiáceas: 3 años de separación."
  fr: "Suit traditionnellement la pomme de terre (meilleure disponibilité en nutriments). Partage nématode de la betterave et mildiou avec betterave et chénopodes — 3 ans d'écart."
  sw: "Kwa jadi hufuata viazi (virutubisho zaidi). Inashiriki minyoo ya kiazi sukari na ubwiri vinyoya na kiazi sukari/jamii ya mchicha — miaka 3 kati yake."
  hi: "परंपरागत रूप से आलू के बाद (बेहतर पोषक आपूर्ति)। चुकंदर/बथुआ-कुल के साथ चुकंदर सिस्ट सूत्रकृमि और मृदुरोमिल आसिता साझा करता है — 3 वर्ष का अंतर।"
  de: "Folgt traditionell der Kartoffel (bessere Nährstoffversorgung). Teilt Rübenzystennematoden und Falschen Mehltau mit Rübe/Gänsefußgewächsen – 3 Jahre Abstand."
rk_crop_hemp_note:
  en: "Dense, fast canopy suppresses weeds and a deep taproot loosens subsoil — a good predecessor for cereals; susceptible to Sclerotinia."
  es: "Su follaje denso y rápido suprime malezas y la raíz pivotante profunda afloja el subsuelo: buen antecesor de cereales; sensible a Sclerotinia."
  fr: "Son couvert dense et rapide étouffe les adventices et sa racine pivotante ameublit le sous-sol — bon précédent pour les céréales ; sensible au Sclerotinia."
  sw: "Majani mengi yanayoota haraka huzuia magugu na mzizi mkuu mrefu hulegeza udongo wa chini — zao zuri kabla ya nafaka; huathiriwa na Sclerotinia."
  hi: "घना, तेज़ छत्र खरपतवार दबाता है और गहरी मूसला जड़ निचली मिट्टी ढीली करती है — अनाज के लिए अच्छी पूर्ववर्ती; Sclerotinia के प्रति संवेदनशील।"
  de: "Dichter, schneller Bestand unterdrückt Unkraut, die tiefe Pfahlwurzel lockert den Unterboden – gute Vorfrucht für Getreide; anfällig für Sclerotinia."
rk_crop_clover_grass_ley_note:
  en: "Builds soil organic matter, structure and N (grass–clover mixtures fix more N than clover alone), and cleans out annual weeds. Wireworms build up — avoid potatoes/maize/root crops for 2–3 years after ploughing it out."
  es: "Aumenta la materia orgánica, la estructura y el N del suelo (las mezclas de gramíneas y trébol fijan más N que el trébol solo) y limpia las malezas anuales. Se acumulan gusanos alambre: evite papa, maíz y raíces 2–3 años tras romperla."
  fr: "Enrichit le sol en matière organique, structure et azote (les mélanges graminées–trèfle fixent plus que le trèfle seul) et nettoie les adventices annuelles. Les taupins s'accumulent — évitez pomme de terre/maïs/racines 2–3 ans après le retournement."
  sw: "Hujenga mboji, muundo na naitrojeni ya udongo (mchanganyiko wa nyasi na karafuu huweka naitrojeni zaidi kuliko karafuu peke yake), na husafisha magugu ya msimu mmoja. Minyoo waya huongezeka — epuka viazi/mahindi/mazao ya mizizi kwa miaka 2–3 baada ya kulima."
  hi: "मिट्टी का जैविक पदार्थ, संरचना और नाइट्रोजन बढ़ाता है (घास–तिपतिया मिश्रण अकेले तिपतिया से अधिक नाइट्रोजन जोड़ते हैं) और एकवर्षीय खरपतवार साफ़ करता है। वायरवर्म बढ़ते हैं — जोतने के बाद 2–3 वर्ष आलू/मक्का/जड़ फसलें न लगाएँ।"
  de: "Baut Humus, Struktur und Stickstoff auf (Kleegras bindet mehr N als Klee allein) und räumt einjährige Unkräuter aus. Drahtwürmer nehmen zu – nach dem Umbruch 2–3 Jahre keine Kartoffeln/Mais/Hackfrüchte."
rk_crop_phacelia_cover_note:
  en: "Not related to any major crop, so it fits almost any rotation without spreading diseases; fine roots improve topsoil crumb and it catches leftover N."
  es: "No está emparentada con ningún cultivo principal, así que encaja en casi cualquier rotación sin propagar enfermedades; sus raíces finas mejoran el grumo del suelo y capta el N sobrante."
  fr: "Apparentée à aucune grande culture, elle s'insère dans presque toute rotation sans propager de maladies ; ses racines fines améliorent la structure grumeleuse et elle capte l'azote résiduel."
  sw: "Haina uhusiano na zao lolote kuu, hivyo inafaa karibu mzunguko wowote bila kueneza magonjwa; mizizi midogo huboresha chembechembe za udongo wa juu na hukusanya naitrojeni iliyobaki."
  hi: "किसी मुख्य फसल से संबंधित नहीं, इसलिए रोग फैलाए बिना लगभग किसी भी फसल-चक्र में फिट; बारीक जड़ें ऊपरी मिट्टी की भुरभुराहट सुधारती हैं और बचा नाइट्रोजन समेटती हैं।"
  de: "Mit keiner Hauptkultur verwandt, passt daher in fast jede Fruchtfolge, ohne Krankheiten zu übertragen; feine Wurzeln verbessern die Krümelstruktur und sie bindet Reststickstoff."
rk_crop_sorghum_sudan_note:
  en: "Huge root system breaks compaction; some cultivars suppress root-knot nematodes (dhurrin/HCN). Allelopathic — wait before sowing small-seeded crops."
  es: "Su enorme sistema radical rompe la compactación; algunas variedades suprimen nematodos agalladores (durrina/HCN). Es alelopático: espere antes de sembrar cultivos de semilla pequeña."
  fr: "Son énorme système racinaire casse le tassement ; certaines variétés freinent les nématodes à galles (dhurrine/HCN). Allélopathique — attendez avant de semer des cultures à petites graines."
  sw: "Mfumo mkubwa wa mizizi huvunja ugandamizaji; baadhi ya aina huzuia minyoo vifundo (dhurrin/HCN). Una sumu kwa mimea mingine — subiri kabla ya kupanda mazao ya mbegu ndogo."
  hi: "विशाल जड़ तंत्र मिट्टी का दबाव तोड़ता है; कुछ किस्में जड़-गाँठ सूत्रकृमि दबाती हैं (ढुरिन/HCN)। एलेलोपैथिक — छोटे बीज वाली फसलें बोने से पहले रुकें।"
  de: "Riesiges Wurzelsystem bricht Verdichtungen; manche Sorten unterdrücken Wurzelgallennematoden (Dhurrin/HCN). Allelopathisch – vor kleinsamigen Kulturen abwarten."
rk_crop_sorghum_sudan_allelopathy:
  en: "Sorghum roots/residues exude sorgoleone and phenolics that suppress weeds and can reduce stands/growth of small-seeded following crops (wheat, vegetables) for weeks."
  es: "Las raíces y rastrojos de sorgo liberan sorgoleona y fenoles que suprimen malezas y pueden reducir durante semanas la emergencia y el crecimiento de cultivos de semilla pequeña que siguen (trigo, hortalizas)."
  fr: "Racines et résidus de sorgho libèrent sorgoléone et composés phénoliques qui freinent les adventices et peuvent réduire pendant des semaines la levée et la croissance des cultures à petites graines suivantes (blé, légumes)."
  sw: "Mizizi na masalia ya mtama hutoa sorgoleone na fenoli zinazozuia magugu na zinaweza kupunguza kuota/ukuaji wa mazao ya mbegu ndogo yanayofuata (ngano, mboga) kwa wiki kadhaa."
  hi: "ज्वार की जड़ें/अवशेष सोर्गोलियोन और फ़ीनोलिक छोड़ते हैं जो खरपतवार दबाते हैं और कई सप्ताह तक बाद की छोटे बीज वाली फसलों (गेहूं, सब्ज़ियाँ) का अंकुरण/बढ़वार घटा सकते हैं।"
  de: "Sorghumwurzeln und -rückstände geben Sorgoleon und Phenole ab, die Unkraut unterdrücken und Aufgang/Wachstum kleinsamiger Folgekulturen (Weizen, Gemüse) wochenlang mindern können."
