  en: "Water storage anomaly (GRACE/GRACE-FO, ~300 km)"
  es: "Anomalía del agua almacenada (GRACE/GRACE-FO, ~300 km)"
  fr: "Anomalie du stock d'eau (GRACE/GRACE-FO, ~300 km)"
  sw: "Hitilafu ya maji yaliyohifadhiwa (GRACE/GRACE-FO, ~km 300)"
  hi: "जल भंडार विसंगति (GRACE/GRACE-FO, ~300 किमी)"
  de: "Wasserspeicher-Anomalie (GRACE/GRACE-FO, ~300 km)"
series_grace_trend: {en: "Long-term trend (fitted)", es: "Tendencia a largo plazo (ajustada)", fr: "Tendance à long terme (ajustée)", sw: "Mwelekeo wa muda mrefu (uliokokotolewa)", hi: "दीर्घकालिक रुझान (फ़िट किया गया)", de: "Langfristiger Trend (angepasst)"}
gw_step_intro:
  en: "NASA GRACE and GRACE-FO weigh the water stored under and on the land each month ({first} to {last}, {n} months; JPL RL06.3 mascons)."
  es: "NASA GRACE y GRACE-FO pesan cada mes el agua almacenada bajo y sobre la tierra ({first} a {last}, {n} meses; mascons JPL RL06.3)."
  fr: "NASA GRACE et GRACE-FO pèsent chaque mois l'eau stockée sous et sur les terres ({first} à {last}, {n} mois ; mascons JPL RL06.3)."
  sw: "NASA GRACE na GRACE-FO hupima uzito wa maji yaliyohifadhiwa chini na juu ya ardhi kila mwezi ({first} hadi {last}, miezi {n}; mascon za JPL RL06.3)."
  hi: "NASA GRACE और GRACE-FO हर महीने ज़मीन के नीचे और ऊपर जमा पानी को तौलते हैं ({first} से {last}, {n} महीने; JPL RL06.3 मैस्कॉन)।"
  de: "NASA GRACE und GRACE-FO wiegen jeden Monat das Wasser unter und auf dem Land ({first} bis {last}, {n} Monate; JPL-RL06.3-Mascons)."
gw_step_trend:
  en: "Trend at this location: {trend}. Change since 2003: {change:+.0f} cm of water."
  es: "Tendencia en este lugar: {trend}. Cambio desde 2003: {change:+.0f} cm de agua."
  fr: "Tendance à cet endroit : {trend}. Variation depuis 2003 : {change:+.0f} cm d'eau."
  sw: "Mwelekeo mahali hapa: {trend}. Mabadiliko tangu 2003: sm {change:+.0f} za maji."
  hi: "इस स्थान पर रुझान: {trend}। 2003 से बदलाव: {change:+.0f} सेमी पानी।"
  de: "Trend an diesem Ort: {trend}. Änderung seit 2003: {change:+.0f} cm Wasser."
gw_step_recent:
  en: "Last 3 months (seasonal cycle removed): {anom:+.0f} cm vs. the 2004–2009 mean, lower than {pct:.0f} % of months on record."
  es: "Últimos 3 meses (sin ciclo estacional): {anom:+.0f} cm frente a la media 2004–2009, por debajo del {pct:.0f} % de los meses registrados."
  fr: "3 derniers mois (cycle saisonnier retiré) : {anom:+.0f} cm par rapport à la moyenne 2004–2009, plus bas que {pct:.0f} % des mois enregistrés."
  sw: "Miezi 3 iliyopita (mzunguko wa msimu umeondolewa): sm {anom:+.0f} ukilinganisha na wastani wa 2004–2009, chini kuliko {pct:.0f} % ya miezi iliyorekodiwa."
  hi: "पिछले 3 महीने (मौसमी चक्र हटाकर): 2004–2009 के औसत की तुलना में {anom:+.0f} सेमी, रिकॉर्ड के {pct:.0f} % महीनों से कम।"
  de: "Letzte 3 Monate (ohne Jahresgang): {anom:+.0f} cm gegenüber dem Mittel 2004–2009, niedriger als {pct:.0f} % der erfassten Monate."
gw_step_5y:
  en: "Last 5 years alone: {slope:+.1f} cm/yr (wet or dry spells dominate short windows)."
  es: "Solo los últimos 5 años: {slope:+.1f} cm/año (las rachas húmedas o secas dominan en periodos cortos)."
  fr: "5 dernières années seules : {slope:+.1f} cm/an (les épisodes humides ou secs dominent sur des périodes courtes)."
  sw: "Miaka 5 iliyopita pekee: sm {slope:+.1f}/mwaka (vipindi vya mvua au ukame hutawala vipindi vifupi)."
  hi: "केवल पिछले 5 वर्ष: {slope:+.1f} सेमी/वर्ष (छोटी अवधि में गीले या सूखे दौर हावी रहते हैं)।"
  de: "Nur die letzten 5 Jahre: {slope:+.1f} cm/Jahr (nasse oder trockene Phasen dominieren kurze Zeiträume)."
gw_step_wells:
  en: "Check against wells (VALIDATION V14): in 11 U.S. aquifer regions, GRACE's yearly storage moved with USGS groundwater levels in all 11 (median r = 0.56) and the trend direction matched in 8; it can disagree where irrigation recharge keeps shallow wells steady while the wider region dries (e.g. Fallon, Nevada)."
  es: "Comprobación con pozos (VALIDACIÓN V14): en 11 regiones acuíferas de EE. UU., el almacenamiento anual de GRACE se movió con los niveles freáticos del USGS en las 11 (r mediana = 0,56) y la dirección de la tendencia coincidió en 8; puede discrepar donde la recarga por riego mantiene estables los pozos someros mientras la región se seca (p. ej. Fallon, Nevada)."
  fr: "Vérification avec des puits (VALIDATION V14) : dans 11 régions aquifères des États-Unis, le stock annuel GRACE a suivi les niveaux de nappe USGS dans les 11 (r médian = 0,56) et le sens de la tendance concordait dans 8 ; il peut diverger là où la recharge par l'irrigation maintient les puits peu profonds alors que la région s'assèche (p. ex. Fallon, Nevada)."
  sw: "Ulinganisho na visima (UTHIBITISHO V14): katika maeneo 11 ya chemichemi nchini Marekani, hifadhi ya kila mwaka ya GRACE ilienda sambamba na viwango vya maji ya ardhini vya USGS katika yote 11 (r ya kati = 0.56) na mwelekeo ulilingana katika 8; inaweza kutofautiana pale ujazaji wa umwagiliaji unapoweka visima vifupi sawa wakati eneo pana linakauka (mf. Fallon, Nevada)."
  hi: "कुओं से जाँच (सत्यापन V14): अमेरिका के 11 जलभृत क्षेत्रों में GRACE का वार्षिक भंडार सभी 11 में USGS भूजल स्तर के साथ बदला (माध्यिका r = 0.56) और 8 में रुझान की दिशा मेल खाई; जहाँ सिंचाई से उथले कुएँ भरे रहते हैं पर बड़ा क्षेत्र सूखता है, वहाँ अंतर हो सकता है (जैसे Fallon, Nevada)।"
  de: "Abgleich mit Brunnen (VALIDIERUNG V14): In 11 US-Grundwasserregionen folgte der jährliche GRACE-Speicher in allen 11 den USGS-Grundwasserständen (Median r = 0,56), die Trendrichtung stimmte in 8; Abweichungen gibt es, wo Bewässerung flache Brunnen auffüllt, während die Region austrocknet (z. B. Fallon, Nevada)."
gw_step_moved:
  en: "Nearest land cell used ({km} km away)."
  es: "Se usó la celda terrestre más cercana (a {km} km)."
  fr: "Cellule terrestre la plus proche utilisée (à {km} km)."
  sw: "Seli ya nchi kavu iliyo karibu zaidi imetumika (km {km})."
  hi: "सबसे नज़दीकी ज़मीनी सेल उपयोग किया गया ({km} किमी दूर)।"
  de: "Nächstgelegene Landzelle verwendet ({km} km entfernt)."
gw_note_sig:
  en: "A long, statistically tested record; but the footprint is ~300 km and includes soil and surface water."
  es: "Un registro largo y probado estadísticamente; pero la huella es de ~300 km e incluye agua del suelo y superficial."
  fr: "Une longue série testée statistiquement ; mais l'emprise est de ~300 km et inclut l'eau du sol et de surface."
  sw: "Kumbukumbu ndefu iliyopimwa kitakwimu; lakini eneo ni ~km 300 na linajumuisha maji ya udongo na ya juu."
  hi: "लंबा, सांख्यिकीय रूप से परखा रिकॉर्ड; पर दायरा ~300 किमी है और इसमें मिट्टी व सतही पानी शामिल है।"
  de: "Eine lange, statistisch geprüfte Reihe; die Fläche ist aber ~300 km groß und umfasst Boden- und Oberflächenwasser."
gw_note_uncertain:
  en: "Year-to-year swings are large compared with the trend, so its direction is uncertain."
  es: "Las variaciones entre años son grandes frente a la tendencia, así que su dirección es incierta."
  fr: "Les variations d'une année à l'autre sont grandes par rapport à la tendance, sa direction est donc incertaine."
  sw: "Tofauti za mwaka hadi mwaka ni kubwa ukilinganisha na mwelekeo, hivyo mwelekeo wake hauna uhakika."
  hi: "रुझान की तुलना में साल-दर-साल उतार-चढ़ाव बड़े हैं, इसलिए इसकी दिशा अनिश्चित है।"
  de: "Die Schwankungen von Jahr zu Jahr sind groß gegenüber dem Trend, seine Richtung ist daher unsicher."
