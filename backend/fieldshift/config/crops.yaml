# FieldShift crop parameter table — version 1.0.0
# Sources (see docs/MODELS.md for full references):
#   kc_*, stages, root_m, p ............ FAO-56 Tables 11, 12, 22 (Allen et al. 1998); arid-region stage lengths where given
#   ky ................................... FAO-33 / FAO-56 yield response factor (Doorenbos & Kassam 1979)
#   wp (g/m2, normalised water productivity), hi ..... AquaCrop defaults (Steduto et al. 2009, Raes et al. 2009) where available
#   t_base, t_heat, t_kill ............. common agronomic thresholds (cited in docs/MODELS.md); heat = Tmax at flowering
#   n_fix_kg_ha ........................ typical net symbiotic N credit to the following crop (extension literature, wide ranges)
#   price_usd_t, cost_usd_ha .......... INDICATIVE 2023–24 U.S. values (USDA NASS prices received; extension enterprise budgets).
#                                         Edit locally — market suitability must be reviewed by the farmer.
#   calib ............................... scales WP-based potential biomass to typical irrigated yields (documented calibration)
# Teff, cover crops and some smallholder crops are not in FAO-56; their values are literature estimates marked low_confidence.

version: "1.0.0"
