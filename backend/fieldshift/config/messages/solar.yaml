# Solar irrigation pump advisor (engine/solar_service.py; POST /api/solar-pump and the advice card's Why view).
solar_step_need:
  en: "Crop water need (FAO-56): ETc = Kc × ET₀. In {month} ET₀ averages {et0:.1f} mm/day (NASA POWER, {y0}–{y1}) and the season-weighted Kc of {crop} is {kc:.2f}."
  es: "Necesidad de agua del cultivo (FAO-56): ETc = Kc × ET₀. En {month} la ET₀ promedia {et0:.1f} mm/día (NASA POWER, {y0}–{y1}) y el Kc ponderado de {crop} es {kc:.2f}."
  fr: "Besoin en eau (FAO-56) : ETc = Kc × ET₀. En {month}, l'ET₀ moyenne est de {et0:.1f} mm/jour (NASA POWER, {y0}–{y1}) et le Kc pondéré de {crop} est de {kc:.2f}."
  sw: "Mahitaji ya maji ya zao (FAO-56): ETc = Kc × ET₀. Mwezi {month} wastani wa ET₀ ni mm {et0:.1f}/siku (NASA POWER, {y0}–{y1}) na Kc ya msimu ya {crop} ni {kc:.2f}."
  hi: "फसल जल आवश्यकता (FAO-56): ETc = Kc × ET₀। {month} में औसत ET₀ {et0:.1f} मिमी/दिन है (NASA POWER, {y0}–{y1}) और {crop} का मौसम-भारित Kc {kc:.2f} है।"
  de: "Wasserbedarf der Kultur (FAO-56): ETc = Kc × ET₀. Im {month} beträgt ET₀ im Mittel {et0:.1f} mm/Tag (NASA POWER, {y0}–{y1}); der saisongewichtete Kc von {crop} ist {kc:.2f}."
solar_step_rain:
  en: "Effective rain (USDA-SCS) {peff:.0f} mm of {rain:.0f} mm → net irrigation {net:.0f} mm/month; with {method} irrigation (~{eff:.0%} efficient) gross {gross:.0f} mm/month = {m3:.0f} m³/day on {area:.2f} ha."
  es: "Lluvia efectiva (USDA-SCS) {peff:.0f} mm de {rain:.0f} mm → riego neto {net:.0f} mm/mes; con riego por {method} (~{eff:.0%} de eficiencia) bruto {gross:.0f} mm/mes = {m3:.0f} m³/día en {area:.2f} ha."
  fr: "Pluie efficace (USDA-SCS) {peff:.0f} mm sur {rain:.0f} mm → irrigation nette {net:.0f} mm/mois ; en irrigation {method} (efficience ~{eff:.0%}) brute {gross:.0f} mm/mois = {m3:.0f} m³/jour sur {area:.2f} ha."
  sw: "Mvua yenye manufaa (USDA-SCS) mm {peff:.0f} kati ya mm {rain:.0f} → umwagiliaji halisi mm {net:.0f}/mwezi; kwa umwagiliaji wa {method} (ufanisi ~{eff:.0%}) jumla mm {gross:.0f}/mwezi = m³ {m3:.0f}/siku kwa ha {area:.2f}."
  hi: "प्रभावी वर्षा (USDA-SCS) {rain:.0f} मिमी में से {peff:.0f} मिमी → शुद्ध सिंचाई {net:.0f} मिमी/माह; {method} सिंचाई (~{eff:.0%} दक्षता) से सकल {gross:.0f} मिमी/माह = {area:.2f} हेक्टेयर पर {m3:.0f} m³/दिन।"
  de: "Effektiver Regen (USDA-SCS) {peff:.0f} mm von {rain:.0f} mm → Nettobewässerung {net:.0f} mm/Monat; mit {method}bewässerung (~{eff:.0%} Wirkungsgrad) brutto {gross:.0f} mm/Monat = {m3:.0f} m³/Tag auf {area:.2f} ha."
solar_step_head:
  en: "Total dynamic head {head:.1f} m = static lift {static:.0f} m + {method} pressure {pressure:.0f} m + 10% pipe friction."
  es: "Altura dinámica total {head:.1f} m = elevación estática {static:.0f} m + presión de {method} {pressure:.0f} m + 10% de fricción en tuberías."
  fr: "Hauteur manométrique totale {head:.1f} m = hauteur géométrique {static:.0f} m + pression {method} {pressure:.0f} m + 10 % de pertes de charge."
  sw: "Kimo chote {head:.1f} m = kuinua maji m {static:.0f} + shinikizo la {method} m {pressure:.0f} + 10% msuguano wa bomba."
  hi: "कुल डायनेमिक हेड {head:.1f} मी = स्थिर उठान {static:.0f} मी + {method} दबाव {pressure:.0f} मी + 10% पाइप घर्षण।"
  de: "Gesamtförderhöhe {head:.1f} m = statische Höhe {static:.0f} m + Druck {method} {pressure:.0f} m + 10 % Rohrreibung."
solar_step_energy:
  en: "Hydraulic energy E = ρ·g·H·V = 0.002725 × {head:.1f} m × {m3:.0f} m³ = {kwh:.1f} kWh/day ({wh:.0f} Wh per m³)."
  es: "Energía hidráulica E = ρ·g·H·V = 0,002725 × {head:.1f} m × {m3:.0f} m³ = {kwh:.1f} kWh/día ({wh:.0f} Wh por m³)."
  fr: "Énergie hydraulique E = ρ·g·H·V = 0,002725 × {head:.1f} m × {m3:.0f} m³ = {kwh:.1f} kWh/jour ({wh:.0f} Wh par m³)."
  sw: "Nishati ya maji E = ρ·g·H·V = 0.002725 × {head:.1f} m × {m3:.0f} m³ = {kwh:.1f} kWh/siku ({wh:.0f} Wh kwa m³)."
  hi: "जलीय ऊर्जा E = ρ·g·H·V = 0.002725 × {head:.1f} मी × {m3:.0f} m³ = {kwh:.1f} kWh/दिन (प्रति m³ {wh:.0f} Wh)।"
  de: "Hydraulische Energie E = ρ·g·H·V = 0,002725 × {head:.1f} m × {m3:.0f} m³ = {kwh:.1f} kWh/Tag ({wh:.0f} Wh je m³)."
solar_step_sun:
  en: "Sunshine in {month}: {psh:.2f} kWh/m²/day (NASA POWER all-sky irradiance = peak-sun hours). PV performance ratio {pr:.2f} (module temperature at {tair:.0f} °C air: ×{tf:.2f}; other losses ×{loss})."
  es: "Sol en {month}: {psh:.2f} kWh/m²/día (irradiancia NASA POWER = horas de sol pico). Rendimiento FV {pr:.2f} (temperatura del módulo con {tair:.0f} °C de aire: ×{tf:.2f}; otras pérdidas ×{loss})."
  fr: "Ensoleillement en {month} : {psh:.2f} kWh/m²/jour (irradiance NASA POWER = heures de plein soleil). Ratio de performance PV {pr:.2f} (température des modules à {tair:.0f} °C d'air : ×{tf:.2f} ; autres pertes ×{loss})."
  sw: "Jua mwezi {month}: {psh:.2f} kWh/m²/siku (mionzi ya NASA POWER = saa za jua kali). Uwiano wa utendaji wa paneli {pr:.2f} (joto la paneli kwa hewa ya {tair:.0f} °C: ×{tf:.2f}; hasara nyingine ×{loss})."
  hi: "{month} में धूप: {psh:.2f} kWh/m²/दिन (NASA POWER विकिरण = पीक-सन घंटे)। PV प्रदर्शन अनुपात {pr:.2f} ({tair:.0f} °C हवा पर मॉड्यूल तापमान: ×{tf:.2f}; अन्य हानियाँ ×{loss})।"
  de: "Sonne im {month}: {psh:.2f} kWh/m²/Tag (NASA-POWER-Einstrahlung = Volllaststunden). PV-Performance-Ratio {pr:.2f} (Modultemperatur bei {tair:.0f} °C Luft: ×{tf:.2f}; sonstige Verluste ×{loss})."
solar_step_size:
  en: "PV size = E / (sun hours × pump efficiency {eta} × PR) = {kwp:.2f} kWp; pump rated ~{flow:.1f} m³/h."
  es: "Tamaño FV = E / (horas de sol × eficiencia de bomba {eta} × PR) = {kwp:.2f} kWp; bomba de ~{flow:.1f} m³/h."
  fr: "Puissance PV = E / (heures de soleil × rendement pompe {eta} × PR) = {kwp:.2f} kWc ; pompe de ~{flow:.1f} m³/h."
  sw: "Ukubwa wa paneli = E / (saa za jua × ufanisi wa pampu {eta} × PR) = {kwp:.2f} kWp; pampu ya ~m³ {flow:.1f}/saa."
  hi: "PV आकार = E / (धूप घंटे × पंप दक्षता {eta} × PR) = {kwp:.2f} kWp; पंप क्षमता ~{flow:.1f} m³/घंटा।"
  de: "PV-Größe = E / (Sonnenstunden × Pumpenwirkungsgrad {eta} × PR) = {kwp:.2f} kWp; Pumpe ~{flow:.1f} m³/h."
solar_step_cost:
  en: "Over the season the pump lifts {m3} m³. Solar water cost {usd:.3f} USD/m³ (capex {capex} USD annualised over {life} years at {disc:.0%} + {om:.0%} O&M)."
  es: "En la temporada la bomba eleva {m3} m³. Costo del agua solar {usd:.3f} USD/m³ (inversión {capex} USD anualizada a {life} años al {disc:.0%} + {om:.0%} de operación y mantenimiento)."
  fr: "Sur la saison, la pompe relève {m3} m³. Coût de l'eau solaire {usd:.3f} USD/m³ (investissement {capex} USD annualisé sur {life} ans à {disc:.0%} + {om:.0%} d'exploitation-maintenance)."
  sw: "Kwa msimu pampu huinua m³ {m3}. Gharama ya maji ya jua USD {usd:.3f}/m³ (mtaji USD {capex} uliogawanywa kwa miaka {life} kwa {disc:.0%} + {om:.0%} uendeshaji na matengenezo)."
  hi: "मौसम में पंप {m3} m³ पानी उठाता है। सौर पानी की लागत {usd:.3f} USD/m³ (पूंजी {capex} USD, {life} वर्षों में {disc:.0%} पर वार्षिक + {om:.0%} संचालन-रखरखाव)।"
  de: "In der Saison fördert die Pumpe {m3} m³. Solarwasser kostet {usd:.3f} USD/m³ (Investition {capex} USD, annualisiert über {life} Jahre zu {disc:.0%} + {om:.0%} Betrieb und Wartung)."
solar_step_diesel:
  en: "Diesel pump set (fuel-to-water efficiency {eta:.0%}): {ml:.0f} mL fuel per m³ → {usd:.3f} USD/m³ fuel + maintenance (purchase not included); {litres} L/yr = {co2:.1f} t CO₂/yr avoided."
  es: "Motobomba diésel (eficiencia combustible-agua {eta:.0%}): {ml:.0f} mL de combustible por m³ → {usd:.3f} USD/m³ de combustible + mantenimiento (sin compra); {litres} L/año = {co2:.1f} t CO₂/año evitadas."
  fr: "Groupe motopompe diesel (rendement carburant-eau {eta:.0%}) : {ml:.0f} mL de carburant par m³ → {usd:.3f} USD/m³ carburant + entretien (achat non compris) ; {litres} L/an = {co2:.1f} t CO₂/an évitées."
  sw: "Pampu ya dizeli (ufanisi wa mafuta kwa maji {eta:.0%}): mL {ml:.0f} za mafuta kwa m³ → USD {usd:.3f}/m³ mafuta + matengenezo (bila bei ya kununua); L {litres}/mwaka = t {co2:.1f} CO₂/mwaka zinaepukwa."
  hi: "डीज़ल पंप सेट (ईंधन-से-पानी दक्षता {eta:.0%}): प्रति m³ {ml:.0f} mL ईंधन → {usd:.3f} USD/m³ ईंधन + रखरखाव (खरीद शामिल नहीं); {litres} L/वर्ष = {co2:.1f} t CO₂/वर्ष की बचत।"
  de: "Dieselpumpe (Kraftstoff-zu-Wasser-Wirkungsgrad {eta:.0%}): {ml:.0f} mL Kraftstoff je m³ → {usd:.3f} USD/m³ Kraftstoff + Wartung (ohne Anschaffung); {litres} L/Jahr = {co2:.1f} t CO₂/Jahr vermieden."
solar_sum:
  en: "A {kwp:.1f} kWp solar pump lifts the peak-month water need of this field ({m3:.0f} m³/day) using NASA POWER sunshine; it replaces {litres} L of diesel per season."
  es: "Una bomba solar de {kwp:.1f} kWp eleva el agua del mes de mayor demanda de este campo ({m3:.0f} m³/día) con el sol medido por NASA POWER; reemplaza {litres} L de diésel por temporada."
  fr: "Une pompe solaire de {kwp:.1f} kWc couvre le besoin du mois de pointe de cette parcelle ({m3:.0f} m³/jour) avec l'ensoleillement NASA POWER ; elle remplace {litres} L de diesel par saison."
  sw: "Pampu ya jua ya kWp {kwp:.1f} huinua maji yanayohitajika mwezi wa kilele shambani hapa (m³ {m3:.0f}/siku) kwa jua la NASA POWER; inachukua nafasi ya lita {litres} za dizeli kwa msimu."
  hi: "{kwp:.1f} kWp का सौर पंप NASA POWER धूप से इस खेत की चरम माह की पानी ज़रूरत ({m3:.0f} m³/दिन) उठाता है; हर मौसम {litres} L डीज़ल बचाता है।"
  de: "Eine Solarpumpe mit {kwp:.1f} kWp deckt mit NASA-POWER-Sonnenstrahlung den Wasserbedarf des Spitzenmonats ({m3:.0f} m³/Tag) und ersetzt {litres} L Diesel pro Saison."
model_solar:
  en: "PV pump sizing: hydraulic energy ρgHV / (irradiation × pump efficiency × PR) (FAO & GIZ 2018 SPIS)"
  es: "Dimensionado de bomba FV: energía hidráulica ρgHV / (irradiación × eficiencia de bomba × PR) (FAO y GIZ 2018 SPIS)"
  fr: "Dimensionnement de pompe PV : énergie hydraulique ρgHV / (irradiation × rendement pompe × PR) (FAO et GIZ 2018 SPIS)"
  sw: "Ukubwa wa pampu ya jua: nishati ya maji ρgHV / (mionzi × ufanisi wa pampu × PR) (FAO na GIZ 2018 SPIS)"
  hi: "PV पंप आकार: जलीय ऊर्जा ρgHV / (विकिरण × पंप दक्षता × PR) (FAO और GIZ 2018 SPIS)"
  de: "PV-Pumpenauslegung: hydraulische Energie ρgHV / (Einstrahlung × Pumpenwirkungsgrad × PR) (FAO & GIZ 2018 SPIS)"
solar_note:
  en: "Climatology is robust; pumping head, well yield and local prices dominate the uncertainty."
  es: "La climatología es robusta; la altura de bombeo, el caudal del pozo y los precios locales dominan la incertidumbre."
  fr: "La climatologie est robuste ; hauteur de pompage, débit du puits et prix locaux dominent l'incertitude."
  sw: "Takwimu za hali ya hewa ni imara; kimo cha kusukuma, uwezo wa kisima na bei za eneo ndizo zenye kutokuwa na uhakika zaidi."
  hi: "जलवायु आँकड़े मज़बूत हैं; पंपिंग हेड, कुएँ की क्षमता और स्थानीय कीमतें अनिश्चितता का मुख्य कारण हैं।"
  de: "Die Klimatologie ist robust; Förderhöhe, Brunnenleistung und lokale Preise bestimmen die Unsicherheit."
solar_caveat_head:
  en: "Static lift assumed 15 m — set your well/canal depth in the planner for a real quote."
  es: "Se asume una elevación estática de 15 m; indique la profundidad de su pozo o canal en el planificador para un cálculo real."
  fr: "Hauteur géométrique supposée 15 m — indiquez la profondeur de votre puits/canal dans le planificateur pour un vrai devis."
  sw: "Kimo cha kuinua kimekisiwa m 15 — weka kina cha kisima/mfereji wako kwenye mpangaji kupata makadirio halisi."
  hi: "स्थिर उठान 15 मी माना गया — सही अनुमान के लिए प्लानर में अपने कुएँ/नहर की गहराई डालें।"
  de: "Statische Förderhöhe mit 15 m angenommen – für ein echtes Angebot die Brunnen-/Kanaltiefe im Planer eintragen."
solar_caveat_costs:
  en: "Diesel and PV-pump prices are for {country} ({cur}); check local quotes and subsidies (e.g. PM-KUSUM in India)."
  es: "Los precios del diésel y de la bomba solar son de {country} ({cur}); consulte presupuestos locales y subsidios (p. ej., PM-KUSUM en India)."
  fr: "Les prix du diesel et de la pompe solaire sont ceux de {country} ({cur}) ; demandez des devis locaux et vérifiez les subventions (p. ex. PM-KUSUM en Inde)."
  sw: "Bei za dizeli na pampu ya jua ni za {country} ({cur}); uliza bei za karibu na ruzuku (k.m. PM-KUSUM nchini India)."
  hi: "डीज़ल और सोलर पंप की कीमतें {country} ({cur}) की हैं; स्थानीय कोटेशन और सब्सिडी (जैसे भारत में PM-KUSUM) जांचें।"
  de: "Diesel- und Solarpumpenpreise gelten für {country} ({cur}); holen Sie lokale Angebote ein und prüfen Sie Förderungen (z. B. PM-KUSUM in Indien)."
solar_step_prices:
  en: "Prices for {country}: diesel {diesel}; PV pump {pv}."
  es: "Precios para {country}: diésel {diesel}; bomba solar {pv}."
  fr: "Prix pour {country} : diesel {diesel} ; pompe solaire {pv}."
  sw: "Bei za {country}: dizeli {diesel}; pampu ya jua {pv}."
  hi: "{country} के लिए कीमतें: डीज़ल {diesel}; सोलर पंप {pv}।"
  de: "Preise für {country}: Diesel {diesel}; Solarpumpe {pv}."
solar_step_local:
  en: " In {cur}: solar {solar} vs diesel {diesel} per m³, investment {capex} (1 USD = {rate} {cur}, {year})."
  es: " En {cur}: solar {solar} frente a diésel {diesel} por m³, inversión {capex} (1 USD = {rate} {cur}, {year})."
  fr: " En {cur} : solaire {solar} contre diesel {diesel} par m³, investissement {capex} (1 USD = {rate} {cur}, {year})."
  sw: " Kwa {cur}: jua {solar} dhidi ya dizeli {diesel} kwa m³, uwekezaji {capex} (USD 1 = {cur} {rate}, {year})."
  hi: " {cur} में: सोलर {solar} बनाम डीज़ल {diesel} प्रति m³, निवेश {capex} (1 USD = {rate} {cur}, {year})।"
  de: " In {cur}: Solar {solar} gegenüber Diesel {diesel} je m³, Investition {capex} (1 USD = {rate} {cur}, {year})."
country_unknown:
  en: "an unknown country (world averages)"
  es: "un país desconocido (promedios mundiales)"
  fr: "un pays inconnu (moyennes mondiales)"
  sw: "nchi isiyojulikana (wastani wa dunia)"
  hi: "एक अज्ञात देश (विश्व औसत)"
  de: "ein unbekanntes Land (Weltdurchschnitt)"
solar_caveat_well:
  en: "Check that your well can deliver the pump flow; solar pumps work in daylight — a storage tank smooths supply."
  es: "Compruebe que su pozo puede dar el caudal de la bomba; las bombas solares funcionan de día: un tanque de almacenamiento regula el suministro."
  fr: "Vérifiez que votre puits fournit le débit de la pompe ; les pompes solaires fonctionnent de jour — un réservoir lisse l'approvisionnement."
  sw: "Hakikisha kisima chako kinaweza kutoa kiasi cha pampu; pampu za jua hufanya kazi mchana — tanki la kuhifadhi husawazisha upatikanaji."
  hi: "जाँचें कि आपका कुआँ पंप जितना पानी दे सकता है; सौर पंप दिन में चलते हैं — भंडारण टंकी आपूर्ति को संतुलित करती है।"
  de: "Prüfen, ob der Brunnen den Pumpenstrom liefert; Solarpumpen laufen bei Tageslicht – ein Speichertank gleicht aus."
solar_caveat_rice:
  en: "Paddy rice also needs water for puddling and percolation, which is not included."
  es: "El arroz inundado también necesita agua para el fangueo y la percolación, que no se incluye."
  fr: "Le riz inondé demande aussi de l'eau pour la mise en boue et la percolation, non incluse."
  sw: "Mpunga pia unahitaji maji ya kutifua tope na kupenya ardhini, ambayo hayajajumuishwa."
  hi: "धान को पडलिंग और रिसाव के लिए भी पानी चाहिए, जो इसमें शामिल नहीं है।"
  de: "Nassreis braucht zusätzlich Wasser zum Puddeln und für die Versickerung; das ist nicht enthalten."
price_user:
  en: "entered by you"
  es: "introducido por usted"
  fr: "saisi par vous"
  sw: "uliyoingiza wewe"
  hi: "आपके द्वारा दर्ज"
  de: "von Ihnen eingegeben"
