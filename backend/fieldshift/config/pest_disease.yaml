# Texts for the global pest & disease risk cards (engine/risk_cards.py, science/globalrisk.py).
# Languages: en, es, fr, sw, hi, de (English fallback). Actions follow IPM: scout first, cultural control first,
# no pesticide or brand advice — treatment decisions are referred to local thresholds and extension services.
messages:
  risk_title_disease:
    en: "{risk} {name} risk from {day}"
    es: "Riesgo {risk} de {name} desde el {day}"
    fr: "Risque {risk} de {name} dès le {day}"
    sw: "Hatari {risk} ya {name} kuanzia {day}"
    hi: "{day} से {name} का {risk} जोखिम"
    de: "{risk}es Risiko: {name} ab {day}"
  risk_title_pest:
    en: "{risk} {name} risk from {day}"
    es: "Riesgo {risk} de {name} desde el {day}"
    fr: "Risque {risk} : {name} dès le {day}"
    sw: "Hatari {risk} ya {name} kuanzia {day}"
    hi: "{day} से {name} का {risk} जोखिम"
    de: "{risk}es Risiko: {name} ab {day}"

# Translated names of the older (regional) disease models, used in their existing card titles.
legacy_disease_names:
  late_blight: {en: Late blight, es: tizón tardío, fr: mildiou, sw: baka jani chelewa, hi: पछेता झुलसा, de: Kraut- und Knollenfäule}
  stripe_rust: {en: Stripe rust, es: roya amarilla, fr: rouille jaune, sw: kutu ya manjano, hi: पीला रतुआ, de: Gelbrost}
  powdery_mildew: {en: Powdery mildew, es: oídio, fr: oïdium, sw: ukungu mweupe, hi: चूर्णिल आसिता, de: Echter Mehltau}
  legume_leaf_disease: {en: Leaf spot / spring black stem, es: mancha foliar / tallo negro, fr: taches foliaires / tige noire, sw: madoa ya majani / shina jeusi, hi: पत्ती धब्बा / काला तना, de: Blattflecken / Schwarzbeinigkeit}
  white_mould: {en: White mould (Sclerotinia), es: moho blanco (Sclerotinia), fr: pourriture blanche (Sclerotinia), sw: ukungu mweupe (Sclerotinia), hi: सफेद फफूंद (स्क्लेरोटिनिया), de: Weißstängeligkeit (Sclerotinia)}
  downy_mildew_millet: {en: Downy mildew, es: mildiu velloso, fr: mildiou, sw: ubwiri vinyoya, hi: मृदुरोमिल आसिता, de: Falscher Mehltau}

models:
  rice_blast:
    name: {en: Rice blast, es: piricularia del arroz, fr: pyriculariose du riz, sw: ugonjwa wa blast wa mpunga, hi: धान का झोंका (ब्लास्ट) रोग, de: Reisbräune (Blast)}
    model: "BLASTAM criteria: wet period at 15–25 °C lasting 10–17 h (temperature-dependent) after a 5-day mean of 20–25 °C"
    summary: "Long periods of wet leaves at mild temperatures, after a warm and humid spell, let rice blast spores infect."
    action:
      en: "Scout leaves (and panicle necks at heading) for diamond-shaped grey lesions. Avoid extra nitrogen now, keep flooding even, and follow local advice on resistant varieties and protective treatment."
      es: "Revise las hojas (y el cuello de la panícula al espigar) en busca de lesiones grises en forma de rombo. Evite más nitrógeno ahora, mantenga la inundación uniforme y siga el consejo local sobre variedades resistentes y tratamiento preventivo."
      fr: "Inspectez les feuilles (et le col des panicules à l'épiaison) : taches grises en losange. Évitez tout apport d'azote maintenant, gardez une lame d'eau régulière et suivez le conseil local sur les variétés résistantes et la protection."
      sw: "Kagua majani (na shingo za suke wakati wa kuchanua) kwa madoa ya kijivu yenye umbo la almasi. Usiongeze naitrojeni sasa, weka maji sawasawa shambani, na fuata ushauri wa ugani kuhusu aina zinazostahimili na kinga."
      hi: "पत्तियों (और बाली निकलते समय बाली की गर्दन) पर हीरे के आकार के धूसर धब्बे देखें। अभी अतिरिक्त नाइट्रोजन न दें, पानी समान रूप से भरा रखें, और प्रतिरोधी किस्मों व सुरक्षात्मक उपचार पर स्थानीय सलाह मानें।"
      de: "Blätter (und zur Rispenbildung die Rispenhälse) auf rautenförmige graue Flecken prüfen. Jetzt keinen zusätzlichen Stickstoff geben, gleichmäßig fluten und lokale Beratung zu resistenten Sorten und Schutzbehandlung befolgen."
    references:
      - "BLASTAM leaf-blast forecast, as published by the Ibaraki and Hiroshima prefectural plant protection offices (wetness table after Yokouchi, Higuchi & Munakata)"
      - "Symptoms appear about 7–10 days after a favourable day"
    caveats:
      - "Gridded humidity under-estimates wetness inside a flooded rice canopy."
  wheat_leaf_rust:
    name: {en: Wheat leaf rust, es: roya de la hoja del trigo, fr: rouille brune du blé, sw: kutu ya majani ya ngano, hi: गेहूं का भूरा रतुआ, de: Braunrost (Weizen)}
    model: "Magarey et al. (2005) infection model, Table 2 parameters for Puccinia recondita (2.6/25/30 °C, 5–16 h wetness)"
    summary: "Leaf rust spores infect when leaves stay wet with dew for several hours at mild to warm temperatures."
    action:
      en: "Scout the upper leaves for small orange-brown pustules. If they spread before heading on a susceptible variety, follow local thresholds on protective treatment; choose resistant varieties next season."
      es: "Revise las hojas superiores en busca de pústulas pequeñas color naranja-pardo. Si se extienden antes del espigado en una variedad susceptible, siga los umbrales locales de tratamiento; elija variedades resistentes la próxima campaña."
      fr: "Inspectez les feuilles supérieures : petites pustules orange-brun. Si elles s'étendent avant l'épiaison sur une variété sensible, suivez les seuils locaux de traitement ; choisissez des variétés résistantes la saison prochaine."
      sw: "Kagua majani ya juu kwa vipele vidogo vya rangi ya chungwa-kahawia. Vikienea kabla ya kuchanua kwenye aina isiyostahimili, fuata viwango vya ugani kuhusu kinga; panda aina zinazostahimili msimu ujao."
      hi: "ऊपरी पत्तियों पर छोटे नारंगी-भूरे फफोले देखें। यदि संवेदनशील किस्म में बाली से पहले फैलें, तो उपचार के लिए स्थानीय सीमा मानें; अगले मौसम प्रतिरोधी किस्में चुनें।"
      de: "Obere Blätter auf kleine orangebraune Pusteln prüfen. Breiten sie sich vor dem Ährenschieben in einer anfälligen Sorte aus, lokale Schadschwellen beachten; nächste Saison resistente Sorten wählen."
    references:
      - "Magarey R.D., Sutton T.B., Thayer C.L. 2005, Phytopathology 95:92–100, doi:10.1094/PHYTO-95-0092"
      - "Roelfs A.P., Singh R.P., Saari E.E. 1992, Rust Diseases of Wheat, CIMMYT, hdl:10883/1153"
  wheat_stem_rust:
    name: {en: Wheat stem rust, es: roya del tallo del trigo, fr: rouille noire du blé, sw: kutu ya shina ya ngano, hi: गेहूं का काला (तना) रतुआ, de: Schwarzrost (Weizen)}
    model: "Magarey et al. (2005) infection model with stem-rust cardinal values from Roelfs et al. 1992 (2/18/30 °C, ≥ 6 h dew)"
    summary: "Stem rust needs a long dew period on warm nights; it is the most destructive wheat rust (e.g. the Ug99 lineage)."
    action:
      en: "Scout stems and leaf sheaths for elongated brick-red pustules. Stem rust can destroy a crop within weeks: report suspected outbreaks to your extension service and follow local thresholds."
      es: "Revise tallos y vainas en busca de pústulas alargadas color rojo ladrillo. La roya del tallo puede destruir un cultivo en semanas: informe brotes sospechosos al servicio de extensión y siga los umbrales locales."
      fr: "Inspectez tiges et gaines : pustules allongées rouge brique. La rouille noire peut détruire une culture en quelques semaines : signalez tout foyer suspect au service de vulgarisation et suivez les seuils locaux."
      sw: "Kagua mashina na ala za majani kwa vipele virefu vyekundu kama tofali. Kutu ya shina inaweza kuharibu zao ndani ya wiki chache: ripoti mlipuko unaoshukiwa kwa afisa ugani na fuata viwango vya eneo lako."
      hi: "तनों और पत्ती आवरण पर लंबे ईंट-लाल फफोले देखें। काला रतुआ कुछ ही हफ्तों में फसल नष्ट कर सकता है: संदिग्ध प्रकोप की सूचना कृषि विस्तार सेवा को दें और स्थानीय सीमा मानें।"
      de: "Halme und Blattscheiden auf längliche ziegelrote Pusteln prüfen. Schwarzrost kann einen Bestand in Wochen zerstören: Verdachtsfälle der Beratung melden und lokale Schadschwellen beachten."
    references:
      - "Roelfs, Singh & Saari 1992, Rust Diseases of Wheat, CIMMYT"
      - "Magarey et al. 2005, Phytopathology 95:92–100"
  late_blight_tropical:
    name: {en: Late blight (tropical model), es: tizón tardío (modelo tropical), fr: mildiou (modèle tropical), sw: baka jani chelewa (modeli ya tropiki), hi: पछेता झुलसा (उष्णकटिबंधीय मॉडल), de: Kraut- und Knollenfäule (Tropenmodell)}
    model: "Wallin (1962) severity values (hours at RH ≥ 90 % × temperature, 7–27 °C), as used by BLITECAST (Krause et al. 1975)"
    summary: "Many hours of very humid air at cool to mild temperatures let late blight spread fast; in the tropics this happens in any month."
    action:
      en: "Scout the lower leaves for dark water-soaked spots with white mould underneath. Remove infected plants and volunteers, hill up tubers, and follow local advice on protective treatment intervals for your variety's resistance."
      es: "Revise las hojas bajas en busca de manchas oscuras acuosas con moho blanco en el envés. Elimine plantas infectadas y espontáneas, aporque los tubérculos y siga el consejo local sobre intervalos de protección según la resistencia de su variedad."
      fr: "Inspectez les feuilles basses : taches sombres huileuses avec feutrage blanc dessous. Arrachez plantes atteintes et repousses, buttez les tubercules et suivez le conseil local sur les intervalles de protection selon la résistance de la variété."
      sw: "Kagua majani ya chini kwa madoa meusi yenye maji na ukungu mweupe upande wa chini. Ng'oa mimea iliyoambukizwa na inayojiotea, fukia viazi vizuri, na fuata ushauri wa ugani kuhusu vipindi vya kinga kulingana na ustahimilivu wa aina yako."
      hi: "निचली पत्तियों पर गहरे, पानी भरे धब्बे और नीचे सफेद फफूंद देखें। संक्रमित व स्वयं उगे पौधे हटाएं, कंदों पर मिट्टी चढ़ाएं, और अपनी किस्म की प्रतिरोधकता के अनुसार सुरक्षा अंतराल पर स्थानीय सलाह मानें।"
      de: "Untere Blätter auf dunkle, wässrige Flecken mit weißem Belag unterseits prüfen. Befallene Pflanzen und Durchwuchs entfernen, Knollen gut anhäufeln und lokale Beratung zu Behandlungsabständen je nach Sortenresistenz befolgen."
    references:
      - "Wallin J.R. 1962, Summary of recent progress in predicting late blight epidemics, Am. Potato J. 39:306–312"
      - "Krause R.A., Massie L.B., Hyre R.A. 1975, BLITECAST, Plant Dis. Rep. 59:95–98"
      - "Grünwald N.J., Rubio-Covarrubias O.A., Fry W.E. 2000, Plant Disease 84:410–416, doi:10.1094/PDIS.2000.84.4.410"
    caveats:
      - "Replaces the Hutton criteria between the tropics: Hutton's Tmin ≥ 10 °C rule misses cool highland nights."
  gray_leaf_spot:
    name: {en: Maize gray leaf spot, es: mancha gris del maíz, fr: cercosporiose du maïs, sw: madoa kijivu ya mahindi, hi: मक्का का धूसर पर्ण धब्बा, de: Graufleckenkrankheit (Mais)}
    model: "Index of the two weather predictors of Paul & Munkvold (2005): hours at 22–30 °C and humid night hours (RH ≥ 90 %)"
    summary: "Gray leaf spot infects during long, warm, very humid periods, mostly from mid-season on."
    action:
      en: "Scout the leaves below the ear for long, narrow, rectangular grey lesions. Risk is highest where maize follows maize with residue on the surface; rotate, manage residue and choose tolerant hybrids, and use local thresholds before any treatment."
      es: "Revise las hojas bajo la mazorca en busca de lesiones grises rectangulares y alargadas. El riesgo es mayor en maíz tras maíz con rastrojo; rote, maneje el rastrojo, elija híbridos tolerantes y use umbrales locales antes de tratar."
      fr: "Inspectez les feuilles sous l'épi : lésions grises rectangulaires allongées. Le risque est maximal en maïs sur maïs avec résidus en surface ; alternez, gérez les résidus, choisissez des hybrides tolérants et suivez les seuils locaux."
      sw: "Kagua majani chini ya gunzi kwa madoa marefu membamba ya kijivu yenye umbo la mstatili. Hatari ni kubwa mahindi yakifuata mahindi yenye mabaki juu ya udongo; badilisha mazao, simamia mabaki, chagua mbegu zinazostahimili na tumia viwango vya ugani kabla ya kutibu."
      hi: "भुट्टे के नीचे की पत्तियों पर लंबे, संकरे, आयताकार धूसर धब्बे देखें। मक्का के बाद मक्का और सतह पर अवशेष होने पर जोखिम सबसे अधिक है; फसल चक्र अपनाएं, अवशेष प्रबंधन करें, सहनशील संकर चुनें और उपचार से पहले स्थानीय सीमा मानें।"
      de: "Blätter unterhalb des Kolbens auf lange, schmale, rechteckige graue Flecken prüfen. Am höchsten ist das Risiko bei Mais nach Mais mit Ernteresten an der Oberfläche; Fruchtwechsel, Rotte fördern, tolerante Sorten wählen und lokale Schwellen beachten."
    references:
      - "Paul P.A., Munkvold G.P. 2005, Phytopathology 95:388–396, doi:10.1094/PHYTO-95-0388"
  coffee_leaf_rust:
    name: {en: Coffee leaf rust, es: roya del café, fr: rouille orangée du caféier, sw: kutu ya majani ya kahawa, hi: कॉफी पत्ती रतुआ, de: Kaffeerost}
    model: "Magarey et al. (2005) wetness × temperature curve with Kushalappa & Eskes (1989) cardinal temperatures, halved on days with Tmax outside 22–28 °C (Avelino et al. 2015)"
    summary: "Coffee rust spores need liquid water on the leaf for several hours at about 21–25 °C."
    action:
      en: "Check the undersides of leaves on 10 trees per plot for orange powder. Keep shade and nutrition balanced, remove heavily infected leaves, and follow your coffee board's advice on timing protective treatment before the rains."
      es: "Revise el envés de las hojas de 10 árboles por lote en busca de polvo naranja. Mantenga sombra y nutrición equilibradas, retire hojas muy infectadas y siga el consejo de su instituto del café sobre la protección antes de las lluvias."
      fr: "Examinez le revers des feuilles de 10 caféiers par parcelle : poudre orange. Équilibrez ombrage et nutrition, retirez les feuilles très atteintes et suivez le conseil de l'office du café sur la protection avant les pluies."
      sw: "Kagua upande wa chini wa majani ya miti 10 kwa kila kitalu kwa unga wa rangi ya chungwa. Dumisha kivuli na lishe sawa, ondoa majani yaliyoathirika sana, na fuata ushauri wa bodi ya kahawa kuhusu kinga kabla ya mvua."
      hi: "प्रति भूखंड 10 पौधों की पत्तियों के निचले भाग पर नारंगी चूर्ण देखें। छाया और पोषण संतुलित रखें, अधिक संक्रमित पत्तियां हटाएं, और बारिश से पहले सुरक्षात्मक उपचार के समय पर कॉफी बोर्ड की सलाह मानें।"
      de: "Blattunterseiten von 10 Bäumen je Parzelle auf orangefarbenes Pulver prüfen. Beschattung und Ernährung ausgewogen halten, stark befallene Blätter entfernen und die Beratung zum Schutz vor der Regenzeit befolgen."
    references:
      - "Kushalappa A.C., Eskes A.B. (eds.) 1989, Coffee Rust: Epidemiology, Resistance and Management, CRC Press"
      - "Avelino J. et al. 2015, Food Security 7:303–321, doi:10.1007/s12571-015-0446-9"
  black_sigatoka:
    name: {en: Black Sigatoka, es: Sigatoka negra, fr: cercosporiose noire, sw: Sigatoka nyeusi, hi: काला सिगाटोका, de: Schwarze Sigatoka}
    model: "Magarey et al. (2005) curve with germination 20/26.5/35 °C (Jacome & Schuh 1991) and 12 h wetness at the optimum (assumption within the 0–18 h range of Jacome & Schuh 1992)"
    summary: "Black Sigatoka spores infect young banana leaves during long wet periods at warm temperatures."
    action:
      en: "Check the youngest open leaves for brown streaks. Cut out infected leaf parts (deleafing), improve drainage and plant spacing, and follow local advice on protective treatment intervals."
      es: "Revise las hojas abiertas más jóvenes en busca de estrías pardas. Corte las partes infectadas (deshoje), mejore el drenaje y la densidad, y siga el consejo local sobre los intervalos de protección."
      fr: "Examinez les plus jeunes feuilles ouvertes : stries brunes. Coupez les parties atteintes (effeuillage), améliorez drainage et densité, et suivez le conseil local sur les intervalles de protection."
      sw: "Kagua majani machanga yaliyofunguka kwa michirizi ya kahawia. Kata sehemu za majani zilizoathirika, boresha mifereji na nafasi kati ya mimea, na fuata ushauri wa ugani kuhusu vipindi vya kinga."
      hi: "सबसे नई खुली पत्तियों पर भूरी धारियां देखें। संक्रमित पत्ती भाग काट दें, जल निकास व पौधों की दूरी सुधारें, और सुरक्षा अंतराल पर स्थानीय सलाह मानें।"
      de: "Jüngste offene Blätter auf braune Streifen prüfen. Befallene Blattteile herausschneiden (Entblättern), Drainage und Pflanzabstand verbessern und lokale Beratung zu Behandlungsabständen befolgen."
    references:
      - "Jacome L.H., Schuh W., Stevenson R.E. 1991, Phytopathology 81:1480, doi:10.1094/Phyto-81-1480"
      - "Jacome L.H., Schuh W. 1992, Phytopathology 82:515, doi:10.1094/Phyto-82-515"
      - "Magarey et al. 2005, Phytopathology 95:92–100"
  cassava_whitefly:
    name: {en: Whitefly (cassava mosaic vector), es: mosca blanca (vector del mosaico de la yuca), fr: aleurode (vecteur de la mosaïque du manioc), sw: inzi weupe (waenezaji wa batobato ya muhogo), hi: सफेद मक्खी (कसावा मोज़ेक वाहक), de: Weiße Fliege (Maniok-Mosaik-Überträger)}
    model: "Bemisia tabaci counts peak at 28–30 °C, 30–150 mm rain per month and RH 55–70 % (Katono et al. 2021, Uganda)"
    summary: "Whitefly numbers rise in hot weather with moderate rain; young cassava infected with mosaic virus loses the most yield."
    action:
      en: "Count adult whiteflies on the top 5 leaves of 30 plants. Pull out plants with mosaic symptoms early, plant only clean cuttings of resistant varieties, and protect natural enemies."
      es: "Cuente las moscas blancas adultas en las 5 hojas superiores de 30 plantas. Arranque pronto las plantas con mosaico, siembre solo estacas sanas de variedades resistentes y proteja a los enemigos naturales."
      fr: "Comptez les aleurodes adultes sur les 5 feuilles du haut de 30 plants. Arrachez tôt les plants atteints de mosaïque, plantez seulement des boutures saines de variétés résistantes et préservez les auxiliaires."
      sw: "Hesabu inzi weupe wakubwa kwenye majani 5 ya juu ya mimea 30. Ng'oa mapema mimea yenye dalili za batobato, panda vipandikizi safi vya aina zinazostahimili tu, na linda maadui wa asili."
      hi: "30 पौधों की ऊपरी 5 पत्तियों पर वयस्क सफेद मक्खियां गिनें। मोज़ेक लक्षण वाले पौधे जल्दी उखाड़ें, केवल प्रतिरोधी किस्मों की स्वस्थ कलमें लगाएं, और प्राकृतिक शत्रुओं को बचाएं।"
      de: "Adulte Weiße Fliegen auf den obersten 5 Blättern von 30 Pflanzen zählen. Pflanzen mit Mosaik früh entfernen, nur gesunde Stecklinge resistenter Sorten pflanzen und Nützlinge schonen."
    references:
      - "Katono K. et al. 2021, Insects 12:604, doi:10.3390/insects12070604"
    confidence: 0.35
    confidence_note: "Qualitative weather rule; whitefly numbers also depend on variety, crop age and natural enemies."
  desert_locust:
    name: {en: Desert locust breeding, es: reproducción de langosta del desierto, fr: reproduction du criquet pèlerin, sw: kuzaliana kwa nzige wa jangwani, hi: रेगिस्तानी टिड्डी प्रजनन, de: Brut der Wüstenheuschrecke}
    model: "FAO breeding criterion: usually ≥ 25–50 mm of rain moistens sandy soil 5–10 cm deep for egg-laying (Symmons & Cressman 2001); 30-day rain at the field, warm months only"
    summary: "In desert-locust areas, enough rain on warm sandy soil lets locusts lay eggs; hoppers can appear a few weeks later."
    action:
      en: "Rain may let desert locusts breed nearby. Check FAO Locust Watch (fao.org/locust-watch) and report hoppers or swarms to your national locust control unit; do not treat without their advice."
      es: "La lluvia puede permitir la reproducción de langosta cerca. Consulte FAO Locust Watch (fao.org/locust-watch) e informe saltones o enjambres a la unidad nacional de control; no trate sin su consejo."
      fr: "La pluie peut permettre la reproduction du criquet pèlerin à proximité. Consultez FAO Locust Watch (fao.org/locust-watch) et signalez larves ou essaims à l'unité nationale de lutte ; ne traitez pas sans son avis."
      sw: "Mvua inaweza kuwezesha nzige wa jangwani kuzaliana karibu. Angalia FAO Locust Watch (fao.org/locust-watch) na ripoti tunutu au makundi ya nzige kwa kitengo cha taifa cha kudhibiti nzige; usinyunyize bila ushauri wao."
      hi: "बारिश से आसपास रेगिस्तानी टिड्डी प्रजनन कर सकती है। FAO Locust Watch (fao.org/locust-watch) देखें और फुदकों या झुंडों की सूचना राष्ट्रीय टिड्डी नियंत्रण इकाई को दें; उनकी सलाह के बिना उपचार न करें।"
      de: "Regen kann Wüstenheuschrecken in der Nähe die Brut ermöglichen. FAO Locust Watch (fao.org/locust-watch) prüfen und Larven oder Schwärme der nationalen Heuschreckenbekämpfung melden; nicht ohne deren Rat behandeln."
    references:
      - "Symmons P.M., Cressman K. 2001, Desert Locust Guidelines 1: Biology and behaviour, FAO Rome"
      - "FAO Locust Watch, https://www.fao.org/locust-watch/"
    confidence: 0.35
    confidence_note: "Uses rain at the field's grid cell only; breeding happens in nearby desert areas the model does not see."
    caveats:
      - "Awareness only: locust surveys and control are the job of national locust units coordinated by FAO."

