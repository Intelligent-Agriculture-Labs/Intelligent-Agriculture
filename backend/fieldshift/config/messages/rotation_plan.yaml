plan_cost_soil: {en: "{v:.1f} t/ha more soil loss", es: "{v:.1f} t/ha más de pérdida de suelo", fr: "{v:.1f} t/ha de perte de sol en plus", sw: "t/ha {v:.1f} zaidi za udongo unaopotea", hi: "{v:.1f} t/ha अधिक मिट्टी का नुकसान", de: "{v:.1f} t/ha mehr Bodenverlust"}
