  sw: "Hali ya msimu inatokana moja kwa moja na joto na modeli ya msimu."
  hi: "मौसम की अवस्था सीधे तापमान और मौसम मॉडल से निकलती है।"
  de: "Der Saisonstatus folgt direkt aus der Temperatur und dem Saisonmodell."
