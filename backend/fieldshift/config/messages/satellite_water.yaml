  sw: " Unyevu wa udongo katika eneo la mizizi: asilimia-nafasi ya {pct:.0f}."
  hi: " जड़ क्षेत्र की मिट्टी की नमी: {pct:.0f}वाँ पर्सेंटाइल।"
  de: " Bodenfeuchte im Wurzelraum: {pct:.0f}. Perzentil."
sw_gda_sf:
