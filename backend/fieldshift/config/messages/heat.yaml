hs_step_animal:
  en: "{animal}: max THI {v:.1f} on {date} → {cls} ({thr}; {ref})."
  es: "{animal}: THI máximo {v:.1f} el {date} → {cls} ({thr}; {ref})."
  fr: "{animal} : THI maximal {v:.1f} le {date} → {cls} ({thr} ; {ref})."
  sw: "{animal}: THI ya juu {v:.1f} tarehe {date} → {cls} ({thr}; {ref})."
  hi: "{animal}: {date} को अधिकतम THI {v:.1f} → {cls} ({thr}; {ref})।"
  de: "{animal}: maximaler THI {v:.1f} am {date} → {cls} ({thr}; {ref})."
hs_step_livestock:
  en: "Livestock actions: shade, unlimited cool water (cattle drink up to 2× more in heat), handle and move animals only in the cool early morning, ventilate poultry houses, feed in the evening."
  es: "Para el ganado: sombra, agua fresca sin límite (el ganado bebe hasta el doble con calor), manejar y mover animales solo temprano en la mañana fresca, ventilar los galpones de aves y alimentar al atardecer."
  fr: "Pour le bétail : ombre, eau fraîche à volonté (les bovins boivent jusqu'à 2× plus par chaleur), manipuler et déplacer les animaux seulement tôt le matin au frais, ventiler les poulaillers, nourrir le soir."
  sw: "Kwa mifugo: kivuli, maji baridi bila kikomo (ng'ombe hunywa hadi mara 2 zaidi wakati wa joto), shughulikia na kuhamisha wanyama asubuhi na mapema tu, pitisha hewa mabanda ya kuku, lisha jioni."
  hi: "पशुओं के लिए: छाया, असीमित ठंडा पानी (गर्मी में मवेशी 2 गुना तक अधिक पीते हैं), पशुओं को केवल सुबह की ठंडक में संभालें और ले जाएँ, मुर्गीघरों में हवा आने दें, शाम को चारा दें।"
  de: "Für Tiere: Schatten, kühles Wasser ohne Begrenzung (Rinder trinken bei Hitze bis zu doppelt so viel), Tiere nur am kühlen frühen Morgen treiben und behandeln, Geflügelställe lüften, abends füttern."
hs_caveat_housed:
  en: "THI uses outdoor air; housed animals (poultry, dairy barns) can be hotter or cooler than outside."
  es: "El THI usa el aire exterior; los animales estabulados (aves, establos lecheros) pueden estar más calientes o frescos que afuera."
  fr: "Le THI utilise l'air extérieur ; les animaux en bâtiment (volailles, étables laitières) peuvent avoir plus chaud ou plus frais qu'à l'extérieur."
  sw: "THI hutumia hewa ya nje; wanyama walio bandani (kuku, mabanda ya ng'ombe wa maziwa) wanaweza kuwa na joto zaidi au kidogo kuliko nje."
  hi: "THI बाहरी हवा पर आधारित है; बंद जगह में रखे पशु (मुर्गियाँ, डेयरी शेड) बाहर से अधिक गर्म या ठंडे हो सकते हैं।"
  de: "Der THI nutzt die Außenluft; Tiere im Stall (Geflügel, Milchviehställe) können es wärmer oder kühler haben als draußen."
hs_sum:
  en: "Heat stress for people and animals from forecast temperature, humidity, wind and sunshine: outdoor wet-bulb globe temperature (WBGT) for field workers and temperature–humidity index (THI) for livestock."
  es: "Estrés por calor para personas y animales según temperatura, humedad, viento y sol previstos: temperatura de globo y bulbo húmedo (WBGT) para quienes trabajan en el campo e índice temperatura-humedad (THI) para el ganado."
  fr: "Stress thermique des personnes et des animaux d'après la température, l'humidité, le vent et l'ensoleillement prévus : WBGT en extérieur pour les travailleurs des champs et indice température-humidité (THI) pour le bétail."
  sw: "Msongo wa joto kwa watu na wanyama kutoka utabiri wa joto, unyevu, upepo na jua: WBGT ya nje kwa wafanyakazi wa shambani na kielelezo cha joto-unyevu (THI) kwa mifugo."
  hi: "पूर्वानुमानित तापमान, आर्द्रता, हवा और धूप से लोगों और पशुओं पर गर्मी का तनाव: खेत कामगारों के लिए बाहरी WBGT और पशुओं के लिए तापमान–आर्द्रता सूचकांक (THI)।"
  de: "Hitzestress für Menschen und Tiere aus vorhergesagter Temperatur, Feuchte, Wind und Sonne: WBGT im Freien für Feldarbeitende und Temperatur-Feuchte-Index (THI) für Nutztiere."
model_heat_stress:
  en: "Outdoor WBGT (Liljegren et al. 2008) with NIOSH 2016 / ISO 7243 work–rest limits; livestock THI (NRC 1971; Marai et al. 2007)"
  es: "WBGT exterior (Liljegren et al. 2008) con límites de trabajo y descanso NIOSH 2016 / ISO 7243; THI del ganado (NRC 1971; Marai et al. 2007)"
  fr: "WBGT extérieur (Liljegren et al. 2008) avec limites travail–repos NIOSH 2016 / ISO 7243 ; THI du bétail (NRC 1971 ; Marai et al. 2007)"
  sw: "WBGT ya nje (Liljegren et al. 2008) na vikomo vya kazi–mapumziko vya NIOSH 2016 / ISO 7243; THI ya mifugo (NRC 1971; Marai et al. 2007)"
  hi: "बाहरी WBGT (Liljegren et al. 2008) NIOSH 2016 / ISO 7243 काम–आराम सीमाओं के साथ; पशु THI (NRC 1971; Marai et al. 2007)"
  de: "WBGT im Freien (Liljegren et al. 2008) mit Arbeits-Pausen-Grenzen nach NIOSH 2016 / ISO 7243; Tier-THI (NRC 1971; Marai et al. 2007)"
hs_note:
  en: "WBGT model agrees with an independent implementation to <0.02 °C and is validated against field measurements in the literature (≈1 °C); the forecast itself is the main uncertainty."
  es: "El modelo WBGT coincide con una implementación independiente a <0,02 °C y está validado con mediciones de campo publicadas (≈1 °C); la principal incertidumbre es el propio pronóstico."
  fr: "Le modèle WBGT concorde avec une implémentation indépendante à <0,02 °C et est validé par des mesures de terrain publiées (≈1 °C) ; la prévision elle-même est la principale incertitude."
  sw: "Modeli ya WBGT inakubaliana na utekelezaji huru kwa <0.02 °C na imethibitishwa dhidi ya vipimo vya shambani vilivyochapishwa (≈1 °C); utabiri wenyewe ndio chanzo kikuu cha kutokuwa na uhakika."
  hi: "WBGT मॉडल एक स्वतंत्र कार्यान्वयन से <0.02 °C तक मेल खाता है और प्रकाशित क्षेत्र मापों से सत्यापित है (≈1 °C); मुख्य अनिश्चितता स्वयं पूर्वानुमान है।"
  de: "Das WBGT-Modell stimmt mit einer unabhängigen Implementierung auf <0,02 °C überein und ist an veröffentlichten Feldmessungen validiert (≈1 °C); die Hauptunsicherheit ist die Vorhersage selbst."
