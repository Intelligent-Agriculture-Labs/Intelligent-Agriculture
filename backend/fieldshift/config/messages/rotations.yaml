rot_ev_peak:
  en: "Peak crop water demand in {month}: ET₀ ≈ {et0:.0f} mm/month vs. {rain:.0f} mm rain (NASA POWER 1991–2020)."
  es: "Máxima demanda de agua en {month}: ET₀ ≈ {et0:.0f} mm/mes frente a {rain:.0f} mm de lluvia (NASA POWER 1991–2020)."
  fr: "Besoin en eau maximal en {month} : ET₀ ≈ {et0:.0f} mm/mois contre {rain:.0f} mm de pluie (NASA POWER 1991–2020)."
  sw: "Mahitaji makubwa ya maji mwezi {month}: ET₀ ≈ mm {et0:.0f}/mwezi dhidi ya mvua mm {rain:.0f} (NASA POWER 1991–2020)."
  hi: "{month} में फसल जल माँग चरम पर: ET₀ ≈ {et0:.0f} मिमी/माह, जबकि वर्षा {rain:.0f} मिमी (NASA POWER 1991–2020)।"
  de: "Höchster Wasserbedarf im {month}: ET₀ ≈ {et0:.0f} mm/Monat gegenüber {rain:.0f} mm Regen (NASA POWER 1991–2020)."
rot_ev_irrigated:
  en: "{crop}: simulated median irrigation {irr:.0f} mm, median yield {y:.1f} t/ha over {n} seasons."
  es: "{crop}: riego mediano simulado {irr:.0f} mm, rendimiento mediano {y:.1f} t/ha en {n} temporadas."
  fr: "{crop} : irrigation médiane simulée {irr:.0f} mm, rendement médian {y:.1f} t/ha sur {n} saisons."
  sw: "{crop}: umwagiliaji wa wastani wa kati ulioigwa mm {irr:.0f}, mavuno ya wastani wa kati t/ha {y:.1f} kwa misimu {n}."
  hi: "{crop}: {n} मौसमों में अनुकरणित माध्यिका सिंचाई {irr:.0f} मिमी, माध्यिका उपज {y:.1f} t/ha।"
  de: "{crop}: simulierte mediane Bewässerung {irr:.0f} mm, medianer Ertrag {y:.1f} t/ha über {n} Saisons."
rot_ev_rainfed:
  en: "{crop}: simulated median yield {y:.1f} t/ha; failed seasons {fail:.0f} % of {n}."
  es: "{crop}: rendimiento mediano simulado {y:.1f} t/ha; temporadas fallidas {fail:.0f} % de {n}."
  fr: "{crop} : rendement médian simulé {y:.1f} t/ha ; saisons ratées {fail:.0f} % sur {n}."
  sw: "{crop}: mavuno ya wastani wa kati yaliyoigwa t/ha {y:.1f}; misimu iliyoshindwa {fail:.0f} % ya {n}."
  hi: "{crop}: अनुकरणित माध्यिका उपज {y:.1f} t/ha; {n} में से {fail:.0f} % मौसम विफल।"
  de: "{crop}: simulierter medianer Ertrag {y:.1f} t/ha; Missernten in {fail:.0f} % von {n} Saisons."
rot_ev_slope_low:
  en: "Field slope {slope:.1f} % (NASA SRTM 30 m) — low erosion leverage."
  es: "Pendiente del campo {slope:.1f} % (NASA SRTM 30 m): poco margen de mejora frente a la erosión."
  fr: "Pente de la parcelle {slope:.1f} % (NASA SRTM 30 m) — faible levier contre l'érosion."
  sw: "Mteremko wa shamba {slope:.1f} % (NASA SRTM m 30) — athari ndogo ya mmomonyoko."
  hi: "खेत की ढलान {slope:.1f} % (NASA SRTM 30 मी) — कटाव पर कम असर।"
  de: "Hangneigung {slope:.1f} % (NASA SRTM 30 m) – geringer Hebel gegen Erosion."
rot_ev_slope_notable:
  en: "Field slope {slope:.1f} % (NASA SRTM 30 m) — notable erosion leverage."
  es: "Pendiente del campo {slope:.1f} % (NASA SRTM 30 m): la rotación influye bastante en la erosión."
  fr: "Pente de la parcelle {slope:.1f} % (NASA SRTM 30 m) — levier notable contre l'érosion."
  sw: "Mteremko wa shamba {slope:.1f} % (NASA SRTM m 30) — mzunguko una athari kubwa kwa mmomonyoko."
  hi: "खेत की ढलान {slope:.1f} % (NASA SRTM 30 मी) — कटाव पर उल्लेखनीय असर।"
  de: "Hangneigung {slope:.1f} % (NASA SRTM 30 m) – deutlicher Hebel gegen Erosion."
rot_ben_water: {en: "Uses less water: {v} {u} vs. your current rotation.", es: "Usa menos agua: {v} {u} frente a su rotación actual.", fr: "Consomme moins d'eau : {v} {u} par rapport à votre rotation actuelle.", sw: "Hutumia maji kidogo: {v} {u} ukilinganisha na mzunguko wako wa sasa.", hi: "कम पानी: {v} {u}, आपके मौजूदा फसल-चक्र की तुलना में।", de: "Braucht weniger Wasser: {v} {u} im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_income: {en: "Higher indicative margin: {v} {u} vs. your current rotation.", es: "Mayor margen orientativo: {v} {u} frente a su rotación actual.", fr: "Marge indicative plus élevée : {v} {u} par rapport à votre rotation actuelle.", sw: "Faida kubwa zaidi (makadirio): {v} {u} ukilinganisha na mzunguko wako wa sasa.", hi: "अधिक अनुमानित मार्जिन: {v} {u}, आपके मौजूदा फसल-चक्र की तुलना में।", de: "Höherer Richtwert-Deckungsbeitrag: {v} {u} im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_soil: {en: "Healthier soil (index {v}/100) vs. your current rotation.", es: "Suelo más sano (índice {v}/100) frente a su rotación actual.", fr: "Sol plus sain (indice {v}/100) par rapport à votre rotation actuelle.", sw: "Udongo wenye afya zaidi (kielelezo {v}/100) ukilinganisha na mzunguko wako wa sasa.", hi: "स्वस्थ मिट्टी (सूचकांक {v}/100), आपके मौजूदा फसल-चक्र की तुलना में।", de: "Gesünderer Boden (Index {v}/100) im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_erosion: {en: "Lower erosion risk (index {v}) vs. your current rotation.", es: "Menor riesgo de erosión (índice {v}) frente a su rotación actual.", fr: "Risque d'érosion plus faible (indice {v}) par rapport à votre rotation actuelle.", sw: "Hatari ndogo ya mmomonyoko (kielelezo {v}) ukilinganisha na mzunguko wako wa sasa.", hi: "कम कटाव जोखिम (सूचकांक {v}), आपके मौजूदा फसल-चक्र की तुलना में।", de: "Geringeres Erosionsrisiko (Index {v}) im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_pests: {en: "Breaks pest and disease cycles (score {v}/100) vs. your current rotation.", es: "Corta ciclos de plagas y enfermedades (puntuación {v}/100) frente a su rotación actual.", fr: "Coupe les cycles de ravageurs et maladies (score {v}/100) par rapport à votre rotation actuelle.", sw: "Huvunja mizunguko ya wadudu na magonjwa (alama {v}/100) ukilinganisha na mzunguko wako wa sasa.", hi: "कीट और रोग चक्र तोड़ता है (स्कोर {v}/100), आपके मौजूदा फसल-चक्र की तुलना में।", de: "Unterbricht Schädlings- und Krankheitszyklen (Wert {v}/100) im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_risk: {en: "Fewer bad seasons ({v} % risk) vs. your current rotation.", es: "Menos temporadas malas ({v} % de riesgo) frente a su rotación actual.", fr: "Moins de mauvaises saisons ({v} % de risque) par rapport à votre rotation actuelle.", sw: "Misimu mibaya michache ({v} % hatari) ukilinganisha na mzunguko wako wa sasa.", hi: "कम खराब मौसम ({v} % जोखिम), आपके मौजूदा फसल-चक्र की तुलना में।", de: "Weniger schlechte Jahre ({v} % Risiko) im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_nitrogen: {en: "More biological nitrogen: {v} {u} vs. your current rotation.", es: "Más nitrógeno biológico: {v} {u} frente a su rotación actual.", fr: "Plus d'azote biologique : {v} {u} par rapport à votre rotation actuelle.", sw: "Naitrojeni zaidi ya kibiolojia: {v} {u} ukilinganisha na mzunguko wako wa sasa.", hi: "अधिक जैविक नाइट्रोजन: {v} {u}, आपके मौजूदा फसल-चक्र की तुलना में।", de: "Mehr biologischer Stickstoff: {v} {u} im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_bare_days: {en: "Fewer bare-soil days: {v} {u} vs. your current rotation.", es: "Menos días de suelo desnudo: {v} {u} frente a su rotación actual.", fr: "Moins de jours de sol nu : {v} {u} par rapport à votre rotation actuelle.", sw: "Siku chache za udongo wazi: {v} {u} ukilinganisha na mzunguko wako wa sasa.", hi: "खाली मिट्टी के कम दिन: {v} {u}, आपके मौजूदा फसल-चक्र की तुलना में।", de: "Weniger Tage mit offenem Boden: {v} {u} im Vergleich zu Ihrer jetzigen Fruchtfolge."}
rot_ben_similar:
  en: "Similar overall to your current rotation; may suit different priorities."
  es: "En general similar a su rotación actual; puede convenir con otras prioridades."
  fr: "Globalement proche de votre rotation actuelle ; peut convenir à d'autres priorités."
  sw: "Kwa jumla inafanana na mzunguko wako wa sasa; inaweza kufaa vipaumbele tofauti."
  hi: "कुल मिलाकर आपके मौजूदा फसल-चक्र जैसा; अलग प्राथमिकताओं के लिए उपयुक्त हो सकता है।"
  de: "Insgesamt ähnlich wie Ihre jetzige Fruchtfolge; passt eventuell zu anderen Prioritäten."
rot_gap_prices:
  en: "Prices are national producer prices (FAOSTAT) for this field's country and costs are modelled from its yield and price level — local market access (hay buyers, elevators) is not known to IA."
  es: "Los precios son precios nacionales al productor (FAOSTAT) del país de esta parcela y los costos se modelan a partir de su nivel de rendimiento y de precios; IA no conoce su acceso al mercado local (compradores de heno, acopios)."
  fr: "Les prix sont les prix nationaux à la production (FAOSTAT) du pays de cette parcelle et les coûts sont modélisés à partir de son niveau de rendement et de prix — IA ne connaît pas votre accès au marché local (acheteurs de foin, silos)."
  sw: "Bei ni bei za kitaifa za wazalishaji (FAOSTAT) za nchi ya shamba hili na gharama zimekadiriwa kutokana na kiwango chake cha mavuno na bei — IA haijui upatikanaji wa soko lako la karibu (wanunuzi wa nyasi, maghala)."
  hi: "कीमतें इस खेत के देश की राष्ट्रीय उत्पादक कीमतें (FAOSTAT) हैं और लागत उसके उपज व मूल्य स्तर से अनुमानित है — स्थानीय बाज़ार (चारा खरीदार, गोदाम) तक पहुँच IA को ज्ञात नहीं।"
  de: "Preise sind nationale Erzeugerpreise (FAOSTAT) des Landes dieses Feldes, Kosten sind aus dessen Ertrags- und Preisniveau modelliert – den Zugang zum lokalen Markt (Heukäufer, Landhandel) kennt IA nicht."
rot_gap_lowconf:
  en: "Some crops here (e.g. teff, cover mixes) are not in FAO-56; their water parameters are literature estimates."
  es: "Algunos cultivos aquí (p. ej. tef, mezclas de cobertura) no están en FAO-56; sus parámetros de agua son estimaciones de la literatura."
  fr: "Certaines cultures ici (p. ex. teff, mélanges de couverts) ne figurent pas dans FAO-56 ; leurs paramètres hydriques sont des estimations publiées."
  sw: "Baadhi ya mazao hapa (mf. tefu, mchanganyiko wa mazao funika) hayamo kwenye FAO-56; vigezo vyao vya maji ni makadirio ya machapisho."
  hi: "यहाँ कुछ फसलें (जैसे टेफ, आवरण मिश्रण) FAO-56 में नहीं हैं; उनके जल मानदंड शोध-आधारित अनुमान हैं।"
  de: "Einige Kulturen hier (z. B. Teff, Zwischenfruchtmischungen) fehlen in FAO-56; ihre Wasserparameter sind Literaturschätzungen."
rot_gap_soil:
  en: "Soil data are 250 m SoilGrids estimates, not a field soil test."
  es: "Los datos de suelo son estimaciones SoilGrids de 250 m, no un análisis de suelo del campo."
  fr: "Les données de sol sont des estimations SoilGrids à 250 m, pas une analyse de sol de la parcelle."
  sw: "Data za udongo ni makadirio ya SoilGrids ya m 250, si kipimo cha udongo wa shamba."
  hi: "मिट्टी के आँकड़े 250 मी SoilGrids अनुमान हैं, खेत की मिट्टी जाँच नहीं।"
  de: "Bodendaten sind 250-m-Schätzungen von SoilGrids, keine Bodenprobe vom Feld."
rot_risk_alfalfa:
  en: "Alfalfa autotoxicity: do not re-seed alfalfa directly after alfalfa; check stand age and weeds."
  es: "Autotoxicidad de la alfalfa: no resiembre alfalfa justo después de alfalfa; revise la edad de la pradera y las malezas."
  fr: "Autotoxicité de la luzerne : ne ressemez pas de luzerne juste après une luzerne ; vérifiez l'âge du peuplement et les adventices."
  sw: "Sumu ya alfalfa kwa yenyewe: usipande alfalfa mara baada ya alfalfa; angalia umri wa shamba na magugu."
  hi: "रिजका की स्व-विषाक्तता: रिजका के तुरंत बाद फिर रिजका न बोएँ; फसल की उम्र और खरपतवार जाँचें।"
  de: "Luzerne-Selbstunverträglichkeit: Luzerne nicht direkt nach Luzerne säen; Bestandsalter und Unkraut prüfen."
rot_risk_split:
  en: "Split-season irrigation depends on water-right rules and stand health — confirm with your water district."
  es: "El riego parcial depende de las reglas de derechos de agua y del estado del cultivo; confírmelo con su junta de riego."
  fr: "L'irrigation partielle dépend des droits d'eau et de l'état du peuplement — vérifiez auprès de votre gestionnaire d'eau."
  sw: "Umwagiliaji wa msimu nusu unategemea kanuni za haki ya maji na afya ya zao — thibitisha na mamlaka ya maji ya eneo lako."
  hi: "आंशिक-मौसम सिंचाई जल-अधिकार नियमों और फसल की सेहत पर निर्भर है — अपने जल विभाग से पुष्टि करें।"
  de: "Teilsaison-Bewässerung hängt von Wasserrechten und Bestandszustand ab – mit Ihrem Wasserverband klären."
rot_risk_teff:
  en: "Teff needs a fine, firm seedbed and has a niche hay market — verify buyers before planting."
  es: "El tef necesita una cama de siembra fina y firme y tiene un mercado de heno reducido; asegure compradores antes de sembrar."
  fr: "Le teff demande un lit de semences fin et rappuyé et a un marché du foin de niche — trouvez des acheteurs avant de semer."
  sw: "Tefu inahitaji kitalu laini na imara na ina soko dogo la nyasi — hakikisha wanunuzi kabla ya kupanda."
  hi: "टेफ को महीन, सख्त बीज-शय्या चाहिए और इसका चारा बाज़ार सीमित है — बोने से पहले खरीदार पक्के करें।"
  de: "Teff braucht ein feines, rückverfestigtes Saatbett und hat einen Nischen-Heumarkt – vor der Saat Abnehmer sichern."
rot_risk_cover:
  en: "Cover crops use some spring water in dry regions; terminate early if the season is dry."
  es: "Los cultivos de cobertura usan algo de agua en primavera en zonas secas; termínelos pronto si la temporada es seca."
  fr: "Les couverts consomment un peu d'eau au printemps en zone sèche ; détruisez-les tôt si la saison est sèche."
  sw: "Mazao funika hutumia maji kidogo ya masika maeneo makavu; yaondoe mapema msimu ukiwa mkavu."
  hi: "सूखे क्षेत्रों में आवरण फसलें वसंत का कुछ पानी लेती हैं; मौसम सूखा हो तो इन्हें जल्दी खत्म करें।"
  de: "Zwischenfrüchte verbrauchen in Trockengebieten etwas Frühjahrswasser; bei Trockenheit früh beenden."
rot_risk_herbicide:
  en: "Check herbicide carry-over restrictions before switching crops."
  es: "Antes de cambiar de cultivo, revise las restricciones por residuos de herbicidas."
  fr: "Vérifiez les restrictions liées aux rémanences d'herbicides avant de changer de culture."
  sw: "Kagua vikwazo vya mabaki ya dawa za magugu kabla ya kubadilisha zao."
  hi: "फसल बदलने से पहले खरपतवारनाशी के बचे असर की पाबंदियाँ जाँचें।"
  de: "Vor dem Kulturwechsel Nachbauauflagen von Herbiziden prüfen."
rot_disclaimer:
  en: "IA compares rotations under the last 15 seasons of NASA weather at your location. It supports, but does not replace, your judgement and local agronomic advice. Prices and costs are indicative and must be checked against your market."
  es: "IA compara rotaciones con las últimas 15 temporadas de clima NASA en su ubicación. Apoya, pero no reemplaza, su criterio y la asesoría agronómica local. Precios y costos son orientativos y deben contrastarse con su mercado."
  fr: "IA compare les rotations sur les 15 dernières saisons de météo NASA à votre emplacement. Il appuie, sans les remplacer, votre jugement et le conseil agronomique local. Prix et coûts sont indicatifs et doivent être vérifiés sur votre marché."
  sw: "IA hulinganisha mizunguko kwa misimu 15 iliyopita ya hali ya hewa ya NASA mahali ulipo. Inasaidia, lakini haichukui nafasi ya, uamuzi wako na ushauri wa ugani wa eneo lako. Bei na gharama ni makadirio na lazima zilinganishwe na soko lako."
  hi: "IA आपके स्थान पर पिछले 15 मौसमों के NASA मौसम पर फसल-चक्रों की तुलना करता है। यह आपके निर्णय और स्थानीय कृषि सलाह में मदद करता है, उनकी जगह नहीं लेता। कीमतें और लागत अनुमानित हैं, अपने बाज़ार से जाँचें।"
  de: "IA vergleicht Fruchtfolgen mit den letzten 15 Jahren NASA-Wetter an Ihrem Standort. Es unterstützt Ihr Urteil und die lokale Beratung, ersetzt sie aber nicht. Preise und Kosten sind Richtwerte und mit Ihrem Markt abzugleichen."
vuln_water:
  en: "High water demand: ET₀ {et0:.0f} mm vs. rain {rain:.0f} mm"
  es: "Alta demanda de agua: ET₀ {et0:.0f} mm frente a {rain:.0f} mm de lluvia"
  fr: "Forte demande en eau : ET₀ {et0:.0f} mm contre {rain:.0f} mm de pluie"
  sw: "Mahitaji makubwa ya maji: ET₀ mm {et0:.0f} dhidi ya mvua mm {rain:.0f}"
  hi: "पानी की अधिक माँग: ET₀ {et0:.0f} मिमी, वर्षा {rain:.0f} मिमी"
  de: "Hoher Wasserbedarf: ET₀ {et0:.0f} mm gegenüber {rain:.0f} mm Regen"
vuln_frost:
  en: "Frost risk with active growth (mean Tmin {tmin:.0f} °C)"
  es: "Riesgo de helada con el cultivo en crecimiento (mínima media {tmin:.0f} °C)"
  fr: "Risque de gel en pleine croissance (minimale moyenne {tmin:.0f} °C)"
  sw: "Hatari ya baridi kali wakati mimea inakua (wastani wa joto la chini {tmin:.0f} °C)"
  hi: "बढ़वार के दौरान पाले का जोखिम (औसत न्यूनतम {tmin:.0f} °C)"
  de: "Frostgefahr bei aktivem Wachstum (mittleres Minimum {tmin:.0f} °C)"
vuln_heat:
  en: "Heat stress likely (mean Tmax {tmax:.0f} °C)"
  es: "Probable estrés por calor (máxima media {tmax:.0f} °C)"
  fr: "Stress thermique probable (maximale moyenne {tmax:.0f} °C)"
  sw: "Msongo wa joto unatarajiwa (wastani wa joto la juu {tmax:.0f} °C)"
  hi: "गर्मी का तनाव संभावित (औसत अधिकतम {tmax:.0f} °C)"
  de: "Hitzestress wahrscheinlich (mittleres Maximum {tmax:.0f} °C)"
clim_tmax_summer: {en: "Warm-season mean max temperature", es: "Máxima media de la estación cálida", fr: "Maximale moyenne de la saison chaude", sw: "Wastani wa joto la juu msimu wa joto", hi: "गर्म मौसम का औसत अधिकतम तापमान", de: "Mittlere Höchsttemperatur der warmen Saison"}
clim_tmin_winter: {en: "Winter mean min temperature", es: "Mínima media de invierno", fr: "Minimale moyenne d'hiver", sw: "Wastani wa joto la chini msimu wa baridi", hi: "सर्दी का औसत न्यूनतम तापमान", de: "Mittlere Tiefsttemperatur im Winter"}
clim_gdd: {en: "Growing degree-days (base 10 °C)", es: "Grados-día de crecimiento (base 10 °C)", fr: "Degrés-jours de croissance (base 10 °C)", sw: "Nyuzi-siku za ukuaji (msingi 10 °C)", hi: "वृद्धि डिग्री-दिन (आधार 10 °C)", de: "Wachstumsgradtage (Basis 10 °C)"}
clim_frost_free_days: {en: "Frost-free season length", es: "Duración del periodo libre de heladas", fr: "Durée de la saison sans gel", sw: "Urefu wa msimu bila baridi kali", hi: "पाला-मुक्त मौसम की अवधि", de: "Länge der frostfreien Zeit"}
