# Rotation comparison (POST /api/rotations, engine/service.py rotations_api) and climate trends (GET /api/climate).
# Template names/ideas: rot_tpl_<template id>_name / _idea (English must match config/rotations.yaml).
rot_tpl_current_name: {en: "Your current rotation", es: "Su rotación actual", fr: "Votre rotation actuelle", sw: "Mzunguko wako wa sasa", hi: "आपका मौजूदा फसल-चक्र", de: "Ihre jetzige Fruchtfolge"}
rot_tpl_current_idea: {en: "What you grow today.", es: "Lo que siembra hoy.", fr: "Ce que vous cultivez aujourd'hui.", sw: "Unachopanda leo.", hi: "आज आप जो उगाते हैं।", de: "Was Sie heute anbauen."}
rot_tpl_alfalfa_teff_wheat_name:
  en: "Alfalfa (3 yr) → teff → winter wheat"
  es: "Alfalfa (3 años) → tef → trigo de invierno"
  fr: "Luzerne (3 ans) → teff → blé d'hiver"
  sw: "Alfalfa (miaka 3) → tefu → ngano ya baridi"
  hi: "रिजका (3 वर्ष) → टेफ → रबी गेहूं"
  de: "Luzerne (3 J.) → Teff → Winterweizen"
rot_tpl_alfalfa_teff_wheat_idea:
  en: "Keep the alfalfa income, then break the stand with two short, lower-water grass crops."
  es: "Mantenga el ingreso de la alfalfa y luego rompa la pradera con dos gramíneas cortas que usan menos agua."
  fr: "Gardez le revenu de la luzerne, puis cassez la prairie avec deux graminées courtes et moins gourmandes en eau."
  sw: "Endelea na mapato ya alfalfa, kisha ivunje kwa mazao mawili mafupi ya nyasi yanayotumia maji kidogo."
  hi: "रिजका की आय बनाए रखें, फिर कम पानी वाली दो छोटी घास-फसलों से खेत बदलें।"
  de: "Das Luzerne-Einkommen behalten, dann den Bestand mit zwei kurzen, wassersparenden Gräsern umbrechen."
rot_tpl_split_season_alfalfa_name:
  en: "Split-season alfalfa (stop irrigating after mid-July)"
  es: "Alfalfa con riego parcial (dejar de regar a mediados de julio)"
  fr: "Luzerne en irrigation partielle (arrêt mi-juillet)"
  sw: "Alfalfa ya msimu nusu (acha kumwagilia katikati ya Julai)"
  hi: "आंशिक-मौसम रिजका (मध्य जुलाई के बाद सिंचाई बंद)"
  de: "Luzerne mit Teilsaison-Bewässerung (ab Mitte Juli nicht mehr bewässern)"
rot_tpl_split_season_alfalfa_idea:
  en: "Same crop, less water: alfalfa survives summer dormancy; skip the low-value late cuts in drought years."
  es: "Mismo cultivo, menos agua: la alfalfa sobrevive al reposo de verano; omita los cortes tardíos de poco valor en años secos."
  fr: "Même culture, moins d'eau : la luzerne survit à la dormance estivale ; renoncez aux coupes tardives peu rentables les années sèches."
  sw: "Zao lile lile, maji kidogo: alfalfa huvumilia kulala wakati wa kiangazi; acha mikato ya mwisho yenye thamani ndogo miaka ya ukame."
  hi: "वही फसल, कम पानी: रिजका गर्मी की सुप्तावस्था झेल लेता है; सूखे वर्षों में कम मूल्य वाली देर की कटाइयाँ छोड़ें।"
  de: "Gleiche Kultur, weniger Wasser: Luzerne übersteht die Sommerruhe; in Dürrejahren die wenig lohnenden späten Schnitte auslassen."
rot_tpl_alfalfa_silage_triticale_name:
  en: "Alfalfa (3 yr) → corn silage → winter triticale"
  es: "Alfalfa (3 años) → maíz para ensilaje → triticale de invierno"
  fr: "Luzerne (3 ans) → maïs ensilage → triticale d'hiver"
  sw: "Alfalfa (miaka 3) → sileji ya mahindi → tritikale ya baridi"
  hi: "रिजका (3 वर्ष) → मक्का साइलेज → शीतकालीन ट्रिटिकेल"
  de: "Luzerne (3 J.) → Silomais → Wintertriticale"
rot_tpl_alfalfa_silage_triticale_idea:
  en: "Use the alfalfa nitrogen credit in a high-yield forage crop, then keep the ground covered over winter."
  es: "Aproveche el nitrógeno que deja la alfalfa en un forraje de alto rendimiento y mantenga el suelo cubierto en invierno."
  fr: "Valorisez l'azote laissé par la luzerne dans un fourrage productif, puis gardez le sol couvert en hiver."
  sw: "Tumia naitrojeni iliyoachwa na alfalfa kwa zao la lishe lenye mavuno mengi, kisha funika ardhi wakati wa baridi."
  hi: "रिजका से मिली नाइट्रोजन का उपयोग अधिक उपज वाले चारे में करें, फिर सर्दियों में ज़मीन ढकी रखें।"
  de: "Die Stickstoff-Nachwirkung der Luzerne in einer ertragreichen Futterkultur nutzen, dann den Boden über Winter bedeckt halten."
rot_tpl_wheat_safflower_barley_cover_name:
  en: "Winter wheat → safflower → barley + rye/vetch cover"
  es: "Trigo de invierno → cártamo → cebada + cobertura de centeno/veza"
  fr: "Blé d'hiver → carthame → orge + couvert seigle/vesce"
  sw: "Ngano ya baridi → safflower → shayiri + zao funika la raye/vechi"
  hi: "रबी गेहूं → कुसुम → जौ + राई/वेच आवरण"
  de: "Winterweizen → Färberdistel → Gerste + Roggen/Wicke-Zwischenfrucht"
rot_tpl_wheat_safflower_barley_cover_idea:
  en: "Use winter and spring moisture; deep-rooted safflower scavenges water and breaks cereal disease."
  es: "Aproveche la humedad de invierno y primavera; el cártamo de raíz profunda capta agua y corta las enfermedades de cereales."
  fr: "Valorisez l'humidité d'hiver et de printemps ; le carthame à enracinement profond puise l'eau et coupe les maladies des céréales."
  sw: "Tumia unyevu wa baridi na masika; safflower yenye mizizi mirefu hufikia maji na kuvunja magonjwa ya nafaka."
  hi: "सर्दी और वसंत की नमी का उपयोग करें; गहरी जड़ वाला कुसुम पानी खींचता है और अनाज के रोग-चक्र तोड़ता है।"
  de: "Winter- und Frühjahrsfeuchte nutzen; die tiefwurzelnde Färberdistel erschließt Wasser und unterbricht Getreidekrankheiten."
rot_tpl_maize_soy_wheat_cover_name:
  en: "Maize → soybean → winter wheat + cover"
  es: "Maíz → soja → trigo de invierno + cobertura"
  fr: "Maïs → soja → blé d'hiver + couvert"
  sw: "Mahindi → soya → ngano ya baridi + zao funika"
  hi: "मक्का → सोयाबीन → रबी गेहूं + आवरण फसल"
  de: "Mais → Soja → Winterweizen + Zwischenfrucht"
rot_tpl_maize_soy_wheat_cover_idea:
  en: "Classic legume–cereal rotation that breaks the corn-rootworm cycle and adds residue."
  es: "Rotación clásica leguminosa–cereal que corta el ciclo del gusano de la raíz del maíz y aporta rastrojo."
  fr: "Rotation classique légumineuse–céréale qui coupe le cycle de la chrysomèle du maïs et apporte des résidus."
  sw: "Mzunguko wa kawaida wa jamii ya kunde na nafaka unaovunja mzunguko wa funza wa mizizi ya mahindi na kuongeza masalia."
  hi: "क्लासिक दलहन–अनाज चक्र जो मक्का जड़ कीट का चक्र तोड़ता है और फसल अवशेष बढ़ाता है।"
  de: "Klassische Leguminosen-Getreide-Folge, die den Maiswurzelbohrer-Zyklus unterbricht und Ernterückstände liefert."
rot_tpl_sorghum_cowpea_maize_name:
  en: "Sorghum → cowpea → maize"
  es: "Sorgo → caupí → maíz"
  fr: "Sorgho → niébé → maïs"
  sw: "Mtama → kunde → mahindi"
  hi: "ज्वार → लोबिया → मक्का"
  de: "Sorghum → Augenbohne → Mais"
rot_tpl_sorghum_cowpea_maize_idea:
  en: "Drought-tolerant cereal, a nitrogen-fixing legume, then maize using that nitrogen."
  es: "Un cereal tolerante a la sequía, una leguminosa que fija nitrógeno y luego maíz que aprovecha ese nitrógeno."
  fr: "Une céréale tolérante à la sécheresse, une légumineuse qui fixe l'azote, puis du maïs qui en profite."
  sw: "Nafaka inayostahimili ukame, zao la jamii ya kunde linaloweka naitrojeni, kisha mahindi yanayotumia naitrojeni hiyo."
  hi: "सूखा सहने वाला अनाज, नाइट्रोजन जोड़ने वाली दलहन, फिर वह नाइट्रोजन उपयोग करने वाला मक्का।"
  de: "Trockenheitstolerantes Getreide, eine stickstoffbindende Leguminose, dann Mais, der diesen Stickstoff nutzt."
rot_tpl_millet_cowpea_name:
  en: "Pearl millet → cowpea"
  es: "Mijo perla → caupí"
  fr: "Mil → niébé"
  sw: "Uwele → kunde"
  hi: "बाजरा → लोबिया"
  de: "Perlhirse → Augenbohne"
rot_tpl_millet_cowpea_idea:
  en: "Very low water need; cowpea fixes nitrogen and breaks Striga and stem-borer cycles."
  es: "Muy poca necesidad de agua; el caupí fija nitrógeno y corta los ciclos de Striga y del barrenador del tallo."
  fr: "Très faible besoin en eau ; le niébé fixe l'azote et coupe les cycles du Striga et des foreurs de tiges."
  sw: "Mahitaji kidogo sana ya maji; kunde huweka naitrojeni na kuvunja mizunguko ya kiduha (Striga) na vipekecha shina."
  hi: "पानी की बहुत कम ज़रूरत; लोबिया नाइट्रोजन जोड़ता है और स्ट्राइगा व तना छेदक के चक्र तोड़ता है।"
  de: "Sehr geringer Wasserbedarf; die Augenbohne bindet Stickstoff und unterbricht Striga- und Stängelbohrer-Zyklen."
rot_tpl_potato_wheat_alfalfa_name:
  en: "Potato → winter wheat → alfalfa (2 yr)"
  es: "Papa → trigo de invierno → alfalfa (2 años)"
  fr: "Pomme de terre → blé d'hiver → luzerne (2 ans)"
  sw: "Viazi → ngano ya baridi → alfalfa (miaka 2)"
  hi: "आलू → रबी गेहूं → रिजका (2 वर्ष)"
  de: "Kartoffel → Winterweizen → Luzerne (2 J.)"
rot_tpl_potato_wheat_alfalfa_idea:
  en: "High-value crop followed by a cereal and a perennial legume that rebuilds soil structure."
  es: "Un cultivo de alto valor seguido de un cereal y una leguminosa perenne que reconstruye la estructura del suelo."
  fr: "Une culture à forte valeur suivie d'une céréale et d'une légumineuse pérenne qui reconstruit la structure du sol."
  sw: "Zao la thamani kubwa likifuatwa na nafaka na zao la kudumu la jamii ya kunde linalojenga upya muundo wa udongo."
  hi: "उच्च मूल्य वाली फसल, फिर अनाज और एक बहुवर्षीय दलहन जो मिट्टी की संरचना फिर से बनाती है।"
  de: "Eine hochwertige Kultur, gefolgt von Getreide und einer mehrjährigen Leguminose, die die Bodenstruktur wieder aufbaut."
rot_tpl_sunflower_wheat_cover_name:
  en: "Sunflower → winter wheat → cover crop"
  es: "Girasol → trigo de invierno → cultivo de cobertura"
  fr: "Tournesol → blé d'hiver → couvert végétal"
  sw: "Alizeti → ngano ya baridi → zao funika"
  hi: "सूरजमुखी → रबी गेहूं → आवरण फसल"
  de: "Sonnenblume → Winterweizen → Zwischenfrucht"
rot_tpl_sunflower_wheat_cover_idea:
  en: "Deep-rooted oilseed and a winter cereal; the cover crop protects soil in the bare window."
  es: "Una oleaginosa de raíz profunda y un cereal de invierno; la cobertura protege el suelo cuando quedaría desnudo."
  fr: "Un oléagineux à enracinement profond et une céréale d'hiver ; le couvert protège le sol pendant l'interculture."
  sw: "Zao la mafuta lenye mizizi mirefu na nafaka ya baridi; zao funika hulinda udongo ukiwa wazi."
  hi: "गहरी जड़ वाली तिलहन और शीतकालीन अनाज; आवरण फसल खाली समय में मिट्टी बचाती है।"
  de: "Tiefwurzelnde Ölsaat und Wintergetreide; die Zwischenfrucht schützt den Boden in der Brachezeit."
rot_tpl_maize_bean_sorghum_name:
  en: "Maize → dry bean → sorghum"
  es: "Maíz → frijol → sorgo"
  fr: "Maïs → haricot sec → sorgho"
  sw: "Mahindi → maharagwe → mtama"
  hi: "मक्का → राजमा → ज्वार"
  de: "Mais → Trockenbohne → Sorghum"
rot_tpl_maize_bean_sorghum_idea:
  en: "Alternates grass and legume families; sorghum tolerates the driest year in the cycle."
  es: "Alterna gramíneas y leguminosas; el sorgo aguanta el año más seco del ciclo."
  fr: "Alterne graminées et légumineuses ; le sorgho supporte l'année la plus sèche du cycle."
  sw: "Hubadilishana jamii ya nyasi na ya kunde; mtama huvumilia mwaka mkavu zaidi wa mzunguko."
  hi: "घास और दलहन परिवार बारी-बारी से; ज्वार चक्र का सबसे सूखा वर्ष झेल लेता है।"
  de: "Wechselt Gräser und Leguminosen ab; Sorghum verträgt das trockenste Jahr im Zyklus."
rot_tpl_sweetpotato_maize_cowpea_name:
  en: "Sweet potato → maize → cowpea"
  es: "Camote → maíz → caupí"
  fr: "Patate douce → maïs → niébé"
  sw: "Viazi vitamu → mahindi → kunde"
  hi: "शकरकंद → मक्का → लोबिया"
  de: "Süßkartoffel → Mais → Augenbohne"
rot_tpl_sweetpotato_maize_cowpea_idea:
  en: "A ground-covering root crop protects soil and spreads risk; cowpea restores nitrogen for the next maize."
  es: "Un cultivo de raíz que cubre el suelo lo protege y reparte el riesgo; el caupí repone nitrógeno para el siguiente maíz."
  fr: "Une plante à racines couvrante protège le sol et répartit le risque ; le niébé restitue de l'azote pour le maïs suivant."
  sw: "Zao la mizizi linalofunika ardhi hulinda udongo na kugawa hatari; kunde hurudisha naitrojeni kwa mahindi yanayofuata."
  hi: "ज़मीन ढकने वाली कंद फसल मिट्टी बचाती है और जोखिम बाँटती है; लोबिया अगली मक्का के लिए नाइट्रोजन लौटाता है।"
  de: "Eine bodendeckende Knollenkultur schützt den Boden und verteilt das Risiko; die Augenbohne liefert Stickstoff für den nächsten Mais."
