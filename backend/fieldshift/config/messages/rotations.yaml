clim_no_trend:
  en: "No statistically clear trend (p < 0.1) in the main indicators since {year}; year-to-year variability dominates."
  es: "No hay una tendencia estadísticamente clara (p < 0,1) en los indicadores principales desde {year}; domina la variabilidad entre años."
  fr: "Aucune tendance statistiquement nette (p < 0,1) sur les principaux indicateurs depuis {year} ; la variabilité d'une année à l'autre domine."
  sw: "Hakuna mwelekeo wazi kitakwimu (p < 0.1) katika viashiria vikuu tangu {year}; tofauti za mwaka hadi mwaka ndizo kubwa."
  hi: "{year} से मुख्य संकेतकों में कोई सांख्यिकीय रूप से स्पष्ट रुझान नहीं (p < 0.1); साल-दर-साल उतार-चढ़ाव हावी है।"
  de: "Seit {year} kein statistisch klarer Trend (p < 0,1) bei den Hauptindikatoren; die Schwankung von Jahr zu Jahr überwiegt."
