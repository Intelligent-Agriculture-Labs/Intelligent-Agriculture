# Water supply evidence (engine/water_supply.py): GRACE groundwater trend and rain provenance (POWER + GPM IMERG).
gw_caveat_regional:
  en: "This is a regional signal: your own well can stay steady while the region loses water, or the reverse."
  es: "Es una señal regional: su pozo puede mantenerse estable mientras la región pierde agua, o al revés."
  fr: "C'est un signal régional : votre puits peut rester stable alors que la région perd de l'eau, ou l'inverse."
  sw: "Hii ni ishara ya kikanda: kisima chako kinaweza kubaki sawa wakati eneo linapoteza maji, au kinyume chake."
  hi: "यह क्षेत्रीय संकेत है: क्षेत्र का पानी घटते हुए भी आपका कुआँ स्थिर रह सकता है, या उल्टा।"
  de: "Das ist ein regionales Signal: Ihr eigener Brunnen kann stabil bleiben, während die Region Wasser verliert – oder umgekehrt."
gw_caveat_total:
  en: "GRACE senses total water storage (groundwater + soil water + surface water + snow) over ~300 km (one 3° mascon), not the aquifer under your field; local wells can behave differently."
  es: "GRACE mide el agua total almacenada (subterránea + del suelo + superficial + nieve) en ~300 km (un mascon de 3°), no el acuífero bajo su campo; los pozos locales pueden comportarse distinto."
  fr: "GRACE mesure le stock d'eau total (nappes + eau du sol + eaux de surface + neige) sur ~300 km (un mascon de 3°), pas l'aquifère sous votre parcelle ; les puits locaux peuvent se comporter autrement."
  sw: "GRACE hupima jumla ya maji yaliyohifadhiwa (ya ardhini + ya udongo + ya juu + theluji) kwa ~km 300 (mascon moja ya 3°), si chemichemi iliyo chini ya shamba lako; visima vya eneo vinaweza kuwa tofauti."
  hi: "GRACE ~300 किमी (एक 3° मैस्कॉन) में कुल जल भंडार (भूजल + मिट्टी का पानी + सतही पानी + बर्फ़) मापता है, आपके खेत के नीचे का जलभृत नहीं; स्थानीय कुएँ अलग व्यवहार कर सकते हैं।"
  de: "GRACE misst den gesamten Wasservorrat (Grundwasser + Bodenwasser + Oberflächenwasser + Schnee) über ~300 km (ein 3°-Mascon), nicht den Grundwasserleiter unter Ihrem Feld; lokale Brunnen können sich anders verhalten."
gw_caveat_latency:
  en: "GRACE data arrive ~2–3 months late, and the GRACE → GRACE-FO gap (Jul 2017 – May 2018) has no data."
  es: "Los datos GRACE llegan con ~2–3 meses de retraso, y no hay datos en la pausa GRACE → GRACE-FO (jul 2017 – may 2018)."
  fr: "Les données GRACE arrivent avec ~2–3 mois de retard, et la lacune GRACE → GRACE-FO (juil. 2017 – mai 2018) n'a pas de données."
  sw: "Data za GRACE hufika kwa kuchelewa ~miezi 2–3, na pengo la GRACE → GRACE-FO (Jul 2017 – Mei 2018) halina data."
  hi: "GRACE डेटा ~2–3 महीने देर से आता है, और GRACE → GRACE-FO अंतराल (जुलाई 2017 – मई 2018) में डेटा नहीं है।"
  de: "GRACE-Daten kommen ~2–3 Monate verspätet, und in der Lücke GRACE → GRACE-FO (Juli 2017 – Mai 2018) gibt es keine Daten."
rain_step_imerg:
  en: "Rain: NASA POWER (MERRA-2) and NASA GPM IMERG satellite rain averaged day by day (IMERG to {last}; later days use POWER scaled to IMERG's climatology). Against 18 rain gauges on 6 continents this blend beat POWER alone at 16 (VALIDATION V13)."
  es: "Lluvia: NASA POWER (MERRA-2) y lluvia satelital NASA GPM IMERG promediadas día a día (IMERG hasta el {last}; los días posteriores usan POWER escalado a la climatología de IMERG). Frente a 18 pluviómetros en 6 continentes, esta combinación superó a POWER solo en 16 (VALIDACIÓN V13)."
  fr: "Pluie : NASA POWER (MERRA-2) et pluie satellite NASA GPM IMERG moyennées jour par jour (IMERG jusqu'au {last} ; ensuite POWER recalé sur la climatologie IMERG). Face à 18 pluviomètres sur 6 continents, ce mélange a battu POWER seul dans 16 cas (VALIDATION V13)."
  sw: "Mvua: NASA POWER (MERRA-2) na mvua ya setilaiti ya NASA GPM IMERG zimewekwa wastani siku kwa siku (IMERG hadi {last}; siku za baadaye hutumia POWER iliyorekebishwa kwa takwimu za IMERG). Dhidi ya vipimo 18 vya mvua katika mabara 6 mchanganyiko huu ulishinda POWER peke yake mara 16 (UTHIBITISHO V13)."
  hi: "वर्षा: NASA POWER (MERRA-2) और NASA GPM IMERG उपग्रह वर्षा का दिन-प्रतिदिन औसत ({last} तक IMERG; बाद के दिनों में IMERG जलवायु के अनुसार समायोजित POWER)। 6 महाद्वीपों के 18 वर्षामापियों पर यह मिश्रण 16 जगह अकेले POWER से बेहतर रहा (सत्यापन V13)।"
  de: "Regen: NASA POWER (MERRA-2) und NASA-GPM-IMERG-Satellitenregen, Tag für Tag gemittelt (IMERG bis {last}; spätere Tage nutzen auf die IMERG-Klimatologie skaliertes POWER). Gegen 18 Regenmesser auf 6 Kontinenten schlug diese Kombination POWER allein an 16 Stationen (VALIDIERUNG V13)."
rain_step_power_only:
  en: "Rain: NASA POWER only — GPM IMERG blending is validated only between 45° S and 45° N."
  es: "Lluvia: solo NASA POWER; la combinación con GPM IMERG solo está validada entre 45° S y 45° N."
  fr: "Pluie : NASA POWER seul — le mélange avec GPM IMERG n'est validé qu'entre 45° S et 45° N."
  sw: "Mvua: NASA POWER pekee — kuchanganya na GPM IMERG kumethibitishwa tu kati ya 45° Kusini na 45° Kaskazini."
  hi: "वर्षा: केवल NASA POWER — GPM IMERG मिश्रण केवल 45° द और 45° उ के बीच सत्यापित है।"
  de: "Regen: nur NASA POWER – die Kombination mit GPM IMERG ist nur zwischen 45° S und 45° N validiert."
