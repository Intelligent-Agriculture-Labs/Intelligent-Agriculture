  en: "{crop}: frost during the season in >30 % of years"
  es: "{crop}: heladas durante la temporada en >30 % de los años"
  fr: "{crop} : gel pendant la saison dans >30 % des années"
  sw: "{crop}: baridi kali wakati wa msimu katika >30 % ya miaka"
  hi: "{crop}: >30 % वर्षों में मौसम के दौरान पाला"
  de: "{crop}: Frost während der Saison in >30 % der Jahre"
rot_note_unfit:
  en: "{crop}: local season too short/cold or too dry"
  es: "{crop}: la temporada local es demasiado corta/fría o seca"
  fr: "{crop} : saison locale trop courte/froide ou trop sèche"
  sw: "{crop}: msimu wa hapa ni mfupi/baridi mno au mkavu mno"
  hi: "{crop}: स्थानीय मौसम बहुत छोटा/ठंडा या बहुत सूखा"
  de: "{crop}: örtliche Saison zu kurz/kalt oder zu trocken"
