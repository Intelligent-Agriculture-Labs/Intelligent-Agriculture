# ---- rain provenance with near-real-time IMERG (engine/water_supply.py)
rain_step_imerg_nrt:
  en: "Rain: NASA POWER (MERRA-2) and NASA GPM IMERG satellite rain averaged day by day — IMERG Final (gauge-calibrated) to {final}, then IMERG {runs} near-real-time runs from NASA GES DISC to {last} ({days} days). Against 18 rain gauges on 6 continents the Final blend beat POWER alone at 16 (VALIDATION V13); the near-real-time runs are not gauge-calibrated and are checked against Final in VALIDATION V13b."
  es: "Lluvia: NASA POWER (MERRA-2) y lluvia satelital NASA GPM IMERG promediadas día a día — IMERG Final (calibrada con pluviómetros) hasta el {final}, luego las ejecuciones casi en tiempo real IMERG {runs} de NASA GES DISC hasta el {last} ({days} días). Frente a 18 pluviómetros en 6 continentes, la combinación con Final superó a POWER solo en 16 (VALIDACIÓN V13); las ejecuciones casi en tiempo real no están calibradas con pluviómetros y se comparan con Final en la VALIDACIÓN V13b."
  fr: "Pluie : NASA POWER (MERRA-2) et pluie satellite NASA GPM IMERG moyennées jour par jour — IMERG Final (calée sur pluviomètres) jusqu'au {final}, puis les productions quasi temps réel IMERG {runs} de la NASA GES DISC jusqu'au {last} ({days} jours). Face à 18 pluviomètres sur 6 continents, le mélange Final a battu POWER seul dans 16 cas (VALIDATION V13) ; les productions quasi temps réel ne sont pas calées sur pluviomètres et sont comparées à Final dans la VALIDATION V13b."
  sw: "Mvua: NASA POWER (MERRA-2) na mvua ya setilaiti ya NASA GPM IMERG zimewekwa wastani siku kwa siku — IMERG Final (iliyorekebishwa kwa vipimo vya mvua) hadi {final}, kisha matoleo ya karibu-wakati-halisi ya IMERG {runs} kutoka NASA GES DISC hadi {last} (siku {days}). Dhidi ya vipimo 18 vya mvua katika mabara 6 mchanganyiko wa Final ulishinda POWER peke yake mara 16 (UTHIBITISHO V13); matoleo ya karibu-wakati-halisi hayajarekebishwa kwa vipimo vya mvua na yanakaguliwa dhidi ya Final katika UTHIBITISHO V13b."
  hi: "वर्षा: NASA POWER (MERRA-2) और NASA GPM IMERG उपग्रह वर्षा का दिन-प्रतिदिन औसत — {final} तक IMERG Final (वर्षामापी से अंशांकित), फिर {last} तक NASA GES DISC के IMERG {runs} लगभग-वास्तविक-समय रन ({days} दिन)। 6 महाद्वीपों के 18 वर्षामापियों पर Final मिश्रण 16 जगह अकेले POWER से बेहतर रहा (सत्यापन V13); लगभग-वास्तविक-समय रन वर्षामापी से अंशांकित नहीं हैं और सत्यापन V13b में Final से जाँचे गए हैं।"
  de: "Regen: NASA POWER (MERRA-2) und NASA-GPM-IMERG-Satellitenregen, Tag für Tag gemittelt – IMERG Final (an Regenmessern kalibriert) bis {final}, danach die echtzeitnahen IMERG-{runs}-Läufe von NASA GES DISC bis {last} ({days} Tage). Gegen 18 Regenmesser auf 6 Kontinenten schlug die Final-Kombination POWER allein an 16 Stationen (VALIDIERUNG V13); die echtzeitnahen Läufe sind nicht an Regenmessern kalibriert und werden in VALIDIERUNG V13b gegen Final geprüft."
