# One-command start:  docker compose up --build   ->  app http://localhost:8080 , API docs http://localhost:8080/docs
# Offline demo (no network needed, pre-cached NASA data):  FIELDSHIFT_OFFLINE=1 docker compose up --build
# Works the same with podman-compose.
services:
  fieldshift:
    build: .
    environment:
      FIELDSHIFT_OFFLINE: ${FIELDSHIFT_OFFLINE:-0}
      FIELDSHIFT_ORNL_RETRIES: ${FIELDSHIFT_ORNL_RETRIES:-1}
    volumes:
      - cache:/data
    ports:
      - "${PORT:-8080}:8000"
    restart: unless-stopped
volumes:
  cache:
